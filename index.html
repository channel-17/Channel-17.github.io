html,body{

#stage{

  position:relative;

/* =========================

LOADER

========================= */

#loaderWrap{

  position:absolute;

  left:50%;

  top:42%;

  transform:translateX(-50%);

  width:min(80vw,420px);

}

#loader{

  position:relative;

  width:100%;

  height:28px;

  border:1px solid rgba(255,255,255,.15);

  background:rgba(255,255,255,.02);

  overflow:hidden;

}

#fill{

  position:absolute;

  inset:0;

  width:0%;

  background:

  repeating-linear-gradient(

    90deg,

    #fff 0px,

    #fff 12px,

    transparent 12px,

    transparent 17px

  );

  transition:width .6s linear;

}

#percent{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:12px;

  font-weight:bold;

  letter-spacing:.25em;

  color:#000;

  mix-blend-mode:difference;

}

/* =========================

LITTLE HOMIE

========================= */

#homie{

  position:absolute;

  left:50%;

  top:55%;

  transform:translate(-50%,-50%);

  width:100px;

  pointer-events:none;

  user-select:none;

  transition:transform .2s ease;

}

.walk{

  animation:walkBob 1.2s infinite steps(2,end);

}

@keyframes walkBob{

  50%{

    transform:translate(-50%,-50%) translateY(2px);

  }

}

.nervous{

  animation:nervous .12s infinite steps(2,end);

}

@keyframes nervous{

  50%{

    transform:translate(-50%,-50%) translateX(1px);

  }

}

.scurry{

  animation:scurry 4s linear forwards;

}

@keyframes scurry{

  from{

    left:50%;

  }

  to{

    left:130%;

  }

}

/* =========================

SPEED LINES

========================= */

#speed{

  position:absolute;

  left:calc(50% - 88px);

  top:55%;

  transform:translateY(-50%);

  width:44px;

  height:30px;

  opacity:0;

  transition:opacity .4s ease;

}

#speed.active{

  opacity:1;

}

.sline{

  position:absolute;

  right:0;

  height:2px;

  background:rgba(255,255,255,.55);

  animation:speedMove .35s linear infinite;

}

.s1{

  width:24px;

  top:4px;

}

.s2{

  width:38px;

  top:14px;

}

.s3{

  width:20px;

  top:24px;

}

@keyframes speedMove{

  from{

    transform:translateX(0);

    opacity:.2;

  }

  to{

    transform:translateX(-20px);

    opacity:0;

  }

}

/* =========================

CHAOS

========================= */

#chaos{

  position:absolute;

  inset:0;

  opacity:0;

  pointer-events:none;

  transition:opacity 1.2s ease;

}

.window{

  position:absolute;

  border:1px solid rgba(200,255,80,.2);

  background:rgba(0,0,0,.88);

  color:rgba(220,255,120,.75);

  padding:10px;

  font-size:11px;

  letter-spacing:.12em;

  box-shadow:0 0 20px rgba(180,255,80,.05);

}

.w1{top:12%;left:8%;width:180px}

.w2{top:28%;right:10%;width:220px}

.w3{bottom:18%;left:12%;width:250px}

.w4{top:54%;right:18%;width:180px}

.w5{top:42%;left:36%;width:210px}

/* =========================

RECONNECT

========================= */

#reconnect{

  position:absolute;

  left:50%;

  top:48%;

  transform:translate(-50%,-50%);

  font-size:22px;

  letter-spacing:.32em;

  color:rgba(210,255,90,.15);

  opacity:0;

  transition:opacity 2s ease;

  animation:breathe 4s ease-in-out infinite;

}

@keyframes breathe{

  0%,100%{

    opacity:.18;

  }

  50%{

    opacity:.55;

  }

}

/* =========================

CHANNELS

========================= */

#channels{

  position:absolute;

  left:50%;

  top:56%;

  transform:translateX(-50%);

}

.channel{

  margin:18px 0;

  letter-spacing:.18em;

  color:rgba(220,255,120,.75);

}

.dormant{

}

<script>

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const homie = document.getElementById("homie");

const chaos = document.getElementById("chaos");

const reconnect = document.getElementById("reconnect");

const channels = document.getElementById("channels");

const speed = document.getElementById("speed");

let progress = 0;

let halted = false;

const loop = setInterval(()=>{

  if(halted) return;

  progress++;

  fill.style.width = progress + "%";

  percent.innerText = progress + "%";

  if(progress === 16){

    halted = true;

    homie.classList.remove("walk");

    setTimeout(()=>{

      progress = 17;

      fill.style.width = "17%";

      percent.innerText = "17%";

    },900);

    setTimeout(()=>{

      progress = 18;

      fill.style.width = "18%";

      percent.innerText = "18%";

    },1500);

    setTimeout(()=>{

      homie.classList.add("nervous");

    },2400);

    setTimeout(()=>{

      chaos.style.opacity = 1;

    },3800);

    setTimeout(()=>{

      recovery();

    },7800);

  }

},580);

function recovery(){

  chaos.style.opacity = 0;

  fill.style.width = "100%";

  percent.innerText = "100%";

  percent.classList.add("flash");

  homie.classList.remove("nervous");

  setTimeout(()=>{

    homie.classList.add("walk");

    homie.classList.add("scurry");

    speed.classList.add("active");

  },1200);

  setTimeout(()=>{

    speed.classList.remove("active");

  },5000);

  setTimeout(()=>{

    reconnect.style.opacity = 1;

  },5200);

}

reconnect.addEventListener("click",()=>{

  channels.style.opacity = 1;

});

setInterval(()=>{

  const dormant = document.querySelectorAll(".dormant");

  const random = dormant[Math.floor(Math.random()*dormant.length)];

  random.style.opacity = ".32";

  setTimeout(()=>{

    random.style.opacity = "";

  },700);

},18000);

</script>
