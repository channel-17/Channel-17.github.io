<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

/* =========================================================

RESET

========================================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial, Helvetica, sans-serif;

}

/* =========================================================

BASE

========================================================= */

body{

background:#000;

overflow:hidden;

color:#fff;

}

/* =========================================================

NOISE

========================================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.045;

z-index:99999;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================================

VIGNETTE

========================================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 48%,

rgba(0,0,0,.52) 74%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================================

FLASH

========================================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:700;

}

/* =========================================================

LOADER

========================================================= */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:3000;

transition:

1s ease;

}

/* tube */

#tube{

position:relative;

width:min(84vw,560px);

height:28px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.12);

background:

rgba(255,255,255,.02);

box-shadow:

0 0 12px rgba(255,255,255,.03);

}

#tube::after{

content:"";

position:absolute;

inset:0;

opacity:.08;

background:

linear-gradient(

180deg,

rgba(255,255,255,.08),

transparent

);

}

/* fill */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.88),

rgba(255,255,255,1)

);

}

/* turtle */

#turtleWrap{

margin-top:32px;

height:66px;

display:flex;

justify-content:center;

align-items:center;

}

#turtle{

width:60px;

height:60px;

opacity:.94;

transition:

.18s ease;

filter:

drop-shadow(

0 0 8px rgba(255,255,255,.08)

);

animation:

walkBob 1.2s ease-in-out infinite;

}

@keyframes walkBob{

0%,100%{

transform:

translateY(0px);

}

50%{

transform:

translateY(-2px);

}

}

/* right */

.walkRight{

transform:

scaleX(1);

}

/* left */

.lookLeft{

transform:

scaleX(-1);

}

/* gasp */

.gasp #head{

transform:

translateX(6px);

}

.gasp #leg1{

transform:

translateY(2px);

}

.gasp #leg2{

transform:

translateY(2px);

}

/* retract */

.retract #head{

transform:

translateX(-18px);

opacity:0;

transition:

.14s ease;

}

.retract #leg1{

transform:

translateY(-12px);

opacity:0;

transition:

.12s ease;

}

.retract #leg2{

transform:

translateY(-12px);

opacity:0;

transition:

.12s ease;

}

.retract #tail{

transform:

translateX(10px);

opacity:0;

transition:

.12s ease;

}

/* shell */

.shell{

transform:

scale(.72);

opacity:.82;

filter:

blur(.1px)

drop-shadow(

0 0 10px rgba(255,255,255,.06)

);

}

/* percent */

#percent{

margin-top:14px;

font-size:14px;

font-weight:600;

letter-spacing:.28em;

opacity:.42;

}

/* =========================================================

CHAOS

========================================================= */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

opacity:0;

z-index:2000;

transition:

.5s ease;

}

/* signal lost */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(30px,5vw,76px);

letter-spacing:.24em;

white-space:nowrap;

opacity:0;

color:#fff;

text-shadow:

0 0 16px rgba(255,255,255,.12);

}

/* =========================================================

FRAGMENTS

========================================================= */

.uiFragment{

position:absolute;

border:

1px solid rgba(255,255,255,.05);

background:

rgba(255,255,255,.02);

backdrop-filter:

blur(1px);

opacity:.08;

mix-blend-mode:screen;

}

/* bars */

.browserBar{

width:78vw;

height:48px;

border-radius:14px;

}

/* windows */

.windowFrag{

width:90vw;

height:28vh;

}

/* tabs */

.tabFrag{

width:36vw;

height:42px;

border-radius:10px;

}

/* side */

.sideFrag{

width:20vw;

height:44vh;

}

/* =========================================================

CASCADE

========================================================= */

@keyframes cascade{

0%{

opacity:0;

transform:

translate(

0px,

0px

)

scale(1);

}

20%{

opacity:.14;

}

100%{

opacity:0;

transform:

translate(

calc(var(--x) * 1px),

calc(var(--y) * 1px)

)

scale(1.04);

}

}

/* =========================================================

WARNINGS

========================================================= */

.warning{

position:absolute;

font-size:

clamp(10px,1.5vw,18px);

letter-spacing:.18em;

white-space:nowrap;

color:#ff2d2d;

opacity:0;

text-shadow:

0 0 10px rgba(255,0,0,.3);

animation:

warn .42s linear;

}

@keyframes warn{

0%{

opacity:0;

transform:

translateX(-10px);

}

40%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(10px);

}

}

/* =========================================================

SHAKE

========================================================= */

.shake{

animation:

shake .08s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(1px,-1px);

}

50%{

transform:translate(-1px,1px);

}

75%{

transform:translate(1px,1px);

}

100%{

transform:translate(0px,0px);

}

}

.violent{

animation:

violent .05s linear infinite;

}

@keyframes violent{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(3px,-2px);

}

50%{

transform:translate(-3px,2px);

}

75%{

transform:translate(2px,3px);

}

100%{

transform:translate(0px,0px);

}

}

/* =========================================================

MATRIX

========================================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

pointer-events:none;

z-index:1200;

opacity:0;

}

/* =========================================================

SIGNAL SPACE

========================================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

z-index:5000;

transition:

2s ease;

}

/* reconnect */

#reconnect{

position:absolute;

font-size:

clamp(18px,3vw,30px);

letter-spacing:.34em;

color:

rgba(255,255,255,.76);

opacity:0;

cursor:pointer;

text-shadow:

0 0 12px rgba(255,255,255,.06);

}

/* warmth */

#warmth{

position:absolute;

width:18px;

height:18px;

border-radius:50%;

opacity:0;

background:

radial-gradient(

circle,

rgba(255,210,150,.95) 0%,

rgba(255,160,70,.42) 34%,

transparent 78%

);

filter:

blur(5px);

}

/* inner */

#symbol{

position:absolute;

width:min(42vw,220px);

opacity:0;

filter:

blur(.2px)

drop-shadow(

0 0 10px rgba(255,255,255,.05)

);

transition:

2.5s ease;

}

/* outer */

#outerTriangle{

position:absolute;

width:min(72vw,420px);

opacity:0;

filter:

blur(.3px)

drop-shadow(

0 0 12px rgba(255,255,255,.04)

);

transition:

3s ease;

}

/* etchings */

#etchings{

position:absolute;

inset:0;

opacity:0;

transition:

4s ease;

}

.etch{

position:absolute;

display:block;

opacity:.18;

filter:

blur(.12px)

drop-shadow(

0 0 10px rgba(255,180,90,.03)

);

}

#etch1{

width:min(40vw,230px);

left:12%;

top:59%;

transform:

rotate(-3deg);

opacity:.72;

}

#etch2{

width:min(46vw,280px);

left:24%;

top:75%;

transform:

rotate(1deg);

opacity:.52;

}

#etch3{

width:min(28vw,170px);

left:66%;

top:77%;

transform:

rotate(-4deg);

opacity:.34;

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<!-- =========================================================

LOADER

========================================================= -->

<div id="loader">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtleWrap">

<svg

id="turtle"

class="walkRight"

viewBox="0 0 120 120">

<!-- shell -->

<ellipse

id="shellBody"

cx="60"

cy="60"

rx="30"

ry="24"

fill="white"/>

<!-- shell lines -->

<path

d="M60 38 L60 82"

stroke="black"

stroke-width="2"

opacity=".18"/>

<path

d="M38 60 L82 60"

stroke="black"

stroke-width="2"

opacity=".18"/>

<path

d="M46 46 L74 74"

stroke="black"

stroke-width="2"

opacity=".12"/>

<!-- head -->

<circle

id="head"

cx="92"

cy="56"

r="10"

fill="white"/>

<!-- legs -->

<rect

id="leg1"

x="42"

y="80"

width="8"

height="12"

rx="4"

fill="white"/>

<rect

id="leg2"

x="66"

y="80"

width="8"

height="12"

rx="4"

fill="white"/>

<!-- tail -->

<polygon

id="tail"

points="26,60 18,56 18,64"

fill="white"/>

</svg>

</div>

<div id="percent">

0%

</div>

</div>

<!-- =========================================================

CHAOS

========================================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================================

MATRIX

========================================================= -->

<canvas id="matrix"></canvas>

<!-- =========================================================

SIGNAL SPACE

========================================================= -->

<div id="signalSpace">

<div id="reconnect">

RECONNECT

</div>

<div id="warmth"></div>

<img

id="symbol"

src="Inner17-final.png">

<img

id="outerTriangle"

src="Outer17-final.png">

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<div id="vignette"></div>

<script>

/* =========================================================

LOADER

========================================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

let load = 0;

let turned = false;

let gasped = false;

let hidden = false;

const loading =

setInterval(()=>{

load += .38;

if(load > 17){

load = 17;

}

fill.style.width =

load + "%";

percent.innerText =

Math.floor(load) + "%";

/* TWITCH */

if(load >= 15.8 && !turned){

microTwitch();

turned = true;

setTimeout(()=>{

turtle.classList.remove(

"walkRight"

);

turtle.classList.add(

"lookLeft"

);

},120);

}

/* GASP */

if(load >= 16.3 && !gasped){

gasped = true;

turtle.classList.add(

"gasp"

);

}

/* RETRACT */

if(load >= 16.7 && !hidden){

hidden = true;

turtle.classList.remove(

"gasp"

);

turtle.classList.add(

"retract"

);

}

/* SHELL HOLD */

if(load >= 16.9){

turtle.classList.add(

"shell"

);

}

/* CHAOS */

if(load >= 17){

clearInterval(loading);

setTimeout(()=>{

startChaos();

},950);

}

},58);

/* =========================================================

MICRO TWITCH

========================================================= */

function microTwitch(){

document.body.style.transform =

"translateX(2px)";

setTimeout(()=>{

document.body.style.transform =

"translateX(0px)";

},40);

}

/* =========================================================

CHAOS

========================================================= */

const chaos =

document.getElementById("chaos");

const signalLost =

document.getElementById("signalLost");

const matrix =

document.getElementById("matrix");

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},700);

chaos.style.opacity = 1;

matrix.style.opacity = .24;

document.body.classList.add(

"shake"

);

let intensity = 0;

const escalation =

setInterval(()=>{

intensity += 1;

/* slow contamination */

for(let i=0;i<intensity*2;i++){

fragmentCascade();

}

/* warnings */

if(intensity > 2){

warning();

}

/* signal loss */

if(intensity > 5){

lost();

}

/* flashes */

if(intensity > 6){

flash();

}

/* heavy collapse */

if(intensity > 9){

document.body.classList.add(

"violent"

);

for(let i=0;i<intensity;i++){

fragmentCascade();

}

}

/* collapse */

if(intensity >= 18){

clearInterval(escalation);

collapse();

}

},180);

}

/* =========================================================

FRAGMENTS

========================================================= */

function fragmentCascade(){

const types = [

"browserBar",

"windowFrag",

"tabFrag",

"sideFrag"

];

const frag =

document.createElement("div");

frag.className =

`uiFragment ${

types[

Math.floor(

Math.random()*types.length

)

]

}`;

frag.style.top =

(Math.random()*100)+"%";

frag.style.left =

(Math.random()*100)+"%";

frag.style.setProperty(

"--x",

Math.random()*140-70

);

frag.style.setProperty(

"--y",

Math.random()*80-40

);

frag.style.animation =

`cascade ${

.5 + Math.random()*.7

}s linear forwards`;

chaos.appendChild(frag);

setTimeout(()=>{

frag.remove();

},1200);

}

/* =========================================================

FLASH

========================================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .18;

setTimeout(()=>{

f.style.opacity = 0;

},40);

}

/* =========================================================

WARNINGS

========================================================= */

function warning(){

const msgs = [

"SYSTEM OVERLOAD",

"MEMORY COLLISION",

"SIGNAL CONFLICT",

"TRANSMISSION FAILURE",

"IDENTITY COLLISION",

"AUTHENTICATION FAILURE",

"TOO MANY ACTIVE MASKS",

"HUMAN INPUT LOST",

"ORIGINAL SIGNAL LOST"

];

const w =

document.createElement("div");

w.className = "warning";

w.innerText =

msgs[

Math.floor(

Math.random()*msgs.length

)

];

w.style.left =

(Math.random()*80+4)+"%";

w.style.top =

(Math.random()*84+4)+"%";

chaos.appendChild(w);

setTimeout(()=>{

w.remove();

},420);

}

/* =========================================================

SIGNAL LOST

========================================================= */

function lost(){

signalLost.style.opacity =

.92;

signalLost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*10-5}px,

${Math.random()*8-4}px

)`;

setTimeout(()=>{

signalLost.style.opacity = 0;

},180);

}

/* =========================================================

COLLAPSE

========================================================= */

function collapse(){

chaos.style.opacity = 0;

matrix.style.opacity = 0;

document.body.classList.remove(

"shake",

"violent"

);

/* uncomfortable silence */

setTimeout(()=>{

const signalSpace =

document.getElementById(

"signalSpace"

);

signalSpace.style.opacity = 1;

signalSpace.style.pointerEvents =

"auto";

/* reconnect breathing */

const reconnect =

document.getElementById(

"reconnect"

);

reconnect.style.opacity = .82;

let breath = 0;

const breathe =

setInterval(()=>{

breath++;

if(breath < 5){

reconnect.style.textShadow =

`0 0 ${

18 + Math.random()*26

}px rgba(255,255,255,.22)`;

}else{

reconnect.style.textShadow =

`0 0 14px rgba(255,255,255,.08)`;

}

},700);

},1300);

}

/* =========================================================

MATRIX

========================================================= */

const ctx =

matrix.getContext("2d");

function resize(){

matrix.width =

window.innerWidth;

matrix.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const streams = [];

for(let i=0;i<42;i++){

streams.push({

x:

Math.random()*matrix.width,

y:

Math.random()*matrix.height,

speed:

2 + Math.random()*4,

len:

12 + Math.random()*18

});

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,.08)";

ctx.fillRect(

0,

0,

matrix.width,

matrix.height

);

streams.forEach(s=>{

for(let i=0;i<s.len;i++){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i/s.len)

})`;

ctx.font =

"18px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

s.x + (i*18),

s.y

);

}

s.x += s.speed;

if(s.x > matrix.width + 300){

s.x = -400;

s.y =

Math.random()*matrix.height;

}

});

requestAnimationFrame(draw);

}

draw();

/* =========================================================

RECONNECT

========================================================= */

const reconnect =

document.getElementById(

"reconnect"

);

reconnect.addEventListener(

"click",

()=>{

/* disappear */

reconnect.style.opacity = 0;

/* warmth */

const warmth =

document.getElementById(

"warmth"

);

warmth.style.opacity = 1;

/* transfer */

warmth.animate([

{

transform:

"translate(-50%,-50%) scale(.3)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(1)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(5.8)",

opacity:.14

}

],{

duration:2400,

fill:"forwards"

});

/* inner */

setTimeout(()=>{

document.getElementById(

"symbol"

).style.opacity = .24;

},700);

/* outer */

setTimeout(()=>{

document.getElementById(

"outerTriangle"

).style.opacity = .28;

},1400);

/* etchings */

setTimeout(()=>{

document.getElementById(

"etchings"

).style.opacity = 1;

},2200);

});

</script>

</body>

</html>
