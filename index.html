<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

/* =========================================================

RESET

========================================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial, Helvetica, sans-serif;

cursor:default;

}

/* =========================================================

BASE

========================================================= */

body{

background:#000;

color:#fff;

overflow:hidden;

}

/* =========================================================

NOISE

========================================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.05;

z-index:999999;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .06s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================================

VIGNETTE

========================================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:9999999;

background:

radial-gradient(

circle,

transparent 46%,

rgba(0,0,0,.48) 72%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================================

LOADER

========================================================= */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

z-index:2000;

background:#000;

transition:

1s ease;

}

/* =========================================================

BAR

========================================================= */

#bar{

position:relative;

width:min(60vw,420px);

height:40px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.1);

background:

rgba(255,255,255,.025);

box-shadow:

0 0 20px rgba(255,255,255,.04);

}

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.82),

rgba(255,255,255,1)

);

box-shadow:

0 0 18px rgba(255,255,255,.12);

}

/* =========================================================

PERCENT

========================================================= */

#percent{

margin-top:18px;

font-size:16px;

font-weight:700;

letter-spacing:.22em;

opacity:.5;

}

/* =========================================================

TURTLE

========================================================= */

#turtleWrap{

margin-top:34px;

display:flex;

justify-content:center;

align-items:center;

height:90px;

}

#turtle{

width:92px;

height:92px;

opacity:.96;

filter:

drop-shadow(

0 0 12px rgba(255,255,255,.08)

);

transition:

.16s ease;

animation:

walk 1.2s ease-in-out infinite;

}

/* walk */

@keyframes walk{

0%,100%{

transform:

translateY(0px);

}

50%{

transform:

translateY(-3px);

}

}

/* face right */

.walking{

transform:

scaleX(1);

}

/* look left */

.look{

transform:

scaleX(-1);

}

/* gasp */

.gasp #head{

transform:

translateX(10px);

}

.gasp #leg1{

transform:

translateY(3px);

}

.gasp #leg2{

transform:

translateY(3px);

}

/* retract */

.retract #head{

transform:

translateX(-28px);

opacity:0;

}

.retract #leg1{

transform:

translateY(-18px);

opacity:0;

}

.retract #leg2{

transform:

translateY(-18px);

opacity:0;

}

.retract #tail{

transform:

translateX(10px);

opacity:0;

}

/* shell lock */

.shell #shell{

transform:

scale(1.08);

}

/* =========================================================

CHAOS

========================================================= */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

opacity:0;

z-index:3000;

transition:

1s ease;

}

/* =========================================================

DESKTOP WINDOWS

========================================================= */

.window{

position:absolute;

background:

rgba(15,15,15,.94);

border:

1px solid rgba(255,255,255,.08);

border-radius:12px;

overflow:hidden;

box-shadow:

0 0 22px rgba(0,0,0,.7);

opacity:0;

animation:

cascade linear forwards;

}

/* top bar */

.windowTop{

height:34px;

display:flex;

align-items:center;

padding-left:14px;

font-size:12px;

letter-spacing:.12em;

background:

rgba(255,255,255,.05);

border-bottom:

1px solid rgba(255,255,255,.04);

}

/* body */

.windowBody{

padding:16px;

font-size:12px;

line-height:1.7;

opacity:.75;

}

/* warning */

.red{

color:#ff3434;

}

/* cascade */

@keyframes cascade{

0%{

opacity:0;

transform:

translate(0px,0px)

scale(.96);

}

12%{

opacity:.92;

}

100%{

opacity:0;

transform:

translate(

var(--moveX),

var(--moveY)

)

scale(1.03);

}

}

/* =========================================================

SIGNAL LOST

========================================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(34px,6vw,82px);

letter-spacing:.26em;

color:#ff2a2a;

opacity:0;

text-shadow:

0 0 18px rgba(255,0,0,.22);

}

/* =========================================================

FLASH

========================================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:9000;

}

/* =========================================================

RECONNECT SPACE

========================================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

z-index:7000;

transition:

2s ease;

}

/* reconnect */

#reconnect{

position:absolute;

font-size:

clamp(18px,3vw,30px);

letter-spacing:.34em;

opacity:0;

cursor:pointer;

user-select:none;

color:

rgba(255,255,255,.78);

text-shadow:

0 0 10px rgba(255,255,255,.08);

transition:

.5s ease;

z-index:9000;

}

/* warmth */

#warmth{

position:absolute;

width:18px;

height:18px;

border-radius:50%;

opacity:0;

filter:

blur(8px);

background:

radial-gradient(

circle,

rgba(255,214,170,.98) 0%,

rgba(255,155,80,.6) 24%,

rgba(255,120,40,.12) 52%,

transparent 80%

);

z-index:5000;

}

/* inner */

#inner{

position:absolute;

width:min(40vw,220px);

opacity:0;

filter:

blur(.2px)

drop-shadow(

0 0 10px rgba(255,255,255,.06)

);

transition:

3s ease;

z-index:6000;

}

/* outer */

#outer{

position:absolute;

width:min(70vw,420px);

opacity:0;

filter:

blur(.2px)

drop-shadow(

0 0 12px rgba(255,255,255,.04)

);

transition:

2s ease;

z-index:5500;

}

/* etchings */

#etchings{

position:absolute;

inset:0;

opacity:0;

transition:

4s ease;

z-index:4000;

}

.etch{

position:absolute;

opacity:.16;

filter:

blur(.15px)

drop-shadow(

0 0 10px rgba(255,180,90,.03)

);

}

#etch1{

width:min(36vw,220px);

left:12%;

top:64%;

}

#etch2{

width:min(42vw,260px);

left:26%;

top:78%;

}

#etch3{

width:min(26vw,160px);

left:68%;

top:80%;

}

/* =========================================================

SHAKE

========================================================= */

.shake{

animation:

shake .07s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(2px,-1px);

}

50%{

transform:translate(-2px,1px);

}

75%{

transform:translate(1px,2px);

}

100%{

transform:translate(0px,0px);

}

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<!-- =========================================================

LOADER

========================================================= -->

<div id="loader">

<div id="bar">

<div id="fill"></div>

</div>

<div id="percent">

0%

</div>

<div id="turtleWrap">

<svg

id="turtle"

class="walking"

viewBox="0 0 120 120">

<!-- shell -->

<g id="shell">

<ellipse

cx="60"

cy="60"

rx="34"

ry="28"

fill="white"/>

<!-- shell segmentation -->

<path

d="M60 32 L60 88"

stroke="black"

stroke-width="2.6"

opacity=".18"/>

<path

d="M30 60 L90 60"

stroke="black"

stroke-width="2.6"

opacity=".18"/>

<path

d="M42 42 L78 78"

stroke="black"

stroke-width="2"

opacity=".12"/>

<path

d="M78 42 L42 78"

stroke="black"

stroke-width="2"

opacity=".12"/>

</g>

<!-- head -->

<circle

id="head"

cx="96"

cy="58"

r="11"

fill="white"/>

<!-- legs -->

<rect

id="leg1"

x="42"

y="84"

width="10"

height="14"

rx="4"

fill="white"/>

<rect

id="leg2"

x="70"

y="84"

width="10"

height="14"

rx="4"

fill="white"/>

<!-- tail -->

<polygon

id="tail"

points="24,60 14,56 14,64"

fill="white"/>

</svg>

</div>

</div>

<!-- =========================================================

CHAOS

========================================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================================

RECONNECT

========================================================= -->

<div id="signalSpace">

<div id="reconnect">

RECONNECT

</div>

<div id="warmth"></div>

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<div id="vignette"></div>

<script>

/* =========================================================

ELEMENTS

========================================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

const chaos =

document.getElementById("chaos");

const reconnect =

document.getElementById("reconnect");

const signalSpace =

document.getElementById("signalSpace");

/* =========================================================

LOADING

========================================================= */

let load = 0;

let looked = false;

let gasped = false;

let hidden = false;

const loaderLoop =

setInterval(()=>{

load += .55;

if(load > 17){

load = 17;

}

fill.style.width =

load + "%";

percent.innerText =

Math.floor(load) + "%";

/* twitch */

if(load >= 15.7 && !looked){

looked = true;

microTwitch();

setTimeout(()=>{

turtle.classList.remove(

"walking"

);

turtle.classList.add(

"look"

);

},120);

}

/* gasp */

if(load >= 16.1 && !gasped){

gasped = true;

turtle.classList.add(

"gasp"

);

}

/* retract */

if(load >= 16.5 && !hidden){

hidden = true;

turtle.classList.remove(

"gasp"

);

turtle.classList.add(

"retract"

);

}

/* shell */

if(load >= 16.8){

turtle.classList.add(

"shell"

);

}

/* chaos */

if(load >= 17){

clearInterval(loaderLoop);

setTimeout(()=>{

startChaos();

},1000);

}

},52);

/* =========================================================

TWITCH

========================================================= */

function microTwitch(){

document.body.style.transform =

"translateX(2px)";

setTimeout(()=>{

document.body.style.transform =

"translateX(0px)";

},40);

}

/* =========================================================

CHAOS

========================================================= */

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},900);

chaos.style.opacity = 1;

document.body.classList.add(

"shake"

);

let layer = 0;

const chaosLoop =

setInterval(()=>{

layer++;

/* cascading windows */

for(let i=0;i<layer+1;i++){

spawnWindow();

}

/* flashes */

if(layer > 4){

flash();

}

/* signal lost */

if(layer > 6){

signalLost();

}

/* collapse */

if(layer >= 16){

clearInterval(chaosLoop);

collapse();

}

},180);

}

/* =========================================================

WINDOWS

========================================================= */

function spawnWindow(){

const titles = [

"system",

"memory",

"warning",

"signal",

"identity",

"transmission",

"mask protocol",

"channel"

];

const bodies = [

"MEMORY COLLISION DETECTED",

"TRANSMISSION FAILURE",

"TOO MANY ACTIVE MASKS",

"HUMAN INPUT LOST",

"ORIGINAL SIGNAL DETECTED",

"DO NOT LET THEM SEE YOU",

"RECONNECT?",

"SIGNAL STILL ACTIVE"

];

const win =

document.createElement("div");

win.className = "window";

win.style.width =

(300 + Math.random()*260)+"px";

win.style.height =

(140 + Math.random()*140)+"px";

win.style.left =

(Math.random()*60)+"vw";

win.style.top =

(Math.random()*60)+"vh";

win.style.setProperty(

"--moveX",

`${Math.random()*180-90}px`

);

win.style.setProperty(

"--moveY",

`${Math.random()*120-60}px`

);

win.style.animationDuration =

(.9 + Math.random()*1.2)+"s";

win.innerHTML = `

<div class="windowTop">

${titles[Math.floor(Math.random()*titles.length)]}

</div>

<div class="windowBody">

<div class="red">

${bodies[Math.floor(Math.random()*bodies.length)]}

</div>

<br>

recursive overflow detected

<br>

signal instability rising

<br>

authentication failure

</div>

`;

chaos.appendChild(win);

setTimeout(()=>{

win.remove();

},2200);

}

/* =========================================================

FLASH

========================================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .12;

setTimeout(()=>{

f.style.opacity = 0;

},40);

}

/* =========================================================

SIGNAL LOST

========================================================= */

function signalLost(){

const lost =

document.getElementById("signalLost");

lost.style.opacity = .88;

lost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*8-4}px,

${Math.random()*6-3}px

)`;

setTimeout(()=>{

lost.style.opacity = 0;

},150);

}

/* =========================================================

COLLAPSE

========================================================= */

function collapse(){

chaos.style.opacity = 0;

document.body.classList.remove(

"shake"

);

/* silence */

setTimeout(()=>{

signalSpace.style.opacity = 1;

signalSpace.style.pointerEvents =

"auto";

/* reconnect */

reconnect.style.opacity = .76;

/* symbol emergence */

document.getElementById(

"inner"

).style.opacity = .18;

document.getElementById(

"outer"

).style.opacity = .12;

/* heartbeat */

heartbeat();

},1400);

}

/* =========================================================

HEARTBEAT

========================================================= */

function heartbeat(){

let unstable = true;

setTimeout(()=>{

unstable = false;

},6000);

setInterval(()=>{

if(unstable){

reconnect.animate([

{

opacity:.42,

textShadow:"0 0 6px rgba(255,255,255,.04)"

},

{

opacity:.96,

textShadow:"0 0 22px rgba(255,255,255,.22)"

},

{

opacity:.48,

textShadow:"0 0 10px rgba(255,255,255,.06)"

}

],{

duration:1200

});

}else{

reconnect.animate([

{

opacity:.64,

textShadow:"0 0 10px rgba(255,255,255,.08)"

},

{

opacity:.82,

textShadow:"0 0 16px rgba(255,255,255,.14)"

},

{

opacity:.68,

textShadow:"0 0 10px rgba(255,255,255,.08)"

}

],{

duration:1800

});

}

},1800);

}

/* =========================================================

RECONNECT

========================================================= */

reconnect.addEventListener(

"click",

()=>{

/* remove reconnect */

reconnect.style.pointerEvents =

"none";

reconnect.style.opacity = 0;

/* warmth */

const warmth =

document.getElementById(

"warmth"

);

warmth.style.opacity = 1;

warmth.animate([

{

transform:

"scale(.3)",

opacity:1

},

{

transform:

"scale(1)",

opacity:1

},

{

transform:

"scale(8)",

opacity:.12

}

],{

duration:2600,

fill:"forwards"

});

/* outer triangle fucks off */

const outer =

document.getElementById(

"outer"

);

outer.style.opacity = 0;

outer.style.transform =

"scale(1.08)";

/* inner remains */

const inner =

document.getElementById(

"inner"

);

inner.style.opacity = .28;

/* etchings emerge */

setTimeout(()=>{

document.getElementById(

"etchings"

).style.opacity = 1;

},1300);

});

</script>

</body>

</html>
