<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL-17</title>
<style>

body {

    margin: 0;

    padding: 0;

    background: #000;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

}

.container {

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* LOGO */

.logo {

    width: 170px;

    max-width: 60vw;

    opacity: 0;

    animation: fadeLogo 4s ease forwards;

    filter:

    drop-shadow(0 0 10px rgba(255,255,255,0.08));

}

/* TYPEWRITER */

.subtext {

    margin-top: 28px;

font-size: 0.9rem;

letter-spacing: 4px;

color: #ffffff;

text-transform: uppercase;

opacity: 0;

animation:

    fadeText 1s ease forwards;

animation-delay: 4s;
}

/* BLINKING DOTS */

.dots {

    animation: dotsBlink 1.4s infinite;

}

/* RECONNECT */

.reconnect {

    margin-top: 45px;

    text-decoration: none;

    font-size: 0.75rem;

    letter-spacing: 6px;

    color: rgba(255,255,255,0.25);

    opacity: 0;

    animation: fadeReconnect 2s ease forwards;

    animation-delay: 10s;

    transition: 0.3s ease;

}

.reconnect:hover {

    color: rgba(255,255,255,0.8);

    letter-spacing: 8px;

}

/* ANIMATIONS */

@keyframes fadeLogo {

    from {

        opacity: 0;

        transform: scale(0.92);

        filter: blur(8px);

    }

    to {

        opacity: 1;

        transform: scale(1);

        filter: blur(0);

    }

}

@keyframes typing {

    from {

        width: 0;

    }

    to {

        width: 24ch;

    }

}

@keyframes blinkCursor {

    50% {

        border-color: transparent;

    }

}

@keyframes dotsBlink {

    0%, 20% {

        opacity: 0.2;

    }

    50% {

        opacity: 1;

    }

    100% {

        opacity: 0.2;

    }

}

@keyframes fadeReconnect {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    from {

    opacity: 0;

    transform: translateY(8px);

}

to {

    opacity: 1;

    transform: translateY(0);

}

}

</style>
</head>
<body>
<div class="container">
<img src="mark17.png" class="logo">
<div class="subtext">

    transmission interrupted<span class="dots">

        <span>.</span><span>.</span><span>.</span>

    </span>

</div>

  <a class="reconnect" href="#">

    reconnect

</a>
  </body>
  </html>
