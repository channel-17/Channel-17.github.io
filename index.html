<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

/* ==================================================

RESET

================================================== */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial, Helvetica, sans-serif;

}

/* ==================================================

BASE

================================================== */

body{

background:#000;

overflow:hidden;

color:#fff;

}

/* ==================================================

NOISE

================================================== */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

opacity:.055;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* ==================================================

VIGNETTE

================================================== */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:9999999;

background:

radial-gradient(

circle,

transparent 52%,

rgba(0,0,0,.52) 72%,

rgba(0,0,0,.98) 100%

);

}

/* ==================================================

LOADER

================================================== */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:1000;

transition:

.8s ease;

}

/* loading tube */

#tube{

position:relative;

width:min(84vw,560px);

height:28px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.12);

background:

rgba(255,255,255,.025);

box-shadow:

0 0 12px rgba(255,255,255,.03);

}

#tube::after{

content:"";

position:absolute;

inset:0;

opacity:.1;

background:

linear-gradient(

180deg,

rgba(255,255,255,.08),

transparent

);

}

/* fill */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.86),

rgba(255,255,255,1)

);

}

/* turtle */

#turtleWrap{

margin-top:32px;

height:56px;

display:flex;

justify-content:center;

align-items:center;

}

#turtle{

width:42px;

height:42px;

opacity:.92;

transition:

.22s ease;

filter:

drop-shadow(

0 0 8px rgba(255,255,255,.08)

);

}

/* left */

.lookLeft{

transform:

scaleX(-1);

}

/* right */

.lookRight{

transform:

scaleX(1);

}

/* shell */

.shell{

transform:

scale(.68);

opacity:.72;

filter:

blur(.2px)

drop-shadow(

0 0 10px rgba(255,255,255,.06)

);

}

/* percent */

#percent{

margin-top:10px;

font-size:11px;

letter-spacing:.4em;

opacity:.12;

}

/* ==================================================

FLASH

================================================== */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:500;

}

/* ==================================================

CHAOS

================================================== */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

opacity:0;

z-index:400;

transition:

.5s ease;

}

/* signal lost */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(30px,5vw,76px);

letter-spacing:.24em;

white-space:nowrap;

opacity:0;

color:#fff;

text-shadow:

0 0 18px rgba(255,255,255,.12);

}

/* ==================================================

CASCADE FRAGMENTS

================================================== */

.uiFragment{

position:absolute;

border:

1px solid rgba(255,255,255,.05);

background:

rgba(255,255,255,.02);

backdrop-filter:

blur(1px);

opacity:.06;

mix-blend-mode:screen;

}

/* fake browser bars */

.browserBar{

width:78vw;

height:48px;

left:50%;

transform:

translateX(-50%);

border-radius:14px;

}

/* fake windows */

.windowFrag{

width:88vw;

height:28vh;

left:50%;

transform:

translateX(-50%);

}

/* fake tabs */

.tabFrag{

width:38vw;

height:42px;

border-radius:10px;

}

/* fake sidebars */

.sideFrag{

width:22vw;

height:44vh;

}

/* ==================================================

CASCADE ANIMATION

================================================== */

@keyframes cascade{

0%{

opacity:0;

transform:

translate(

0px,

0px

)

scale(1);

}

20%{

opacity:.12;

}

100%{

opacity:0;

transform:

translate(

calc(var(--x) * 1px),

calc(var(--y) * 1px)

)

scale(1.04);

}

}

/* ==================================================

WARNINGS

================================================== */

.warning{

position:absolute;

font-size:

clamp(10px,1.5vw,18px);

letter-spacing:.22em;

white-space:nowrap;

color:#ff2d2d;

opacity:0;

text-shadow:

0 0 10px rgba(255,0,0,.3);

animation:

warn .4s linear;

}

@keyframes warn{

0%{

opacity:0;

transform:

translateX(-10px);

}

40%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(10px);

}

}

/* ==================================================

SHAKE

================================================== */

.shake{

animation:

shake .08s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(1px,-1px);

}

50%{

transform:translate(-1px,1px);

}

75%{

transform:translate(1px,1px);

}

100%{

transform:translate(0px,0px);

}

}

/* violent */

.violent{

animation:

violent .05s linear infinite;

}

@keyframes violent{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(3px,-2px);

}

50%{

transform:translate(-3px,2px);

}

75%{

transform:translate(2px,3px);

}

100%{

transform:translate(0px,0px);

}

}

/* ==================================================

MATRIX

================================================== */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

pointer-events:none;

z-index:300;

opacity:0;

}

/* ==================================================

SIGNAL SPACE

================================================== */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

z-index:2000;

transition:

2s ease;

}

/* reconnect */

#reconnect{

position:absolute;

font-size:

clamp(18px,3vw,30px);

letter-spacing:.34em;

color:

rgba(255,255,255,.76);

opacity:0;

cursor:pointer;

text-shadow:

0 0 12px rgba(255,255,255,.06);

animation:

rePulse 5s ease-in-out infinite;

transition:

1s ease;

}

@keyframes rePulse{

0%,100%{

opacity:.54;

}

50%{

opacity:.84;

}

}

/* touch */

#touch{

position:absolute;

width:18px;

height:18px;

border-radius:50%;

opacity:0;

background:

radial-gradient(

circle,

rgba(255,220,180,.95) 0%,

rgba(255,180,90,.45) 36%,

transparent 80%

);

filter:

blur(4px);

}

/* inner */

#symbol{

position:absolute;

width:min(42vw,220px);

opacity:0;

filter:

blur(.2px)

drop-shadow(

0 0 10px rgba(255,255,255,.05)

);

transition:

2s ease;

}

/* outer */

#outerTriangle{

position:absolute;

width:min(72vw,420px);

opacity:0;

filter:

blur(.3px)

drop-shadow(

0 0 12px rgba(255,255,255,.04)

);

transition:

2.5s ease;

}

/* etchings */

#etchings{

position:absolute;

inset:0;

opacity:0;

transition:

3s ease;

}

.etch{

position:absolute;

display:block;

opacity:.18;

filter:

blur(.12px)

drop-shadow(

0 0 10px rgba(255,180,90,.03)

);

}

/* placements */

#etch1{

width:min(40vw,230px);

left:12%;

top:59%;

transform:

rotate(-3deg);

opacity:.72;

}

#etch2{

width:min(46vw,280px);

left:24%;

top:75%;

transform:

rotate(1deg);

opacity:.52;

}

#etch3{

width:min(28vw,170px);

left:66%;

top:77%;

transform:

rotate(-4deg);

opacity:.34;

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<!-- ==================================================

LOADER

================================================== -->

<div id="loader">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtleWrap">

<svg id="turtle"

class="lookLeft"

viewBox="0 0 100 100">

<ellipse

cx="52"

cy="52"

rx="24"

ry="18"

fill="white"/>

<circle

cx="76"

cy="50"

r="7"

fill="white"/>

<rect

x="36"

y="68"

width="7"

height="10"

rx="3"

fill="white"/>

<rect

x="56"

y="68"

width="7"

height="10"

rx="3"

fill="white"/>

</svg>

</div>

<div id="percent">

0%

</div>

</div>

<!-- ==================================================

CHAOS

================================================== -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- ==================================================

MATRIX

================================================== -->

<canvas id="matrix"></canvas>

<!-- ==================================================

SIGNAL SPACE

================================================== -->

<div id="signalSpace">

<div id="reconnect">

RECONNECT

</div>

<div id="touch"></div>

<img

id="symbol"

src="Inner17-final.png">

<img

id="outerTriangle"

src="Outer17-final.png">

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<div id="vignette"></div>

<script>

/* ==================================================

LOADER

================================================== */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

let load = 0;

const loading =

setInterval(()=>{

/* faster */

load += .34;

if(load > 17){

load = 17;

}

/* fill */

fill.style.width =

load + "%";

/* percent */

percent.innerText =

Math.floor(load) + "%";

/* turtle */

if(load >= 16 && load < 16.6){

turtle.classList.remove(

"lookLeft"

);

turtle.classList.add(

"lookRight"

);

}

/* shell */

if(load >= 16.6){

turtle.classList.remove(

"lookRight"

);

turtle.classList.add(

"shell"

);

}

/* chaos */

if(load >= 17){

clearInterval(loading);

setTimeout(()=>{

startChaos();

},820);

}

},64);

/* ==================================================

CHAOS

================================================== */

const chaos =

document.getElementById("chaos");

const signalLost =

document.getElementById("signalLost");

const matrix =

document.getElementById("matrix");

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},600);

chaos.style.opacity = 1;

matrix.style.opacity = .24;

document.body.classList.add(

"shake"

);

let intensity = 0;

const escalation =

setInterval(()=>{

intensity += 1;

/* CASCADE GROWS */

for(let i=0;i<intensity*4;i++){

fragmentCascade();

}

/* warnings */

for(let i=0;i<intensity*.8;i++){

warning();

}

/* flashes */

if(intensity > 4){

flash();

}

/* lost */

if(intensity > 6){

lost();

}

/* full panic */

if(intensity > 8){

document.body.classList.add(

"violent"

);

}

/* longer collapse */

if(intensity >= 18){

clearInterval(escalation);

collapse();

}

},180);

}

/* ==================================================

FRAGMENTS

================================================== */

function fragmentCascade(){

const types = [

"browserBar",

"windowFrag",

"tabFrag",

"sideFrag"

];

const frag =

document.createElement("div");

frag.className =

`uiFragment ${

types[

Math.floor(

Math.random()*types.length

)

]

}`;

frag.style.top =

(Math.random()*100)+"%";

frag.style.left =

(Math.random()*100)+"%";

frag.style.setProperty(

"--x",

Math.random()*140-70

);

frag.style.setProperty(

"--y",

Math.random()*80-40

);

frag.style.animation =

`cascade ${

.4 + Math.random()*.7

}s linear forwards`;

chaos.appendChild(frag);

setTimeout(()=>{

frag.remove();

},1200);

}

/* ==================================================

FLASH

================================================== */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .18;

setTimeout(()=>{

f.style.opacity = 0;

},40);

}

/* ==================================================

WARNINGS

================================================== */

function warning(){

const msgs = [

"UNAUTHORIZED SIGNAL",

"SYSTEM OVERLOAD",

"TRANSMISSION BREACH",

"MEMORY COLLISION",

"FREQUENCY COLLAPSE",

"CONTAINMENT FAILURE"

];

const w =

document.createElement("div");

w.className = "warning";

w.innerText =

msgs[

Math.floor(

Math.random()*msgs.length

)

];

w.style.left =

(Math.random()*80+4)+"%";

w.style.top =

(Math.random()*84+4)+"%";

chaos.appendChild(w);

setTimeout(()=>{

w.remove();

},400);

}

/* ==================================================

SIGNAL LOST

================================================== */

function lost(){

signalLost.style.opacity =

.92;

signalLost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*10-5}px,

${Math.random()*8-4}px

)`;

setTimeout(()=>{

signalLost.style.opacity = 0;

},180);

}

/* ==================================================

COLLAPSE

================================================== */

function collapse(){

chaos.style.opacity = 0;

matrix.style.opacity = 0;

document.body.classList.remove(

"shake",

"violent"

);

/* silence */

setTimeout(()=>{

const signalSpace =

document.getElementById(

"signalSpace"

);

signalSpace.style.opacity = 1;

signalSpace.style.pointerEvents =

"auto";

/* reconnect only */

document.getElementById(

"reconnect"

).style.opacity = .84;

},1200);

}

/* ==================================================

MATRIX

================================================== */

const ctx =

matrix.getContext("2d");

function resize(){

matrix.width =

window.innerWidth;

matrix.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const streams = [];

for(let i=0;i<42;i++){

streams.push({

x:

Math.random()*matrix.width,

y:

Math.random()*matrix.height,

speed:

2 + Math.random()*4,

len:

12 + Math.random()*18

});

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,.08)";

ctx.fillRect(

0,

0,

matrix.width,

matrix.height

);

streams.forEach(s=>{

for(let i=0;i<s.len;i++){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i/s.len)

})`;

ctx.font =

"18px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

s.x + (i*18),

s.y

);

}

s.x += s.speed;

if(s.x > matrix.width + 300){

s.x = -400;

s.y =

Math.random()*matrix.height;

}

});

requestAnimationFrame(draw);

}

draw();

/* ==================================================

RECONNECT

================================================== */

const reconnect =

document.getElementById(

"reconnect"

);

reconnect.addEventListener(

"click",

()=>{

/* SAME FRAME */

reconnect.style.opacity = 0;

/* mud */

const touch =

document.getElementById(

"touch"

);

touch.style.opacity = 1;

/* warm pulse */

touch.animate([

{

transform:

"translate(-50%,-50%) scale(.2)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(.8)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(1.2)",

opacity:.7

}

],{

duration:1400,

fill:"forwards"

});

/* inner */

setTimeout(()=>{

document.getElementById(

"symbol"

).style.opacity = .24;

},500);

/* outer */

setTimeout(()=>{

document.getElementById(

"outerTriangle"

).style.opacity = .28;

},1000);

/* etchings */

setTimeout(()=>{

document.getElementById(

"etchings"

).style.opacity = 1;

},1500);

});

</script>

</body>

</html>
