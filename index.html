<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL 17</title>
        <style>

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background: #000;

    overflow: hidden;

    font-family: Arial, sans-serif;

}

/* SYMBOL */

.logo {

    position: absolute;

    top: 44%;

    left: 50%;

    transform: translate(-50%, -50%);

    width: 170px;

    max-width: 58vw;

    opacity: 0;

    filter:

    blur(8px)

    drop-shadow(0 0 12px rgba(255,255,255,0.05));

    animation: signalFade 5s ease forwards;

    animation-delay: 1.5s;

}

/* SIGNAL TEXT */

.signal {

    position: absolute;

    top: 58%;

    left: 32%;

    color: rgba(255,255,255,0.42);

    font-size: 0.82rem;

    letter-spacing: 6px;

    text-transform: uppercase;

    white-space: nowrap;

}

/* RECONNECT */

.reconnect {

    position: absolute;

    top: 66%;

    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.24);

    text-decoration: none;

    font-size: 0.75rem;

    letter-spacing: 10px;

    opacity: 0;

    animation: reconnectFade 2s ease forwards;

    animation-delay: 9s;

}

/* LOGO FADE */

@keyframes signalFade {

    from {

        opacity: 0;

        filter:

        blur(12px)

        drop-shadow(0 0 2px rgba(255,255,255,0.01));

        transform:

        translate(-50%, -50%)

        scale(0.92);

    }

    to {

        opacity: 1;

        filter:

        blur(0)

        drop-shadow(0 0 18px rgba(255,255,255,0.08));

        transform:

        translate(-50%, -50%)

        scale(1);

    }

}

/* RECONNECT */

@keyframes reconnectFade {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

</style>
        </head>
    <body>
        <img src="mark17.png" class="logo">
        <div class="signal" id="signal"></div>
        <a href="#" class="reconnect">

reconnect

</a>
        <script>

const message = "SIGNAL LOST...";

const signal = document.getElementById("signal");

let index = 0;

function typeSignal() {

    if (index < message.length) {

        signal.textContent += message.charAt(index);

        index++;

        setTimeout(typeSignal, 120);

    }

}

setTimeout(typeSignal, 5500);

</script>
        </body>
    </html>
