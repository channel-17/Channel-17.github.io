<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
}

body{
position:relative;
background:black;
}



/ SCREEN /

.screen{
position:absolute;
inset:0;
overflow:hidden;
background:black;
}



/ VIOLENT OPENING GLITCH /

.glitch{
position:absolute;
inset:0;

background:

repeating-linear-gradient(
0deg,
rgba(255,255,255,.14) 0px,
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
),

repeating-linear-gradient(
90deg,
rgba(255,255,255,.06) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 6px
);

mix-blend-mode:screen;

opacity:0;

pointer-events:none;

z-index:50;
}

.glitch.active{
animation:violentGlitch 2.2s steps(2) forwards;
}

@keyframes violentGlitch{

0%{
opacity:0;
}

8%{
opacity:1;
transform:
translateX(-40px)
skewX(18deg);
}

18%{
opacity:.1;
}

28%{
opacity:1;
transform:
translateX(32px)
skewX(-12deg);
}

44%{
opacity:0;
}

58%{
opacity:.9;
transform:
translateY(-5px)
scale(1.02);
}

74%{
opacity:.16;
}

100%{
opacity:.05;
transform:none;
}

}



/ SYMBOL /

.symbol-wrap{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:230px;
height:230px;

z-index:5;
}



/ TRIANGLE /

.outer{
position:absolute;

width:100%;
height:100%;

object-fit:contain;

opacity:.28;

filter:
blur(1px)
brightness(.45);

transition:4s ease;
}



/ INNER SIGNAL /

.inner{
position:absolute;

width:100%;
height:100%;

object-fit:contain;

opacity:.03;

filter:
blur(.5px);

transition:4s ease;
}



/ INTERFERENCE /

.interference{
position:absolute;
inset:0;

pointer-events:none;

z-index:20;

opacity:.1;

background:
linear-gradient(
90deg,
rgba(255,255,255,.06),
transparent 18%,
transparent 82%,
rgba(255,255,255,.04)
);

mix-blend-mode:screen;

animation:
edgePulse 5s ease-in-out infinite;
}

@keyframes edgePulse{

0%{
opacity:.05;
}

50%{
opacity:.14;
}

100%{
opacity:.05;
}

}



/ SIGNAL LOST /

.signal{
position:absolute;

top:62%;
left:50%;

transform:
translateX(-50%);

font-size:.72rem;

letter-spacing:7px;

color:#bdb4a7;

opacity:0;

z-index:12;

animation:
signalAppear 2.5s ease forwards;

animation-delay:4s;
}

@keyframes signalAppear{

0%{
opacity:0;
letter-spacing:18px;
filter:blur(10px);
}

100%{
opacity:.62;
letter-spacing:7px;
filter:none;
}

}



/ RECONNECT /

.reconnect{
position:absolute;

top:68%;
left:50%;

transform:
translateX(-50%);

font-size:.84rem;

letter-spacing:8px;

color:#d8d0c4;

opacity:0;

cursor:pointer;

z-index:14;

animation:
reconnectAppear 2s ease forwards;

animation-delay:7s;
}

@keyframes reconnectAppear{

0%{
opacity:0;
}

100%{
opacity:.86;
}

}



/ EMBER /

.ember{
position:absolute;

width:12px;
height:12px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:40;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,150,70,.95) 30%,
rgba(255,70,20,.5) 60%,
transparent 100%
);

box-shadow:
0 0 16px rgba(255,120,50,.9),
0 0 44px rgba(255,70,20,.45);
}



/ FREQUENCY ARCS /

.frequency{
position:absolute;

left:7vw;
bottom:7vh;

display:flex;
flex-direction:column;

gap:12px;

opacity:0;

transition:3s ease;

z-index:15;
}

.frequency div{

font-size:.58rem;

letter-spacing:4px;

color:#cfc7bb;

opacity:.72;
}

.frequency.awaken{
opacity:1;
}



/ SIGNAL REVEAL /

.inner.awaken{
opacity:.18;
filter:none;
}

.outer.fade{
opacity:.04;
filter:blur(8px);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch" id="glitch"></div>

<div class="interference"></div>

<div class="symbol-wrap">

<img
src="Trust17.png"
class="outer"
id="outer"
>

<img
src="Trust17.png"
class="inner"
id="inner"
>

</div>

<div
class="signal"
id="signal"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

<div
class="frequency"
id="frequency"
>

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass One Back</div>

</div>

<div
class="ember"
id="ember"
></div>

</div>

<script>

const glitch =
document.getElementById("glitch");

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const outer =
document.getElementById("outer");

const inner =
document.getElementById("inner");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");



/ GLITCH /

setTimeout(()=>{

glitch.classList.add("active");

},200);



/ TOUCH */

reconnect.addEventListener("click",(e)=>{

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";

ember.style.opacity="1";



ember.animate([

{
transform:"translate(-50%,-50%) scale(.2)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(18)",
opacity:.02
}

],{

duration:5200,
easing:"ease-out",
fill:"forwards"

});



setTimeout(()=>{

inner.classList.add("awaken");

outer.classList.add("fade");

},500);



setTimeout(()=>{

frequency.classList.add("awaken");

},2400);

});

</script>

</body>
</html>
