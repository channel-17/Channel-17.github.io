<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

html, body {
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
color:white;
}

.screen{
position:relative;
width:100%;
height:100vh;
background:black;
overflow:hidden;
}



/* VIOLENT SIGNAL TAKEOVER /

.glitch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.10) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

opacity:.05;

animation:glitch 2s ease;

pointer-events:none;

z-index:20;
}

@keyframes glitch {

0%{
opacity:1;
transform:
translateX(-30px)
skewX(12deg);
}

20%{
opacity:.2;
}

40%{
opacity:1;
transform:
translateX(20px)
skewX(-10deg);
}

70%{
opacity:.1;
}

100%{
opacity:.05;
transform:none;
}

}



/ TRIANGLE /

.triangle{

position:absolute;

top:50%;
left:50%;

width:0;
height:0;

margin-left:-100px;
margin-top:-150px;

border-left:100px solid transparent;
border-right:100px solid transparent;
border-bottom:180px solid rgba(255,255,255,.05);

opacity:.25;

transition:4s ease;

z-index:2;
}



/ INNER SIGNAL /

.symbol{

position:absolute;

top:38%;
left:0;

width:100%;

text-align:center;

font-size:80px;

letter-spacing:10px;

opacity:.03;

transition:4s ease;

z-index:3;
}



/ SIGNAL LOST /

.signal{

position:absolute;

top:63%;

left:0;

width:100%;

text-align:center;

font-size:12px;

letter-spacing:6px;

opacity:.6;

z-index:5;
}



/ RECONNECT /

.reconnect{

position:absolute;

top:70%;

left:0;

width:100%;

text-align:center;

font-size:15px;

letter-spacing:8px;

opacity:.9;

cursor:pointer;

z-index:6;
}



/ EMBER /

.ember{

position:absolute;

width:8px;
height:8px;

border-radius:50%;

opacity:0;

pointer-events:none;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,140,70,.6) 45%,
transparent 100%
);

box-shadow:
0 0 8px rgba(255,120,50,.35);

z-index:15;
}



/ FREQUENCY ARCS /

.frequency{

position:absolute;

left:25px;
bottom:30px;

opacity:0;

transition:3s ease;

z-index:10;
}

.frequency div{

margin-top:10px;

font-size:10px;

letter-spacing:4px;

opacity:.7;
}



/ AWAKEN */

.show{
opacity:1;
}

.awaken{
opacity:.15;
}

.fade{
opacity:.03;
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch"></div>

<div class="triangle" id="triangle"></div>

<div class="symbol" id="symbol">
.17
</div>

<div class="signal" id="signal">
signal lost
</div>

<div class="reconnect" id="reconnect">
reconnect
</div>

<div class="frequency" id="frequency">

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass it Back</div>

</div>

<div class="ember" id="ember"></div>

</div>

<script>

var reconnect =
document.getElementById("reconnect");

var signal =
document.getElementById("signal");

var ember =
document.getElementById("ember");

var frequency =
document.getElementById("frequency");

var symbol =
document.getElementById("symbol");

var triangle =
document.getElementById("triangle");



reconnect.onclick=function(e){

signal.style.opacity="0";

reconnect.style.opacity="0";

ember.style.left=e.clientX+"px";

ember.style.top=e.clientY+"px";

ember.style.opacity="1";



ember.animate([

{
transform:"scale(.5)",
opacity:1
},

{
transform:"scale(6)",
opacity:.02
}

],{

duration:4000,
fill:"forwards"

});



setTimeout(function(){

symbol.classList.add("awaken");

triangle.classList.add("fade");

},700);



setTimeout(function(){

frequency.classList.add("show");

},2200);

};

</script>

</body>
</html>
