<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

cursor:default;

}

/* =========================================

MAIN

========================================= */

body{

background:#000;

overflow:hidden;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

z-index:1;

background:#000;

}

/* =========================================

PHONE EDGES

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:9999;

background:

radial-gradient(

circle,

transparent 54%,

rgba(0,0,0,.25) 76%,

rgba(0,0,0,.95) 100%

);

}

/* =========================================

CORRUPTION LAYER

========================================= */

#corruption{

position:fixed;

inset:0;

pointer-events:none;

z-index:20;

mix-blend-mode:screen;

opacity:1;

}

/* =========================================

NOISE

========================================= */

#noise{

position:fixed;

inset:0;

z-index:4;

pointer-events:none;

opacity:.06;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .04s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

WHITE FLASH

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

z-index:60;

pointer-events:none;

mix-blend-mode:screen;

transition:

.08s linear;

}

/* =========================================

SCREEN FRACTURES

========================================= */

#fractures{

position:fixed;

inset:0;

z-index:50;

pointer-events:none;

opacity:0;

}

.fracture{

position:absolute;

background:

rgba(255,255,255,.07);

mix-blend-mode:screen;

filter:blur(.4px);

}

/* =========================================

SYSTEM WARNINGS

========================================= */

#warningWrap{

position:absolute;

inset:0;

pointer-events:none;

z-index:100;

}

.warning{

position:absolute;

font-size:

clamp(12px,2vw,22px);

letter-spacing:.24em;

color:#fff;

opacity:0;

white-space:nowrap;

mix-blend-mode:screen;

text-shadow:

0 0 8px rgba(255,255,255,.15);

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:52%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(24px,5vw,74px);

letter-spacing:.24em;

color:#fff;

white-space:nowrap;

opacity:0;

z-index:120;

mix-blend-mode:screen;

text-shadow:

0 0 16px rgba(255,255,255,.22);

}

/* =========================================

STATIC LINES

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

z-index:80;

opacity:0;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-240px);

opacity:.02;

}

50%{

opacity:.55;

}

100%{

transform:

translateX(240px);

opacity:.02;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:39%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(76vw,460px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2s ease;

z-index:200;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:

10s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.28;

transition:

10s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:61%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.28em;

color:#f2c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:240;

transition:

1.5s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

reconnectPulse 3s ease infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.18;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,170,60,.18),

0 0 40px rgba(255,120,20,.08);

}

}

/* =========================================

HUMAN WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:5;

opacity:0;

mix-blend-mode:screen;

transition:

10s ease;

background:

radial-gradient(circle at center,

rgba(255,130,40,.26) 0%,

rgba(255,120,20,.12) 5%,

rgba(255,120,20,.05) 10%,

transparent 20%

);

}

/* =========================================

ROOM LIGHT

========================================= */

#room{

position:fixed;

inset:0;

pointer-events:none;

z-index:6;

opacity:0;

transition:

12s ease;

background:

radial-gradient(circle at center,

rgba(255,180,90,.05) 0%,

rgba(255,160,50,.02) 30%,

transparent 65%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:7;

opacity:0;

transition:

8s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

10s ease;

z-index:400;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.02;

transition:

10s ease;

filter:

drop-shadow(

0 0 10px

rgba(255,120,20,.05)

);

}

.connected .etch{

opacity:1;

}

#etch1{

width:min(48vw,280px);

left:9%;

top:64%;

transform:

rotate(-4deg);

}

#etch2{

width:min(62vw,390px);

left:14%;

top:50%;

transform:

rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:30%;

bottom:-2%;

transform:

rotate(-5deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #room{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 18px

rgba(255,180,90,.22)

)

drop-shadow(

0 0 56px

rgba(255,120,20,.12)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="flash"></div>

<div id="fractures"></div>

<div id="corruption"></div>

<div id="warningWrap"></div>

<div id="static"></div>

<div id="warmth"></div>

<div id="room"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch"

id="etch1"

href="#">

<img src="lastsesh17.png"

width="100%">

</a>

<a class="etch"

id="etch2"

href="#">

<img src="RoachTray17.png"

width="100%">

</a>

<a class="etch"

id="etch3"

href="#">

<img src="PassItBack17.png"

width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

window.onload = () => {

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

function resize(){

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

/* =========================================

DATA

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 18;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .5,

y:

canvas.height * .36,

w:620,

h:300

};

/* =========================================

STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y:

i * fontSize,

x:

Math.random() * -4000,

speed:

7 + Math.random() * 10,

length:

18 + Math.random() * 34,

laps:0,

finished:false,

dead:

Math.random() > .8,

flash:

Math.random() > .94,

vertical:

Math.random() > .9

});

}

/* =========================================

FLASH

========================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .16;

setTimeout(()=>{

f.style.opacity = 0;

},60);

}

/* =========================================

FRACTURE

========================================= */

function fracture(){

const layer =

document.getElementById("fractures");

layer.style.opacity = 1;

layer.innerHTML = "";

for(let i=0;i<5;i++){

const s =

document.createElement("div");

s.className = "fracture";

s.style.left =

(Math.random()*100) + "%";

s.style.top =

(Math.random()*100) + "%";

s.style.width =

(100 + Math.random()*500) + "px";

s.style.height =

(10 + Math.random()*180) + "px";

s.style.transform =

`translate(

${Math.random()*80-40}px,

${Math.random()*80-40}px

)`;

layer.appendChild(s);

}

setTimeout(()=>{

layer.style.opacity = 0;

},80);

}

/* =========================================

WARNINGS

========================================= */

function warning(){

const wrap =

document.getElementById("warningWrap");

const w =

document.createElement("div");

w.className = "warning";

const messages = [

"SYSTEM FAILURE",

"CONTAINMENT BREACH",

"UNAUTHORIZED SIGNAL",

"CHANNEL CONFLICT",

"MEMORY LEAK",

"TRANSMISSION ERROR"

];

w.innerText =

messages[

Math.floor(

Math.random()*messages.length

)

];

w.style.left =

(Math.random()*70+10) + "%";

w.style.top =

(Math.random()*70+10) + "%";

w.style.opacity =

Math.random() * .8;

wrap.appendChild(w);

setTimeout(()=>{

w.remove();

},180);

}

/* =========================================

DRAW

========================================= */

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.16)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* dead holes */

if(

stream.dead &&

Math.random() > .996

){

ctx.clearRect(

charX,

stream.y,

fontSize,

fontSize

);

}

/* white corruption */

if(

stream.flash &&

Math.random() > .996

){

ctx.fillStyle =

"rgba(255,255,255,.92)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* vertical leaks */

if(

stream.vertical &&

Math.random() > .995

){

ctx.fillStyle =

"rgba(100,255,100,.42)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y + (Math.random()*180)

);

}

}

stream.x += stream.speed;

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 240

){

stream.laps++;

if(stream.laps >= 2){

stream.finished = true;

}else{

stream.x =

Math.random() * -4000;

}

}

});

/* layered corruption */

if(Math.random() > .76){

flash();

}

if(Math.random() > .82){

fracture();

}

if(Math.random() > .88){

warning();

}

/* finish */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(loop);

setTimeout(()=>{

failure();

},200);

}

}

/* =========================================

FAILURE

========================================= */

function failure(){

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

/* static */

for(let i=0;i<42;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70) + "%";

line.style.left =

Math.random()*60 + "%";

line.style.top =

Math.random()*100 + "%";

line.style.animationDuration =

(.05 + Math.random()*1) + "s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

/* signal */

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* fade */

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

},1000);

/* symbol */

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},1400);

/* reconnect */

setTimeout(()=>{

signalLost.classList.remove("active");

document

.getElementById("reconnect")

.classList.add("active");

},2000);

}

/* =========================================

START

========================================= */

const loop =

setInterval(draw,38);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

reconnect.classList.remove("active");

document.body.classList.add("connected");

/* warmth originates FROM touch */

const warmth =

document.getElementById("warmth");

const x =

e.clientX;

const y =

e.clientY;

warmth.style.background =

`

radial-gradient(circle at ${x}px ${y}px,

rgba(255,130,40,.26) 0%,

rgba(255,120,20,.12) 5%,

rgba(255,120,20,.05) 10%,

transparent 20%)

`;

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},4800);

});

};

</script>

</body>

</html>
