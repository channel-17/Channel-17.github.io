<!-- =========================================

CHANNEL 17 — SACRED HQ BASE BUILD

CLEAN FOUNDATION VERSION

========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

color:#fff;

}

/* =========================================

STATIC NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.08;

z-index:2;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:noiseMove .14s linear infinite;

}

@keyframes noiseMove{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

FULL MATRIX TAKEOVER

========================================= */

#matrix{

position:fixed;

inset:0;

overflow:hidden;

background:#000;

z-index:100;

opacity:0;

pointer-events:none;

}

/* =========================================

MATRIX GRID

========================================= */

#matrixGrid{

position:absolute;

inset:0;

display:grid;

grid-template-columns:repeat(28,1fr);

grid-template-rows:repeat(52,1fr);

font-size:clamp(9px,1vw,14px);

font-weight:bold;

color:#66ff66;

opacity:.95;

}

.cell{

display:flex;

align-items:center;

justify-content:center;

transition:.04s linear;

user-select:none;

}

/* =========================================

SCANNER

========================================= */

#scanner{

position:absolute;

left:0;

top:-30%;

width:100%;

height:32%;

background:

linear-gradient(

180deg,

transparent,

rgba(100,255,120,.08),

rgba(180,255,180,.22),

rgba(100,255,120,.08),

transparent

);

filter:blur(8px);

mix-blend-mode:screen;

animation:scannerSweep 2.2s linear infinite;

}

@keyframes scannerSweep{

0%{

top:-30%;

}

100%{

top:130%;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:clamp(28px,5vw,52px);

letter-spacing:.28em;

text-align:center;

line-height:1.2;

color:#8fff8f;

opacity:0;

z-index:120;

}

#signalLost.active{

animation:signalFlicker .12s infinite;

}

@keyframes signalFlicker{

0%{

opacity:.1;

transform:

translate(-50%,-50%)

translateX(-2px);

}

50%{

opacity:1;

transform:

translate(-50%,-50%)

translateX(2px);

}

100%{

opacity:.08;

transform:

translate(-50%,-50%)

translateX(-1px);

}

}

/* =========================================

MAIN AREA

========================================= */

#main{

position:relative;

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:40%;

left:50%;

transform:translate(-50%,-50%);

width:min(78vw,470px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:2.8s ease;

z-index:20;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.36;

transition:3s ease;

filter:

drop-shadow(0 0 10px rgba(255,140,40,.04));

}

#inner{

position:absolute;

width:100%;

opacity:.36;

transition:3s ease;

filter:

drop-shadow(0 0 10px rgba(255,140,40,.04));

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:63%;

left:50%;

transform:translateX(-50%);

font-size:clamp(22px,4vw,42px);

letter-spacing:.28em;

color:#f4d4af;

opacity:0;

cursor:pointer;

pointer-events:none;

z-index:40;

transition:

opacity 2s ease,

text-shadow 2s ease,

transform .3s ease;

text-shadow:

0 0 8px rgba(255,140,40,.04),

0 0 24px rgba(255,120,20,.02);

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:reconnectPulse 4s ease-in-out infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.45;

text-shadow:

0 0 8px rgba(255,140,40,.04),

0 0 20px rgba(255,120,20,.02);

}

50%{

opacity:1;

text-shadow:

0 0 14px rgba(255,180,90,.24),

0 0 42px rgba(255,120,20,.14);

}

}

#reconnect:hover{

transform:translateX(-50%) scale(1.03);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:3;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%);

filter:blur(45px);

opacity:0;

animation:smokeFloat linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smokeFloat{

0%{

transform:translate(0,0) scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:translate(160px,-220px) scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:2.4s ease;

z-index:60;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

filter:

drop-shadow(0 0 14px rgba(255,120,20,.16))

drop-shadow(0 0 28px rgba(255,120,20,.06));

transition:.4s ease;

}

.etch:hover{

transform:translateX(6px);

}

#etch1{

width:min(56vw,350px);

left:8%;

top:24%;

transform:rotate(-2deg);

}

#etch2{

width:min(62vw,390px);

left:12%;

top:48%;

transform:rotate(2deg);

}

#etch3{

width:min(58vw,340px);

left:15%;

bottom:12%;

transform:rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #outer{

opacity:.02;

filter:blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(0 0 18px rgba(255,180,90,.24))

drop-shadow(0 0 56px rgba(255,120,20,.16));

}

.connected #reconnect{

opacity:0;

pointer-events:none;

}

.connected #symbolWrap{

transform:

translate(-50%,-50%)

scale(1.05);

}

</style>

</head>

<body>

<!-- STATIC -->

<div id="noise"></div>

<!-- SMOKE -->

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<!-- MATRIX -->

<div id="matrix">

<div id="matrixGrid"></div>

<div id="scanner"></div>

<div id="signalLost">

SIGNAL<br>LOST

</div>

</div>

<!-- MAIN -->

<div id="main">

<!-- SYMBOL -->

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<!-- RECONNECT -->

<div id="reconnect">

RECONNECT

</div>

<!-- ETCHINGS -->

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<script>

/* =========================================

MATRIX GRID BUILD

========================================= */

const matrixGrid = document.getElementById("matrixGrid");

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*.17";

const totalCells = 1456;

for(let i=0;i<totalCells;i++){

const cell = document.createElement("div");

cell.classList.add("cell");

cell.innerText =

chars[Math.floor(Math.random()*chars.length)];

matrixGrid.appendChild(cell);

}

/* =========================================

LIVE CHAOS

========================================= */

const cells = document.querySelectorAll(".cell");

setInterval(()=>{

cells.forEach(cell=>{

if(Math.random() > .18){

cell.innerText =

chars[Math.floor(Math.random()*chars.length)];

}

});

},40);

/* =========================================

HIDDEN .17

========================================= */

const beaconCells = [690,691,692,720,748,776];

setInterval(()=>{

beaconCells.forEach(i=>{

if(cells[i]){

cells[i].innerText = ".17";

cells[i].style.color = "#b7ffb7";

}

});

setTimeout(()=>{

beaconCells.forEach(i=>{

if(cells[i]){

cells[i].style.color = "#66ff66";

}

});

},120);

},850);

/* =========================================

START TAKEOVER

========================================= */

const matrix = document.getElementById("matrix");

setTimeout(()=>{

matrix.style.opacity = 1;

},40);

/* =========================================

SIGNAL LOST

========================================= */

const signalLost =

document.getElementById("signalLost");

setTimeout(()=>{

signalLost.style.opacity = 1;

signalLost.classList.add("active");

},3400);

/* =========================================

CUT CHAOS

========================================= */

setTimeout(()=>{

matrix.style.opacity = 0;

},5200);

/* =========================================

SYMBOL EMERGES

========================================= */

const symbolWrap =

document.getElementById("symbolWrap");

setTimeout(()=>{

symbolWrap.classList.add("visible");

},5600);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

setTimeout(()=>{

signalLost.style.opacity = 0;

},7200);

setTimeout(()=>{

signalLost.classList.remove("active");

reconnect.classList.add("active");

},8200);

/* =========================================

CONNECT

========================================= */

const etchings =

document.getElementById("etchings");

reconnect.addEventListener("click",()=>{

/* kill reconnect immediately */

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

reconnect.style.pointerEvents = "none";

document.body.classList.add("connected");

/* amber warmth */

document.body.animate([

{

filter:"brightness(1)"

},

{

filter:"brightness(1.18)"

},

{

filter:"brightness(1)"

}

],{

duration:1800,

easing:"ease"

});

/* reveal */

setTimeout(()=>{

etchings.classList.add("visible");

},1100);

});

</script>

</body>

</html>
