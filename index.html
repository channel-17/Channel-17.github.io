<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Little Homie Prototype</title>

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,Helvetica,sans-serif;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

}

/* =========================

   MAIN STAGE

========================= */

#stage{

  position:relative;

  width:100%;

  height:100%;

  overflow:hidden;

}

/* =========================

   LOADER

========================= */

#loaderWrap{

  position:absolute;

  left:50%;

  top:42%;

  transform:translateX(-50%);

  width:min(78vw,420px);

}

#loader{

  width:100%;

  display:flex;

  gap:5px;

}

.block{

  flex:1;

  height:22px;

  border:1px solid rgba(255,255,255,.14);

  background:rgba(255,255,255,.03);

  transition:.2s ease;

}

.block.active{

  background:#fff;

  box-shadow:0 0 10px rgba(255,255,255,.16);

}

#percent{

  margin-top:12px;

  text-align:center;

  color:rgba(255,255,255,.48);

  font-size:13px;

  letter-spacing:.22em;

}

/* =========================

   LITTLE HOMIE

========================= */

#turtleLane{

  position:absolute;

  width:min(78vw,420px);

  height:80px;

  left:50%;

  top:50%;

  transform:translateX(-50%);

}

#turtle{

  position:absolute;

  left:0;

  top:16px;

  width:48px;

  height:32px;

  transition:

    transform .25s ease,

    left .5s linear;

}

/* shell */

.shell{

  position:absolute;

  left:14px;

  top:8px;

  width:24px;

  height:16px;

  background:#fff;

  border-radius:4px;

}

.shell::before{

  content:"";

  position:absolute;

  left:11px;

  top:1px;

  width:2px;

  height:14px;

  background:rgba(0,0,0,.18);

}

.shell::after{

  content:"";

  position:absolute;

  left:2px;

  top:7px;

  width:20px;

  height:2px;

  background:rgba(0,0,0,.15);

}

/* head */

.head{

  position:absolute;

  left:36px;

  top:11px;

  width:8px;

  height:8px;

  background:#fff;

  border-radius:2px;

  transition:.2s ease;

}

/* neck */

.neck{

  position:absolute;

  left:31px;

  top:13px;

  width:6px;

  height:4px;

  background:#fff;

  transition:.2s ease;

}

/* tail */

.tail{

  position:absolute;

  left:8px;

  top:14px;

  width:0;

  height:0;

  border-top:3px solid transparent;

  border-bottom:3px solid transparent;

  border-right:7px solid #fff;

}

/* legs */

.leg{

  position:absolute;

  width:5px;

  height:7px;

  background:#fff;

  border-radius:1px;

}

.leg1{

  left:18px;

  top:22px;

}

.leg2{

  left:30px;

  top:22px;

}

/* walk cycle */

.walk .leg1{

  animation:legA .7s infinite;

}

.walk .leg2{

  animation:legB .7s infinite;

}

@keyframes legA{

  0%,100%{transform:translateX(0)}

  50%{transform:translateX(-2px)}

}

@keyframes legB{

  0%,100%{transform:translateX(-2px)}

  50%{transform:translateX(0)}

}

/* lookback */

.lookback{

  transform:scaleX(-1);

}

/* neck extension */

.periscope .head{

  transform:translateX(8px) translateY(-4px);

}

.periscope .neck{

  transform:translateX(5px) scaleX(1.8);

}

/* shell retreat */

.hide .head,

.hide .neck,

.hide .tail,

.hide .leg{

  opacity:0;

  transform:translateX(-12px);

}

.hide .shell{

  transform:scale(1.08);

}

/* nervous jitter */

.jitter{

  animation:jitter .14s infinite;

}

@keyframes jitter{

  0%{transform:translateX(0)}

  25%{transform:translateX(1px)}

  50%{transform:translateX(-1px)}

  75%{transform:translateX(.5px)}

  100%{transform:translateX(0)}

}

/* blackout */

#fade{

  position:absolute;

  inset:0;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:2s ease;

}

/* final flash */

.flash100{

  animation:flash100 1s infinite;

}

@keyframes flash100{

  0%,100%{

    opacity:1;

  }

  50%{

    opacity:.25;

  }

}

</style>

</head>

<body>

<div id="stage">

  <div id="loaderWrap">

    <div id="loader"></div>

    <div id="percent">0%</div>

  </div>

  <div id="turtleLane">

    <div id="turtle" class="walk">

      <div class="tail"></div>

      <div class="shell"></div>

      <div class="neck"></div>

      <div class="head"></div>

      <div class="leg leg1"></div>

      <div class="leg leg2"></div>

    </div>

  </div>

  <div id="fade"></div>

</div>

<script>

const loader = document.getElementById("loader");

const turtle = document.getElementById("turtle");

const percent = document.getElementById("percent");

const fade = document.getElementById("fade");

const TOTAL = 20;

const INTERRUPT = 17;

let progress = 0;

let turtleX = 0;

for(let i=0;i<TOTAL;i++){

  const block = document.createElement("div");

  block.className = "block";

  loader.appendChild(block);

}

const blocks = document.querySelectorAll(".block");

function activateBlock(index){

  if(blocks[index]){

    blocks[index].classList.add("active");

  }

}

function updatePercent(num){

  percent.innerText = `${num}%`;

}

function moveTurtle(){

  turtleX += 14;

  turtle.style.left = turtleX + "px";

}

const walkLoop = setInterval(() => {

  progress++;

  activateBlock(progress - 1);

  updatePercent(Math.floor((progress / TOTAL) * 100));

  moveTurtle();

  /* INTERRUPT MOMENT */

  if(progress === INTERRUPT){

    turtle.classList.remove("walk");

    setTimeout(() => {

      turtle.classList.add("lookback");

    },300);

    /* loader inertia */

    setTimeout(() => {

      activateBlock(progress);

      updatePercent(

        Math.floor(((progress + 1)/TOTAL)*100)

      );

    },700);

    setTimeout(() => {

      turtle.classList.add("periscope");

    },1000);

    setTimeout(() => {

      turtle.classList.remove("periscope");

      turtle.classList.add("hide");

    },1700);

    setTimeout(() => {

      turtle.classList.add("jitter");

    },1900);

    /* blackout */

    setTimeout(() => {

      fade.style.opacity = 1;

    },3200);

    clearInterval(walkLoop);

    /* recovery */

    setTimeout(recoveryScene,6200);

  }

},620);

/* =========================

   RECOVERY

========================= */

function recoveryScene(){

  fade.style.opacity = 0;

  blocks.forEach(b => b.classList.add("active"));

  percent.innerText = "100%";

  percent.classList.add("flash100");

  turtle.className = "";

  turtle.style.left = "50%";

  turtle.style.transform = "translateX(-50%)";

  /* peeking */

  turtle.classList.add("hide");

  setTimeout(() => {

    turtle.classList.remove("jitter");

    document.querySelector(".head").style.opacity = 1;

    document.querySelector(".neck").style.opacity = 1;

  },900);

  /* realize */

  setTimeout(() => {

    turtle.classList.remove("hide");

  },1800);

  /* OH SHIT */

  setTimeout(() => {

    turtle.style.transition = "left 3.2s linear";

    turtle.style.left = "100%";

    turtle.classList.add("walk");

  },2600);

}

</script>

</body>

</html>
