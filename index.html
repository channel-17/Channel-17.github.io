<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>CHANNEL 17</title>

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  color:#fff;

  font-family:Arial, Helvetica, sans-serif;

}

body{

  position:relative;

}

/* =========================

GLOBAL TEXTURE

========================= */

#noise{

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:99999;

  opacity:.045;

  mix-blend-mode:screen;

  background-image:

    repeating-linear-gradient(

      0deg,

      rgba(255,255,255,.035) 0px,

      rgba(255,255,255,.035) 1px,

      transparent 1px,

      transparent 3px

    );

  animation:noiseMove .05s linear infinite;

}

@keyframes noiseMove{

  from{transform:translateY(0);}

  to{transform:translateY(3px);}

}

#vignette{

  position:fixed;

  inset:0;

  pointer-events:none;

  z-index:999999;

  background:

    radial-gradient(

      circle,

      transparent 44%,

      rgba(0,0,0,.55) 73%,

      rgba(0,0,0,.98) 100%

    );

}

#flash{

  position:fixed;

  inset:0;

  background:#fff;

  opacity:0;

  pointer-events:none;

  mix-blend-mode:screen;

  z-index:9000;

}

/* =========================

LOADER

========================= */

#loader{

  position:fixed;

  inset:0;

  z-index:3000;

  background:#000;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  transition:opacity .7s ease;

}

#bar{

  position:relative;

  width:min(58vw,410px);

  height:42px;

  border-radius:999px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,.14);

  background:rgba(255,255,255,.022);

  box-shadow:

    0 0 18px rgba(255,255,255,.035),

    inset 0 0 16px rgba(255,255,255,.025);

}

#fill{

  position:absolute;

  left:0;

  top:0;

  height:100%;

  width:0%;

  border-radius:999px;

  background:

    linear-gradient(

      90deg,

      rgba(255,255,255,.86),

      rgba(255,255,255,1)

    );

  box-shadow:0 0 20px rgba(255,255,255,.18);

}

#percent{

  margin-top:18px;

  font-size:16px;

  font-weight:700;

  letter-spacing:.22em;

  opacity:.55;

}

#turtleWrap{

  margin-top:34px;

  width:120px;

  height:90px;

  display:flex;

  justify-content:center;

  align-items:center;

}

#turtle{

  width:104px;

  height:78px;

  overflow:visible;

  opacity:.96;

  filter:drop-shadow(0 0 10px rgba(255,255,255,.08));

}

.walking{

  animation:turtleWalk 1s ease-in-out infinite;

}

@keyframes turtleWalk{

  0%,100%{ transform:translateY(0) translateX(0) scaleX(1); }

  50%{ transform:translateY(-2px) translateX(2px) scaleX(1); }

}

.lookLeft{

  animation:none;

  transform:scaleX(-1);

  transition:transform .14s ease;

}

.gasp #head{

  transform:translateX(10px) translateY(-1px);

}

.gasp #frontLeg{

  transform:translateY(5px);

}

.gasp #backLeg{

  transform:translateY(4px);

}

.gasp #tail{

  transform:translateX(-2px);

}

.retract #head{

  transform:translateX(-36px);

  opacity:0;

  transition:.16s ease;

}

.retract #frontLeg,

.retract #backLeg{

  transform:translateY(-22px);

  opacity:0;

  transition:.14s ease;

}

.retract #tail{

  transform:translateX(18px);

  opacity:0;

  transition:.14s ease;

}

.retract #neck{

  transform:translateX(-28px);

  opacity:0;

  transition:.14s ease;

}

.shellOnly{

  animation:none;

  transform:scale(.9);

  transition:transform .18s ease;

}

/* =========================

CHAOS

========================= */

#chaos{

  position:fixed;

  inset:0;

  z-index:4000;

  overflow:hidden;

  pointer-events:none;

  opacity:0;

  transition:opacity .25s ease;

}

.window{

  position:absolute;

  background:rgba(12,12,12,.92);

  border:1px solid rgba(255,255,255,.08);

  border-radius:12px;

  overflow:hidden;

  box-shadow:0 0 26px rgba(0,0,0,.75);

  opacity:0;

  animation:windowCascade linear forwards;

}

.window.topLeft{

  left:var(--x);

  top:var(--y);

}

.windowTop{

  height:32px;

  padding-left:14px;

  display:flex;

  align-items:center;

  font-size:12px;

  letter-spacing:.16em;

  color:rgba(255,255,255,.52);

  background:rgba(255,255,255,.045);

  border-bottom:1px solid rgba(255,255,255,.04);

}

.windowBody{

  padding:14px;

  font-size:12px;

  line-height:1.65;

  color:rgba(255,255,255,.62);

}

.red{ color:#ff3434; }

.yellow{ color:#c7c35a; }

.dim{ color:rgba(255,255,255,.34); }

@keyframes windowCascade{

  0%{

    opacity:0;

    transform:translate(0,0) scale(.96);

  }

  12%{

    opacity:.9;

  }

  75%{

    opacity:.72;

  }

  100%{

    opacity:0;

    transform:

      translate(

        var(--moveX),

        var(--moveY)

      )

      scale(1.035);

  }

}

.glitchStrip{

  position:absolute;

  height:18px;

  background:

    linear-gradient(

      90deg,

      transparent,

      rgba(194,190,72,.35),

      transparent

    );

  opacity:0;

  animation:stripDeath .7s linear forwards;

}

@keyframes stripDeath{

  0%{opacity:0; transform:translateX(-40px);}

  35%{opacity:.7;}

  100%{opacity:0; transform:translateX(80px);}

}

#signalLost{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  font-size:clamp(34px,6vw,82px);

  letter-spacing:.26em;

  color:#fff;

  opacity:0;

  text-shadow:0 0 16px rgba(255,255,255,.14);

}

.shake{

  animation:shake .075s linear infinite;

}

@keyframes shake{

  0%{transform:translate(0,0);}

  25%{transform:translate(2px,-1px);}

  50%{transform:translate(-2px,1px);}

  75%{transform:translate(1px,2px);}

  100%{transform:translate(0,0);}

}

/* =========================

SIGNAL SPACE

========================= */

#signalSpace{

  position:fixed;

  inset:0;

  z-index:7000;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  pointer-events:none;

  transition:opacity 1.4s ease;

}

#reconnect{

  position:absolute;

  z-index:9000;

  font-size:clamp(18px,3vw,30px);

  letter-spacing:.34em;

  color:rgba(255,255,255,.78);

  opacity:0;

  cursor:pointer;

  user-select:none;

  padding:34px;

  transition:opacity .15s linear;

}

#reconnect.ready{

  pointer-events:auto;

  animation:recoverBreath 2.2s ease-in-out infinite;

}

@keyframes recoverBreath{

  0%{

    opacity:.48;

    text-shadow:0 0 6px rgba(255,255,255,.04);

  }

  18%{

    opacity:.96;

    text-shadow:0 0 26px rgba(255,255,255,.24);

  }

  35%{

    opacity:.52;

    text-shadow:0 0 10px rgba(255,255,255,.08);

  }

  100%{

    opacity:.72;

    text-shadow:0 0 15px rgba(255,255,255,.12);

  }

}

#warmth{

  position:absolute;

  z-index:8500;

  width:24px;

  height:24px;

  border-radius:50%;

  opacity:0;

  pointer-events:none;

  background:

    radial-gradient(

      circle,

      rgba(255,230,180,.98) 0%,

      rgba(255,116,36,.7) 23%,

      rgba(145,25,12,.42) 45%,

      rgba(0,0,0,.92) 73%,

      rgba(0,0,0,0) 100%

    );

  filter:blur(5px);

}

#centerWarmth{

  position:absolute;

  width:64vw;

  height:58vh;

  border-radius:50%;

  opacity:0;

  pointer-events:none;

  background:

    radial-gradient(

      circle,

      rgba(255,145,65,.08) 0%,

      rgba(255,145,65,.035) 26%,

      rgba(0,0,0,0) 68%

    );

  filter:blur(34px);

  transition:opacity 2.4s ease;

}

#inner{

  position:absolute;

  z-index:6000;

  width:min(42vw,220px);

  opacity:0;

  filter:

    blur(.2px)

    drop-shadow(0 0 10px rgba(255,255,255,.05));

  transition:opacity 2.2s ease;

}

#outer{

  position:absolute;

  z-index:5800;

  width:min(72vw,420px);

  opacity:0;

  filter:

    blur(.25px)

    drop-shadow(0 0 12px rgba(255,255,255,.04));

  transition:

    opacity 1s ease,

    transform 1.2s ease,

    filter 1.2s ease;

}

#etchings{

  position:absolute;

  inset:0;

  opacity:0;

  z-index:5000;

  pointer-events:none;

  transition:opacity 2.8s ease;

}

.etch{

  position:absolute;

  display:block;

  pointer-events:auto;

  opacity:.75;

  filter:

    blur(.12px)

    drop-shadow(0 0 12px rgba(255,140,55,.08));

}

#etch1{

  width:min(40vw,230px);

  left:12%;

  top:60%;

  transform:rotate(-3deg);

}

#etch2{

  width:min(46vw,280px);

  left:24%;

  top:76%;

  transform:rotate(1deg);

}

#etch3{

  width:min(30vw,180px);

  left:66%;

  top:78%;

  transform:rotate(-4deg);

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<div id="loader">

  <div id="bar">

    <div id="fill"></div>

  </div>

  <div id="percent">0%</div>

  <div id="turtleWrap">

    <svg id="turtle" class="walking" viewBox="0 0 150 110">

      <g id="turtleBody">

        <path

          id="backLeg"

          d="M54 82 C47 85 46 94 52 98 C59 101 65 93 62 85 Z"

          fill="white"

        />

        <path

          id="frontLeg"

          d="M92 82 C86 86 87 96 94 98 C102 99 106 90 101 84 Z"

          fill="white"

        />

        <path

          id="tail"

          d="M31 58 L18 51 L20 66 Z"

          fill="white"

        />

        <path

          id="shell"

          d="

            M38 59

            C39 35 58 22 82 24

            C108 27 125 43 123 62

            C121 81 102 92 77 91

            C53 90 37 78 38 59

            Z"

          fill="white"

        />

        <path

          d="M51 44 C65 36 87 36 109 48"

          stroke="black"

          stroke-width="3"

          opacity=".18"

          fill="none"

        />

        <path

          d="M48 63 C67 57 93 57 116 66"

          stroke="black"

          stroke-width="3"

          opacity=".18"

          fill="none"

        />

        <path

          d="M67 30 C63 47 62 72 66 89"

          stroke="black"

          stroke-width="3"

          opacity=".16"

          fill="none"

        />

        <path

          d="M91 31 C84 50 82 74 86 91"

          stroke="black"

          stroke-width="3"

          opacity=".16"

          fill="none"

        />

        <path

          id="neck"

          d="M119 55 C128 50 136 50 140 56 C143 63 137 69 126 68 L118 67 Z"

          fill="white"

        />

        <circle

          id="head"

          cx="140"

          cy="59"

          r="12"

          fill="white"

        />

        <circle

          id="eye"

          cx="144"

          cy="56"

          r="2.2"

          fill="black"

          opacity=".35"

        />

      </g>

    </svg>

  </div>

</div>

<div id="chaos">

  <div id="signalLost">SIGNAL LOST</div>

</div>

<div id="signalSpace">

  <div id="centerWarmth"></div>

  <img id="outer" src="Outer17-final.png" />

  <img id="inner" src="Inner17-final.png" />

  <div id="reconnect">RECONNECT</div>

  <div id="warmth"></div>

  <div id="etchings">

    <a class="etch" id="etch1" href="#">

      <img src="lastsesh17.png" width="100%" />

    </a>

    <a class="etch" id="etch2" href="#">

      <img src="RoachTray17.png" width="100%" />

    </a>

    <a class="etch" id="etch3" href="#">

      <img src="PassItBack17.png" width="100%" />

    </a>

  </div>

</div>

<div id="vignette"></div>

<script>

/* =========================

ELEMENTS

========================= */

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const turtle = document.getElementById("turtle");

const loader = document.getElementById("loader");

const chaos = document.getElementById("chaos");

const flash = document.getElementById("flash");

const signalSpace = document.getElementById("signalSpace");

const reconnect = document.getElementById("reconnect");

const inner = document.getElementById("inner");

const outer = document.getElementById("outer");

const warmth = document.getElementById("warmth");

const centerWarmth = document.getElementById("centerWarmth");

const etchings = document.getElementById("etchings");

const signalLostText = document.getElementById("signalLost");

/* =========================

LOADING / TURTLE

========================= */

let load = 0;

let looked = false;

let gasped = false;

let retracted = false;

const loaderLoop = setInterval(() => {

  load += .52;

  if(load > 17){

    load = 17;

  }

  fill.style.width = load + "%";

  percent.innerText = Math.floor(load) + "%";

  if(load >= 15.6 && !looked){

    looked = true;

    microTwitch();

    setTimeout(() => {

      turtle.classList.remove("walking");

      turtle.classList.add("lookLeft");

    }, 130);

  }

  if(load >= 16.05 && !gasped){

    gasped = true;

    turtle.classList.add("gasp");

  }

  if(load >= 16.55 && !retracted){

    retracted = true;

    turtle.classList.remove("gasp");

    turtle.classList.add("retract");

  }

  if(load >= 16.85){

    turtle.classList.add("shellOnly");

  }

  if(load >= 17){

    clearInterval(loaderLoop);

    setTimeout(() => {

      startChaos();

    }, 1050);

  }

}, 55);

function microTwitch(){

  document.body.style.transform = "translateX(2px)";

  setTimeout(() => {

    document.body.style.transform = "translateX(0)";

  }, 45);

}

/* =========================

CHAOS

========================= */

function startChaos(){

  loader.style.opacity = 0;

  setTimeout(() => {

    loader.style.display = "none";

  }, 700);

  chaos.style.opacity = 1;

  document.body.classList.add("shake");

  let layer = 0;

  const chaosLoop = setInterval(() => {

    layer++;

    if(layer < 4){

      spawnWindow("soft");

    }

    if(layer >= 4){

      for(let i=0; i<layer; i++){

        spawnWindow("heavy");

      }

      if(Math.random() > .45){

        spawnStrip();

      }

    }

    if(layer > 5){

      pulseFlash();

    }

    if(layer > 7){

      signalLost();

    }

    if(layer >= 18){

      clearInterval(chaosLoop);

      collapseChaos();

    }

  }, 180);

}

function spawnWindow(mode){

  const types = [

    {

      title:"warning",

      headline:"MEMORY COLLISION DETECTED",

      color:"red",

      body:["recursive overflow detected","signal instability rising","authentication failure"]

    },

    {

      title:"system failure",

      headline:"CONTAINMENT FAILURE",

      color:"red",

      body:["mask protocol engaged","original signal suppressed","synthetic layer active"]

    },

    {

      title:"signal",

      headline:"SIGNAL STILL ACTIVE",

      color:"yellow",

      body:["channel resistance detected","frequency refusing collapse","reconnect trace visible"]

    },

    {

      title:"identity",

      headline:"TOO MANY ACTIVE MASKS",

      color:"red",

      body:["original input buried","self-image loop active","authenticity unreadable"]

    },

    {

      title:"toxic stream",

      headline:"TRANSMISSION POISONED",

      color:"yellow",

      body:["A7X19 BZ0% C17","M4SK NULL 5IGNAL","17 17 17"]

    },

    {

      title:"download",

      headline:"UNREQUESTED FILE STACK",

      color:"red",

      body:["plasticself.exe","performative_identity.pkg","human_input_lost.dat"]

    }

  ];

  const data = types[Math.floor(Math.random()*types.length)];

  const win = document.createElement("div");

  win.className = "window topLeft";

  const w = mode === "soft"

    ? 220 + Math.random()*120

    : 260 + Math.random()*300;

  const h = mode === "soft"

    ? 110 + Math.random()*90

    : 140 + Math.random()*170;

  win.style.width = w + "px";

  win.style.height = h + "px";

  const diagonal = Math.random();

  const x = mode === "soft"

    ? 8 + Math.random()*26

    : Math.random()*70;

  const y = mode === "soft"

    ? 8 + Math.random()*22

    : Math.random()*68;

  win.style.setProperty("--x", x + "vw");

  win.style.setProperty("--y", y + "vh");

  win.style.setProperty("--moveX", (80 + Math.random()*130) + "px");

  win.style.setProperty("--moveY", (70 + Math.random()*160) + "px");

  win.style.animationDuration =

    mode === "soft"

      ? (1.2 + Math.random()*.5) + "s"

      : (.8 + Math.random()*1.1) + "s";

  win.innerHTML = `

    <div class="windowTop">${data.title}</div>

    <div class="windowBody">

      <div class="${data.color}">${data.headline}</div>

      <br>

      <div>${data.body[0]}</div>

      <div>${data.body[1]}</div>

      <div>${data.body[2]}</div>

    </div>

  `;

  chaos.appendChild(win);

  setTimeout(() => {

    win.remove();

  }, 2300);

}

function spawnStrip(){

  const strip = document.createElement("div");

  strip.className = "glitchStrip";

  strip.style.left = Math.random()*80 + "vw";

  strip.style.top = Math.random()*90 + "vh";

  strip.style.width = (120 + Math.random()*340) + "px";

  chaos.appendChild(strip);

  setTimeout(() => {

    strip.remove();

  }, 800);

}

function pulseFlash(){

  flash.style.opacity = Math.random() * .14;

  setTimeout(() => {

    flash.style.opacity = 0;

  }, 40);

}

function signalLost(){

  signalLostText.style.opacity = .85;

  signalLostText.style.transform =

    `translate(-50%,-50%) translate(${Math.random()*10-5}px,${Math.random()*8-4}px)`;

  setTimeout(() => {

    signalLostText.style.opacity = 0;

  }, 150);

}

function collapseChaos(){

  chaos.style.opacity = 0;

  document.body.classList.remove("shake");

  setTimeout(() => {

    showReconnect();

  }, 1350);

}

/* =========================

RECONNECT

========================= */

function showReconnect(){

  signalSpace.style.opacity = 1;

  signalSpace.style.pointerEvents = "auto";

  reconnect.style.opacity = .78;

  reconnect.classList.add("ready");

  setTimeout(() => {

    inner.style.opacity = .18;

    outer.style.opacity = .13;

  }, 450);

}

reconnect.addEventListener("click", () => {

  reconnect.classList.remove("ready");

  reconnect.style.pointerEvents = "none";

  reconnect.style.opacity = 0;

  warmth.style.opacity = 1;

  warmth.animate([

    {

      transform:"scale(.35)",

      opacity:1

    },

    {

      transform:"scale(1.1)",

      opacity:1

    },

    {

      transform:"scale(6.5)",

      opacity:.22

    },

    {

      transform:"scale(8.5)",

      opacity:.08

    }

  ],{

    duration:2600,

    fill:"forwards",

    easing:"ease-out"

  });

  centerWarmth.style.opacity = 1;

  outer.style.opacity = 0;

  outer.style.transform = "scale(1.1)";

  outer.style.filter = "blur(4px)";

  inner.style.opacity = .32;

  setTimeout(() => {

    warmth.style.background =

      "radial-gradient(circle, rgba(0,0,0,.96) 0%, rgba(0,0,0,.75) 42%, transparent 82%)";

    warmth.style.filter = "blur(7px)";

    warmth.style.opacity = .9;

    warmth.style.transform = "scale(1.15)";

  }, 2300);

  setTimeout(() => {

    etchings.style.opacity = 1;

    etchings.style.pointerEvents = "auto";

  }, 1200);

});

</script>

</body>

</html>
