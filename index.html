<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" href="Signal17.png?v=17">

<style>

{

margin:0;

padding:0;

box-sizing:border-box;

}



body{

background:#000;

overflow:hidden;

font-family:"Courier New", monospace;

height:100vh;

width:100vw;

color:#d8d2c8;

}



/ MAIN SCREEN /

.screen{

position:relative;

width:100%;

height:100vh;

overflow:hidden;

background:

radial-gradient(

circle at center,

rgba(18,18,18,.92) 0%,

#000 72%

);

}



/ OPENING GLITCH /

.glitch{

position:absolute;

inset:-10%;

opacity:0;

pointer-events:none;

z-index:999;

background:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.24) 0px,

rgba(255,255,255,.24) 2px,

transparent 3px,

transparent 6px

),

repeating-linear-gradient(

90deg,

rgba(255,255,255,.08) 0px,

rgba(255,255,255,.08) 1px,

transparent 2px,

transparent 5px

);

mix-blend-mode:screen;

}



.glitch.active{

animation:violentGlitch 1.5s steps(2) forwards;

}



@keyframes violentGlitch{

0%{

opacity:0;

transform:scale(1);

}



10%{

opacity:1;

transform:

translateX(-40px)

skewX(14deg);

}



22%{

opacity:0;

}



33%{

opacity:1;

transform:

translateX(34px)

skewX(-10deg);

}



48%{

opacity:0;

}



62%{

opacity:.9;

transform:

translateY(-10px)

scale(1.04);

}



100%{

opacity:0;

transform:none;

}

}



/ SYMBOL AREA /

.symbol-wrap{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:280px;

height:280px;

}



.outer-symbol,

.inner-symbol{

position:absolute;

width:100%;

height:100%;

object-fit:contain;

opacity:0;

}



.outer-symbol{

filter:

blur(1px)

brightness(.42);

}



.outer-symbol.visible{

animation:outerReveal 4s ease forwards;

}



.inner-symbol.visible{

animation:innerReveal 4s ease forwards;

}



@keyframes outerReveal{

0%{

opacity:0;

filter:

blur(14px)

brightness(.05);

transform:scale(.95);

}



100%{

opacity:.35;

filter:

blur(1px)

brightness(.5);

transform:scale(1);

}

}



@keyframes innerReveal{

0%{

opacity:0;

filter:

blur(18px)

brightness(.2);

transform:scale(.92);

}



100%{

opacity:1;

filter:none;

transform:scale(1);

}

}



/ SIGNAL TEXT /

.text-zone{

position:absolute;

top:74%;

left:50%;

transform:translateX(-50%);

width:340px;

height:60px;

}



.signal-line{

position:absolute;

width:100%;

text-align:center;

letter-spacing:8px;

opacity:0;

color:#cfc7bb;

}



.signal-line.active{

animation:signalFlicker 3s ease forwards;

}



@keyframes signalFlicker{

0%{

opacity:0;

filter:blur(8px);

letter-spacing:16px;

}



22%{

opacity:.18;

}



44%{

opacity:.06;

}



67%{

opacity:.84;

letter-spacing:8px;

}



100%{

opacity:.74;

filter:none;

letter-spacing:8px;

}

}



/ RECONNECT /

.reconnect{

position:absolute;

width:100%;

text-align:center;

letter-spacing:8px;

opacity:0;

cursor:pointer;

}



.reconnect.live{

animation:reconnectPulse 2.8s ease infinite;

}



@keyframes reconnectPulse{

0%{

opacity:.08;

}



50%{

opacity:1;

text-shadow:

0 0 16px rgba(255,255,255,.22);

}



100%{

opacity:.08;

}

}



/ THUMB WARMTH /

.warmth{

position:absolute;

width:260px;

height:260px;

border-radius:50%;

top:50%;

left:50%;

transform:translate(-50%,-50%);

pointer-events:none;

opacity:0;

background:

radial-gradient(

circle,

rgba(255,210,140,.28) 0%,

rgba(255,180,120,.1) 40%,

transparent 72%

);

}



.warmth.active{

animation:warmSpread 4s ease forwards;

}



@keyframes warmSpread{

0%{

opacity:0;

transform:

translate(-50%,-50%)

scale(.2);

}



100%{

opacity:1;

transform:

translate(-50%,-50%)

scale(2.6);

}

}



/ INTERFERENCE DISSOLVE /

.outer-symbol.dissolve{

animation:signalBreakdown 4s ease forwards;

}



@keyframes signalBreakdown{

0%{

opacity:.35;

}



100%{

opacity:0;

filter:

blur(18px)

brightness(.1);

transform:

translateX(-2px)

translateY(2px);

}

}



/ INNER SIGNAL SURVIVES /

.inner-symbol.stable{

animation:signalStabilize 3s ease forwards;

}



@keyframes signalStabilize{

0%{

filter:

brightness(1);

}



100%{

filter:

brightness(1.15)

drop-shadow(

0 0 10px

rgba(255,220,170,.12)

);

}

}



/ CAVE / SIGNAL SPACE /

.cave-zone{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

}



.cave-zone.awake{

animation:caveReveal 3s ease forwards;

}



@keyframes caveReveal{

0%{

opacity:0;

}



100%{

opacity:1;

}

}



.cave-symbol{

margin-top:260px;

margin-bottom:44px;

font-size:2rem;

letter-spacing:12px;

color:#ddd4c8;

opacity:.9;

}



/ LINKS /

.cave-links{

display:flex;

flex-direction:column;

gap:24px;

text-align:center;

}



.cave-link{

letter-spacing:5px;

opacity:.68;

cursor:pointer;

transition:.3s ease;

}



.cave-link:hover{

opacity:1;

text-shadow:

0 0 10px rgba(255,230,180,.16);

}

</style>

</head>

<body>

<div class="screen">



<div class="glitch" id="glitch"></div>



<div class="symbol-wrap">



<img

src="Outer17-final.png"

class="outer-symbol"

id="outerSymbol"

/>



<img

src="Inner17-final.png"

class="inner-symbol"

id="innerSymbol"

/>



</div>



<div class="text-zone">



<div

class="signal-line"

id="signalLine"

>

signal lost

</div>



<div

class="reconnect"

id="reconnect"

>

reconnect

</div>



</div>



<div

class="warmth"

id="warmth"

></div>



<div

class="cave-zone"

id="caveZone"

>



<div class="cave-symbol">

:lll

</div>



<div class="cave-links">



<div class="cave-link">

Latest Sesh

</div>



<div class="cave-link">

Roach Tray

</div>



<div class="cave-link">

Pass One Back

</div>



</div>



</div>



</div>

<script>

const glitch =

document.getElementById("glitch");



const outerSymbol =

document.getElementById("outerSymbol");



const innerSymbol =

document.getElementById("innerSymbol");



const signalLine =

document.getElementById("signalLine");



const reconnect =

document.getElementById("reconnect");



const warmth =

document.getElementById("warmth");



const caveZone =

document.getElementById("caveZone");



/ OPENING GLITCH /

setTimeout(() => {

glitch.classList.add("active");

}, 300);



/ SYMBOL APPEAR /

setTimeout(() => {

outerSymbol.classList.add("visible");

innerSymbol.classList.add("visible");

}, 1700);



/ SIGNAL LOST /

setTimeout(() => {

signalLine.classList.add("active");

}, 5200);



/ SIGNAL LOST LEAVES /

setTimeout(() => {

signalLine.style.opacity = "0";

}, 8600);



/ RECONNECT APPEARS /

setTimeout(() => {

reconnect.classList.add("live");

reconnect.style.opacity = "1";

}, 9600);



/ HUMAN TOUCH */

reconnect.addEventListener("click", () => {



reconnect.classList.remove("live");

reconnect.style.opacity = "0";



warmth.classList.add("active");



outerSymbol.classList.add("dissolve");



innerSymbol.classList.add("stable");



setTimeout(() => {

caveZone.classList.add("awake");

}, 2200);



});

</script>

</body>

</html>
