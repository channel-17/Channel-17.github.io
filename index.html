<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Homie Prototype</title>

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial, Helvetica, sans-serif;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

}

#stage{

  position:relative;

  width:100%;

  height:100%;

  overflow:hidden;

}

/* =========================

   LOADER

========================= */

#loaderWrap{

  position:absolute;

  width:min(76vw,420px);

  left:50%;

  top:42%;

  transform:translateX(-50%);

}

#loader{

  width:100%;

  height:24px;

  border:1px solid rgba(255,255,255,.14);

  overflow:hidden;

  position:relative;

}

#fill{

  height:100%;

  width:0%;

  background:

  repeating-linear-gradient(

    90deg,

    #fff 0px,

    #fff 12px,

    transparent 12px,

    transparent 17px

  );

  transition:width .45s linear;

}

#percent{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:rgba(255,255,255,.45);

  font-size:13px;

  font-weight:bold;

  letter-spacing:.25em;

}

/* =========================

   LITTLE HOMIE

========================= */

#homie{

  position:absolute;

  left:50%;

  top:56%;

  transform:translate(-50%,-50%);

  width:76px;

  height:48px;

  transition:.3s ease;

}

/* body */

.body{

  position:absolute;

  left:18px;

  top:13px;

  width:38px;

  height:24px;

  background:#fff;

  border-radius:22px 22px 10px 10px;

}

/* head */

.head{

  position:absolute;

  left:55px;

  top:18px;

  width:14px;

  height:14px;

  background:#fff;

  border-radius:50%;

  transition:.25s ease;

}

/* eye */

.eye{

  position:absolute;

  right:4px;

  top:5px;

  width:3px;

  height:3px;

  background:#000;

  border-radius:50%;

}

/* tail */

.tail{

  position:absolute;

  left:10px;

  top:24px;

  width:0;

  height:0;

  border-top:5px solid transparent;

  border-bottom:5px solid transparent;

  border-right:10px solid #fff;

}

/* legs */

.leg{

  position:absolute;

  width:7px;

  height:12px;

  background:#fff;

  border-radius:2px;

  top:35px;

}

.leg1{ left:25px; }

.leg2{ left:45px; }

/* =========================

   WALK

========================= */

.walk{

  animation:bob 1.2s infinite steps(2,end);

}

.walk .leg1{

  animation:stepA 1.2s infinite steps(2,end);

}

.walk .leg2{

  animation:stepB 1.2s infinite steps(2,end);

}

@keyframes bob{

  50%{

    margin-top:2px;

  }

}

@keyframes stepA{

  50%{

    transform:translateX(-2px);

  }

}

@keyframes stepB{

  50%{

    transform:translateX(2px);

  }

}

/* =========================

   LOOK

========================= */

.look .head{

  left:8px;

}

.look .eye{

  left:4px;

  right:auto;

}

/* =========================

   PEEK

========================= */

.peek .head{

  left:7px;

  top:7px;

}

/* =========================

   SHELL

========================= */

.hide .head,

.hide .tail,

.hide .leg{

  opacity:0;

}

.hide .body{

  transform:scale(.96);

}

/* =========================

   JITTER

========================= */

.jitter{

  animation:jitter .12s infinite steps(2,end);

}

@keyframes jitter{

  50%{

    transform:translate(-50%,-50%) translateX(1px);

  }

}

/* =========================

   CHAOS

========================= */

#chaos{

  position:absolute;

  inset:0;

  opacity:0;

  background:#000;

  pointer-events:none;

  transition:1.4s ease;

}

.glitch{

  position:absolute;

  color:rgba(255,60,60,.25);

  font-size:13px;

  font-weight:bold;

  letter-spacing:.18em;

}

.g1{top:18%;left:10%}

.g2{top:32%;right:10%}

.g3{bottom:24%;left:14%}

.g4{top:55%;right:18%}

.g5{bottom:16%;right:8%}

/* =========================

   100%

========================= */

.flash{

  animation:flash 1s infinite;

}

@keyframes flash{

  50%{

    opacity:.2;

  }

}

/* =========================

   RUN

========================= */

.run{

  animation:run 2.8s linear forwards;

}

@keyframes run{

  from{

    left:50%;

  }

  to{

    left:115%;

  }

}

</style>

</head>

<body>

<div id="stage">

  <!-- LOADER -->

  <div id="loaderWrap">

    <div id="loader">

      <div id="fill"></div>

      <div id="percent">0%</div>

    </div>

  </div>

  <!-- LITTLE HOMIE -->

  <div id="homie" class="walk">

    <div class="tail"></div>

    <div class="body"></div>

    <div class="head">

      <div class="eye"></div>

    </div>

    <div class="leg leg1"></div>

    <div class="leg leg2"></div>

  </div>

  <!-- CHAOS -->

  <div id="chaos">

    <div class="glitch g1">UNREQUESTED FILE STACK</div>

    <div class="glitch g2">SIGNAL LOST</div>

    <div class="glitch g3">IDENTITY LOOP ACTIVE</div>

    <div class="glitch g4">NOISE OVERLOAD</div>

    <div class="glitch g5">TOO MANY ACTIVE MASKS</div>

  </div>

</div>

<script>

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const homie = document.getElementById("homie");

const chaos = document.getElementById("chaos");

let progress = 0;

let frozen = false;

/* =========================

   LOADING LOOP

========================= */

const loading = setInterval(()=>{

  if(frozen) return;

  progress++;

  fill.style.width = progress + "%";

  percent.innerText = progress + "%";

  /* TREMOR */

  if(progress === 16){

    frozen = true;

    /* stop walking */

    homie.classList.remove("walk");

    /* notice */

    setTimeout(()=>{

      homie.classList.add("look");

    },500);

    /* loader inertia */

    setTimeout(()=>{

      progress = 17;

      fill.style.width = "17%";

      percent.innerText = "17%";

    },1000);

    setTimeout(()=>{

      progress = 18;

      fill.style.width = "18%";

      percent.innerText = "18%";

    },1450);

    /* peek */

    setTimeout(()=>{

      homie.classList.remove("look");

      homie.classList.add("peek");

    },2100);

    /* shell */

    setTimeout(()=>{

      homie.classList.remove("peek");

      homie.classList.add("hide");

    },3200);

    /* nervous */

    setTimeout(()=>{

      homie.classList.add("jitter");

    },3500);

    /* chaos */

    setTimeout(()=>{

      chaos.style.opacity = 1;

    },4300);

    /* recovery */

    setTimeout(()=>{

      recovery();

    },7600);

  }

},620);

/* =========================

   RECOVERY

========================= */

function recovery(){

  chaos.style.opacity = 0;

  fill.style.width = "100%";

  percent.innerText = "100%";

  percent.classList.add("flash");

  homie.classList.remove("jitter");

  /* slowly emerges */

  setTimeout(()=>{

    homie.classList.remove("hide");

    homie.classList.add("peek");

  },900);

  /* realization */

  setTimeout(()=>{

    homie.classList.remove("peek");

    homie.classList.add("walk");

  },1700);

  /* OH SHIT RUN */

  setTimeout(()=>{

    homie.classList.add("run");

  },2400);

}

</script>

</body>

</html>
