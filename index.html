<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:monospace;
overflow:hidden;
}

.center{
position:absolute;
width:100%;
text-align:center;
}

#symbol{
top:30%;
font-size:80px;
opacity:.1;
}

#signal{
top:55%;
font-size:14px;
letter-spacing:6px;
}

#reconnect{
top:65%;
font-size:18px;
letter-spacing:8px;
cursor:pointer;
}

#frequency{
position:absolute;
left:20px;
bottom:20px;
opacity:0;
}

#frequency div{
margin-top:10px;
font-size:10px;
letter-spacing:4px;
}

.show{
opacity:1 !important;
}

</style>
</head>

<body>

<div id="symbol" class="center">
.17
</div>

<div id="signal" class="center">
signal lost
</div>

<div id="reconnect" class="center">
reconnect
</div>

<div id="frequency">

<div>Latest Sesh</div>
<div>Roach Tray</div>
<div>Pass it Back</div>

</div>

<script>

var reconnect =
document.getElementById("reconnect");

var frequency =
document.getElementById("frequency");

reconnect.onclick=function(){

reconnect.style.display="none";

document.getElementById("signal").style.display="none";

frequency.classList.add("show");

};

</script>

</body>
</html>
