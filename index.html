<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

/* =========================================================

RESET

========================================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial, Helvetica, sans-serif;

}

/* =========================================================

BASE

========================================================= */

body{

background:#000;

color:#fff;

overflow:hidden;

}

/* =========================================================

NOISE

========================================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:99999;

opacity:.055;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================================

VIGNETTE

========================================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 50%,

rgba(0,0,0,.48) 72%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================================

LOADER

========================================================= */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:1000;

transition:

.8s ease;

}

/* tube */

#tube{

position:relative;

width:min(84vw,560px);

height:28px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.12);

background:

rgba(255,255,255,.025);

box-shadow:

0 0 12px rgba(255,255,255,.03);

}

/* subtle imperfection */

#tube::after{

content:"";

position:absolute;

inset:0;

opacity:.12;

mix-blend-mode:screen;

background:

linear-gradient(

180deg,

rgba(255,255,255,.08),

transparent

);

}

/* fill */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.84),

rgba(255,255,255,1)

);

}

/* turtle */

#turtleWrap{

margin-top:34px;

height:58px;

display:flex;

justify-content:center;

align-items:center;

}

#turtle{

font-size:48px;

line-height:1;

opacity:.94;

color:#fff;

letter-spacing:-0.18em;

transition:

.28s ease;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.08)

);

}

/* LEFT */

.turtle-left{

transform:

scaleX(-1);

}

/* RIGHT */

.turtle-right{

transform:

scaleX(1);

}

/* SHELL */

.turtle-shell{

transform:

scale(.64);

opacity:.76;

filter:

blur(.15px)

drop-shadow(

0 0 12px rgba(255,255,255,.06)

);

}

/* percent */

#percent{

margin-top:12px;

font-size:11px;

letter-spacing:.42em;

opacity:.12;

}

/* =========================================================

FLASH

========================================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:600;

}

/* =========================================================

CHAOS

========================================================= */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

opacity:0;

z-index:400;

transition:

.5s ease;

}

/* ghost bars */

.ghostBar{

position:absolute;

left:0;

width:100%;

height:54px;

border-bottom:

1px solid rgba(255,255,255,.06);

background:

linear-gradient(

180deg,

rgba(255,255,255,.03),

transparent

);

mix-blend-mode:screen;

}

/* ghost search */

.searchGhost{

position:absolute;

left:50%;

width:72vw;

height:48px;

transform:

translateX(-50%);

border-radius:999px;

border:

1px solid rgba(255,255,255,.08);

background:

rgba(255,255,255,.03);

opacity:.08;

}

/* warnings */

.warning{

position:absolute;

font-size:

clamp(10px,1.5vw,18px);

letter-spacing:.22em;

white-space:nowrap;

color:#ff3131;

opacity:0;

text-shadow:

0 0 10px rgba(255,0,0,.3);

animation:

warn .36s linear;

}

@keyframes warn{

0%{

opacity:0;

transform:

translateX(-8px);

}

40%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(8px);

}

}

/* signal lost */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(30px,5vw,74px);

letter-spacing:.24em;

white-space:nowrap;

opacity:0;

color:#fff;

text-shadow:

0 0 16px rgba(255,255,255,.1);

}

/* =========================================================

SHAKE

========================================================= */

.shake{

animation:

shake .08s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(1px,-1px);

}

50%{

transform:translate(-1px,1px);

}

75%{

transform:translate(1px,1px);

}

100%{

transform:translate(0px,0px);

}

}

/* violent */

.violent{

animation:

violent .05s linear infinite;

}

@keyframes violent{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(3px,-2px);

}

50%{

transform:translate(-3px,2px);

}

75%{

transform:translate(2px,3px);

}

100%{

transform:translate(0px,0px);

}

}

/* =========================================================

MATRIX

========================================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

pointer-events:none;

z-index:300;

opacity:0;

}

/* =========================================================

SIGNAL SPACE

========================================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

transition:

2s ease;

z-index:2000;

}

/* subtle signal haze */

#signalHaze{

position:absolute;

width:90vw;

height:70vh;

opacity:.16;

filter:

blur(42px);

background:

radial-gradient(

circle,

rgba(255,190,100,.08) 0%,

rgba(255,190,100,.03) 26%,

transparent 72%

);

animation:

signalBreathe 7s ease-in-out infinite;

}

@keyframes signalBreathe{

0%,100%{

opacity:.08;

}

50%{

opacity:.18;

}

}

/* symbol */

#symbol{

position:absolute;

width:min(72vw,420px);

opacity:.28;

filter:

blur(.25px)

drop-shadow(

0 0 12px rgba(255,255,255,.04)

);

}

/* reconnect */

#reconnect{

position:absolute;

top:50%;

transform:

translateY(38px);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.34em;

color:

rgba(255,255,255,.76);

opacity:0;

cursor:pointer;

text-shadow:

0 0 12px rgba(255,255,255,.06);

transition:

1s ease;

animation:

reconnectPulse 5s ease-in-out infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.54;

}

50%{

opacity:.86;

}

}

/* =========================================================

ETCHINGS

========================================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

transition:

3s ease;

}

/* links */

.etch{

position:absolute;

display:block;

opacity:.16;

filter:

blur(.12px)

drop-shadow(

0 0 10px rgba(255,180,90,.03)

);

}

/* placements */

#etch1{

width:min(40vw,230px);

left:12%;

top:59%;

transform:

rotate(-3deg);

opacity:.72;

}

#etch2{

width:min(46vw,280px);

left:24%;

top:75%;

transform:

rotate(1deg);

opacity:.52;

}

#etch3{

width:min(28vw,170px);

left:66%;

top:77%;

transform:

rotate(-4deg);

opacity:.34;

}

/* =========================================================

TOUCH

========================================================= */

#touch{

position:fixed;

width:34px;

height:34px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:999999;

background:

radial-gradient(

circle,

rgba(255,220,180,.28) 0%,

rgba(255,180,90,.12) 28%,

transparent 80%

);

filter:

blur(10px);

transform:

translate(-50%,-50%);

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<!-- =========================================================

LOADER

========================================================= -->

<div id="loader">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtleWrap">

<div id="turtle">

◖◗

</div>

</div>

<div id="percent">

0%

</div>

</div>

<!-- =========================================================

CHAOS

========================================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================================

MATRIX

========================================================= -->

<canvas id="matrix"></canvas>

<!-- =========================================================

SIGNAL SPACE

========================================================= -->

<div id="signalSpace">

<div id="signalHaze"></div>

<img id="symbol"

src="Outer17-final.png">

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<!-- =========================================================

TOUCH

========================================================= -->

<div id="touch"></div>

<div id="vignette"></div>

<script>

/* =========================================================

LOADER

========================================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

let load = 0;

/* turtle starts LEFT */

turtle.className =

"turtle-left";

const loading =

setInterval(()=>{

/* pacing */

load += .24;

if(load > 17){

load = 17;

}

/* fill */

fill.style.width =

load + "%";

/* percent */

percent.innerText =

Math.floor(load) + "%";

/* 16% turn */

if(load >= 16 && load < 16.6){

turtle.className =

"turtle-right";

}

/* 17% shell */

if(load >= 16.6){

turtle.className =

"turtle-shell";

}

/* attack */

if(load >= 17){

clearInterval(loading);

setTimeout(()=>{

startChaos();

},900);

}

},82);

/* =========================================================

CHAOS

========================================================= */

const chaos =

document.getElementById("chaos");

const signalLost =

document.getElementById("signalLost");

const matrix =

document.getElementById("matrix");

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},700);

chaos.style.opacity = 1;

matrix.style.opacity = .22;

document.body.classList.add(

"shake"

);

/* escalation */

let intensity = 0;

const escalation =

setInterval(()=>{

intensity += 1;

/* grows */

for(let i=0;i<intensity;i++){

ghostBar();

}

for(let i=0;i<intensity*.8;i++){

searchGhost();

}

for(let i=0;i<intensity*.55;i++){

warning();

}

/* late escalation */

if(intensity > 5){

flash();

}

if(intensity > 6){

lost();

}

if(intensity > 8){

document.body.classList.add(

"violent"

);

}

/* collapse */

if(intensity >= 12){

clearInterval(escalation);

collapse();

}

},220);

}

/* =========================================================

FLASH

========================================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .16;

setTimeout(()=>{

f.style.opacity = 0;

},36);

}

/* =========================================================

WARNINGS

========================================================= */

function warning(){

const msgs = [

"UNAUTHORIZED SIGNAL",

"MEMORY COLLISION",

"TRANSMISSION BREACH",

"SYSTEM OVERLOAD",

"CONTAINMENT FAILURE",

"FREQUENCY COLLAPSE"

];

const w =

document.createElement("div");

w.className = "warning";

w.innerText =

msgs[

Math.floor(

Math.random()*msgs.length

)

];

w.style.left =

(Math.random()*72+8)+"%";

w.style.top =

(Math.random()*74+8)+"%";

chaos.appendChild(w);

setTimeout(()=>{

w.remove();

},360);

}

/* =========================================================

GHOST BARS

========================================================= */

function ghostBar(){

const g =

document.createElement("div");

g.className = "ghostBar";

g.style.top =

(Math.random()*100)+"%";

g.style.transform =

`translate(

${Math.random()*40-20}px,

${Math.random()*16-8}px

)`;

chaos.appendChild(g);

setTimeout(()=>{

g.remove();

},160);

}

/* =========================================================

SEARCH GHOST

========================================================= */

function searchGhost(){

const s =

document.createElement("div");

s.className = "searchGhost";

s.style.top =

(Math.random()*70+10)+"%";

s.style.transform =

`translateX(-50%)

translate(

${Math.random()*60-30}px,

${Math.random()*20-10}px

)`;

chaos.appendChild(s);

setTimeout(()=>{

s.remove();

},200);

}

/* =========================================================

SIGNAL LOST

========================================================= */

function lost(){

signalLost.style.opacity =

.92;

signalLost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*10-5}px,

${Math.random()*8-4}px

)`;

setTimeout(()=>{

signalLost.style.opacity = 0;

},180);

}

/* =========================================================

COLLAPSE

========================================================= */

function collapse(){

chaos.style.opacity = 0;

matrix.style.opacity = 0;

document.body.classList.remove(

"shake",

"violent"

);

/* breath */

setTimeout(()=>{

document.getElementById(

"signalSpace"

).style.opacity = 1;

document.getElementById(

"signalSpace"

).style.pointerEvents = "auto";

/* reconnect appears */

document.getElementById(

"reconnect"

).style.opacity = .84;

},850);

}

/* =========================================================

MATRIX

========================================================= */

const ctx =

matrix.getContext("2d");

function resize(){

matrix.width =

window.innerWidth;

matrix.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const streams = [];

for(let i=0;i<28;i++){

streams.push({

x:

Math.random()*matrix.width,

y:

Math.random()*matrix.height,

speed:

1.8 + Math.random()*2,

len:

10 + Math.random()*18

});

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,.08)";

ctx.fillRect(

0,

0,

matrix.width,

matrix.height

);

streams.forEach(s=>{

for(let i=0;i<s.len;i++){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i/s.len)

})`;

ctx.font =

"18px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

s.x + (i*18),

s.y

);

}

s.x += s.speed;

if(s.x > matrix.width + 300){

s.x = -400;

s.y =

Math.random()*matrix.height;

}

});

requestAnimationFrame(draw);

}

draw();

/* =========================================================

RECONNECT

========================================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener(

"click",

e=>{

/* hide text */

reconnect.style.opacity = 0;

/* touch */

const touch =

document.getElementById("touch");

touch.style.left =

e.clientX + "px";

touch.style.top =

e.clientY + "px";

touch.style.opacity = 1;

/* thermal transfer */

touch.animate([

{

transform:

"translate(-50%,-50%) scale(.3)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(1.4)",

opacity:.9

},

{

transform:

"translate(-50%,-50%) scale(5.8)",

opacity:0

}

],{

duration:1200,

fill:"forwards"

});

/* humanity emerges */

setTimeout(()=>{

document.getElementById(

"etchings"

).style.opacity = 1;

},420);

});

</script>

</body>

</html>
