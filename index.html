<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

body {

    background: black;

    overflow: hidden;

    width: 100vw;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

}

.container {

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* SYMBOL */

.logo {

    width: 220px;

    opacity: 0;

    animation: logoFade 4s ease forwards;

    animation-delay: 2s;

    filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));

}

/* SIGNAL TEXT */

.signal-wrap {

    width: 260px;

    margin-top: 42px;

    text-align: left;

    min-height: 32px;

}

#signal-text {

    color: rgba(255,255,255,0.72);

    font-size: 1.7rem;

    letter-spacing: 9px;

    text-transform: uppercase;

}

.dots {

    opacity: 0;

    color: rgba(255,255,255,0.72);

    font-size: 1.7rem;

    letter-spacing: 4px;

}

.dots span {

    opacity: 0;

    animation: blinkDots 1.8s infinite;

}

.dots span:nth-child(1) {

    animation-delay: 0s;

}

.dots span:nth-child(2) {

    animation-delay: 0.3s;

}

.dots span:nth-child(3) {

    animation-delay: 0.6s;

}

/* RECONNECT */

.reconnect {

    margin-top: 55px;

    text-decoration: none;

    color: rgba(255,255,255,0.28);

    letter-spacing: 10px;

    font-size: 1.1rem;

    opacity: 0;

    animation: reconnectFade 2s ease forwards;

    animation-delay: 10s;

}

/* ANIMATIONS */

@keyframes logoFade {

    from {

        opacity: 0;

        transform: scale(0.92);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}

@keyframes reconnectFade {

    from {

        opacity: 0;

        transform: translateY(8px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}

@keyframes blinkDots {

    0% {

        opacity: 0;

    }

    25% {

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}

</style>

</head>

<body>

<div class="container">

    <img src="./mark17.png?v=3" class="logo">

    <div class="signal-wrap">

        <span id="signal-text"></span>

        <span class="dots" id="dots">

            <span>.</span>

            <span>.</span>

            <span>.</span>

        </span>

    </div>

    <a class="reconnect" href="#">

        reconnect

    </a>

</div>

<script>

const text = "SIGNAL LOST";

const target = document.getElementById("signal-text");

const dots = document.getElementById("dots");

let i = 0;

function typeText() {

    if (i < text.length) {

        target.innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText, 180);

    }

}

setTimeout(typeText, 6200);

setTimeout(() => {

    dots.style.opacity = "1";

}, 8600);

</script>

</body>

</html>
