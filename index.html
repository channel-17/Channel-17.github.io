<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Channel 17</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
#stage:before{content:"";position:absolute;inset:-2%;opacity:.035;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0px,rgba(255,255,255,.035) 1px,transparent 1px,transparent 4px);animation:voidShift 9s linear infinite}
@keyframes voidShift{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}

/* LOADER */
#loaderWrap{position:absolute;left:50%;top:40%;transform:translateX(-50%);width:220px}
#loader{position:relative;width:100%;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.02);overflow:hidden;box-shadow:inset 0 0 18px rgba(255,255,255,.045),0 0 18px rgba(255,255,255,.035)}
#fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:999px;background:repeating-linear-gradient(90deg,#fff 0px,#fff 12px,transparent 12px,transparent 17px);transition:width .6s linear}
#percent{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;letter-spacing:.22em;color:#fff;mix-blend-mode:difference;z-index:5}

/* LITTLE HOMIE */
#homie{position:absolute;left:50%;top:55%;width:92px;transform:translate(-50%,-50%);pointer-events:none;user-select:none;z-index:20}
.walk{animation:walkBob 1.18s ease-in-out infinite}
@keyframes walkBob{0%,100%{transform:translate(-50%,-50%) rotate(.4deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(-.5deg) translateY(2px)}}
.nervous{animation:nervousShake .08s steps(2,end) infinite}
@keyframes nervousShake{0%{transform:translate(-50%,-50%) translateX(0)}50%{transform:translate(-50%,-50%) translateX(1px)}100%{transform:translate(-50%,-50%) translateX(-1px)}}
.scurry{animation:scurry 3.8s linear forwards}
@keyframes scurry{from{left:50%}to{left:140%}}

/* FEAR AND SPEED LINES */
#fear{position:absolute;left:calc(50% - 55px);top:53%;width:28px;height:30px;opacity:0;z-index:22}
#fear.active{opacity:1}
.tick{position:absolute;width:9px;height:2px;border-radius:999px;background:rgba(255,255,255,.45);animation:gasp .16s infinite alternate}
.t1{top:6px;left:2px}.t2{top:18px;left:6px}
@keyframes gasp{from{transform:translateX(0);opacity:.18}to{transform:translateX(-5px);opacity:.62}}

#speed{position:absolute;left:calc(50% - 75px);top:54%;width:42px;height:30px;opacity:0;transition:opacity .25s ease;z-index:19}
#speed.active{opacity:1}
.sline{position:absolute;right:0;height:2px;border-radius:999px;background:rgba(255,255,255,.55);animation:speedMove .24s linear infinite}
.s1{width:19px;top:3px}.s2{width:32px;top:13px}.s3{width:18px;top:23px}
@keyframes speedMove{from{transform:translateX(0);opacity:.25}to{transform:translateX(-22px);opacity:0}}

/* CHAOS */
#chaos{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;transition:opacity .45s ease;z-index:30}
.window{position:absolute;border:1px solid rgba(190,255,70,.14);background:rgba(0,0,0,.86);color:rgba(220,255,120,.74);padding:10px;font-size:11px;letter-spacing:.1em;box-shadow:0 0 22px rgba(180,255,60,.05);animation:collapseDrift 5.8s linear infinite}
@keyframes collapseDrift{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.045) translate(-9px,7px)}}
.w1{top:8%;left:4%;width:180px}.w2{top:18%;right:6%;width:240px}.w3{top:38%;left:10%;width:280px}.w4{bottom:18%;right:12%;width:220px}.w5{top:56%;left:34%;width:260px}.w6{top:26%;left:42%;width:200px}.w7{bottom:8%;left:20%;width:240px}.w8{top:7%;right:24%;width:190px}
.strip{position:absolute;height:14px;background:linear-gradient(90deg,transparent,rgba(210,255,80,.22),transparent);opacity:0;animation:strip 1.1s ease forwards}
@keyframes strip{0%{opacity:0;transform:translateX(-60px)}25%{opacity:.75}100%{opacity:0;transform:translateX(80px)}}

/* POST */
#reconnect{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:22px;letter-spacing:.32em;color:rgba(210,255,90,.12);opacity:0;transition:opacity 2s ease;animation:breathe 4s ease-in-out infinite;z-index:50;cursor:pointer;user-select:none}
@keyframes breathe{0%,100%{opacity:.18;text-shadow:0 0 4px rgba(210,255,90,.03)}50%{opacity:.58;text-shadow:0 0 18px rgba(210,255,90,.14)}}
#channels{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:280px;opacity:0;transition:opacity 1.8s ease;z-index:55}
.channel{margin:16px 0;font-size:16px;letter-spacing:.16em;color:rgba(220,255,120,.72)}
.dormant{color:rgba(220,255,120,.12)}
.flash{animation:flash 1s infinite}
@keyframes flash{50%{opacity:.23}}

#touchCanvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;z-index:45}
</style>
</head>
<body>
<div id="stage">
  <div id="loaderWrap">
    <div id="loader"><div id="fill"></div><div id="percent">0%</div></div>
  </div>

  <img id="homie" class="walk" alt="Little Homie"
    src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 100'%3E%3Crect width='180' height='100' fill='none'/%3E%3Cpath fill='white' d='M42 61 C45 36 62 25 86 25 C111 25 128 39 130 62 L146 62 C149 55 155 51 163 51 C173 51 179 58 179 68 C179 78 172 85 162 85 C154 85 148 80 145 73 L130 73 C125 84 112 88 91 88 L58 88 C48 88 40 80 42 61 Z'/%3E%3Cpath fill='white' d='M41 64 L18 75 L42 78 Z'/%3E%3Crect fill='white' x='50' y='80' width='12' height='20' rx='4' transform='rotate(16 56 90)'/%3E%3Crect fill='white' x='104' y='80' width='12' height='20' rx='4' transform='rotate(-12 110 90)'/%3E%3Ccircle fill='black' cx='164' cy='67' r='4'/%3E%3C/svg%3E" />

  <div id="fear"><div class="tick t1"></div><div class="tick t2"></div></div>
  <div id="speed"><div class="sline s1"></div><div class="sline s2"></div><div class="sline s3"></div></div>

  <div id="chaos">
    <div class="window w1">TOO MANY ACTIVE MASKS</div>
    <div class="window w2">MEMORY STACK OVERFLOW</div>
    <div class="window w3">UNRESOLVED SIGNAL THREADS</div>
    <div class="window w4">IDENTITY LOOP ACTIVE</div>
    <div class="window w5">NOISE LIMIT EXCEEDED</div>
    <div class="window w6">SIGNAL COLLAPSE DETECTED</div>
    <div class="window w7">OVERLAPPING PERSONALITIES</div>
    <div class="window w8">FREQUENCY BREACH</div>
  </div>

  <canvas id="touchCanvas"></canvas>
  <div id="reconnect">reconnect</div>

  <div id="channels">
    <div class="channel">.last upload</div>
    <div class="channel">.roach tray</div>
    <div class="channel">.pass it back</div>
    <div class="channel dormant">.█████ ████</div>
    <div class="channel dormant">.signal_lost</div>
  </div>
</div>

<script>
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");
const homie=document.getElementById("homie");
const chaos=document.getElementById("chaos");
const reconnect=document.getElementById("reconnect");
const channels=document.getElementById("channels");
const speed=document.getElementById("speed");
const fear=document.getElementById("fear");
const canvas=document.getElementById("touchCanvas");
const ctx=canvas.getContext("2d");

let progress=0;
let halted=false;

function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();
addEventListener("resize",resize);

const loop=setInterval(()=>{
  if(halted)return;
  progress++;
  fill.style.width=progress+"%";
  percent.innerText=progress+"%";
  if(progress===16){
    halted=true;
    homie.classList.remove("walk");

    setTimeout(()=>{progress=17;fill.style.width="17%";percent.innerText="17%"},900);
    setTimeout(()=>{progress=18;fill.style.width="18%";percent.innerText="18%"},1600);

    setTimeout(()=>{homie.classList.add("nervous");fear.classList.add("active")},2500);
    setTimeout(()=>{chaos.style.opacity=1;spawnStrips()},3600);
    setTimeout(recovery,8200);
  }
},580);

function spawnStrips(){
  for(let i=0;i<18;i++){
    setTimeout(()=>{
      const s=document.createElement("div");
      s.className="strip";
      s.style.left=Math.random()*85+"vw";
      s.style.top=Math.random()*90+"vh";
      s.style.width=(90+Math.random()*260)+"px";
      chaos.appendChild(s);
      setTimeout(()=>s.remove(),1300);
    },i*130);
  }
}

function recovery(){
  chaos.style.opacity=0;
  fill.style.width="100%";
  percent.innerText="100%";
  percent.classList.add("flash");
  fear.classList.remove("active");
  homie.classList.remove("nervous");

  setTimeout(()=>{
    homie.classList.add("walk","scurry");
    speed.classList.add("active");
  },1000);

  setTimeout(()=>speed.classList.remove("active"),4200);
  setTimeout(()=>reconnect.style.opacity=1,5200);
}

reconnect.addEventListener("pointerdown",(e)=>{
  reconnect.style.pointerEvents="none";
  if(navigator.vibrate) navigator.vibrate([55,35,90]);
  reconnect.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:.65},{transform:"translate(-50%,-50%) scale(.96)",opacity:.35},{transform:"translate(-50%,-50%) scale(1.02)",opacity:0}],{duration:420,fill:"forwards",easing:"ease-out"});
  animateTouch(e.clientX,e.clientY);
  setTimeout(()=>channels.style.opacity=1,1700);
});

function animateTouch(cx,cy){
  canvas.style.opacity=1;
  let start=performance.now();
  function frame(now){
    const t=(now-start)/2600;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let p=0;p<26;p++){
      const angle=(p/26)*Math.PI*2 + Math.sin(p)*.4;
      const len=(80+t*Math.max(canvas.width,canvas.height)*.75)*(0.45+Math.random()*.03);
      const x=cx+Math.cos(angle)*len*t;
      const y=cy+Math.sin(angle)*len*t;
      ctx.beginPath();
      ctx.strokeStyle=`rgba(210,255,45,${Math.max(0,.32-t*.3)})`;
      ctx.lineWidth=1;
      ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo((cx+x)/2+Math.sin(t*8+p)*30,(cy+y)/2+Math.cos(t*7+p)*30,x,y);
      ctx.stroke();
      ctx.beginPath();
      ctx.fillStyle=`rgba(230,255,80,${Math.max(0,.55-t*.5)})`;
      ctx.arc(x,y,1.6,0,Math.PI*2);
      ctx.fill();
    }
    if(t<1) requestAnimationFrame(frame);
    else {canvas.style.opacity=0;ctx.clearRect(0,0,canvas.width,canvas.height)}
  }
  requestAnimationFrame(frame);
}

setInterval(()=>{
  const dormant=document.querySelectorAll(".dormant");
  const random=dormant[Math.floor(Math.random()*dormant.length)];
  random.style.opacity=".32";
  setTimeout(()=>random.style.opacity="",700);
},18000);
</script>
</body>
</html>
