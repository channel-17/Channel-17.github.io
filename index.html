<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Little Homie Prototype</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,Helvetica,sans-serif;

  color:#fff;

}

#stage{

  position:relative;

  width:100%;

  height:100%;

  overflow:hidden;

}

/* LOADER */

#loaderWrap{

  position:absolute;

  left:50%;

  top:40%;

  transform:translateX(-50%);

  width:min(76vw,420px);

}

#bar{

  position:relative;

  width:100%;

  height:28px;

  border:1px solid rgba(255,255,255,.16);

  background:rgba(255,255,255,.025);

  overflow:hidden;

}

#fill{

  height:100%;

  width:0%;

  background:repeating-linear-gradient(

    90deg,

    #fff 0 12px,

    transparent 12px 17px

  );

  transition:width .5s linear;

}

#percent{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:13px;

  font-weight:bold;

  letter-spacing:.24em;

  color:rgba(255,255,255,.48);

}

/* LITTLE HOMIE */

#homie{

  position:absolute;

  left:50%;

  top:54%;

  width:84px;

  height:50px;

  transform:translate(-50%,-50%);

  transition:transform .22s ease, opacity .2s ease;

}

.body{

  position:absolute;

  left:18px;

  top:14px;

  width:42px;

  height:25px;

  background:#fff;

  border-radius:24px 24px 12px 12px;

}

.head{

  position:absolute;

  left:58px;

  top:18px;

  width:16px;

  height:16px;

  background:#fff;

  border-radius:50%;

  transition:.25s ease;

}

.eye{

  position:absolute;

  right:5px;

  top:6px;

  width:3px;

  height:3px;

  background:#000;

  border-radius:50%;

}

.tail{

  position:absolute;

  left:10px;

  top:25px;

  width:0;

  height:0;

  border-top:5px solid transparent;

  border-bottom:5px solid transparent;

  border-right:10px solid #fff;

}

.leg{

  position:absolute;

  width:8px;

  height:11px;

  top:38px;

  background:#fff;

  border-radius:4px;

}

.leg1{left:26px}

.leg2{left:46px}

/* mechanical walk */

.walk{

  animation:homieBob 1.25s steps(2,end) infinite;

}

.walk .leg1{

  animation:stepA 1.25s steps(2,end) infinite;

}

.walk .leg2{

  animation:stepB 1.25s steps(2,end) infinite;

}

@keyframes homieBob{

  50%{margin-top:2px}

}

@keyframes stepA{

  50%{transform:translateX(-3px)}

}

@keyframes stepB{

  50%{transform:translateX(3px)}

}

/* look back */

.look .head{

  left:8px;

}

.look .eye{

  left:5px;

  right:auto;

}

/* cautious peek */

.peek .head{

  left:7px;

  top:7px;

}

/* shell */

.hide .head,

.hide .tail,

.hide .leg{

  opacity:0;

}

.hide .body{

  transform:scale(.98);

}

/* nervous shell */

.jitter{

  animation:jitter .11s steps(2,end) infinite;

}

@keyframes jitter{

  0%{transform:translate(-50%,-50%) translateX(0)}

  50%{transform:translate(-50%,-50%) translateX(1px)}

  100%{transform:translate(-50%,-50%) translateX(-1px)}

}

/* chaos placeholder */

#chaos{

  position:absolute;

  inset:0;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:opacity 1.2s ease;

}

.chaosText{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  color:rgba(255,60,60,.35);

  font-size:18px;

  letter-spacing:.3em;

}

/* 100% */

.flash{

  animation:flash 1s infinite;

}

@keyframes flash{

  50%{opacity:.24}

}

/* survivor hustle */

.run{

  animation:runAway 3s linear forwards;

}

.run::before,

.run::after{

  content:"";

  position:absolute;

  right:80px;

  width:18px;

  height:2px;

  background:rgba(255,255,255,.65);

}

.run::before{top:20px}

.run::after{top:31px}

@keyframes runAway{

  from{left:50%}

  to{left:118%}

}

</style>

</head>

<body>

<div id="stage">

  <div id="loaderWrap">

    <div id="bar">

      <div id="fill"></div>

      <div id="percent">0%</div>

    </div>

  </div>

  <div id="homie" class="walk">

    <div class="tail"></div>

    <div class="body"></div>

    <div class="head"><div class="eye"></div></div>

    <div class="leg leg1"></div>

    <div class="leg leg2"></div>

  </div>

  <div id="chaos">

    <div class="chaosText">CHAOS</div>

  </div>

</div>

<script>

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const homie = document.getElementById("homie");

const chaos = document.getElementById("chaos");

let progress = 0;

let paused = false;

const loading = setInterval(() => {

  if(paused) return;

  progress++;

  fill.style.width = progress + "%";

  percent.textContent = progress + "%";

  if(progress === 16){

    paused = true;

    homie.classList.remove("walk");

    setTimeout(() => {

      homie.classList.add("look");

    }, 520);

    setTimeout(() => {

      progress = 17;

      fill.style.width = "17%";

      percent.textContent = "17%";

    }, 950);

    setTimeout(() => {

      progress = 18;

      fill.style.width = "18%";

      percent.textContent = "18%";

    }, 1400);

    setTimeout(() => {

      homie.classList.remove("look");

      homie.classList.add("peek");

    }, 2050);

    setTimeout(() => {

      homie.classList.remove("peek");

      homie.classList.add("hide");

    }, 3050);

    setTimeout(() => {

      homie.classList.add("jitter");

    }, 3350);

    setTimeout(() => {

      chaos.style.opacity = 1;

    }, 4300);

    setTimeout(recovery, 7600);

  }

}, 620);

function recovery(){

  chaos.style.opacity = 0;

  fill.style.width = "100%";

  percent.textContent = "100%";

  percent.classList.add("flash");

  homie.classList.remove("jitter");

  setTimeout(() => {

    homie.classList.remove("hide");

    homie.classList.add("peek");

  }, 900);

  setTimeout(() => {

    homie.classList.remove("peek");

    homie.classList.add("walk");

  }, 1700);

  setTimeout(() => {

    homie.classList.add("run");

  }, 2400);

}

</script>

</body>

</html>
