<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" type="image/png" href="Inner17-final.png"/>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:"Courier New", monospace;

    color:#d7cdbd;

}

/* MAIN */

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transform:translateY(-42px);

}

/* SYMBOL WRAP */

.symbol-wrap{

    position:relative;

    width:220px;

    height:220px;

}

/* SYMBOLS */

.outer-symbol,

.inner-symbol{

    position:absolute;

    inset:0;

    width:100%;

    opacity:0;

    filter:

        drop-shadow(0 0 4px rgba(255,245,220,.06))

        drop-shadow(0 0 18px rgba(255,245,220,.04));

}

/* GLITCH */

.glitch{

    animation:glitch .22s linear 2;

}

@keyframes glitch{

    0%{

        transform:translateX(0px);

        filter:brightness(1);

    }

    20%{

        transform:translateX(-10px);

        filter:brightness(3);

    }

    40%{

        transform:translateX(8px);

        filter:brightness(.25);

    }

    60%{

        transform:translateX(-6px);

    }

    80%{

        transform:translateX(5px);

    }

    100%{

        transform:translateX(0px);

        filter:brightness(1);

    }

}

/* TEXT AREA */

.text-area{

    margin-top:2px;

    min-height:42px;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

}

/* SIGNAL LOST */

#line{

    font-size:1.52rem;

    letter-spacing:.34rem;

    color:#d8cfbf;

    opacity:0;

    transition:opacity 1.4s ease;

    white-space:nowrap;

}

/* RECONNECT */

#reconnect{

    position:absolute;

    font-size:1.52rem;

    letter-spacing:.34rem;

    color:#93897d;

    opacity:0;

    white-space:nowrap;

    cursor:pointer;

    user-select:none;

    transform-origin:center;

    filter:

        blur(.3px)

        brightness(.75);

}

/* ACTIVATION */

#reconnect.active{

    animation:

    awaken 6.2s ease-in-out infinite;

}

/* RECONNECT PULSE */

@keyframes awaken{

    0%{

        opacity:.05;

        transform:scale(1);

        filter:

            blur(.8px)

            brightness(.55);

        text-shadow:none;

    }

    10%{

        opacity:.12;

        transform:scale(1.002);

        filter:

            blur(.4px)

            brightness(.82);

    }

    16%{

        opacity:.04;

    }

    24%{

        opacity:.18;

        transform:scale(1.005);

        filter:

            blur(.2px)

            brightness(.96);

    }

    38%{

        opacity:1;

        transform:scale(1.032);

        filter:

            blur(0px)

            brightness(1.72);

        text-shadow:

            0 0 8px rgba(255,255,255,.12),

            0 0 20px rgba(255,255,255,.08),

            0 0 44px rgba(255,255,255,.04);

    }

    44%{

        opacity:.28;

        transform:scale(1.004);

        filter:

            blur(.25px)

            brightness(.84);

    }

    58%{

        opacity:.10;

        transform:scale(1);

        filter:

            blur(.7px)

            brightness(.62);

    }

    74%{

        opacity:.92;

        transform:scale(1.028);

        filter:

            blur(0px)

            brightness(1.62);

        text-shadow:

            0 0 10px rgba(255,255,255,.12),

            0 0 26px rgba(255,255,255,.08),

            0 0 52px rgba(255,255,255,.04);

    }

    100%{

        opacity:.05;

        transform:scale(1);

        filter:

            blur(.8px)

            brightness(.55);

        text-shadow:none;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="symbol-wrap">

        <img src="Outer17-final.png"

             class="outer-symbol"

             id="outerSymbol">

        <img src="Inner17-final.png"

             class="inner-symbol"

             id="innerSymbol">

    </div>

    <div class="text-area">

        <div id="line"></div>

        <div id="reconnect">

            reconnect

        </div>

    </div>

</div>

<script>

const outer =

document.getElementById("outerSymbol");

const inner =

document.getElementById("innerSymbol");

const line =

document.getElementById("line");

const reconnect =

document.getElementById("reconnect");

const sleep = (ms) =>

new Promise(resolve => setTimeout(resolve, ms));

async function runSequence(){

    /* BLACK SCREEN */

    await sleep(1800);

    /* SLOW BLEED IN */

    outer.style.transition =

    "opacity 5.8s ease";

    inner.style.transition =

    "opacity 5.8s ease";

    outer.style.opacity = ".92";

    inner.style.opacity = ".92";

    await sleep(5200);

    /* GLITCH */

    outer.classList.add("glitch");

    inner.classList.add("glitch");

    /* PAUSE */

    await sleep(1000);

    /* TYPEWRITER */

    line.style.opacity = "1";

    const words = [

        "s",

        "si",

        "sig",

        "sign",

        "signa",

        "signal",

        "signal ",

        "signal l",

        "signal lo",

        "signal los",

        "signal lost"

    ];

    for(let i = 0; i < words.length; i++){

        line.innerHTML = words[i];

        await sleep(120);

    }

    /* HOLD */

    await sleep(700);

    /* SEARCH LOOP */

    for(let cycle = 0; cycle < 3; cycle++){

        line.innerHTML = "signal lost.";

        await sleep(340);

        line.innerHTML = "signal lost..";

        await sleep(340);

        line.innerHTML = "signal lost...";

        await sleep(520);

        line.innerHTML = "signal lost";

        await sleep(260);

    }

    /* HOLD */

    await sleep(650);

    /* FADE TEXT */

    line.style.opacity = "0";

    await sleep(1500);

    /* GHOST */

    reconnect.style.opacity = ".05";

    await sleep(1200);

    /* ACTIVATE */

    reconnect.classList.add("active");

}

runSequence();

/* =========================

   RECONNECT CLICK

========================= */

reconnect.addEventListener("click", async () => {

    /* stop pulse */

    reconnect.classList.remove("active");

    /* fade reconnect */

    reconnect.style.transition =

    "opacity 1.4s ease";

    reconnect.style.opacity = "0";

    /* dissolve outer walls */

    outer.style.transition = `

        opacity 3.2s ease,

        filter 3.2s ease,

        transform 3.2s ease

    `;

    outer.style.opacity = "0";

    outer.style.filter =

    "blur(12px) brightness(.4)";

    outer.style.transform =

    "scale(1.08)";

    /* inner survives */

    inner.style.transition =

    "filter 4s ease";

    inner.style.filter =

    `

    drop-shadow(0 0 8px rgba(255,245,220,.10))

    drop-shadow(0 0 22px rgba(255,245,220,.08))

    `;

    /* subtle atmosphere shift */

    document.body.style.transition =

    "background 4s ease";

    document.body.style.background =

    "#020202";

});

</script>

</body>

</html>
