<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

* {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

}

body {

  background: black;

  height: 100vh;

  overflow: hidden;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family: Arial, sans-serif;

  color: rgba(255,255,255,0.72);

}

.container {

  position: relative;

  display: flex;

  flex-direction: column;

  align-items: center;

}

/* SYMBOL */

.logo {

  width: 170px;

  max-width: 52vw;

  opacity: 0;

  animation: logoFade 2.8s ease forwards;

}

/* SIGNAL TEXT */

.signal-wrap {

  margin-top: 26px;

  width: 170px;

  text-align: left;

  letter-spacing: 8px;

  font-size: 1rem;

  color: rgba(255,255,255,0.62);

  white-space: nowrap;

  overflow: hidden;

  opacity: 0;

  animation: textAppear 0.2s linear forwards;

  animation-delay: 3.2s;

}

#signal-text::after {

  content: "|";

  animation: cursorBlink 0.8s infinite;

}

.dots {

  margin-left: 2px;

}

.dots span {

  opacity: 0;

  animation: dotPulse 1.8s infinite;

}

.dots span:nth-child(1) {

  animation-delay: 0s;

}

.dots span:nth-child(2) {

  animation-delay: 0.3s;

}

.dots span:nth-child(3) {

  animation-delay: 0.6s;

}

/* RECONNECT */

.reconnect {

  margin-top: 36px;

  font-size: 0.9rem;

  letter-spacing: 10px;

  color: rgba(255,255,255,0.28);

  text-decoration: none;

  opacity: 0;

  animation: reconnectFade 2s ease forwards;

  animation-delay: 8s;

  transition: 0.3s ease;

}

.reconnect:hover {

  color: rgba(255,255,255,0.75);

}

/* ANIMATIONS */

@keyframes logoFade {

  from {

    opacity: 0;

    transform: scale(0.96);

  }

  to {

    opacity: 1;

    transform: scale(1);

  }

}

@keyframes textAppear {

  from {

    opacity: 0;

  }

  to {

    opacity: 1;

  }

}

@keyframes reconnectFade {

  from {

    opacity: 0;

    transform: translateY(8px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

@keyframes dotPulse {

  0% { opacity: 0; }

  20% { opacity: 1; }

  100% { opacity: 0; }

}

@keyframes cursorBlink {

  0% { opacity: 1; }

  50% { opacity: 0; }

  100% { opacity: 1; }

}

</style>

</head>

<body>

<div class="container">

  <img src="./mark17.png?v=2" class="logo">

  <div class="signal-wrap">

    <span id="signal-text"></span>

    <span class="dots">

      <span>.</span>

      <span>.</span>

      <span>.</span>

    </span>

  </div>

  <a class="reconnect" href="#">

    reconnect

  </a>

</div>

<script>

const text = "SIGNAL LOST";

const target = document.getElementById("signal-text");

let i = 0;

function typeText() {

  if (i < text.length) {

    target.innerHTML += text.charAt(i);

    i++;

    setTimeout(typeText, 180);

  }

}

setTimeout(typeText, 3400);

</script>

</body>

</html>
