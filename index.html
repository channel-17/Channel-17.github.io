<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

cursor:default;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

z-index:1;

background:#000;

}

/* =========================================

PHONE DARK EDGES

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999;

background:

radial-gradient(

circle,

transparent 54%,

rgba(0,0,0,.28) 78%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================

STATIC NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:5;

opacity:.08;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

EMERGENCY FLASHES

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

z-index:30;

mix-blend-mode:screen;

}

/* =========================================

SCREEN FRACTURES

========================================= */

#fracture{

position:fixed;

inset:0;

pointer-events:none;

z-index:25;

opacity:0;

}

.slice{

position:absolute;

background:

rgba(255,255,255,.08);

mix-blend-mode:screen;

}

/* =========================================

WARNING

========================================= */

#warning{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(18px,4vw,42px);

letter-spacing:.24em;

color:#fff;

white-space:nowrap;

opacity:0;

z-index:100;

mix-blend-mode:screen;

text-shadow:

0 0 12px rgba(255,255,255,.25);

}

#warning.active{

animation:

warning .08s infinite;

}

@keyframes warning{

0%{

opacity:.04;

transform:

translate(-50%,-50%)

translateX(0px);

}

25%{

opacity:1;

transform:

translate(-50%,-50%)

translateX(-4px);

}

50%{

opacity:.2;

}

75%{

opacity:1;

transform:

translate(-50%,-50%)

translateX(4px);

}

100%{

opacity:.04;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:56%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(28px,5vw,72px);

letter-spacing:.24em;

color:#fff;

opacity:0;

white-space:nowrap;

z-index:110;

mix-blend-mode:screen;

}

#signalLost.active{

animation:

signal .12s infinite;

}

@keyframes signal{

0%{

opacity:.05;

}

50%{

opacity:1;

}

100%{

opacity:.05;

}

}

/* =========================================

STATIC SIGNAL LINES

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

z-index:15;

opacity:0;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-180px);

opacity:.02;

}

50%{

opacity:.5;

}

100%{

transform:

translateX(180px);

opacity:.02;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:39%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(76vw,460px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2s ease;

z-index:200;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:

8s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.32;

transition:

8s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:61%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,28px);

letter-spacing:.26em;

color:#f1c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:220;

transition:

1.5s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

reconnectPulse 3s ease infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.18;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,160,50,.18),

0 0 50px rgba(255,120,20,.08);

}

}

/* =========================================

WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:3;

opacity:0;

transition:

10s ease;

background:

radial-gradient(circle at center,

rgba(255,120,20,.22) 0%,

rgba(255,120,20,.12) 4%,

rgba(255,120,20,.05) 8%,

transparent 16%

);

mix-blend-mode:screen;

}

/* =========================================

ROOM LIGHT

========================================= */

#room{

position:fixed;

inset:0;

pointer-events:none;

z-index:4;

opacity:0;

transition:

10s ease;

background:

radial-gradient(circle at center,

rgba(255,180,90,.05) 0%,

rgba(255,160,50,.02) 30%,

transparent 62%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:

8s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

8s ease;

z-index:300;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.03;

transition:

8s ease;

}

.connected .etch{

opacity:1;

}

#etch1{

width:min(48vw,280px);

left:10%;

top:60%;

transform:

rotate(-4deg);

}

#etch2{

width:min(62vw,390px);

left:14%;

top:50%;

transform:

rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:28%;

bottom:-1%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #room{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 18px

rgba(255,180,90,.22)

)

drop-shadow(

0 0 56px

rgba(255,120,20,.12)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="flash"></div>

<div id="fracture"></div>

<div id="static"></div>

<div id="warmth"></div>

<div id="room"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="warning">

WARNING WARNING WARNING

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch"

id="etch1"

href="#">

<img src="lastsesh17.png"

width="100%">

</a>

<a class="etch"

id="etch2"

href="#">

<img src="RoachTray17.png"

width="100%">

</a>

<a class="etch"

id="etch3"

href="#">

<img src="PassItBack17.png"

width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

window.onload = () => {

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 18;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .52,

y:

canvas.height * .38,

w:560,

h:260

};

for(let i=0;i<rows;i++){

streams.push({

y:

i * fontSize,

x:

Math.random() * -3000,

speed:

8 + Math.random() * 14,

length:

16 + Math.random() * 28,

laps:0,

finished:false

});

}

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .14;

setTimeout(()=>{

f.style.opacity = 0;

},40);

}

function fracture(){

const layer =

document.getElementById("fracture");

layer.style.opacity = 1;

layer.innerHTML = "";

for(let i=0;i<4;i++){

const s =

document.createElement("div");

s.className = "slice";

s.style.left =

(Math.random()*100) + "%";

s.style.top =

(Math.random()*100) + "%";

s.style.width =

(100 + Math.random()*500) + "px";

s.style.height =

(20 + Math.random()*120) + "px";

s.style.transform =

`translate(

${Math.random()*40-20}px,

${Math.random()*40-20}px

)`;

layer.appendChild(s);

}

setTimeout(()=>{

layer.style.opacity = 0;

},70);

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.18)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

}

stream.x += stream.speed;

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 220

){

stream.laps++;

if(stream.laps >= 2){

stream.finished = true;

}else{

stream.x =

Math.random() * -3000;

}

}

});

if(Math.random() > .74){

flash();

}

if(Math.random() > .82){

fracture();

}

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(loop);

setTimeout(()=>{

failure();

},200);

}

}

function failure(){

const warning =

document.getElementById("warning");

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

warning.style.opacity = 1;

warning.classList.add("active");

for(let i=0;i<34;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70) + "%";

line.style.left =

Math.random()*60 + "%";

line.style.top =

Math.random()*100 + "%";

line.style.animationDuration =

(.05 + Math.random()*1) + "s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

setTimeout(()=>{

warning.style.opacity = 0;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

},500);

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

},1400);

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},1700);

setTimeout(()=>{

document

.getElementById("reconnect")

.classList.add("active");

},2300);

}

const loop =

setInterval(draw,34);

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

document.body.classList.add("connected");

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},4500);

});

};

</script>

</body>

</html>
