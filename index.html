<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
color:white;
}

.screen{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:black;
}



/* VIOLENT SIGNAL TAKEOVER /

.glitch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.14) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

mix-blend-mode:screen;

pointer-events:none;

opacity:0;

z-index:50;

animation:takeover 2.5s ease forwards;
}

@keyframes takeover{

0%{
opacity:0;
transform:translateX(0px);
}

6%{
opacity:1;
transform:
translateX(-40px)
skewX(16deg);
}

12%{
opacity:.1;
}

22%{
opacity:1;
transform:
translateX(28px)
skewX(-10deg);
}

34%{
opacity:.15;
}

48%{
opacity:1;
transform:
translateY(-4px)
scale(1.02);
}

62%{
opacity:.08;
}

100%{
opacity:.04;
transform:none;
}

}



/ INTERFERENCE /

.interference{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
90deg,
rgba(255,255,255,.04),
transparent 20%,
transparent 80%,
rgba(255,255,255,.03)
);

opacity:.08;

mix-blend-mode:screen;

pointer-events:none;

z-index:20;

animation:pulse 5s ease-in-out infinite;
}

@keyframes pulse{

0%{
opacity:.04;
}

50%{
opacity:.12;
}

100%{
opacity:.04;
}

}



/ SYMBOL /

.symbol{
position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

font-size:5rem;

letter-spacing:10px;

opacity:.015;

filter:blur(.4px);

transition:4s ease;

z-index:6;
}



/ TRIANGLE INFLUENCE /

.triangle{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:0;
height:0;

border-left:110px solid transparent;
border-right:110px solid transparent;
border-bottom:190px solid rgba(255,255,255,.05);

opacity:.22;

filter:blur(1px);

transition:4s ease;

z-index:5;
}



/ SIGNAL /

.signal{
position:absolute;

left:50%;
bottom:29%;

transform:translateX(-50%);

font-size:.72rem;

letter-spacing:7px;

opacity:.55;

z-index:12;
}



/ RECONNECT /

.reconnect{
position:absolute;

left:50%;
bottom:22%;

transform:translateX(-50%);

font-size:.85rem;

letter-spacing:8px;

opacity:.86;

cursor:pointer;

z-index:13;
}



/ EMBER /

.ember{
position:absolute;

width:8px;
height:8px;

border-radius:50%;

opacity:0;

pointer-events:none;

background:
radial-gradient(
circle,
rgba(255,210,160,1) 0%,
rgba(255,120,60,.75) 40%,
rgba(255,70,20,.18) 70%,
transparent 100%
);

box-shadow:
0 0 8px rgba(255,120,50,.55),
0 0 18px rgba(255,70,20,.22);

z-index:30;
}



/ FREQUENCY ARCS /

.frequency{
position:absolute;

left:7vw;
bottom:7vh;

display:flex;
flex-direction:column;

gap:10px;

opacity:0;

transition:3s ease;

z-index:15;
}

.frequency div{

font-size:.58rem;

letter-spacing:4px;

opacity:.7;
}

.frequency.show{
opacity:1;
}



/ REVEAL */

.symbol.awaken{
opacity:.15;
filter:none;
}

.triangle.fade{
opacity:.03;
filter:blur(7px);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch"></div>

<div class="interference"></div>

<div class="triangle" id="triangle"></div>

<div class="symbol" id="symbol">
.17
</div>

<div class="signal" id="signal">
signal lost
</div>

<div class="reconnect" id="reconnect">
reconnect
</div>

<div class="frequency" id="frequency">

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass it Back</div>

</div>

<div class="ember" id="ember"></div>

</div>

<script>

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");

const symbol =
document.getElementById("symbol");

const triangle =
document.getElementById("triangle");



reconnect.addEventListener("click",(e)=>{

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";

ember.style.opacity="1";



ember.animate([

{
transform:"translate(-50%,-50%) scale(.3)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(8)",
opacity:.04
}

],{

duration:4200,
fill:"forwards",
easing:"ease-out"

});



setTimeout(()=>{

symbol.classList.add("awaken");

triangle.classList.add("fade");

},700);



setTimeout(()=>{

frequency.classList.add("show");

},2400);

});

</script>

</body>
</html>
