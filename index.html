<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Little Homie Test</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,Helvetica,sans-serif;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

  color:white;

}

#stage{

  position:relative;

  width:100%;

  height:100%;

}

#loaderWrap{

  position:absolute;

  left:50%;

  top:42%;

  transform:translateX(-50%);

  width:min(76vw,380px);

}

#bar{

  width:100%;

  height:24px;

  border:1px solid rgba(255,255,255,.16);

  background:rgba(255,255,255,.025);

  overflow:hidden;

}

#fill{

  width:0%;

  height:100%;

  background:repeating-linear-gradient(

    90deg,

    rgba(255,255,255,.95) 0px,

    rgba(255,255,255,.95) 10px,

    transparent 10px,

    transparent 15px

  );

  transition:width .35s linear;

}

#percent{

  margin-top:14px;

  text-align:center;

  color:rgba(255,255,255,.55);

  font-size:14px;

  letter-spacing:.24em;

  font-weight:bold;

}

#lane{

  position:absolute;

  left:50%;

  top:52%;

  transform:translateX(-50%);

  width:min(76vw,380px);

  height:80px;

}

#homie{

  position:absolute;

  left:0;

  top:16px;

  width:64px;

  height:42px;

  transition:left .45s linear, transform .35s ease;

}

.sprite{

  width:64px;

  height:42px;

  image-rendering:pixelated;

  overflow:visible;

}

.pixel{

  fill:#fff;

}

.dim{

  fill:rgba(255,255,255,.82);

}

#homie.shake{

  animation:shellJitter .11s steps(2,end) infinite;

}

@keyframes shellJitter{

  0%{transform:translateX(0)}

  25%{transform:translateX(1px)}

  50%{transform:translateX(-1px)}

  75%{transform:translateX(1px)}

  100%{transform:translateX(0)}

}

#fade{

  position:absolute;

  inset:0;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:opacity 1.6s ease;

}

.flash{

  animation:flash .75s infinite;

}

@keyframes flash{

  0%,100%{opacity:1}

  50%{opacity:.25}

}

</style>

</head>

<body>

<div id="stage">

  <div id="loaderWrap">

    <div id="bar"><div id="fill"></div></div>

    <div id="percent">0%</div>

  </div>

  <div id="lane">

    <div id="homie"></div>

  </div>

  <div id="fade"></div>

</div>

<script>

const homie = document.getElementById("homie");

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const fade = document.getElementById("fade");

let p = 0;

let x = 0;

let frame = 0;

function svg(blocks){

  return `

  <svg class="sprite" viewBox="0 0 32 21">

    ${blocks.map(b=>`<rect class="${b[4]||"pixel"}" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}"/>`).join("")}

  </svg>`;

}

const walk1 = [

  [8,9,2,2],[10,8,3,2],[13,7,8,2],[21,8,3,2],[24,9,2,2],

  [9,11,16,2],[8,13,18,2],[10,15,14,2],

  [11,10,2,1,"dim"],[15,9,2,1,"dim"],[19,10,2,1,"dim"],

  [5,12,3,2],[3,11,2,2],

  [26,12,4,2],[30,11,2,2],

  [11,17,2,3],[21,17,2,3],

  [7,15,2,2]

];

const walk2 = [

  [8,9,2,2],[10,8,3,2],[13,7,8,2],[21,8,3,2],[24,9,2,2],

  [9,11,16,2],[8,13,18,2],[10,15,14,2],

  [11,10,2,1,"dim"],[15,9,2,1,"dim"],[19,10,2,1,"dim"],

  [5,12,3,2],[3,11,2,2],

  [26,12,4,2],[30,11,2,2],

  [13,17,2,3],[19,17,2,3],

  [7,15,2,2]

];

const look = [

  [8,9,2,2],[10,8,3,2],[13,7,8,2],[21,8,3,2],[24,9,2,2],

  [9,11,16,2],[8,13,18,2],[10,15,14,2],

  [11,10,2,1,"dim"],[15,9,2,1,"dim"],[19,10,2,1,"dim"],

  [1,11,2,2],[3,12,4,2],

  [26,13,3,2],

  [12,17,2,3],[21,17,2,3],

  [27,15,2,2]

];

const neck = [

  [8,9,2,2],[10,8,3,2],[13,7,8,2],[21,8,3,2],[24,9,2,2],

  [9,11,16,2],[8,13,18,2],[10,15,14,2],

  [11,10,2,1,"dim"],[15,9,2,1,"dim"],[19,10,2,1,"dim"],

  [1,6,2,2],[3,8,2,2],[5,10,2,2],

  [26,13,3,2],

  [12,17,2,3],[21,17,2,3],

  [27,15,2,2]

];

const shell = [

  [8,9,2,2],[10,8,3,2],[13,7,8,2],[21,8,3,2],[24,9,2,2],

  [9,11,16,2],[8,13,18,2],[10,15,14,2],

  [11,10,2,1,"dim"],[15,9,2,1,"dim"],[19,10,2,1,"dim"],

  [7,15,2,2]

];

function setSprite(type){

  if(type==="walk"){

    homie.innerHTML = svg(frame % 2 ? walk1 : walk2);

    frame++;

  }

  if(type==="look") homie.innerHTML = svg(look);

  if(type==="neck") homie.innerHTML = svg(neck);

  if(type==="shell") homie.innerHTML = svg(shell);

}

setSprite("walk");

const ticker = setInterval(()=>{

  p += 1;

  x += 10;

  fill.style.width = p + "%";

  percent.textContent = p + "%";

  homie.style.left = x + "px";

  setSprite("walk");

  if(p === 16){

    clearInterval(ticker);

    setTimeout(()=>setSprite("look"),450);

    setTimeout(()=>{

      p = 17;

      fill.style.width = p + "%";

      percent.textContent = p + "%";

    },700);

    setTimeout(()=>{

      p = 18;

      fill.style.width = p + "%";

      percent.textContent = p + "%";

    },1050);

    setTimeout(()=>setSprite("neck"),1250);

    setTimeout(()=>{

      setSprite("shell");

      homie.classList.add("shake");

    },2050);

    setTimeout(()=>fade.style.opacity = 1,3600);

    setTimeout(recovery,6200);

  }

},640);

function recovery(){

  homie.classList.remove("shake");

  fade.style.opacity = 0;

  p = 100;

  fill.style.width = "100%";

  percent.textContent = "100%";

  percent.classList.add("flash");

  homie.style.left = "50%";

  homie.style.transform = "translateX(-50%)";

  setSprite("shell");

  setTimeout(()=>setSprite("neck"),1200);

  setTimeout(()=>setSprite("walk"),2200);

  setTimeout(()=>{

    homie.style.transition = "left 5s linear";

    homie.style.transform = "translateX(0)";

    homie.style.left = "100%";

    setInterval(()=>setSprite("walk"),700);

  },2800);

}

</script>

</body>

</html>
