<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

/* =========================================

RESET

========================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial,Helvetica,sans-serif;

color:#fff;

}

/* =========================================

BASE ATMOSPHERE

========================================= */

body{

position:relative;

background:#000;

-webkit-tap-highlight-color:transparent;

}

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:99999;

opacity:.035;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.04) 0px,

rgba(255,255,255,.04) 1px,

transparent 1px,

transparent 4px

);

animation:noiseMove .06s linear infinite;

}

@keyframes noiseMove{

from{

transform:translateY(0px);

}

to{

transform:translateY(3px);

}

}

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 46%,

rgba(0,0,0,.48) 72%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================

LOADER

========================================= */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:2000;

transition:opacity .7s ease;

}

/* =========================================

SEGMENT BAR

========================================= */

#bar{

display:flex;

gap:5px;

width:min(58vw,320px);

height:26px;

}

.segment{

flex:1;

border:

1px solid rgba(255,255,255,.14);

background:

rgba(255,255,255,.025);

border-radius:4px;

box-shadow:

inset 0 0 8px rgba(255,255,255,.02);

transition:

background .18s ease,

box-shadow .18s ease;

}

.segment.active{

background:

rgba(255,255,255,.92);

box-shadow:

0 0 12px rgba(255,255,255,.12);

}

/* =========================================

PERCENT

========================================= */

#percent{

margin-top:16px;

font-size:14px;

font-weight:700;

letter-spacing:.22em;

opacity:.54;

}

/* =========================================

TURTLE

========================================= */

#turtleWrap{

margin-top:36px;

width:100px;

height:70px;

display:flex;

justify-content:center;

align-items:center;

}

#turtle{

width:84px;

height:54px;

overflow:visible;

opacity:.98;

filter:

drop-shadow(

0 0 8px rgba(255,255,255,.06)

);

}

.walk{

animation:

walk 1s ease-in-out infinite;

}

@keyframes walk{

0%,100%{

transform:

translateX(0px)

translateY(0px);

}

50%{

transform:

translateX(2px)

translateY(-2px);

}

}

/* anatomy */

#head,

#neck,

#frontLeg,

#backLeg,

#tail,

#shell{

transition:.14s ease;

}

/* look back */

.look{

transform:

scaleX(-1);

}

/* gasp */

.gasp #head{

transform:

translateX(6px);

}

.gasp #neck{

transform:

translateX(4px);

}

.gasp #frontLeg{

transform:

translateY(3px);

}

/* retract */

.retract #head{

transform:

translateX(-20px);

opacity:0;

}

.retract #neck{

transform:

translateX(-18px);

opacity:0;

}

.retract #frontLeg,

.retract #backLeg{

transform:

translateY(-14px);

opacity:0;

}

.retract #tail{

transform:

translateX(8px);

opacity:0;

}

.retract #shell{

transform:

scale(1.04);

}

/* =========================================

CHAOS

========================================= */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

opacity:0;

z-index:5000;

transition:opacity .3s ease;

}

.window{

position:absolute;

background:

rgba(10,10,10,.92);

border:

1px solid rgba(255,255,255,.08);

border-radius:10px;

overflow:hidden;

box-shadow:

0 0 22px rgba(0,0,0,.72);

opacity:0;

animation:

cascade linear forwards;

}

@keyframes cascade{

0%{

opacity:0;

transform:

translate(0px,0px)

scale(.96);

}

10%{

opacity:.92;

}

100%{

opacity:0;

transform:

translate(

var(--moveX),

var(--moveY)

)

scale(1.03);

}

}

.windowTop{

height:28px;

padding-left:12px;

display:flex;

align-items:center;

font-size:11px;

letter-spacing:.14em;

background:

rgba(255,255,255,.04);

border-bottom:

1px solid rgba(255,255,255,.04);

color:

rgba(255,255,255,.48);

}

.windowBody{

padding:12px;

font-size:11px;

line-height:1.6;

color:

rgba(255,255,255,.62);

}

.red{

color:#ff4141;

}

.amber{

color:#c8b86a;

}

/* strips */

.strip{

position:absolute;

height:14px;

opacity:0;

background:

linear-gradient(

90deg,

transparent,

rgba(196,176,92,.24),

transparent

);

animation:

strip .7s linear forwards;

}

@keyframes strip{

0%{

opacity:0;

transform:translateX(-30px);

}

20%{

opacity:.7;

}

100%{

opacity:0;

transform:translateX(70px);

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

left:50%;

top:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(32px,6vw,74px);

letter-spacing:.24em;

opacity:0;

text-shadow:

0 0 14px rgba(255,255,255,.12);

}

/* =========================================

RECONNECT SPACE

========================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

z-index:8000;

transition:opacity 1.2s ease;

}

/* symbols */

#outer{

position:absolute;

width:min(72vw,360px);

opacity:0;

transition:

opacity 1.4s ease,

filter 1.4s ease,

transform 1.4s ease;

filter:

drop-shadow(

0 0 8px rgba(255,255,255,.03)

);

}

#inner{

position:absolute;

width:min(42vw,190px);

opacity:0;

transition:

opacity 1.8s ease;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.05)

);

}

/* reconnect */

#reconnect{

position:absolute;

font-size:

clamp(18px,3vw,28px);

letter-spacing:.34em;

padding:30px;

cursor:pointer;

user-select:none;

opacity:0;

z-index:9000;

color:

rgba(255,255,255,.76);

transition:

opacity .15s linear;

}

.breathing{

animation:

heartbeat 2.2s ease-in-out infinite;

}

@keyframes heartbeat{

0%{

opacity:.44;

text-shadow:

0 0 6px rgba(255,255,255,.04);

}

18%{

opacity:.98;

text-shadow:

0 0 22px rgba(255,255,255,.2);

}

36%{

opacity:.5;

text-shadow:

0 0 8px rgba(255,255,255,.05);

}

100%{

opacity:.72;

text-shadow:

0 0 14px rgba(255,255,255,.08);

}

}

/* ripple */

#ripple{

position:absolute;

width:18px;

height:18px;

border-radius:50%;

opacity:0;

pointer-events:none;

z-index:8800;

filter:

blur(5px);

background:

radial-gradient(

circle,

rgba(255,214,170,.95) 0%,

rgba(255,170,80,.72) 22%,

rgba(190,130,50,.16) 46%,

transparent 76%

);

}

/* dormant signal */

#signalField{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

z-index:7600;

}

/* subtle traces */

.trace{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,186,92,.14),

transparent

);

opacity:.22;

}

/* channel links */

#channels{

position:absolute;

bottom:11vh;

left:50%;

transform:

translateX(-50%);

display:flex;

flex-direction:column;

gap:18px;

opacity:0;

transition:opacity 1.8s ease;

z-index:9200;

}

.channel{

position:relative;

font-size:15px;

letter-spacing:.24em;

color:

rgba(255,255,255,.64);

text-decoration:none;

padding:

10px 18px;

border:

1px solid rgba(255,255,255,.06);

background:

rgba(255,255,255,.015);

border-radius:6px;

overflow:hidden;

transition:

.18s ease;

}

/* interaction */

.channel:hover,

.channel:active{

color:

rgba(255,255,255,.92);

border-color:

rgba(255,210,140,.18);

background:

rgba(255,210,140,.03);

box-shadow:

0 0 14px rgba(255,186,92,.08);

}

/* pulse */

.channel::after{

content:"";

position:absolute;

left:-40%;

top:0;

width:30%;

height:100%;

background:

linear-gradient(

90deg,

transparent,

rgba(255,210,140,.08),

transparent

);

transform:

skewX(-20deg);

opacity:0;

}

.channel:hover::after{

animation:

signalPass .8s linear;

}

@keyframes signalPass{

0%{

left:-40%;

opacity:0;

}

20%{

opacity:1;

}

100%{

left:140%;

opacity:0;

}

}

</style>

</head>

<body>

<div id="noise"></div>

<!-- =========================================

LOADER

========================================= -->

<div id="loader">

<div id="bar"></div>

<div id="percent">

0%

</div>

<div id="turtleWrap">

<svg

id="turtle"

class="walk"

viewBox="0 0 120 70">

<!-- legs -->

<ellipse

id="backLeg"

cx="48"

cy="54"

rx="5"

ry="7"

fill="white"/>

<ellipse

id="frontLeg"

cx="76"

cy="54"

rx="5"

ry="7"

fill="white"/>

<!-- tail -->

<polygon

id="tail"

points="24,42 14,37 14,47"

fill="white"/>

<!-- shell underside -->

<ellipse

cx="62"

cy="40"

rx="28"

ry="16"

fill="rgba(255,255,255,.88)"/>

<!-- shell -->

<path

id="shell"

d="

M34 40

C34 24 48 14 66 14

C86 14 98 25 98 40

C98 55 86 66 66 66

C48 66 34 56 34 40

Z"

fill="white"/>

<!-- shell lines -->

<path

d="M44 30 C58 24 76 24 90 31"

stroke="black"

stroke-width="2"

opacity=".12"

fill="none"/>

<path

d="M42 44 C58 39 78 39 92 46"

stroke="black"

stroke-width="2"

opacity=".12"

fill="none"/>

<!-- neck -->

<rect

id="neck"

x="92"

y="35"

width="14"

height="8"

rx="4"

fill="white"/>

<!-- head -->

<circle

id="head"

cx="110"

cy="39"

r="8"

fill="white"/>

<!-- eye -->

<circle

cx="113"

cy="37"

r="1.4"

fill="black"

opacity=".3"/>

</svg>

</div>

</div>

<!-- =========================================

CHAOS

========================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================

FINAL SIGNAL

========================================= -->

<div id="signalSpace">

<div id="signalField"></div>

<img

id="outer"

src="Outer17-final.png">

<img

id="inner"

src="Inner17-final.png">

<div id="reconnect">

RECONNECT

</div>

<div id="ripple"></div>

<div id="channels">

<a class="channel" href="#">

LAST SESH

</a>

<a class="channel" href="#">

ROACH TRAY

</a>

<a class="channel" href="#">

PASS IT BACK

</a>

</div>

</div>

<div id="vignette"></div>

<script>

/* =========================================

SEGMENTS

========================================= */

const bar =

document.getElementById("bar");

for(let i=0;i<17;i++){

const seg =

document.createElement("div");

seg.className =

"segment";

bar.appendChild(seg);

}

const segments =

document.querySelectorAll(".segment");

/* =========================================

ELEMENTS

========================================= */

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

const chaos =

document.getElementById("chaos");

const signalLost =

document.getElementById("signalLost");

const signalSpace =

document.getElementById("signalSpace");

const reconnect =

document.getElementById("reconnect");

const ripple =

document.getElementById("ripple");

const outer =

document.getElementById("outer");

const inner =

document.getElementById("inner");

const channels =

document.getElementById("channels");

const signalField =

document.getElementById("signalField");

/* =========================================

LOADING

========================================= */

let load = 0;

let looked = false;

let gasped = false;

let retracted = false;

const loop =

setInterval(()=>{

load++;

if(load > 17){

load = 17;

}

/* segments */

segments.forEach((s,i)=>{

if(i < load){

s.classList.add("active");

}

});

/* percent */

percent.innerText =

load + "%";

/* look back */

if(load >= 15 && !looked){

looked = true;

microTwitch();

setTimeout(()=>{

turtle.classList.remove(

"walk"

);

turtle.classList.add(

"look"

);

},120);

}

/* gasp */

if(load >= 16 && !gasped){

gasped = true;

turtle.classList.add(

"gasp"

);

}

/* retract */

if(load >= 17 && !retracted){

retracted = true;

turtle.classList.remove(

"gasp"

);

turtle.classList.add(

"retract"

);

clearInterval(loop);

setTimeout(()=>{

startChaos();

},900);

}

},260);

/* =========================================

TWITCH

========================================= */

function microTwitch(){

document.body.style.transform =

"translateX(2px)";

setTimeout(()=>{

document.body.style.transform =

"translateX(0px)";

},40);

}

/* =========================================

CHAOS

========================================= */

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},700);

chaos.style.opacity = 1;

let stage = 0;

const chaosLoop =

setInterval(()=>{

stage++;

for(let i=0;i<Math.min(stage,5);i++){

spawnWindow();

}

if(stage > 5){

spawnStrip();

}

if(stage > 7){

pulseSignal();

}

if(stage >= 15){

clearInterval(chaosLoop);

collapse();

}

},180);

}

/* =========================================

WINDOWS

========================================= */

function spawnWindow(){

const types = [

{

title:"identity",

color:"red",

headline:"TOO MANY ACTIVE MASKS",

body:[

"authentic signal buried",

"identity loop active",

"synthetic behavior detected"

]

},

{

title:"download",

color:"red",

headline:"UNREQUESTED FILE STACK",

body:[

"plasticself.exe",

"performative_identity.pkg",

"human_input_lost.dat"

]

},

{

title:"transmission",

color:"amber",

headline:"SIGNAL STILL ACTIVE",

body:[

"frequency surviving",

"hidden packet received",

"reconnect possible"

]

}

];

const data =

types[

Math.floor(Math.random()*types.length)

];

const win =

document.createElement("div");

win.className =

"window";

win.style.width =

(220 + Math.random()*240)+"px";

win.style.height =

(120 + Math.random()*120)+"px";

win.style.left =

(Math.random()*72)+"vw";

win.style.top =

(Math.random()*70)+"vh";

win.style.setProperty(

"--moveX",

`${70 + Math.random()*120}px`

);

win.style.setProperty(

"--moveY",

`${50 + Math.random()*120}px`

);

win.style.animationDuration =

(.8 + Math.random()*1)+"s";

win.innerHTML = `

<div class="windowTop">

${data.title}

</div>

<div class="windowBody">

<div class="${data.color}">

${data.headline}

</div>

<br>

<div>${data.body[0]}</div>

<div>${data.body[1]}</div>

<div>${data.body[2]}</div>

</div>

`;

chaos.appendChild(win);

setTimeout(()=>{

win.remove();

},2000);

}

/* =========================================

STRIPS

========================================= */

function spawnStrip(){

const strip =

document.createElement("div");

strip.className =

"strip";

strip.style.left =

(Math.random()*80)+"vw";

strip.style.top =

(Math.random()*90)+"vh";

strip.style.width =

(100 + Math.random()*240)+"px";

chaos.appendChild(strip);

setTimeout(()=>{

strip.remove();

},700);

}

/* =========================================

SIGNAL LOST

========================================= */

function pulseSignal(){

signalLost.style.opacity =

.84;

signalLost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*8-4}px,

${Math.random()*6-3}px

)`;

setTimeout(()=>{

signalLost.style.opacity = 0;

},150);

}

/* =========================================

COLLAPSE

========================================= */

function collapse(){

chaos.style.opacity = 0;

setTimeout(()=>{

showSignal();

},1100);

}

/* =========================================

FINAL SIGNAL

========================================= */

function showSignal(){

signalSpace.style.opacity = 1;

signalSpace.style.pointerEvents =

"auto";

/* symbols */

outer.style.opacity = .16;

inner.style.opacity = .16;

/* reconnect */

reconnect.style.opacity = .76;

reconnect.classList.add(

"breathing"

);

/* dormant traces */

spawnDormantField();

}

/* =========================================

DORMANT FIELD

========================================= */

function spawnDormantField(){

signalField.style.opacity = 1;

for(let i=0;i<18;i++){

const t =

document.createElement("div");

t.className =

"trace";

t.style.width =

(40 + Math.random()*160)+"px";

t.style.left =

(Math.random()*100)+"vw";

t.style.top =

(Math.random()*100)+"vh";

t.style.opacity =

.08 + Math.random()*.08;

signalField.appendChild(t);

}

}

/* =========================================

RECONNECT

========================================= */

reconnect.addEventListener(

"click",

()=>{

/* remove reconnect */

reconnect.classList.remove(

"breathing"

);

reconnect.style.pointerEvents =

"none";

reconnect.style.opacity = 0;

/* ripple */

ripple.style.opacity = 1;

ripple.animate([

{

transform:"scale(.3)",

opacity:1

},

{

transform:"scale(1)",

opacity:1

},

{

transform:"scale(10)",

opacity:.18

},

{

transform:"scale(14)",

opacity:0

}

],{

duration:1800,

fill:"forwards",

easing:"ease-out"

});

/* wake traces */

document.querySelectorAll(".trace")

.forEach((t,i)=>{

setTimeout(()=>{

t.animate([

{

opacity:.08

},

{

opacity:.36

},

{

opacity:.12

}

],{

duration:1400

});

},i*40);

});

/* dissolve outer */

outer.style.opacity = 0;

outer.style.filter =

"blur(4px)";

outer.style.transform =

"scale(1.08)";

/* inner survives */

inner.style.opacity = .32;

/* reveal channels */

setTimeout(()=>{

channels.style.opacity = 1;

},700);

});

</script>

</body>

</html>
