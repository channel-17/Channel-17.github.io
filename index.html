<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CHANNEL 17</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

body{
  position:relative;
}

/* =========================
ATMOSPHERE
========================= */

#noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:99999;
  opacity:.035;
  mix-blend-mode:screen;
  background-image:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.035) 0px,
      rgba(255,255,255,.035) 1px,
      transparent 1px,
      transparent 4px
    );
  animation:noiseMove .06s linear infinite;
}

@keyframes noiseMove{
  to{transform:translateY(3px)}
}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999999;
  background:
    radial-gradient(
      circle,
      transparent 44%,
      rgba(0,0,0,.5) 72%,
      rgba(0,0,0,.98) 100%
    );
}

#flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:9000;
  mix-blend-mode:screen;
}

/* =========================
LOADER
========================= */

#loader{
  position:fixed;
  inset:0;
  z-index:3000;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:opacity .7s ease;
}

#bar{
  display:flex;
  gap:5px;
  width:min(58vw,320px);
  height:26px;
}

.segment{
  flex:1;
  border:1px solid rgba(255,255,255,.14);
  border-radius:4px;
  background:rgba(255,255,255,.025);
  box-shadow:inset 0 0 8px rgba(255,255,255,.02);
  transition:.12s ease;
}

.segment.active{
  background:rgba(255,255,255,.92);
  box-shadow:0 0 12px rgba(255,255,255,.12);
}

#percent{
  margin-top:16px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.22em;
  opacity:.58;
}

/* =========================
SMALL BLOCK TURTLE
========================= */

#turtleWrap{
  margin-top:36px;
  width:130px;
  height:82px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#turtle{
  position:relative;
  width:76px;
  height:48px;
  transform-origin:center;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.06));
}

.turtlePart{
  position:absolute;
  background:#fff;
}

.shell{
  left:23px;
  top:9px;
  width:38px;
  height:26px;
  border-radius:5px;
  box-shadow:
    inset -7px 0 0 rgba(0,0,0,.08),
    inset 0 -6px 0 rgba(0,0,0,.06);
}

.shell::before,
.shell::after{
  content:"";
  position:absolute;
  background:rgba(0,0,0,.18);
}

.shell::before{
  left:13px;
  top:4px;
  width:2px;
  height:19px;
}

.shell::after{
  left:5px;
  top:13px;
  width:28px;
  height:2px;
}

.shellLine{
  left:41px;
  top:11px;
  width:2px;
  height:24px;
  background:rgba(0,0,0,.12);
  transform:rotate(12deg);
  border-radius:2px;
}

.head{
  left:66px;
  top:15px;
  width:13px;
  height:13px;
  border-radius:4px;
}

.neck{
  left:59px;
  top:18px;
  width:10px;
  height:7px;
  border-radius:2px;
}

.eye{
  position:absolute;
  right:3px;
  top:3px;
  width:2px;
  height:2px;
  background:#000;
  opacity:.35;
}

.tail{
  left:12px;
  top:20px;
  width:0;
  height:0;
  background:transparent;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:11px solid #fff;
}

.leg1{
  left:31px;
  top:35px;
  width:8px;
  height:10px;
  border-radius:2px;
}

.leg2{
  left:51px;
  top:35px;
  width:8px;
  height:10px;
  border-radius:2px;
}

.walk{
  animation:turtleWalk 1s ease-in-out infinite;
}

@keyframes turtleWalk{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(2px,-2px)}
}

.look{
  animation:none;
  transform:scaleX(-1);
}

.gasp .head{transform:translateX(9px)}
.gasp .neck{transform:translateX(6px)}
.gasp .leg1{transform:translateY(2px)}
.gasp .leg2{transform:translateY(4px)}

.retract .head,
.retract .neck{
  transform:translateX(-25px);
  opacity:0;
}

.retract .leg1,
.retract .leg2{
  transform:translateY(-16px);
  opacity:0;
}

.retract .tail{
  transform:translateX(9px);
  opacity:0;
}

.retract .shell{
  transform:scale(1.08);
}

#turtle *{
  transition:.14s ease;
}

/* =========================
CORRUPTION
========================= */

#chaos{
  position:fixed;
  inset:0;
  z-index:5000;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}

.window{
  position:absolute;
  background:rgba(10,10,10,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 0 22px rgba(0,0,0,.72);
  opacity:0;
  animation:cascade linear forwards;
}

@keyframes cascade{
  0%{opacity:0;transform:translate(0,0) scale(.96)}
  10%{opacity:.92}
  78%{opacity:.72}
  100%{opacity:0;transform:translate(var(--mx),var(--my)) scale(1.03)}
}

.windowTop{
  height:28px;
  padding-left:12px;
  display:flex;
  align-items:center;
  font-size:11px;
  letter-spacing:.14em;
  background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.04);
  color:rgba(255,255,255,.48);
}

.windowBody{
  padding:12px;
  font-size:11px;
  line-height:1.6;
  color:rgba(255,255,255,.62);
}

.red{color:#ff4141}
.amber{color:#c8b86a}

.strip{
  position:absolute;
  height:14px;
  opacity:0;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(196,176,92,.24),
      transparent
    );
  animation:stripMove .7s linear forwards;
}

@keyframes stripMove{
  0%{opacity:0;transform:translateX(-30px)}
  20%{opacity:.72}
  100%{opacity:0;transform:translateX(70px)}
}

.screenWarning{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(16px,4vw,44px);
  letter-spacing:.26em;
  color:rgba(255,65,65,.78);
  background:rgba(0,0,0,.18);
  opacity:0;
  animation:screenWarning .65s ease forwards;
}

@keyframes screenWarning{
  0%{opacity:0}
  25%{opacity:.86}
  100%{opacity:0}
}

#signalLost{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:clamp(32px,6vw,74px);
  letter-spacing:.24em;
  opacity:0;
  text-shadow:0 0 14px rgba(255,255,255,.12);
}

/* =========================
FINAL SIGNAL
========================= */

#signalSpace{
  position:fixed;
  inset:0;
  z-index:8000;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.2s ease;
  display:flex;
  justify-content:center;
  align-items:center;
}

#signalCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  z-index:7600;
  pointer-events:none;
  transition:opacity 1.2s ease;
}

#outer,
#inner{
  position:absolute;
  opacity:0;
  transition:
    opacity 1.5s ease,
    filter 1.4s ease,
    transform 1.4s ease;
}

#outer{
  width:min(72vw,360px);
  filter:drop-shadow(0 0 8px rgba(255,255,255,.03));
  z-index:8000;
}

#inner{
  width:min(42vw,190px);
  filter:drop-shadow(0 0 10px rgba(255,255,255,.05));
  z-index:8100;
}

#reconnect{
  position:absolute;
  z-index:9000;
  font-size:clamp(18px,3vw,28px);
  letter-spacing:.34em;
  padding:42px;
  cursor:pointer;
  user-select:none;
  opacity:0;
  color:rgba(255,255,255,.76);
  transition:
    opacity .15s linear,
    transform .15s ease;
}

.breathing{
  animation:
    anxiousHeartbeat 5.8s ease-in-out forwards,
    calmHeartbeat 2.4s ease-in-out 5.8s infinite;
}

@keyframes anxiousHeartbeat{
  0%{opacity:.36;text-shadow:0 0 5px rgba(255,255,255,.03)}
  7%{opacity:1;text-shadow:0 0 28px rgba(255,255,255,.25)}
  15%{opacity:.42;text-shadow:0 0 7px rgba(255,255,255,.04)}
  28%{opacity:.96;text-shadow:0 0 24px rgba(255,255,255,.22)}
  40%{opacity:.48;text-shadow:0 0 8px rgba(255,255,255,.05)}
  57%{opacity:.88;text-shadow:0 0 19px rgba(255,255,255,.16)}
  72%{opacity:.56;text-shadow:0 0 10px rgba(255,255,255,.06)}
  100%{opacity:.72;text-shadow:0 0 14px rgba(255,255,255,.09)}
}

@keyframes calmHeartbeat{
  0%,100%{opacity:.62;text-shadow:0 0 10px rgba(255,255,255,.06)}
  42%{opacity:.84;text-shadow:0 0 17px rgba(255,255,255,.13)}
}

#channels{
  position:absolute;
  bottom:10vh;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  gap:16px;
  opacity:0;
  transition:opacity 1.8s ease;
  z-index:9200;
}

.channel{
  position:relative;
  font-size:15px;
  letter-spacing:.24em;
  color:rgba(255,255,255,.64);
  text-decoration:none;
  padding:10px 18px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.012);
  border-radius:6px;
  overflow:hidden;
  transition:.18s ease;
}

.channel:hover,
.channel:active{
  color:rgba(255,255,255,.92);
  border-color:rgba(255,210,140,.18);
  background:rgba(255,210,140,.03);
  box-shadow:0 0 14px rgba(255,186,92,.08);
}

.channel::after{
  content:"";
  position:absolute;
  left:-40%;
  top:0;
  width:30%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,210,140,.08),
      transparent
    );
  transform:skewX(-20deg);
  opacity:0;
}

.channel:hover::after,
.channel:active::after{
  animation:signalPass .8s linear;
}

@keyframes signalPass{
  0%{left:-40%;opacity:0}
  20%{opacity:1}
  100%{left:140%;opacity:0}
}
</style>
</head>

<body>

<div id="noise"></div>
<div id="flash"></div>

<div id="loader">
  <div id="bar"></div>
  <div id="percent">0%</div>

  <div id="turtleWrap">
    <div id="turtle" class="walk">
      <div class="turtlePart tail"></div>
      <div class="turtlePart shell"></div>
      <div class="turtlePart shellLine"></div>
      <div class="turtlePart neck"></div>
      <div class="turtlePart head"><div class="eye"></div></div>
      <div class="turtlePart leg1"></div>
      <div class="turtlePart leg2"></div>
    </div>
  </div>
</div>

<div id="chaos">
  <div id="signalLost">SIGNAL LOST</div>
</div>

<div id="signalSpace">
  <canvas id="signalCanvas"></canvas>

  <img id="outer" src="Outer17-final.png" />
  <img id="inner" src="Inner17-final.png" />

  <div id="reconnect">RECONNECT</div>

  <div id="channels">
    <a class="channel" href="#">LAST SESH</a>
    <a class="channel" href="#">ROACH TRAY</a>
    <a class="channel" href="#">PASS IT BACK</a>
  </div>
</div>

<div id="vignette"></div>

<script>
const bar = document.getElementById("bar");

for(let i = 0; i < 17; i++){
  const s = document.createElement("div");
  s.className = "segment";
  bar.appendChild(s);
}

const segments = document.querySelectorAll(".segment");
const percent = document.getElementById("percent");
const turtle = document.getElementById("turtle");
const loader = document.getElementById("loader");
const chaos = document.getElementById("chaos");
const flash = document.getElementById("flash");
const signalLost = document.getElementById("signalLost");
const signalSpace = document.getElementById("signalSpace");
const reconnect = document.getElementById("reconnect");
const outer = document.getElementById("outer");
const inner = document.getElementById("inner");
const channels = document.getElementById("channels");
const canvas = document.getElementById("signalCanvas");
const ctx = canvas.getContext("2d");

let load = 0;
let looked = false;
let gasped = false;
let retracted = false;

const loadLoop = setInterval(() => {
  load++;

  if(load > 17){
    load = 17;
  }

  segments.forEach((s,i) => {
    if(i < load){
      s.classList.add("active");
    }
  });

  percent.innerText = load + "%";

  if(load >= 15 && !looked){
    looked = true;
    microTwitch();

    setTimeout(() => {
      turtle.classList.remove("walk");
      turtle.classList.add("look");
    },120);
  }

  if(load >= 16 && !gasped){
    gasped = true;
    turtle.classList.add("gasp");
  }

  if(load >= 17 && !retracted){
    retracted = true;
    turtle.classList.remove("gasp");
    turtle.classList.add("retract");

    clearInterval(loadLoop);

    setTimeout(startChaos,1000);
  }
},260);

function microTwitch(){
  document.body.style.transform = "translateX(2px)";

  setTimeout(() => {
    document.body.style.transform = "translateX(0)";
  },40);
}

function startChaos(){
  loader.style.opacity = 0;

  setTimeout(() => {
    loader.style.display = "none";
  },700);

  chaos.style.opacity = 1;

  let stage = 0;

  const chaosLoop = setInterval(() => {
    stage++;

    for(let i = 0; i < Math.min(stage,5); i++){
      spawnWindow(stage);
    }

    if(stage > 5){
      spawnStrip();
    }

    if(stage === 8 || stage === 12){
      screenWarning();
    }

    if(stage > 7){
      pulseSignal();
    }

    if(stage > 8){
      pulseFlash();
    }

    if(stage >= 19){
      clearInterval(chaosLoop);
      collapse();
    }
  },185);
}

function spawnWindow(stage){
  const types = [
    {
      title:"identity",
      color:"red",
      headline:"TOO MANY ACTIVE MASKS",
      body:[
        "authentic signal buried",
        "identity loop active",
        "synthetic behavior detected"
      ]
    },
    {
      title:"download",
      color:"red",
      headline:"UNREQUESTED FILE STACK",
      body:[
        "plasticself.exe",
        "performative_identity.pkg",
        "human_input_lost.dat"
      ]
    },
    {
      title:"transmission",
      color:"amber",
      headline:"SIGNAL STILL ACTIVE",
      body:[
        "frequency surviving",
        "hidden packet received",
        "reconnect possible"
      ]
    },
    {
      title:"toxic stream",
      color:"amber",
      headline:"TRANSMISSION POISONED",
      body:[
        "M4SK NULL 5IGNAL",
        "17 17 17",
        "carrier wave unstable"
      ]
    }
  ];

  const data = types[Math.floor(Math.random() * types.length)];
  const win = document.createElement("div");

  win.className = "window";

  win.style.width = (220 + Math.random() * 240) + "px";
  win.style.height = (120 + Math.random() * 120) + "px";
  win.style.left = (Math.random() * 72) + "vw";
  win.style.top = (Math.random() * 70) + "vh";
  win.style.setProperty("--mx",(70 + Math.random() * 120) + "px");
  win.style.setProperty("--my",(50 + Math.random() * 120) + "px");
  win.style.animationDuration = (.95 + Math.random() * 1.05) + "s";

  if(stage > 10 && Math.random() > .5){
    win.style.filter = "blur(.35px)";
    win.style.transform = "skewX(" + ((Math.random() * 2) - 1) + "deg)";
  }

  win.innerHTML = `
    <div class="windowTop">${data.title}</div>
    <div class="windowBody">
      <div class="${data.color}">${data.headline}</div><br>
      <div>${data.body[0]}</div>
      <div>${data.body[1]}</div>
      <div>${data.body[2]}</div>
    </div>
  `;

  chaos.appendChild(win);

  setTimeout(() => {
    win.remove();
  },2300);
}

function spawnStrip(){
  const strip = document.createElement("div");

  strip.className = "strip";
  strip.style.left = (Math.random() * 80) + "vw";
  strip.style.top = (Math.random() * 90) + "vh";
  strip.style.width = (100 + Math.random() * 260) + "px";

  chaos.appendChild(strip);

  setTimeout(() => {
    strip.remove();
  },700);
}

function screenWarning(){
  const warn = document.createElement("div");

  warn.className = "screenWarning";
  warn.innerText =
    Math.random() > .5
      ? "SIGNAL SUPPRESSED"
      : "AUTHENTICITY FAILURE";

  chaos.appendChild(warn);

  setTimeout(() => {
    warn.remove();
  },700);
}

function pulseSignal(){
  signalLost.style.opacity = .84;

  signalLost.style.transform =
    `translate(-50%,-50%) translate(${Math.random()*8-4}px,${Math.random()*6-3}px)`;

  setTimeout(() => {
    signalLost.style.opacity = 0;
  },150);
}

function pulseFlash(){
  flash.style.opacity = Math.random() * .12;

  setTimeout(() => {
    flash.style.opacity = 0;
  },38);
}

function collapse(){
  chaos.style.opacity = 0;

  setTimeout(showSignal,1200);
}

function showSignal(){
  signalSpace.style.opacity = 1;
  signalSpace.style.pointerEvents = "auto";

  outer.style.opacity = .16;
  inner.style.opacity = .16;

  reconnect.style.opacity = .76;
  reconnect.classList.add("breathing");

  resizeCanvas();
  drawDormantSignal();
}

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize",resizeCanvas);

let rippleActive = false;
let rippleStart = 0;
let dormantTick = 0;
let touchX = 0;
let touchY = 0;

function drawDormantSignal(){
  if(rippleActive){
    return;
  }

  canvas.style.opacity = .14;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  dormantTick += .012;

  const centerY = canvas.height * .5;

  for(let i = 0; i < 18; i++){
    const y = centerY + (i - 9) * 15 + Math.sin(dormantTick + i) * 4;

    ctx.beginPath();
    ctx.strokeStyle = `rgba(255,190,100,${.018 + (i % 3) * .008})`;
    ctx.lineWidth = 1;

    for(let x = canvas.width * .06; x < canvas.width * .94; x += 10){
      const yy =
        y +
        Math.sin(x * .016 + dormantTick * 7 + i) * 2.8;

      if(x === canvas.width * .06){
        ctx.moveTo(x,yy);
      }else{
        ctx.lineTo(x,yy);
      }
    }

    ctx.stroke();
  }

  requestAnimationFrame(drawDormantSignal);
}

reconnect.addEventListener("pointerdown",(e) => {
  const rect = canvas.getBoundingClientRect();

  touchX = e.clientX - rect.left;
  touchY = e.clientY - rect.top;

  reconnect.classList.remove("breathing");
  reconnect.style.pointerEvents = "none";

  reconnect.animate([
    {transform:"scale(1)",opacity:.9},
    {transform:"scale(.965)",opacity:.66},
    {transform:"scale(1.02)",opacity:0}
  ],{
    duration:260,
    fill:"forwards",
    easing:"ease-out"
  });

  if(navigator.vibrate){
    navigator.vibrate([45,35,85]);
  }

  setTimeout(() => {
    rippleActive = true;
    rippleStart = performance.now();
    canvas.style.opacity = 1;
    inner.style.opacity = .3;
    animateLivingTouch();
  },190);

  setTimeout(() => {
    outer.style.opacity = 0;
    outer.style.filter = "blur(4px)";
    outer.style.transform = "scale(1.08)";
  },1300);

  setTimeout(() => {
    channels.style.opacity = 1;
  },2400);
});

function animateLivingTouch(){
  const now = performance.now();
  const t = (now - rippleStart) / 3600;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const cx = touchX || canvas.width / 2;
  const cy = touchY || canvas.height / 2;

  const reach = Math.max(canvas.width,canvas.height) * 1.05;
  const waveFront = t * reach;

  for(let i = 0; i < 34; i++){
    const baseY =
      canvas.height * .5 +
      (i - 17) * 11 +
      Math.sin(i * .6 + t * 6) * 22;

    ctx.beginPath();

    const alpha = Math.max(0,.23 - t * .14);
    ctx.strokeStyle = `rgba(255,190,100,${alpha})`;
    ctx.lineWidth = 1;

    for(let x = canvas.width * .04; x < canvas.width * .96; x += 8){
      const dx = x - cx;
      const dy = baseY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);

      const contact = Math.max(0,1 - Math.abs(dist - waveFront) / 160);
      const livingDrift = Math.sin(x * .018 + i * .8 + t * 14) * 5;
      const touchedPull = Math.sin(dist * .035 - t * 18) * 18 * contact;

      const y = baseY + livingDrift + touchedPull;

      if(x === canvas.width * .04){
        ctx.moveTo(x,y);
      }else{
        ctx.lineTo(x,y);
      }
    }

    ctx.stroke();
  }

  const glow = ctx.createRadialGradient(
    cx,cy,0,
    cx,cy,Math.max(60,waveFront * .35)
  );

  glow.addColorStop(0,`rgba(255,200,120,${Math.max(0,.18-t*.12)})`);
  glow.addColorStop(.45,`rgba(255,160,70,${Math.max(0,.055-t*.04)})`);
  glow.addColorStop(1,"rgba(255,160,70,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  if(t < 1){
    requestAnimationFrame(animateLivingTouch);
  }else{
    rippleActive = false;
    canvas.style.opacity = .2;
    drawDormantSignal();
  }
}
