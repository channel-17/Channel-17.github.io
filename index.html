<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New;
color:white;
}

.screen{
position:relative;
width:100%;
height:100%;
background:black;
overflow:hidden;
}



/* GLITCH /

.glitch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

opacity:.05;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.08) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

animation:glitch 2s ease;
}

@keyframes glitch{

0%{
opacity:1;
left:-30px;
}

50%{
opacity:.2;
left:20px;
}

100%{
opacity:.05;
left:0px;
}

}



/ TRIANGLE /

.triangle{
position:absolute;

top:50%;
left:50%;

margin-left:-100px;
margin-top:-140px;

width:0;
height:0;

border-left:100px solid transparent;
border-right:100px solid transparent;
border-bottom:180px solid rgba(255,255,255,.06);
}



/ SYMBOL /

.symbol{
position:absolute;

top:50%;
left:50%;

margin-left:-70px;
margin-top:-40px;

font-size:80px;

opacity:.04;
}



/ SIGNAL /

.signal{
position:absolute;

width:100%;
text-align:center;

bottom:28%;

font-size:12px;

letter-spacing:6px;

opacity:.6;
}



/ RECONNECT /

.reconnect{
position:absolute;

width:100%;
text-align:center;

bottom:21%;

font-size:15px;

letter-spacing:8px;

opacity:.85;

cursor:pointer;
}



/ EMBER /

.ember{
position:absolute;

width:8px;
height:8px;

border-radius:50%;

opacity:0;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,140,70,.7) 40%,
transparent 100%
);

box-shadow:
0 0 8px rgba(255,120,50,.4);
}



/ FREQUENCY */

.frequency{
position:absolute;

left:25px;
bottom:30px;

opacity:0;
}

.frequency div{

margin-top:10px;

font-size:10px;

letter-spacing:4px;

opacity:.7;
}

.show{
opacity:1;
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch"></div>

<div class="triangle"></div>

<div class="symbol" id="symbol">
.17
</div>

<div class="signal" id="signal">
signal lost
</div>

<div class="reconnect" id="reconnect">
reconnect
</div>

<div class="frequency" id="frequency">

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass it Back</div>

</div>

<div class="ember" id="ember"></div>

</div>

<script>

var reconnect =
document.getElementById("reconnect");

var signal =
document.getElementById("signal");

var ember =
document.getElementById("ember");

var frequency =
document.getElementById("frequency");

var symbol =
document.getElementById("symbol");



reconnect.onclick=function(e){

signal.style.opacity="0";

reconnect.style.opacity="0";

ember.style.left=e.clientX+"px";

ember.style.top=e.clientY+"px";

ember.style.opacity="1";

ember.animate([

{
transform:"scale(.5)",
opacity:1
},

{
transform:"scale(6)",
opacity:.03
}

],{

duration:4000,
fill:"forwards"

});

setTimeout(function(){

symbol.style.opacity=".15";

},700);

setTimeout(function(){

frequency.className="frequency show";

},2200);

};

</script>

</body>
</html>
