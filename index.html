<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
color:white;
}



/* MAIN SCREEN /

.screen{
position:relative;
width:100%;
height:100vh;
background:black;
overflow:hidden;
}



/ GLITCH /

.glitch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.08) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

opacity:0;

pointer-events:none;

animation:
glitchFlash 2s ease forwards;

z-index:30;
}

@keyframes glitchFlash{

0%{
opacity:0;
}

10%{
opacity:1;
transform:translateX(-20px);
}

20%{
opacity:.2;
}

35%{
opacity:1;
transform:translateX(15px);
}

50%{
opacity:0;
}

100%{
opacity:.04;
}

}



/ SYMBOL /

.symbol{
position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

font-size:7rem;

letter-spacing:12px;

opacity:.06;

z-index:5;

transition:4s ease;
}



/ TRIANGLE /

.triangle{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:0;
height:0;

border-left:120px solid transparent;
border-right:120px solid transparent;
border-bottom:210px solid rgba(255,255,255,.08);

opacity:.3;

z-index:4;

transition:4s ease;
}



/ SIGNAL /

.signal{
position:absolute;

bottom:28%;

left:50%;

transform:translateX(-50%);

font-size:.75rem;

letter-spacing:7px;

opacity:.65;

z-index:10;
}



/ RECONNECT /

.reconnect{
position:absolute;

bottom:22%;

left:50%;

transform:translateX(-50%);

font-size:.9rem;

letter-spacing:8px;

opacity:.9;

cursor:pointer;

z-index:12;
}



/ EMBER /

.ember{
position:absolute;

width:12px;
height:12px;

border-radius:50%;

opacity:0;

pointer-events:none;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,140,70,.95) 30%,
rgba(255,70,20,.45) 60%,
transparent 100%
);

box-shadow:
0 0 18px rgba(255,120,50,.9),
0 0 42px rgba(255,70,20,.5);

z-index:25;
}



/ FREQUENCY /

.frequency{
position:absolute;

left:7vw;
bottom:7vh;

opacity:0;

z-index:15;

transition:3s ease;
}

.frequency div{

margin-top:10px;

font-size:.62rem;

letter-spacing:4px;

opacity:.7;
}

.frequency.show{
opacity:1;
}



/ REVEAL */

.symbol.awaken{
opacity:.18;
}

.triangle.fade{
opacity:.04;
filter:blur(6px);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch"></div>

<div class="triangle" id="triangle"></div>

<div class="symbol" id="symbol">
.17
</div>

<div class="signal" id="signal">
signal lost
</div>

<div class="reconnect" id="reconnect">
reconnect
</div>

<div class="frequency" id="frequency">

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass One Back</div>

</div>

<div class="ember" id="ember"></div>

</div>

<script>

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");

const symbol =
document.getElementById("symbol");

const triangle =
document.getElementById("triangle");



reconnect.addEventListener("click",(e)=>{

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";

ember.style.opacity="1";



ember.animate([

{
transform:"translate(-50%,-50%) scale(.2)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(18)",
opacity:.02
}

],{

duration:5000,
fill:"forwards",
easing:"ease-out"

});



setTimeout(()=>{

symbol.classList.add("awaken");

triangle.classList.add("fade");

},500);



setTimeout(()=>{

frequency.classList.add("show");

},2200);

});

</script>

</body>
</html>
