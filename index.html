<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" href="Signal17.png?v=17">

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
font-family:"Courier New", monospace;
height:100vh;
width:100vw;
color:#d8d2c8;
}



/ MAIN /

.screen{
position:relative;
width:100%;
height:100vh;
overflow:hidden;

background:
radial-gradient(
circle at center,
rgba(12,12,12,.92) 0%,
#000 76%
);

}



/ STATIC /

.glitch{
position:absolute;
inset:-10%;
opacity:0;
pointer-events:none;
z-index:999;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.16) 0px,
rgba(255,255,255,.16) 2px,
transparent 3px,
transparent 7px
),

repeating-linear-gradient(
90deg,
rgba(255,255,255,.06) 0px,
rgba(255,255,255,.06) 1px,
transparent 2px,
transparent 6px
);

mix-blend-mode:screen;
}

.glitch.active{
animation:violentGlitch 1.5s steps(2) forwards;
}

@keyframes violentGlitch{

0%{
opacity:0;
}

10%{
opacity:1;
transform:
translateX(-40px)
skewX(16deg);
}

22%{
opacity:0;
}

36%{
opacity:1;
transform:
translateX(28px)
skewX(-10deg);
}

52%{
opacity:0;
}

72%{
opacity:.7;
transform:
translateY(-6px)
scale(1.02);
}

100%{
opacity:0;
transform:none;
}

}



/ SYMBOL /

.symbol-wrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:250px;
height:250px;
}

.outer-symbol,
.inner-symbol{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
}

.outer-symbol{
filter:
blur(1px)
brightness(.4);
}

.outer-symbol.visible{
animation:outerReveal 4s ease forwards;
}

.inner-symbol.visible{
animation:innerReveal 4s ease forwards;
}

@keyframes outerReveal{

0%{
opacity:0;
filter:
blur(14px)
brightness(.04);
}

100%{
opacity:.34;
filter:
blur(1px)
brightness(.5);
}

}

@keyframes innerReveal{

0%{
opacity:0;
filter:
blur(18px)
brightness(.2);
transform:scale(.94);
}

100%{
opacity:1;
filter:none;
transform:scale(1);
}

}



/ SIGNAL LOST /

.signal-line{
position:absolute;
top:73%;
left:50%;
transform:translateX(-50%);

letter-spacing:8px;
font-size:.95rem;

opacity:0;
color:#cfc7bb;
}

.signal-line.active{
animation:signalFlicker 3s ease forwards;
}

@keyframes signalFlicker{

0%{
opacity:0;
filter:blur(8px);
letter-spacing:18px;
}

25%{
opacity:.14;
}

50%{
opacity:.05;
}

75%{
opacity:.8;
letter-spacing:8px;
}

100%{
opacity:.7;
filter:none;
letter-spacing:8px;
}

}



/ RECONNECT /

.reconnect{
position:absolute;

top:73%;
left:50%;

transform:translateX(-50%);

letter-spacing:8px;
font-size:.95rem;

opacity:0;
cursor:pointer;
color:#ddd5ca;
}

.reconnect.live{
animation:reconnectPulse 2.8s ease infinite;
}

@keyframes reconnectPulse{

0%{
opacity:.08;
}

50%{
opacity:1;

text-shadow:
0 0 10px rgba(255,255,255,.18);

}

100%{
opacity:.08;
}

}



/ EMBER /

.ember{
position:absolute;

top:73%;
left:50%;

width:12px;
height:12px;

border-radius:50%;

opacity:0;
pointer-events:none;

transform:
translate(-50%,-50%)
scale(.2);

background:
radial-gradient(
circle,
rgba(255,170,80,.95) 0%,
rgba(255,120,50,.7) 30%,
rgba(255,70,20,.25) 60%,
transparent 100%
);

box-shadow:
0 0 12px rgba(255,120,40,.4);

}

.ember.active{
animation:emberPulse 5s ease forwards;
}

@keyframes emberPulse{

0%{
opacity:0;
transform:
translate(-50%,-50%)
scale(.2);
}

10%{
opacity:1;
}

25%{
transform:
translate(-50%,-50%)
scale(1);
}

100%{
opacity:.22;

transform:
translate(-50%,-50%)
scale(18);
}

}



/ OUTER INTERFERENCE /

.outer-symbol.dissolve{
animation:signalBreakdown 4s ease forwards;
}

@keyframes signalBreakdown{

0%{
opacity:.34;
}

100%{
opacity:0;

filter:
blur(22px)
brightness(.08);

}

}



/ TRUE SIGNAL /

.inner-symbol.stable{
animation:signalStabilize 3s ease forwards;
}

@keyframes signalStabilize{

0%{
filter:brightness(1);
}

100%{

opacity:.16;

filter:
brightness(1.08);

}

}



/ FREQUENCY ARCS /

.frequency-zone{
position:absolute;

bottom:8vh;
left:8vw;

display:flex;
flex-direction:column;

gap:18px;

opacity:0;
pointer-events:none;

z-index:50;
}

.frequency-zone.awake{
animation:frequencyReveal 3s ease forwards;
}

@keyframes frequencyReveal{

0%{
opacity:0;
transform:translateY(8px);
}

100%{
opacity:1;
transform:translateY(0px);
}

}

.frequency-link{
font-size:.72rem;

letter-spacing:3px;

opacity:.65;

cursor:pointer;

transition:.3s ease;
}

.frequency-link:hover{
opacity:1;

text-shadow:
0 0 8px rgba(255,220,160,.12);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch" id="glitch"></div>

<div class="symbol-wrap">

<img
src="Outer17-final.png"
class="outer-symbol"
id="outerSymbol"
/>

<img
src="Inner17-final.png"
class="inner-symbol"
id="innerSymbol"
/>

</div>

<div
class="signal-line"
id="signalLine"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

<div
class="ember"
id="ember"
></div>

<div
class="frequency-zone"
id="frequencyZone"
>

<div class="frequency-link">
Latest Sesh
</div>

<div class="frequency-link">
Roach Tray
</div>

<div class="frequency-link">
Pass One Back
</div>

</div>

</div>

<script>

const glitch =
document.getElementById("glitch");

const outerSymbol =
document.getElementById("outerSymbol");

const innerSymbol =
document.getElementById("innerSymbol");

const signalLine =
document.getElementById("signalLine");

const reconnect =
document.getElementById("reconnect");

const ember =
document.getElementById("ember");

const frequencyZone =
document.getElementById("frequencyZone");



/ STATIC /

setTimeout(() => {

glitch.classList.add("active");

}, 300);



/ SYMBOL /

setTimeout(() => {

outerSymbol.classList.add("visible");

innerSymbol.classList.add("visible");

}, 1700);



/ SIGNAL LOST /

setTimeout(() => {

signalLine.classList.add("active");

}, 5200);



/ REMOVE SIGNAL LOST /

setTimeout(() => {

signalLine.style.display = "none";

}, 8600);



/ RECONNECT /

setTimeout(() => {

reconnect.classList.add("live");

reconnect.style.opacity = "1";

}, 9300);



/ TOUCH */

reconnect.addEventListener("click", () => {

reconnect.classList.remove("live");



ember.classList.add("active");



outerSymbol.classList.add("dissolve");



innerSymbol.classList.add("stable");



setTimeout(() => {

reconnect.style.display = "none";

frequencyZone.classList.add("awake");

}, 1700);

});

</script>

</body>

</html>
