<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>CHANNEL 17</title>

<style>

body{

    margin:0;

    background:black;

    overflow:hidden;

    font-family:Arial, sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    color:#d8d2bf;

}

.container{

    text-align:center;

    position:relative;

}

.symbol{

    width:180px;

    opacity:0;

    animation:fadeIn 4s ease forwards;

    filter:drop-shadow(0 0 8px rgba(255,255,255,.08));

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:scale(.98);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

.signal-text{

    margin-top:28px;

    font-size:18px;

    letter-spacing:8px;

    min-height:24px;

    text-align:left;

    width:320px;

    margin-left:auto;

    margin-right:auto;

    opacity:.92;

}

.reconnect{

    margin-top:30px;

    opacity:0;

    transition:opacity 2s ease;

}

.reconnect button{

    background:none;

    border:1px solid rgba(216,210,191,.35);

    color:#d8d2bf;

    padding:10px 22px;

    letter-spacing:4px;

    font-size:12px;

    cursor:pointer;

    transition:.4s ease;

}

.reconnect button:hover{

    background:rgba(216,210,191,.08);

    border-color:#d8d2bf;

}

.glitch{

    animation:glitch .18s linear;

}

@keyframes glitch{

    0%{

        transform:translate(0px,0px);

        opacity:1;

    }

    20%{

        transform:translate(-1px,1px);

    }

    40%{

        transform:translate(1px,-1px);

    }

    60%{

        transform:translate(-1px,0px);

        opacity:.85;

    }

    100%{

        transform:translate(0px,0px);

        opacity:1;

    }

}

/* WALL ANIMATION */

.wall{

    transition:2.8s ease;

    transform-origin:center;

}

.symbol.open .left-wall{

    transform:translate(-55px,-10px);

    opacity:0;

}

.symbol.open .right-wall{

    transform:translate(55px,-10px);

    opacity:0;

}

.symbol.open .bottom-wall{

    transform:translateY(45px);

    opacity:0;

}

.center-bars{

    transition:1.8s ease;

}

.symbol.open .center-bars{

    opacity:1;

    filter:brightness(1.15);

}

.hidden{

    display:none;

}

</style>

</head>

<body>

<div class="container">

<svg class="symbol" id="symbol" viewBox="0 0 300 300">

    <!-- LEFT WALL -->

    <line class="wall left-wall"

          x1="60" y1="240"

          x2="150" y2="60"

          stroke="#d8d2bf"

          stroke-width="6"/>

    <!-- RIGHT WALL -->

    <line class="wall right-wall"

          x1="150" y1="60"

          x2="240" y2="240"

          stroke="#d8d2bf"

          stroke-width="6"/>

    <!-- BOTTOM WALL -->

    <line class="wall bottom-wall"

          x1="60" y1="240"

          x2="240" y2="240"

          stroke="#d8d2bf"

          stroke-width="6"/>

    <!-- CENTER -->

    <g class="center-bars">

        <rect x="118" y="95" width="12" height="110"

              rx="6" fill="#d8d2bf"/>

        <rect x="142" y="110" width="12" height="95"

              rx="6" fill="#d8d2bf"

              opacity=".85"/>

        <rect x="166" y="125" width="12" height="80"

              rx="6" fill="#d8d2bf"

              opacity=".65"/>

        <circle cx="92" cy="165" r="5"

                fill="#d8d2bf"/>

        <circle cx="92" cy="190" r="5"

                fill="#d8d2bf"

                opacity=".8"/>

    </g>

</svg>

<div class="signal-text" id="signal"></div>

<div class="reconnect" id="reconnectBox">

    <button onclick="reconnect()">RECONNECT</button>

</div>

</div>

<script>

const text = "SIGNAL LOST...";

const signal = document.getElementById("signal");

let i = 0;

function typeSignal(){

    if(i < text.length){

        signal.innerHTML += text.charAt(i);

        if(Math.random() > .72){

            signal.classList.add("glitch");

            setTimeout(()=>{

                signal.classList.remove("glitch");

            },120);

        }

        i++;

        setTimeout(typeSignal, 140);

    } else {

        setTimeout(()=>{

            document.getElementById("reconnectBox").style.opacity = 1;

        },900);

    }

}

setTimeout(typeSignal, 4200);

function reconnect(){

    const symbol = document.getElementById("symbol");

    symbol.classList.add("open");

    document.getElementById("reconnectBox").style.opacity = 0;

    setTimeout(()=>{

        signal.innerHTML = "RECONNECTED";

    },1800);

}

</script>

</body>

</html>
