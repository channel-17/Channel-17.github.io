<style>

*{

}

html,body{

height:100%;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

z-index:1;

}

/* =========================================

STATIC GRAIN

========================================= */

#grain{

position:fixed;

inset:0;

z-index:2;

pointer-events:none;

opacity:.05;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 4px

);

animation:

grain .05s linear infinite;

}

@keyframes grain{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(4px);

}

}

/* =========================================

GLITCH CHAOS

========================================= */

#glitch{

position:fixed;

inset:0;

pointer-events:none;

z-index:6;

mix-blend-mode:screen;

}

.glitchBar{

position:absolute;

background:

rgba(255,255,255,.16);

opacity:0;

animation:

glitchBar .08s linear;

}

@keyframes glitchBar{

0%{

opacity:0;

}

50%{

opacity:1;

}

100%{

opacity:0;

}

}

/* =========================================

WHITE SIGNAL CHAOS

========================================= */

#signalNoise{

pointer-events:none;

z-index:5;

opacity:0;

mix-blend-mode:screen;

}

.signalLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

signalMove linear infinite;

}

@keyframes signalMove{

0%{

transform:translateX(-100px);

opacity:.02;

}

50%{

opacity:.42;

}

100%{

transform:translateX(100px);

opacity:.02;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

left:50%;

40%{

65%{

opacity:.94;

transform:

translateX(-50%)

translateY(2px)

skewX(2deg);

}

100%{

opacity:.03;

}

}

SYMBOL

#symbolWrap.visible{

RECONNECT

========================================= */

#reconnect{

@keyframes reconnectPulse{

50%{

0 0 18px rgba(255,180,90,.22),

THUMBPRINT STAIN

========================================= */

#stain{

z-index:3;

transparent 18%

BACKGROUND WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

radial-gradient(circle at center,

transparent 60%

);

opacity:0;

pointer-events:none;

transition:

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:

6s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

ETCHINGS

========================================= */

6s ease;

rotate(-4deg);

CONNECTED
