<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<!-- favicon -->

<link rel="icon" type="image/png" href="mark17.png"/>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    background:#000;

    overflow:hidden;

    width:100vw;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

    color:#d8d1c2;

}

/* MAIN WRAP */

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:28px;

    opacity:0;

    animation:symbolFade 2.5s ease forwards;

    animation-delay:3.5s;

}

/* SYMBOL */

.symbol{

    width:220px;

    opacity:.92;

    filter:

        drop-shadow(0 0 4px rgba(255,245,220,.08))

        drop-shadow(0 0 10px rgba(255,245,220,.05));

}

/* GLITCH FLASH */

.glitchFlash{

    animation:flash .16s linear 2;

}

@keyframes flash{

    0%{ transform:translateX(0px); filter:brightness(1);}

    20%{ transform:translateX(-4px); filter:brightness(2);}

    40%{ transform:translateX(5px); filter:brightness(.3);}

    60%{ transform:translateX(-2px);}

    100%{ transform:translateX(0px);}

}

/* TEXT AREA */

.textWrap{

    height:40px;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

}

#lineText{

    font-size:1.25rem;

    letter-spacing:.55rem;

    color:#cfc5b3;

    opacity:0;

    white-space:nowrap;

}

/* reconnect */

#reconnect{

    position:absolute;

    font-size:1.15rem;

    letter-spacing:.55rem;

    color:#8f8778;

    opacity:0;

    cursor:pointer;

    transition:opacity .8s ease;

    user-select:none;

}

#reconnect.live{

    animation:pulse 2.2s ease-in-out infinite;

}

@keyframes pulse{

    0%{

        opacity:.28;

        text-shadow:0 0 0px rgba(255,255,255,0);

    }

    50%{

        opacity:.9;

        text-shadow:0 0 10px rgba(255,255,255,.18);

    }

    100%{

        opacity:.28;

        text-shadow:0 0 0px rgba(255,255,255,0);

    }

}

/* dissolve ONLY border lines */

.symbol.dissolve{

    animation:borderFade 3.5s ease forwards;

}

@keyframes borderFade{

    0%{

        mask-image:linear-gradient(to right, white 100%, transparent 100%);

        -webkit-mask-image:linear-gradient(to right, white 100%, transparent 100%);

    }

    100%{

        mask-image:linear-gradient(to right,

        transparent 0%,

        transparent 24%,

        white 38%,

        white 63%,

        transparent 76%,

        transparent 100%);

        

        -webkit-mask-image:linear-gradient(to right,

        transparent 0%,

        transparent 24%,

        white 38%,

        white 63%,

        transparent 76%,

        transparent 100%);

    }

}

@keyframes symbolFade{

    from{

        opacity:0;

        transform:translateY(8px);

    }

    to{

        opacity:1;

        transform:translateY(0px);

    }

}

</style>

</head>

<body>

<div class="container" id="container">

    <img src="mark17.png" class="symbol" id="symbol">

    <div class="textWrap">

        <div id="lineText"></div>

        <div id="reconnect">reconnect</div>

    </div>

</div>

<script>

const lineText = document.getElementById("lineText");

const reconnect = document.getElementById("reconnect");

const symbol = document.getElementById("symbol");

const phrase = "signal lost";

const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

async function typeSignal(){

    /* symbol glitch */

    await sleep(900);

    symbol.classList.add("glitchFlash");

    await sleep(300);

    /* type phrase */

    lineText.style.opacity = 1;

    let current = "";

    for(let i=0;i<phrase.length;i++){

        current += phrase[i];

        lineText.innerHTML = current;

        await sleep(120);

    }

    await sleep(500);

    /* dots cycle */

    for(let cycle=0; cycle<3; cycle++){

        lineText.innerHTML = phrase;

        await sleep(250);

        lineText.innerHTML = phrase + ".";

        await sleep(320);

        lineText.innerHTML = phrase + "..";

        await sleep(320);

        lineText.innerHTML = phrase + "...";

        await sleep(520);

    }

    /* fade out dots first */

    lineText.innerHTML = phrase;

    await sleep(300);

    /* fade whole line */

    lineText.style.transition = "opacity .9s ease";

    lineText.style.opacity = 0;

    await sleep(1200);

    /* reconnect fades in slowly */

    reconnect.style.opacity = ".45";

    await sleep(800);

    reconnect.classList.add("live");

}

/* reconnect click */

reconnect.addEventListener("click", async()=>{

    reconnect.classList.remove("live");

    reconnect.style.opacity = "1";

    symbol.classList.add("dissolve");

});

/* start */

typeSignal();

</script>

</body>

</html>
