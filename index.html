
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" href="Signal17.png?v=17">

<link rel="shortcut icon" href="Signal17.png?v=17">

<link rel="apple-touch-icon" sizes="180x180" href="Beacon17.png">

<style>

/* ===================================================== */

/* RESET */

/* ===================================================== */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  background:#000;

  overflow:hidden;

  width:100vw;

  height:100vh;

  font-family:"Courier New", monospace;

  color:#d8d2c8;

}

/* ===================================================== */

/* MAIN SCREEN */

/* ===================================================== */

.screen{

  position:relative;

  width:100%;

  height:100vh;

  overflow:hidden;

  display:flex;

  justify-content:center;

  align-items:center;

  background:#000;

}

/* ===================================================== */

/* TIMING CONTROLS */

/* ===================================================== */

/*

CHANGE THESE LATER

WITHOUT TOUCHING ANYTHING ELSE

*/

:root{

  --glitch-start: .3s;

  --symbol-start: 1.2s;

  --signal-start: 5.3s;

  --signal-end: 8.5s;

  --reconnect-start: 9.8s;

}

/* ===================================================== */

/* OPENING GLITCH */

/* ===================================================== */

.glitch{

  position:fixed;

  inset:-5%;

  opacity:0;

  pointer-events:none;

  z-index:9999;

  background:

  repeating-linear-gradient(

    0deg,

    rgba(255,255,255,.16) 0px,

    rgba(255,255,255,.16) 2px,

    transparent 3px,

    transparent 7px

  );

  mix-blend-mode:screen;

  filter:

  blur(1.8px)

  contrast(2.8)

  brightness(2.6);

}

.glitch.active{

  animation:violentGlitch 1.1s steps(2) forwards;

}

@keyframes violentGlitch{

  0%{

    opacity:0;

    transform:scale(1);

  }

  8%{

    opacity:1;

    transform:

    translateX(-38px)

    skewX(18deg)

    scale(1.02);

  }

  15%{

    opacity:.2;

  }

  22%{

    opacity:1;

    transform:

    translateX(24px)

    skewX(-14deg)

    scale(1.01);

  }

  35%{

    opacity:0;

  }

  44%{

    opacity:.9;

    transform:

    translateY(-12px)

    skewY(5deg);

  }

  60%{

    opacity:.2;

  }

  72%{

    opacity:.8;

    transform:

    translateX(12px)

    scale(1.01);

  }

  100%{

    opacity:0;

    transform:none;

  }

}

/* ===================================================== */

/* SYMBOL */

/* ===================================================== */

.symbol-wrap{

  position:relative;

  width:260px;

  height:260px;

}

.outer-symbol,

.inner-symbol{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  opacity:0;

}

.inner-symbol{

  z-index:1;

  animation:

  symbolRise 4.8s ease-out forwards;

  animation-delay:var(--symbol-start);

}

.outer-symbol{

  z-index:2;

  animation:

  symbolRise 4.8s ease-out forwards;

  animation-delay:var(--symbol-start);

}

@keyframes symbolRise{

  0%{

    opacity:0;

    transform:scale(.92);

    filter:

    blur(18px)

    brightness(.2);

  }

  40%{

    opacity:.16;

  }

  65%{

    opacity:.42;

    filter:

    blur(3px)

    brightness(.7);

  }

  100%{

    opacity:1;

    transform:scale(1);

    filter:none;

  }

}

/* ===================================================== */

/* QUICK SIGNAL TEAR */

/* ===================================================== */

.signal-tear{

  position:absolute;

  left:0;

  top:48%;

  width:100%;

  height:12px;

  background:#000;

  opacity:0;

  z-index:100;

}

.signal-tear.active{

  animation:

  tearFlash .14s linear forwards;

}

@keyframes tearFlash{

  0%{

    opacity:0;

    transform:translateX(-100%);

  }

  35%{

    opacity:1;

  }

  100%{

    opacity:0;

    transform:translateX(100%);

  }

}

/* ===================================================== */

/* TEXT ZONE */

/* ===================================================== */

.text-zone{

  position:absolute;

  left:50%;

  top:69%;

  transform:translateX(-50%);

  width:320px;

  height:80px;

  text-align:center;

}

/* ===================================================== */

/* SIGNAL LOST */

/* ===================================================== */

.signal-line{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  white-space:nowrap;

  opacity:0;

  font-size:1.15rem;

  letter-spacing:10px;

  color:#c2bcaf;

}

.signal-line.live{

  animation:

  signalResolve 2.2s ease-out forwards;

}

@keyframes signalResolve{

  0%{

    opacity:0;

    filter:

    blur(8px);

    letter-spacing:18px;

    transform:

    translate(-50%,-50%)

    translateX(-10px);

  }

  22%{

    opacity:.18;

  }

  38%{

    opacity:.42;

    transform:

    translate(-50%,-50%)

    translateX(3px);

  }

  56%{

    opacity:.25;

    filter:

    blur(2px);

  }

  72%{

    opacity:.7;

    letter-spacing:10px;

  }

  100%{

    opacity:.9;

    filter:none;

    letter-spacing:8px;

    transform:

    translate(-50%,-50%);

  }

}

/* ===================================================== */

/* RECONNECT */

/* ===================================================== */

.reconnect{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  opacity:0;

  cursor:pointer;

  user-select:none;

  white-space:nowrap;

  font-size:1.1rem;

  letter-spacing:8px;

  color:#d8d2c8;

}

.reconnect.live{

  animation:

  reconnectPulse 2.6s ease-in-out infinite;

}

@keyframes reconnectPulse{

  0%{

    opacity:.08;

    text-shadow:none;

  }

  50%{

    opacity:1;

    text-shadow:

    0 0 12px rgba(255,255,255,.22),

    0 0 24px rgba(255,255,255,.08);

  }

  100%{

    opacity:.12;

    text-shadow:none;

  }

}

/* ===================================================== */

/* OUTER WALL DISSOLVE */

/* ===================================================== */

.outer-symbol.dissolve{

  animation:

  dissolveWalls 3.2s ease forwards;

}

@keyframes dissolveWalls{

  0%{

    opacity:1;

    filter:none;

  }

  50%{

    opacity:.7;

    transform:

    scale(1.01)

    translateY(1px);

    filter:

    blur(1px)

    brightness(.7);

  }

  100%{

    opacity:0;

    transform:

    scale(1.03)

    translateY(4px);

    filter:

    blur(14px)

    brightness(.2);

  }

}

/* ===================================================== */

/* INNER CORE GLOW */

/* ===================================================== */

.inner-symbol.connected{

  animation:

  innerAlive 3s ease forwards;

}

@keyframes innerAlive{

  0%{

    filter:none;

  }

  100%{

    filter:

    drop-shadow(0 0 12px rgba(255,255,255,.08))

    drop-shadow(0 0 26px rgba(255,255,255,.04));

  }

}

</style>

</head>

<body>

<div class="screen">

  <!-- GLITCH -->

  <div class="glitch" id="glitch"></div>

  <!-- SYMBOL -->

  <div class="symbol-wrap">

    <div class="signal-tear" id="tear"></div>

    <img

      src="Inner17-final.png"

      class="inner-symbol"

      id="innerSymbol"

    />

    <img

      src="Outer17-final.png"

      class="outer-symbol"

      id="outerSymbol"

    />

  </div>

  <!-- TEXT -->

  <div class="text-zone">

    <div class="signal-line" id="signalLine">

      signal lost

    </div>

    <div class="reconnect" id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

/* ===================================================== */

/* ELEMENTS */

/* ===================================================== */

const glitch =

document.getElementById("glitch");

const tear =

document.getElementById("tear");

const signalLine =

document.getElementById("signalLine");

const reconnect =

document.getElementById("reconnect");

const outerSymbol =

document.getElementById("outerSymbol");

const innerSymbol =

document.getElementById("innerSymbol");

/* ===================================================== */

/* OPENING GLITCH */

/* ===================================================== */

setTimeout(() => {

  glitch.classList.add("active");

}, 300);

/* ===================================================== */

/* QUICK SYMBOL TEAR */

/* ===================================================== */

setTimeout(() => {

  tear.classList.add("active");

}, 3200);

/* ===================================================== */

/* SIGNAL LOST */

/* ===================================================== */

setTimeout(() => {

  signalLine.style.opacity = 1;

  signalLine.classList.add("live");

}, 5300);

/* ===================================================== */

/* REMOVE SIGNAL */

/* ===================================================== */

setTimeout(() => {

  signalLine.style.opacity = 0;

}, 8500);

/* ===================================================== */

/* RECONNECT */

/* ===================================================== */

setTimeout(() => {

  reconnect.style.opacity = 1;

  reconnect.classList.add("live");

}, 9800);

/* ===================================================== */

/* CLICK RECONNECT */

/* ===================================================== */

reconnect.addEventListener("click", () => {

  reconnect.style.pointerEvents = "none";

  reconnect.classList.remove("live");

  reconnect.style.transition =

  "opacity 1.2s ease";

  reconnect.style.opacity = 0;

  outerSymbol.classList.add("dissolve");

  innerSymbol.classList.add("connected");

});

</script>

</body>

</html>
