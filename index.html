<!-- =========================================

CHANNEL 17

FOUNDATION BUILD // CHECKPOINT

========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

/* =========================================

RESET

========================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

cursor:default;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

background:#000;

z-index:1;

}

/* =========================================

PHONE EDGE DARKNESS

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:9999;

background:

radial-gradient(

circle,

transparent 50%,

rgba(0,0,0,.32) 72%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================

SCREEN NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:4;

opacity:.06;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

FLASHES

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:80;

transition:.06s linear;

}

/* =========================================

SEARCH BAR GHOST

========================================= */

#ghostBar{

position:fixed;

top:0;

left:0;

width:100%;

height:64px;

pointer-events:none;

opacity:0;

z-index:120;

mix-blend-mode:screen;

background:

linear-gradient(

180deg,

rgba(255,255,255,.08),

transparent

);

filter:

blur(.4px);

}

.ghostCopy{

position:absolute;

left:0;

width:100%;

height:64px;

border-bottom:

1px solid rgba(255,255,255,.08);

}

/* =========================================

FRACTURES

========================================= */

#fracture{

position:fixed;

inset:0;

pointer-events:none;

z-index:60;

opacity:0;

}

.slice{

position:absolute;

background:

rgba(255,255,255,.08);

mix-blend-mode:screen;

filter:blur(.5px);

}

/* =========================================

WARNING LAYER

========================================= */

#warningWrap{

position:fixed;

inset:0;

pointer-events:none;

z-index:140;

}

.warning{

position:absolute;

font-size:

clamp(10px,1.8vw,18px);

letter-spacing:.22em;

white-space:nowrap;

color:#fff;

opacity:0;

mix-blend-mode:screen;

text-shadow:

0 0 12px rgba(255,255,255,.18);

animation:

warning .18s linear;

}

@keyframes warning{

0%{

opacity:0;

transform:

translateX(-8px);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(8px);

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(28px,5vw,74px);

letter-spacing:.26em;

white-space:nowrap;

color:#fff;

opacity:0;

z-index:200;

mix-blend-mode:screen;

text-shadow:

0 0 16px rgba(255,255,255,.18);

}

#signalLost.active{

animation:

signal .1s infinite;

}

@keyframes signal{

0%{

opacity:.08;

}

50%{

opacity:1;

}

100%{

opacity:.08;

}

}

/* =========================================

STATIC SIGNAL

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

opacity:0;

z-index:180;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-240px);

opacity:.02;

}

50%{

opacity:.5;

}

100%{

transform:

translateX(240px);

opacity:.02;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:38%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(82vw,500px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

1.6s ease;

z-index:300;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.3;

transition:

8s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.24;

transition:

8s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:60%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.28em;

color:#f2c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:360;

transition:

1s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

pulse 3s ease infinite;

}

@keyframes pulse{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,170,60,.18),

0 0 40px rgba(255,120,20,.08);

}

}

/* =========================================

THERMAL SMUDGE

========================================= */

#smudge{

position:fixed;

width:34px;

height:34px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:30;

background:

radial-gradient(

circle,

rgba(255,110,20,.55) 0%,

rgba(255,80,0,.26) 35%,

rgba(255,60,0,.12) 58%,

transparent 82%

);

filter:

blur(8px);

transform:

translate(-50%,-50%);

transition:

1.6s ease;

}

/* =========================================

INNER WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:8;

opacity:0;

transition:

7s ease;

background:

linear-gradient(

90deg,

rgba(0,0,0,.98) 0%,

rgba(0,0,0,.96) 22%,

rgba(255,110,20,.015) 38%,

rgba(255,120,30,.04) 50%,

rgba(255,110,20,.015) 62%,

rgba(0,0,0,.96) 78%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:9;

opacity:0;

transition:

7s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(

circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

7s ease;

z-index:500;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.02;

transition:

7s ease;

filter:

drop-shadow(

0 0 12px rgba(255,120,20,.06)

);

}

.connected .etch{

opacity:1;

}

/* LAST SESH */

#etch1{

width:min(42vw,240px);

left:10%;

top:58%;

transform:

rotate(-4deg);

}

/* ROACH TRAY */

#etch2{

width:min(56vw,340px);

left:28%;

top:68%;

transform:

rotate(2deg);

}

/* PASS IT BACK */

#etch3{

width:min(44vw,270px);

left:52%;

top:76%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 16px rgba(255,180,90,.18)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="flash"></div>

<div id="ghostBar"></div>

<div id="fracture"></div>

<div id="warningWrap"></div>

<div id="static"></div>

<div id="smudge"></div>

<div id="warmth"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch"

id="etch1"

href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch"

id="etch2"

href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch"

id="etch3"

href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

window.onload = ()=>{

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

function resize(){

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

/* =========================================

DATA

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 18;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .43,

y:

canvas.height * .18,

w:260,

h:360

};

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y:

i * fontSize,

x:

Math.random() * -3000,

speed:

6 + Math.random() * 6,

length:

16 + Math.random() * 26,

laps:0,

finished:false,

flash:

Math.random() > .94,

dead:

Math.random() > .84

});

}

/* =========================================

FLASH

========================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .18;

setTimeout(()=>{

f.style.opacity = 0;

},45);

}

/* =========================================

FRACTURE

========================================= */

function fracture(){

const layer =

document.getElementById("fracture");

layer.style.opacity = 1;

layer.innerHTML = "";

for(let i=0;i<5;i++){

const s =

document.createElement("div");

s.className = "slice";

s.style.left =

(Math.random()*100)+"%";

s.style.top =

(Math.random()*100)+"%";

s.style.width =

(100 + Math.random()*500)+"px";

s.style.height =

(10 + Math.random()*120)+"px";

s.style.transform =

`translate(

${Math.random()*60-30}px,

${Math.random()*60-30}px

)`;

layer.appendChild(s);

}

setTimeout(()=>{

layer.style.opacity = 0;

},70);

}

/* =========================================

WARNINGS

========================================= */

function warning(){

const wrap =

document.getElementById("warningWrap");

const w =

document.createElement("div");

w.className = "warning";

const messages = [

"SYSTEM FAILURE",

"CHANNEL COLLISION",

"TRANSMISSION BREACH",

"UNAUTHORIZED SIGNAL",

"MEMORY LEAK",

"RENDER FAILURE"

];

w.innerText =

messages[

Math.floor(

Math.random()*messages.length

)

];

w.style.left =

(Math.random()*70+10)+"%";

w.style.top =

(Math.random()*70+10)+"%";

wrap.appendChild(w);

setTimeout(()=>{

w.remove();

},180);

}

/* =========================================

GHOST BAR

========================================= */

function ghostBar(){

const layer =

document.getElementById("ghostBar");

layer.style.opacity = .7;

layer.innerHTML = "";

for(let i=0;i<3;i++){

const g =

document.createElement("div");

g.className =

"ghostCopy";

g.style.transform =

`translate(

${Math.random()*30-15}px,

${Math.random()*30-15}px

)`;

layer.appendChild(g);

}

setTimeout(()=>{

layer.style.opacity = 0;

},120);

}

/* =========================================

DRAW

========================================= */

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.14)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

/* KEEP .17 CLEAN */

if(!inside17){

ctx.fillStyle =

`rgba(175,185,60,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

}

stream.x += stream.speed;

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 240

){

stream.laps++;

if(stream.laps >= 2){

stream.finished = true;

}else{

stream.x =

Math.random() * -3000;

}

}

});

/* CHAOS */

if(Math.random() > .78){

flash();

}

if(Math.random() > .84){

fracture();

}

if(Math.random() > .9){

warning();

}

if(Math.random() > .92){

ghostBar();

}

/* FINISH */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(loop);

setTimeout(()=>{

failure();

},120);

}

}

/* =========================================

FAILURE

========================================= */

function failure(){

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

/* STATIC */

for(let i=0;i<42;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70)+"%";

line.style.left =

Math.random()*60+"%";

line.style.top =

Math.random()*100+"%";

line.style.animationDuration =

(.05 + Math.random()*1)+"s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

/* SIGNAL LOST */

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* FADE */

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

},700);

/* SYMBOL */

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},900);

/* RECONNECT */

setTimeout(()=>{

document

.getElementById("reconnect")

.classList.add("active");

},1300);

}

/* =========================================

START

========================================= */

const loop =

setInterval(draw,52);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

reconnect.classList.remove("active");

/* THUMB HEAT */

const smudge =

document.getElementById("smudge");

smudge.style.left =

e.clientX + "px";

smudge.style.top =

e.clientY + "px";

smudge.style.opacity = 1;

/* QUICK GROW */

smudge.animate([

{

transform:

"translate(-50%,-50%) scale(.7)"

},

{

transform:

"translate(-50%,-50%) scale(1.35)"

}

],{

duration:260,

fill:"forwards"

});

/* COOL */

setTimeout(()=>{

smudge.style.opacity = 0;

},900);

/* PAGE WARMS */

setTimeout(()=>{

document.body.classList.add("connected");

},280);

/* ETCHINGS */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},2400);

});

};

</script>

</body>

</html>
