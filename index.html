<!-- CHANNEL 17 / HOSTILE SIGNAL BUILD -->

<!-- FOUNDATION LOCK -->

<!-- ========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

background:#000;

z-index:1;

}

/* =========================================

STATIC GRAIN

========================================= */

#grain{

position:fixed;

inset:0;

z-index:2;

pointer-events:none;

opacity:.05;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 4px

);

animation:

grain .05s linear infinite;

}

@keyframes grain{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(4px);

}

}

/* =========================================

GLITCH CHAOS

========================================= */

#glitch{

position:fixed;

inset:0;

pointer-events:none;

z-index:6;

mix-blend-mode:screen;

}

.glitchBar{

position:absolute;

background:

rgba(255,255,255,.16);

opacity:0;

animation:

glitchBar .08s linear;

}

@keyframes glitchBar{

0%{

opacity:0;

}

50%{

opacity:1;

}

100%{

opacity:0;

}

}

/* =========================================

WHITE SIGNAL CHAOS

========================================= */

#signalNoise{

position:fixed;

inset:0;

pointer-events:none;

z-index:5;

opacity:0;

mix-blend-mode:screen;

}

.signalLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

signalMove linear infinite;

}

@keyframes signalMove{

0%{

transform:translateX(-100px);

opacity:.02;

}

50%{

opacity:.42;

}

100%{

transform:translateX(100px);

opacity:.02;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:54%;

left:50%;

transform:translateX(-50%);

font-size:

clamp(28px,4vw,58px);

letter-spacing:.25em;

white-space:nowrap;

color:#fff;

opacity:0;

mix-blend-mode:screen;

filter:blur(.5px);

z-index:10;

}

#signalLost.active{

animation:

warningPulse .16s infinite;

}

@keyframes warningPulse{

0%{

opacity:.02;

transform:

translateX(-50%)

translateY(0px)

skewX(0deg);

}

15%{

opacity:1;

transform:

translateX(-50%)

translateY(-2px)

skewX(-2deg);

}

40%{

opacity:.14;

}

65%{

opacity:.94;

transform:

translateX(-50%)

translateY(2px)

skewX(2deg);

}

100%{

opacity:.03;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:39%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(78vw,470px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2s ease;

z-index:12;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:

8s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.34;

transition:

8s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:60%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,28px);

letter-spacing:.24em;

color:#efc18a;

opacity:0;

pointer-events:none;

cursor:pointer;

transition:

3s ease;

text-shadow:

0 0 8px rgba(255,120,20,.04);

z-index:14;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

reconnectPulse 4s ease infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.22;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,180,90,.22),

0 0 50px rgba(255,120,20,.12);

}

}

/* =========================================

THUMBPRINT STAIN

========================================= */

#stain{

position:fixed;

inset:0;

pointer-events:none;

z-index:3;

opacity:0;

background:

radial-gradient(circle at center,

rgba(255,90,30,.30) 0%,

rgba(255,120,20,.14) 5%,

rgba(255,120,20,.05) 11%,

transparent 18%

);

mix-blend-mode:screen;

transition:

10s ease;

}

/* =========================================

BACKGROUND WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

background:

radial-gradient(circle at center,

rgba(255,140,40,.04) 0%,

rgba(255,110,20,.02) 25%,

transparent 60%

);

opacity:0;

pointer-events:none;

z-index:2;

transition:

10s ease;

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:

6s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

6s ease;

z-index:15;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.04;

transition:

6s ease;

filter:

drop-shadow(

0 0 12px

rgba(255,120,20,.06)

);

}

.connected .etch{

opacity:1;

}

#etch1{

width:min(48vw,280px);

left:7%;

top:43%;

transform:

rotate(-4deg);

}

#etch2{

width:min(62vw,390px);

left:12%;

top:50%;

transform:

rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:24%;

bottom:2%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 18px

rgba(255,180,90,.22)

)

drop-shadow(

0 0 56px

rgba(255,120,20,.12)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="grain"></div>

<div id="warmth"></div>

<div id="stain"></div>

<div id="signalNoise"></div>

<div id="glitch"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="overlay">

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch"

id="etch1"

href="#">

<img src="lastsesh17.png"

width="100%">

</a>

<a class="etch"

id="etch2"

href="#">

<img src="RoachTray17.png"

width="100%">

</a>

<a class="etch"

id="etch3"

href="#">

<img src="PassItBack17.png"

width="100%">

</a>

</div>

</div>

<script>

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

/* =========================================

SETTINGS

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 16;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .53,

y:

canvas.height * .52,

w:380,

h:210

};

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y: i * fontSize,

x:

Math.random() * -2200,

speed:

10 + Math.random() * 24,

length:

20 + Math.random() * 60,

laps:0,

finished:false,

vertical:

Math.random() > .78,

dead:

Math.random() > .86,

flash:

Math.random() > .92,

glitch:

Math.random() > .88,

freeze:

Math.random() > .90

});

}

/* =========================================

GLITCH BURSTS

========================================= */

function glitchBurst(){

const layer =

document.getElementById("glitch");

for(let i=0;i<18;i++){

const flash =

document.createElement("div");

flash.className =

"glitchBar";

flash.style.left =

Math.random()*100 + "%";

flash.style.top =

Math.random()*100 + "%";

flash.style.width =

Math.random()*700 + "px";

flash.style.height =

(1 + Math.random()*6) + "px";

flash.style.transform =

`rotate(${Math.random()*8-4}deg)`;

layer.appendChild(flash);

setTimeout(()=>{

flash.remove();

},80);

}

}

/* =========================================

DRAW MATRIX

========================================= */

function drawMatrix(){

ctx.fillStyle =

"rgba(0,0,0,0.22)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

/* protected .17 */

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* vertical corruption */

if(

stream.vertical &&

Math.random() > .988

){

ctx.fillStyle =

"rgba(100,255,100,.4)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y + (Math.random()*240)

);

}

/* white flashes */

if(

stream.flash &&

Math.random() > .992

){

ctx.fillStyle =

"rgba(255,255,255,.85)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* frozen corruption */

if(

stream.freeze &&

Math.random() > .995

){

ctx.fillStyle =

"rgba(100,255,100,.18)";

ctx.fillRect(

charX,

stream.y,

120,

2

);

}

/* glitch tears */

if(

stream.glitch &&

Math.random() > .992

){

ctx.fillStyle =

"rgba(100,255,100,.35)";

ctx.fillRect(

charX,

stream.y,

Math.random()*180,

2

);

}

/* dead chunks */

if(

stream.dead &&

Math.random() > .992

){

ctx.clearRect(

charX,

stream.y,

fontSize,

fontSize

);

}

}

stream.x += stream.speed;

/* laps */

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 300

){

stream.laps++;

if(stream.laps >= 3){

stream.finished = true;

}else{

stream.x =

Math.random() * -2200;

}

}

});

/* random glitch */

if(Math.random() > .82){

glitchBurst();

}

/* all finished */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(matrixLoop);

setTimeout(()=>{

systemFailure();

},700);

}

}

/* =========================================

SYSTEM FAILURE

========================================= */

function systemFailure(){

const signalLost =

document.getElementById("signalLost");

const signalNoise =

document.getElementById("signalNoise");

/* unstable signal */

for(let i=0;i<28;i++){

const bar =

document.createElement("div");

bar.className =

"signalLine";

bar.style.width =

(20 + Math.random()*70) + "%";

bar.style.left =

Math.random()*60 + "%";

bar.style.top =

Math.random()*100 + "%";

bar.style.animationDuration =

(.08 + Math.random()*1.1) + "s";

signalNoise.appendChild(bar);

}

signalNoise.style.opacity = .92;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* fade */

setTimeout(()=>{

signalLost.style.opacity = 0;

signalNoise.style.opacity = 0;

},1900);

/* symbol */

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},3200);

/* reconnect */

setTimeout(()=>{

signalLost.classList.remove("active");

document

.getElementById("reconnect")

.classList.add("active");

},5000);

}

/* =========================================

START

========================================= */

const matrixLoop =

setInterval(drawMatrix,28);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.classList.add("connected");

/* thumb stain */

const stain =

document.getElementById("stain");

stain.style.opacity = 1;

/* warmth */

setTimeout(()=>{

document

.getElementById("warmth")

.style.opacity = 1;

},2200);

/* smoke */

setTimeout(()=>{

document

.getElementById("smoke")

.style.opacity = 1;

},3600);

/* etchings */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},6800);

});

</script>

</body>

</html>
