<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

body {

    background: black;

    overflow: hidden;

    width: 100vw;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

}

.container {

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* SYMBOL */

.logo {

    width: 220px;

    opacity: 0;

    animation: logoFade 4s ease forwards;

    animation-delay: 2s;

    filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));

}

/* SIGNAL */

.signal-wrap {

    width: 520px;

    margin-top: 42px;

    min-height: 40px;

    text-align: center;

}

#signal-text {

    color: rgba(255,255,255,0.72);

    font-size: 1.65rem;

    letter-spacing: 10px;

    text-transform: uppercase;

    white-space: nowrap;

}

.dots {

    opacity: 0;

    color: rgba(255,255,255,0.72);

    font-size: 1.65rem;

    letter-spacing: 4px;

}

.dots span {

    opacity: 0;

    animation: blinkDots 1.8s infinite;

}

.dots span:nth-child(1) {

    animation-delay: 0s;

}

.dots span:nth-child(2) {

    animation-delay: 0.3s;

}

.dots span:nth-child(3) {

    animation-delay: 0.6s;

}

/* RECONNECT */

.reconnect {

    margin-top: 55px;

    text-decoration: none;

    color: rgba(255,255,255,0.18);

    letter-spacing: 10px;

    font-size: 1.1rem;

    opacity: 0;

    transition: all 2s ease;

}

/* ACTIVE RECONNECT */

.reconnect.active {

    opacity: 1;

    color: #b8b09a;

    text-shadow:

    0 0 8px rgba(184,176,154,0.4),

    0 0 18px rgba(184,176,154,0.2);

    animation: reconnectPulse 3s ease-in-out infinite;

}

/* ANIMATIONS */

@keyframes logoFade {

    from {

        opacity: 0;

        transform: scale(0.92);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}

@keyframes blinkDots {

    0% {

        opacity: 0;

    }

    25% {

        opacity: 1;

    }

    100% {

        opacity: 0;

    }

}

@keyframes reconnectPulse {

    0% {

        opacity: 0.45;

    }

    50% {

        opacity: 1;

    }

    100% {

        opacity: 0.45;

    }

}

.fade-out {

    animation: fadeOut 2s ease forwards;

}

@keyframes fadeOut {

    from {

        opacity: 1;

    }

    to {

        opacity: 0;

    }

}

</style>

</head>

<body>

<div class="container">

    <img src="./mark17.png?v=4" class="logo">

    <div class="signal-wrap" id="signal-wrap">

        <span id="signal-text"></span>

        <span class="dots" id="dots">

            <span>.</span>

            <span>.</span>

            <span>.</span>

        </span>

    </div>

    <a class="reconnect" id="reconnect" href="#">

        reconnect

    </a>

</div>

<script>

const text = "SIGNAL LOST";

const target = document.getElementById("signal-text");

const dots = document.getElementById("dots");

const reconnect = document.getElementById("reconnect");

const signalWrap = document.getElementById("signal-wrap");

let i = 0;

function typeText() {

    if (i < text.length) {

        target.innerHTML += text.charAt(i);

        i++;

        setTimeout(typeText, 180);

    }

}

setTimeout(typeText, 6200);

setTimeout(() => {

    dots.style.opacity = "1";

}, 8600);

/* AFTER 17 SECONDS */

setTimeout(() => {

    signalWrap.classList.add("fade-out");

}, 17000);

setTimeout(() => {

    reconnect.classList.add("active");

}, 18800);

</script>

</body>

</html>
