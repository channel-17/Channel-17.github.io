<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
}

body{
position:relative;
background:black;
}



/ DARK VIGNETTE /

body::after{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(
circle at center,
transparent 0%,
rgba(0,0,0,.45) 55%,
rgba(0,0,0,.92) 100%
);

pointer-events:none;
z-index:20;
}



/ GLITCH STATIC /

.static{
position:absolute;
inset:0;

opacity:.06;

background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.06) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 4px
);

mix-blend-mode:screen;

animation:
staticShift .18s infinite;
}

@keyframes staticShift{

0%{
transform:translateX(0px);
}

25%{
transform:translateX(-1px);
}

50%{
transform:translateX(1px);
}

75%{
transform:translateX(-1px);
}

100%{
transform:translateX(0px);
}

}



/ SYMBOL /

.symbol{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:210px;

opacity:.015;

filter:blur(.4px);

transition:
opacity 4s ease,
filter 4s ease;

z-index:2;
}

.symbol.awaken{
opacity:.14;
filter:none;
}



/ SIGNAL LOST /

.signal{
position:absolute;

top:62%;
left:50%;

transform:
translateX(-50%);

color:#b8b0a4;

font-size:.7rem;

letter-spacing:6px;

opacity:0;

z-index:5;

animation:
signalIn 2s ease forwards;

animation-delay:4s;
}

@keyframes signalIn{

0%{
opacity:0;
filter:blur(12px);
letter-spacing:16px;
}

100%{
opacity:.55;
filter:none;
letter-spacing:6px;
}

}



/ RECONNECT /

.reconnect{
position:absolute;

top:67%;
left:50%;

transform:
translateX(-50%);

color:#d8d0c4;

font-size:.78rem;

letter-spacing:7px;

opacity:0;

cursor:pointer;

z-index:6;

animation:
reconnectIn 2s ease forwards;

animation-delay:7s;
}

@keyframes reconnectIn{

0%{
opacity:0;
}

100%{
opacity:.82;
}

}



/ EMBER /

.ember{
position:absolute;

width:12px;
height:12px;

border-radius:50%;

pointer-events:none;

opacity:0;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,140,70,.95) 30%,
rgba(255,70,20,.55) 55%,
transparent 100%
);

box-shadow:
0 0 14px rgba(255,120,50,.9),
0 0 32px rgba(255,80,20,.45);

z-index:10;
}



/ FREQUENCY ARCS /

.frequency{
position:absolute;

left:7vw;
bottom:8vh;

display:flex;
flex-direction:column;

gap:11px;

opacity:0;

transition:3s ease;

z-index:7;
}

.frequency div{

font-size:.58rem;

letter-spacing:4px;

color:#c9c1b5;

opacity:.72;
}

.frequency.awaken{
opacity:1;
}



/ EDGE INTERFERENCE */

.edges{
position:absolute;
inset:0;

pointer-events:none;

opacity:.12;

background:
linear-gradient(
90deg,
rgba(255,255,255,.05),
transparent 18%,
transparent 82%,
rgba(255,255,255,.04)
);

mix-blend-mode:screen;

animation:
edgePulse 4s ease-in-out infinite;
}

@keyframes edgePulse{

0%{
opacity:.06;
}

50%{
opacity:.14;
}

100%{
opacity:.06;
}

}

</style>
</head>

<body>

<div class="static"></div>

<div class="edges"></div>

<img
src="Trust17.png"
class="symbol"
id="symbol"
>

<div
class="signal"
id="signal"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

<div
class="frequency"
id="frequency"
>

<div>Latest Sesh</div>
<div>Roach Tray</div>
<div>Pass One Back</div>

</div>

<div
class="ember"
id="ember"
></div>

<script>

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const symbol =
document.getElementById("symbol");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");



reconnect.addEventListener("click",(e)=>{

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";

ember.style.opacity="1";



ember.animate([

{
transform:"translate(-50%,-50%) scale(.2)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(20)",
opacity:.02
}

],{

duration:5000,
easing:"ease-out",
fill:"forwards"

});



setTimeout(()=>{

symbol.classList.add("awaken");

},500);



setTimeout(()=>{

frequency.classList.add("awaken");

},2400);

});

</script>

</body>
</html>
