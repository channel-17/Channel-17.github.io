<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>channel 17</title>

<link rel="icon" type="image/png" href="mark17.png">

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    background:black;

    overflow:hidden;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

}

.container{

    position:relative;

    text-align:center;

}

/* SYMBOL */

.symbol-wrap{

    width:220px;

    margin:auto;

    opacity:0;

    animation:

    symbolReveal 3s ease forwards;

    animation-delay:3s;

}

.symbol-base{

    width:100%;

    display:block;

    transition:

    filter 2.8s ease,

    opacity 2.8s ease;

}

/* SYMBOL APPEAR */

@keyframes symbolReveal{

    0%{

        opacity:0;

        transform:scale(.97);

        filter:blur(10px);

    }

    100%{

        opacity:1;

        transform:scale(1);

        filter:blur(0px);

    }

}

/* TEXT LINE */

.text-line{

    position:relative;

    margin-top:26px;

    height:24px;

    font-size:12px;

    letter-spacing:7px;

    color:#9d968b;

    display:flex;

    justify-content:center;

    align-items:center;

}

/* SIGNAL LOST */

#signalText{

    opacity:0;

    white-space:nowrap;

    overflow:hidden;

}

/* RECONNECT */

#reconnect{

    position:absolute;

    opacity:0;

    color:#7c756b;

    cursor:pointer;

    transition:opacity 1.6s ease;

    animation:

    reconnectPulse 4.6s ease-in-out infinite;

}

/* HEARTBEAT */

@keyframes reconnectPulse{

    0%{

        opacity:.28;

        text-shadow:0 0 0px rgba(255,255,255,0);

    }

    35%{

        opacity:.95;

        text-shadow:

        0 0 7px rgba(255,255,255,.18),

        0 0 18px rgba(255,255,255,.08);

    }

    55%{

        opacity:.4;

    }

    72%{

        opacity:.82;

        text-shadow:

        0 0 8px rgba(255,255,255,.15);

    }

    100%{

        opacity:.28;

        text-shadow:0 0 0px rgba(255,255,255,0);

    }

}

/* CONNECTED */

.connected .symbol-base{

    mask-image:

    radial-gradient(circle at center,

    rgba(0,0,0,1) 0%,

    rgba(0,0,0,1) 36%,

    rgba(0,0,0,.45) 54%,

    rgba(0,0,0,.08) 68%,

    rgba(0,0,0,0) 78%);

    -webkit-mask-image:

    radial-gradient(circle at center,

    rgba(0,0,0,1) 0%,

    rgba(0,0,0,1) 36%,

    rgba(0,0,0,.45) 54%,

    rgba(0,0,0,.08) 68%,

    rgba(0,0,0,0) 78%);

    filter:brightness(1.04);

}

</style>

</head>

<body>

<div class="container" id="container">

    <div class="symbol-wrap">

        <img src="mark17.png" class="symbol-base">

    </div>

    <div class="text-line">

        <div id="signalText"></div>

        <div id="reconnect">

            reconnect

        </div>

    </div>

</div>

<script>

const signalText =

document.getElementById("signalText");

const reconnect =

document.getElementById("reconnect");

const container =

document.getElementById("container");

/* START */

setTimeout(startSignal, 5800);

/* TYPE SIGNAL LOST */

function startSignal(){

    signalText.style.opacity = ".72";

    let text = "signal lost";

    let i = 0;

    const typing = setInterval(() => {

        signalText.innerHTML += text.charAt(i);

        i++;

        if(i >= text.length){

            clearInterval(typing);

            setTimeout(startDots, 700);

        }

    }, 110);

}

/* DOT LOOP */

function startDots(){

    let dots = 0;

    const loop = setInterval(() => {

        dots++;

        signalText.innerHTML =

        "signal lost" + ".".repeat(dots);

        if(dots >= 3){

            dots = 0;

        }

    }, 650);

    /* AFTER SEVERAL LOOPS */

    setTimeout(() => {

        clearInterval(loop);

        signalText.style.transition =

        "opacity 1.8s ease";

        signalText.style.opacity = "0";

        setTimeout(() => {

            reconnect.style.opacity = ".75";

        }, 1800);

    }, 7600);

}

/* CLICK */

reconnect.addEventListener("click", () => {

    reconnect.style.opacity = "0";

    container.classList.add("connected");

    setTimeout(() => {

        document.body.style.transition =

        "opacity 2.2s ease";

        document.body.style.opacity = "0";

    }, 4200);

});

</script>

</body>

</html>
