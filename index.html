<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" href="Signal17.png?v=17">

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
font-family:"Courier New", monospace;
height:100vh;
width:100vw;
color:#d8d2c8;
}

.screen{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
background:
radial-gradient(
circle at center,
rgba(14,14,14,.94) 0%,
#000 72%
);
}



/ OPENING STATIC /

.glitch{
position:absolute;
inset:-10%;
opacity:0;
pointer-events:none;
z-index:999;
background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.18) 0px,
rgba(255,255,255,.18) 2px,
transparent 3px,
transparent 7px
),
repeating-linear-gradient(
90deg,
rgba(255,255,255,.06) 0px,
rgba(255,255,255,.06) 1px,
transparent 2px,
transparent 6px
);
mix-blend-mode:screen;
}

.glitch.active{
animation:violentGlitch 1.4s steps(2) forwards;
}

@keyframes violentGlitch{

0%{
opacity:0;
transform:scale(1);
}

10%{
opacity:1;
transform:
translateX(-40px)
skewX(16deg);
}

22%{
opacity:0;
}

35%{
opacity:1;
transform:
translateX(34px)
skewX(-10deg);
}

48%{
opacity:0;
}

68%{
opacity:.7;
transform:
translateY(-8px)
scale(1.03);
}

100%{
opacity:0;
transform:none;
}

}



/ SYMBOL /

.symbol-wrap{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:280px;
height:280px;
}

.outer-symbol,
.inner-symbol{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
opacity:0;
}

.outer-symbol{
filter:
blur(1px)
brightness(.42);
}

.outer-symbol.visible{
animation:outerReveal 4s ease forwards;
}

.inner-symbol.visible{
animation:innerReveal 4s ease forwards;
}

@keyframes outerReveal{

0%{
opacity:0;
filter:
blur(14px)
brightness(.04);
transform:scale(.95);
}

100%{
opacity:.34;
filter:
blur(1px)
brightness(.5);
transform:scale(1);
}

}

@keyframes innerReveal{

0%{
opacity:0;
filter:
blur(18px)
brightness(.2);
transform:scale(.92);
}

100%{
opacity:1;
filter:none;
transform:scale(1);
}

}



/ SIGNAL TEXT /

.text-zone{
position:absolute;
top:73%;
left:50%;
transform:translateX(-50%);
width:340px;
height:50px;
}

.signal-line{
position:absolute;
width:100%;
text-align:center;
letter-spacing:8px;
opacity:0;
color:#cfc7bb;
}

.signal-line.active{
animation:signalFlicker 2.8s ease forwards;
}

@keyframes signalFlicker{

0%{
opacity:0;
filter:blur(8px);
letter-spacing:18px;
}

22%{
opacity:.14;
}

44%{
opacity:.05;
}

70%{
opacity:.84;
letter-spacing:8px;
}

100%{
opacity:.74;
filter:none;
letter-spacing:8px;
}

}



/ RECONNECT /

.reconnect{
position:absolute;
width:100%;
text-align:center;
letter-spacing:8px;
opacity:0;
cursor:pointer;
}

.reconnect.live{
animation:reconnectPulse 2.6s ease infinite;
}

@keyframes reconnectPulse{

0%{
opacity:.08;
}

50%{
opacity:1;
text-shadow:
0 0 14px rgba(255,255,255,.18);
}

100%{
opacity:.08;
}

}



/ WARMTH /

.warmth{
position:absolute;
top:50%;
left:50%;
width:120px;
height:120px;
border-radius:50%;
transform:translate(-50%,-50%);
pointer-events:none;
opacity:0;

background:
radial-gradient(
circle,
rgba(255,210,140,.12) 0%,
rgba(255,180,120,.05) 36%,
transparent 70%
);
}

.warmth.active{
animation:warmExpand 4.8s ease forwards;
}

@keyframes warmExpand{

0%{
opacity:0;
transform:
translate(-50%,-50%)
scale(.2);
}

14%{
opacity:.08;
}

34%{
opacity:.12;
}

100%{
opacity:.22;
transform:
translate(-50%,-50%)
scale(3.4);
}

}



/ INTERFERENCE DISSOLVE /

.outer-symbol.dissolve{
animation:signalBreakdown 4s ease forwards;
}

@keyframes signalBreakdown{

0%{
opacity:.34;
}

100%{
opacity:0;
filter:
blur(20px)
brightness(.08);
}

}



/ TRUE SIGNAL /

.inner-symbol.stable{
animation:signalStabilize 3s ease forwards;
}

@keyframes signalStabilize{

0%{
filter:brightness(1);
}

100%{
filter:
brightness(1.06);

opacity:.16;
}

}



/ FREQUENCY ARCS /

.frequency-zone{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60vh;
opacity:0;
pointer-events:none;
z-index:20;
}

.frequency-zone.awake{
animation:frequencyReveal 3s ease forwards;
}

@keyframes frequencyReveal{

0%{
opacity:0;
transform:translateY(10px);
}

100%{
opacity:1;
transform:translateY(0px);
}

}

.frequency-mark{
margin-bottom:34px;
font-size:2rem;
letter-spacing:12px;
opacity:.9;
}

.frequency-links{
display:flex;
flex-direction:column;
gap:24px;
text-align:center;
}

.frequency-link{
letter-spacing:5px;
opacity:.68;
cursor:pointer;
transition:.3s ease;
}

.frequency-link:hover{
opacity:1;
text-shadow:
0 0 10px rgba(255,230,180,.14);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch" id="glitch"></div>

<div class="symbol-wrap">

<img
src="Outer17-final.png"
class="outer-symbol"
id="outerSymbol"
/>

<img
src="Inner17-final.png"
class="inner-symbol"
id="innerSymbol"
/>

</div>

<div class="text-zone">

<div
class="signal-line"
id="signalLine"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

</div>

<div
class="warmth"
id="warmth"
></div>

<div
class="frequency-zone"
id="frequencyZone"
>

<div class="frequency-mark">
:lll
</div>

<div class="frequency-links">

<div class="frequency-link">
Latest Sesh
</div>

<div class="frequency-link">
Roach Tray
</div>

<div class="frequency-link">
Pass One Back
</div>

</div>

</div>

</div>

<script>

const glitch =
document.getElementById("glitch");

const outerSymbol =
document.getElementById("outerSymbol");

const innerSymbol =
document.getElementById("innerSymbol");

const signalLine =
document.getElementById("signalLine");

const reconnect =
document.getElementById("reconnect");

const warmth =
document.getElementById("warmth");

const frequencyZone =
document.getElementById("frequencyZone");



/ OPENING STATIC /

setTimeout(() => {

glitch.classList.add("active");

}, 300);



/ SYMBOL /

setTimeout(() => {

outerSymbol.classList.add("visible");

innerSymbol.classList.add("visible");

}, 1700);



/ SIGNAL LOST /

setTimeout(() => {

signalLine.classList.add("active");

}, 5200);



/ REMOVE SIGNAL LOST /

setTimeout(() => {

signalLine.style.display = "none";

}, 8600);



/ SHOW RECONNECT /

setTimeout(() => {

reconnect.classList.add("live");

reconnect.style.opacity = "1";

}, 9300);



/ HUMAN TOUCH */

reconnect.addEventListener("click", () => {

reconnect.classList.remove("live");

reconnect.style.opacity = "0";



warmth.classList.add("active");



outerSymbol.classList.add("dissolve");



innerSymbol.classList.add("stable");



setTimeout(() => {

reconnect.style.display = "none";

frequencyZone.classList.add("awake");

}, 1800);

});

</script>

</body>

</html>
