<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHANNEL 17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Courier New, monospace;
}

/* ---------------- BACKGROUND ---------------- */

body{
background:
radial-gradient(circle at center, rgba(255,120,20,.03) 0%, transparent 35%),
#000;
}

/* ---------------- GLITCH LAYER ---------------- */

#glitch{
position:fixed;
inset:0;
pointer-events:none;
z-index:50;
mix-blend-mode:screen;
opacity:1;
animation:glitchFade 4.8s forwards;
}

.scan{
position:absolute;
width:100%;
height:2px;
background:
linear-gradient(
90deg,
transparent,
rgba(255,120,40,.35),
rgba(255,255,255,.2),
transparent
);
animation:scanMove linear infinite;
}

.scan:nth-child(1){
top:12%;
animation-duration:.08s;
}

.scan:nth-child(2){
top:30%;
animation-duration:.12s;
}

.scan:nth-child(3){
top:48%;
animation-duration:.06s;
}

.scan:nth-child(4){
top:66%;
animation-duration:.15s;
}

.scan:nth-child(5){
top:82%;
animation-duration:.09s;
}

@keyframes scanMove{
0%{
transform:translateX(-100%);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateX(100%);
opacity:0;
}
}

@keyframes glitchFade{
0%{
opacity:1;
}
65%{
opacity:1;
}
100%{
opacity:0;
}
}

/* ---------------- STATIC ---------------- */

#noise{
position:fixed;
inset:0;
background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.02) 0px,
rgba(255,255,255,.02) 1px,
transparent 1px,
transparent 3px
);
opacity:.14;
pointer-events:none;
z-index:5;
}

/* ---------------- MAIN ---------------- */

#main{
position:relative;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

/* ---------------- SYMBOL ---------------- */

#symbolWrap{
position:relative;
width:min(72vw,340px);
height:min(72vw,340px);
display:flex;
justify-content:center;
align-items:center;
animation:symbolFlicker 4s infinite;
}

#outer{
position:absolute;
width:100%;
opacity:.22;
filter:blur(.5px);
animation:outerDecay 7s infinite alternate;
}

#inner{
position:absolute;
width:54%;
opacity:.75;
filter:
drop-shadow(0 0 8px rgba(255,150,60,.18))
drop-shadow(0 0 24px rgba(255,120,20,.08));
animation:innerPulse 6s ease-in-out infinite;
}

@keyframes symbolFlicker{
0%,100%{
opacity:1;
}
48%{
opacity:.85;
}
49%{
opacity:.3;
}
50%{
opacity:1;
}
}

@keyframes outerDecay{
0%{
opacity:.22;
filter:blur(.5px);
}
100%{
opacity:.05;
filter:blur(2px);
}
}

@keyframes innerPulse{
0%,100%{
opacity:.72;
transform:scale(1);
}
50%{
opacity:.92;
transform:scale(1.02);
}
}

/* ---------------- SIGNAL LOST ---------------- */

#warning{
margin-top:28px;
font-size:clamp(18px,3vw,26px);
letter-spacing:.45em;
color:rgba(255,255,255,.38);
text-transform:lowercase;
animation:warningFlash .8s infinite;
}

@keyframes warningFlash{
0%,100%{
opacity:.2;
}
50%{
opacity:.85;
}
}

/* ---------------- RECONNECT ---------------- */

#reconnect{
margin-top:42px;
font-size:clamp(28px,5vw,56px);
letter-spacing:.38em;
color:rgba(255,255,255,.08);
text-transform:uppercase;
cursor:pointer;
pointer-events:none;
transition:
color 2.5s ease,
text-shadow 2.5s ease,
transform .3s ease;
animation:reconnectWarm 6s forwards;
animation-delay:4.4s;
}

#reconnect.active{
pointer-events:auto;
}

#reconnect:hover{
transform:scale(1.03);
}

@keyframes reconnectWarm{

0%{
opacity:0;
color:rgba(255,255,255,0);
text-shadow:none;
}

100%{
opacity:1;
color:rgba(255,225,185,.88);
text-shadow:
0 0 8px rgba(255,120,20,.35),
0 0 28px rgba(255,120,20,.14);
}

}

/* ---------------- SMOKE ---------------- */

#smokeWrap{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:2;
}

.smoke{
position:absolute;
width:55vw;
height:55vw;
border-radius:50%;
background:
radial-gradient(
circle,
rgba(255,255,255,.035),
transparent 70%
);
filter:blur(55px);
animation:smokeFloat linear infinite;
}

.smoke:nth-child(1){
left:-10%;
top:60%;
animation-duration:24s;
}

.smoke:nth-child(2){
right:-15%;
top:20%;
animation-duration:32s;
}

.smoke:nth-child(3){
left:20%;
top:85%;
animation-duration:28s;
}

@keyframes smokeFloat{

0%{
transform:translate(0,0) scale(1);
opacity:0;
}

15%{
opacity:.18;
}

50%{
opacity:.08;
}

100%{
transform:translate(160px,-120px) scale(1.4);
opacity:0;
}

}

/* ---------------- LINKS ---------------- */

#links{
position:absolute;
left:50%;
bottom:14%;
transform:translateX(-50%);
width:min(78vw,520px);

display:flex;
flex-direction:column;
gap:42px;

opacity:0;
pointer-events:none;

transition:opacity 2s ease;
}

#links.show{
opacity:1;
pointer-events:auto;
}

.link{
display:block;
text-decoration:none;
transition:
transform .3s ease,
filter .3s ease;
}

.link:hover{
transform:translateX(10px);
filter:brightness(1.2);
}

.link img{
width:100%;
display:block;
filter:
drop-shadow(0 0 12px rgba(255,120,20,.18))
drop-shadow(0 0 30px rgba(255,120,20,.08));
}

/* ---------------- MOBILE ---------------- */

@media(max-width:700px){

#links{
width:82vw;
bottom:10%;
gap:34px;
}

#symbolWrap{
width:62vw;
height:62vw;
}

}

</style>
</head>

<body>

<div id="noise"></div>

<div id="glitch">
<div class="scan"></div>
<div class="scan"></div>
<div class="scan"></div>
<div class="scan"></div>
<div class="scan"></div>
</div>

<div id="smokeWrap">
<div class="smoke"></div>
<div class="smoke"></div>
<div class="smoke"></div>
</div>

<div id="main">

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">
<img id="inner" src="Inner17-final.png">

</div>

<div id="warning">signal lost</div>

<div id="reconnect">reconnect</div>

<div id="links">

<a class="link" href="#">
<img src="lastsesh17.png">
</a>

<a class="link" href="#">
<img src="RoachTray17.png">
</a>

<a class="link" href="#">
<img src="PassItBack17.png">
</a>

</div>

</div>

<script>

const reconnect = document.getElementById("reconnect");
const warning = document.getElementById("warning");
const links = document.getElementById("links");

setTimeout(()=>{
reconnect.classList.add("active");
},4400);

reconnect.addEventListener("click",()=>{

warning.style.transition="1s";
warning.style.opacity="0";

reconnect.style.transition="1.2s";
reconnect.style.opacity="0";

document.getElementById("outer").style.transition="2.8s";
document.getElementById("outer").style.opacity=".01";

document.getElementById("inner").style.transition="2.8s";
document.getElementById("inner").style.opacity=".92";

setTimeout(()=>{
links.classList.add("show");
},1200);

});

</script>

</body>
</html>
