<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

cursor:default;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

z-index:1;

background:#000;

}

/* =========================================

PHONE DARKNESS EDGE

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:100;

background:

radial-gradient(

circle,

transparent 52%,

rgba(0,0,0,.32) 76%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================

CORRUPTION NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:8;

opacity:.07;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.04) 0px,

rgba(255,255,255,.04) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

RANDOM TEARING

========================================= */

#tears{

position:fixed;

inset:0;

pointer-events:none;

z-index:9;

}

.tear{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.75),

transparent

);

opacity:0;

animation:

tear .18s linear;

}

@keyframes tear{

0%{

opacity:0;

transform:

translateX(-80px);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(80px);

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:53%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(24px,5vw,64px);

letter-spacing:.26em;

color:#fff;

opacity:0;

z-index:30;

white-space:nowrap;

mix-blend-mode:screen;

filter:

blur(.3px);

}

#signalLost.active{

animation:

signal .12s infinite;

}

@keyframes signal{

0%{

opacity:.04;

transform:

translate(-50%,-50%)

skewX(0deg);

}

25%{

opacity:1;

transform:

translate(-50%,-50%)

translateY(-2px)

skewX(-5deg);

}

50%{

opacity:.15;

}

75%{

opacity:1;

transform:

translate(-50%,-50%)

translateY(2px)

skewX(5deg);

}

100%{

opacity:.04;

}

}

/* =========================================

WHITE STATIC SIGNAL

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

z-index:18;

opacity:0;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.92),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-180px);

opacity:.02;

}

50%{

opacity:.45;

}

100%{

transform:

translateX(180px);

opacity:.02;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:39%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(76vw,460px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2.2s ease;

z-index:40;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.35;

transition:

9s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.32;

transition:

9s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:61%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,28px);

letter-spacing:.26em;

color:#f1c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:45;

transition:

1.8s ease;

text-shadow:

0 0 10px rgba(255,120,20,.03);

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

reconnectPulse 3s ease infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.18;

}

50%{

opacity:1;

text-shadow:

0 0 22px rgba(255,160,50,.15),

0 0 55px rgba(255,120,20,.08);

}

}

/* =========================================

WARMTH STAIN

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:3;

opacity:0;

mix-blend-mode:screen;

background:

radial-gradient(circle at center,

rgba(255,140,40,.22) 0%,

rgba(255,120,20,.12) 4%,

rgba(255,120,20,.05) 8%,

transparent 16%

);

transition:

10s ease;

}

/* =========================================

ROOM LIGHT

========================================= */

#room{

position:fixed;

inset:0;

pointer-events:none;

z-index:4;

opacity:0;

transition:

10s ease;

background:

radial-gradient(circle at center,

rgba(255,180,90,.05) 0%,

rgba(255,160,50,.02) 30%,

transparent 62%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:5;

opacity:0;

transition:

8s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

8s ease;

z-index:50;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.03;

transition:

8s ease;

filter:

drop-shadow(

0 0 12px

rgba(255,120,20,.05)

);

}

.connected .etch{

opacity:1;

}

#etch1{

width:min(48vw,280px);

left:10%;

top:60%;

transform:

rotate(-4deg);

}

#etch2{

width:min(62vw,390px);

left:14%;

top:50%;

transform:

rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:28%;

bottom:-1%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #room{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 18px

rgba(255,180,90,.22)

)

drop-shadow(

0 0 56px

rgba(255,120,20,.12)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="tears"></div>

<div id="warmth"></div>

<div id="room"></div>

<div id="static"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch"

id="etch1"

href="#">

<img src="lastsesh17.png"

width="100%">

</a>

<a class="etch"

id="etch2"

href="#">

<img src="RoachTray17.png"

width="100%">

</a>

<a class="etch"

id="etch3"

href="#">

<img src="PassItBack17.png"

width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

/* =========================================

SAFE INIT

========================================= */

window.onload = () => {

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

function resize(){

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

/* =========================================

SETTINGS

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 16;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .54,

y:

canvas.height * .38,

w:520,

h:260

};

/* =========================================

STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y:

i * fontSize,

x:

Math.random() * -3000,

speed:

3 + Math.random() * 7,

length:

18 + Math.random() * 40,

laps:0,

finished:false,

dead:

Math.random() > .83,

flash:

Math.random() > .92,

vertical:

Math.random() > .88

});

}

/* =========================================

TEARS

========================================= */

function tear(){

const layer =

document.getElementById("tears");

const t =

document.createElement("div");

t.className = "tear";

t.style.left =

Math.random()*100 + "%";

t.style.top =

Math.random()*100 + "%";

t.style.width =

(100 + Math.random()*600) + "px";

layer.appendChild(t);

setTimeout(()=>{

t.remove();

},180);

}

/* =========================================

DRAW

========================================= */

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.12)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

/* protected .17 */

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* dead gaps */

if(

stream.dead &&

Math.random() > .996

){

ctx.clearRect(

charX,

stream.y,

fontSize,

fontSize

);

}

/* white glitch */

if(

stream.flash &&

Math.random() > .996

){

ctx.fillStyle =

"rgba(255,255,255,.92)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* vertical leaks */

if(

stream.vertical &&

Math.random() > .995

){

ctx.fillStyle =

"rgba(100,255,100,.42)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y + (Math.random()*180)

);

}

}

stream.x += stream.speed;

/* laps */

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 240

){

stream.laps++;

if(stream.laps >= 2){

stream.finished = true;

}else{

stream.x =

Math.random() * -3000;

}

}

});

/* random tears */

if(Math.random() > .84){

tear();

}

/* finish */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(loop);

setTimeout(()=>{

failure();

},300);

}

}

/* =========================================

FAILURE

========================================= */

function failure(){

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

/* unstable lines */

for(let i=0;i<36;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70) + "%";

line.style.left =

Math.random()*60 + "%";

line.style.top =

Math.random()*100 + "%";

line.style.animationDuration =

(.04 + Math.random()*1) + "s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* fade */

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

},1000);

/* symbol */

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},1400);

/* reconnect */

setTimeout(()=>{

signalLost.classList.remove("active");

document

.getElementById("reconnect")

.classList.add("active");

},1900);

}

/* =========================================

START

========================================= */

const loop =

setInterval(draw,42);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.classList.add("connected");

/* warmth */

document

.getElementById("warmth")

.style.opacity = 1;

/* room */

setTimeout(()=>{

document

.getElementById("room")

.style.opacity = 1;

},2200);

/* smoke */

setTimeout(()=>{

document

.getElementById("smoke")

.style.opacity = 1;

},3400);

/* etchings */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},5000);

});

};

</script>

</body>

</html>
