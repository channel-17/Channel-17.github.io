<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL-17</title>
<style>

body {

    margin: 0;

    padding: 0;

    background: #000;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

}

.container {

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* LOGO */

.logo {

width: 155px;

max-width: 52vw;

opacity: 0;

animation: signalFade 4s ease forwards;

filter:
drop-shadow(0 0 18px rgba(255,255,255,0.08));    

}

/* TYPEWRITER */

.subtext {

    margin-top: 26px;

font-size: 0.82rem;

letter-spacing: 5px;

color: rgba(255,255,255,0.74);

text-transform: uppercase;

overflow: hidden;

white-space: nowrap;

width: 0;

opacity: 0;

animation:

fadeText 0.6s ease forwards,

typing 2.8s steps(25,end) forwards;

animation-delay: 3s;

border-right: 1px solid rgba(255,255,255,0.65);

text-transform: uppercase;

white-space: nowrap;

overflow: hidden;

width: 0;

animation:

    typing 3.5s steps(26,end) forwards,

    fadeText 1s ease forwards;

animation-delay: 3s;
}

/* BLINKING DOTS */

.dots {

    opacity: 1;

}

/* RECONNECT */

.reconnect {

    margin-top: 42px;

font-size: 0.72rem;

letter-spacing: 8px;

text-transform: lowercase;

text-decoration: none;

color: rgba(255,255,255,0.48);

opacity: 0;

animation: fadeReconnect 2s ease forwards;

animation-delay: 8.5s;

transition: 0.3s ease;

}

.reconnect:hover {

    color: rgba(255,255,255,0.9);

letter-spacing: 10px;

}

/* ANIMATIONS */

@keyframes fadeLogo {

    from {

        opacity: 0;

        transform: scale(0.92);

        filter: blur(8px);

    }

    to {

        opacity: 1;

        transform: scale(1);

        filter: blur(0);

    }

}

@keyframes typing {

    from {

        width: 0;

    }

    to {

        width: 24ch;

    }

}

@keyframes blinkCursor {

    50% {

        border-color: transparent;

    }

}

@keyframes dotsBlink {

    0%, 20% {

        opacity: 0.2;

    }

    50% {

        opacity: 1;

    }

    100% {

        opacity: 0.2;

    }

}

@keyframes fadeReconnect {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    from {

    opacity: 0;

    transform: translateY(8px);

}

to {

    opacity: 1;

    transform: translateY(0);

}

}
from {
    width: 0;
}

to {
    width: 25ch;
}

}

@keyframes fadeText {

from {

    opacity: 0;

    transform: translateY(8px);
}

to {

    opacity: 1;

    transform: translateY(0);
}

}
</style>
</head>
<body>
<div class="container">
<img src="mark17.png" class="logo">
<div class="subtext">

    transmission interrupted<span class="dots">

        <span>.</span><span>.</span><span>.</span>

    </span>

</div>

  <a class="reconnect" href="#">

    reconnect

</a>
  </body>
  </html>
