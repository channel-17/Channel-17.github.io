<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
color:white;
font-family:Courier New, monospace;
}



/* SCREEN /

.screen{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:black;
}



/ OPENING TAKEOVER /

.glitch{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.08) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 5px
);

opacity:.04;

pointer-events:none;

animation:takeover 2.6s ease;

z-index:30;
}

@keyframes takeover{

0%{
opacity:1;
transform:
translateX(-40px)
skewX(12deg);
}

15%{
opacity:.2;
}

30%{
opacity:1;
transform:
translateX(28px)
skewX(-10deg);
}

50%{
opacity:.08;
}

70%{
opacity:.4;
transform:
translateY(-2px)
scale(1.01);
}

100%{
opacity:.04;
transform:none;
}

}



/ EDGE INTERFERENCE /

.interference{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
90deg,
rgba(255,255,255,.03),
transparent 20%,
transparent 80%,
rgba(255,255,255,.02)
);

opacity:.06;

pointer-events:none;

animation:pulse 5s ease-in-out infinite;

z-index:15;
}

@keyframes pulse{

0%{
opacity:.03;
}

50%{
opacity:.09;
}

100%{
opacity:.03;
}

}



/ TRIANGLE SUPPRESSION /

.triangle{
position:absolute;

top:50%;
left:50%;

margin-left:-95px;
margin-top:-150px;

width:0;
height:0;

border-left:95px solid transparent;
border-right:95px solid transparent;
border-bottom:175px solid rgba(255,255,255,.035);

opacity:.25;

transition:4s ease;

z-index:2;
}



/ HIDDEN SIGNAL /

.symbol{
position:absolute;

top:34%;
left:0;

width:100%;

text-align:center;

font-size:68px;

letter-spacing:10px;

opacity:.018;

transition:4s ease;

z-index:3;
}



/ SIGNAL LOST /

.signal{
position:absolute;

top:58%;

width:100%;

text-align:center;

font-size:12px;

letter-spacing:6px;

opacity:.45;

z-index:5;
}



/ RECONNECT /

.reconnect{
position:absolute;

top:66%;

width:100%;

text-align:center;

font-size:15px;

letter-spacing:10px;

opacity:.82;

cursor:pointer;

transition:1s ease;

z-index:6;
}

.reconnect:hover{
letter-spacing:13px;
opacity:1;
}



/ EMBER /

.ember{
position:absolute;

width:7px;
height:7px;

border-radius:50%;

opacity:0;

pointer-events:none;

background:
radial-gradient(
circle,
rgba(255,220,170,1) 0%,
rgba(255,140,70,.4) 45%,
transparent 100%
);

box-shadow:
0 0 6px rgba(255,120,50,.25);

z-index:20;
}



/ FREQUENCY ARCS /

.frequency{
position:absolute;

left:24px;
bottom:26px;

opacity:0;

transition:4s ease;

z-index:10;
}

.frequency div{

margin-top:12px;

font-size:12px;

font-family:cursive;

letter-spacing:2px;

opacity:.75;
}



/ REVEAL STATES */

.show{
opacity:1;
}

.awaken{
opacity:.12 !important;
}

.fade{
opacity:.02 !important;
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch"></div>

<div class="interference"></div>

<div class="triangle" id="triangle"></div>

<div class="symbol" id="symbol">
.17
</div>

<div class="signal" id="signal">
signal lost
</div>

<div class="reconnect" id="reconnect">
reconnect
</div>

<div class="frequency" id="frequency">

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass it Back</div>

</div>

<div class="ember" id="ember"></div>

</div>

<script>

var reconnect =
document.getElementById("reconnect");

var signal =
document.getElementById("signal");

var ember =
document.getElementById("ember");

var frequency =
document.getElementById("frequency");

var symbol =
document.getElementById("symbol");

var triangle =
document.getElementById("triangle");



reconnect.onclick=function(e){

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left=e.clientX+"px";

ember.style.top=e.clientY+"px";

ember.style.opacity="1";



ember.animate([

{
transform:"scale(.5)",
opacity:1
},

{
transform:"scale(4)",
opacity:.02
}

],{

duration:4200,
fill:"forwards",
easing:"ease-out"

});



setTimeout(function(){

symbol.classList.add("awaken");

triangle.classList.add("fade");

},900);



setTimeout(function(){

frequency.classList.add("show");

},2500);

};

</script>

</body>
</html>
