<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Little Homie V2</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace;color:white}

#stage{position:relative;width:100%;height:100%}

#wrap{

  position:absolute;left:50%;top:43%;

  transform:translateX(-50%);

  width:min(76vw,390px);

}

#bar{

  position:relative;width:100%;height:28px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(255,255,255,.025);

  overflow:hidden;

}

#fill{

  height:100%;width:0%;

  background:repeating-linear-gradient(

    90deg,

    #fff 0 10px,

    transparent 10px 15px

  );

  transition:width .55s linear;

}

#pct{

  position:absolute;inset:0;

  display:flex;align-items:center;justify-content:center;

  color:rgba(255,255,255,.58);

  font-size:13px;letter-spacing:.22em;

  pointer-events:none;

}

#homie{

  position:absolute;

  left:50%;top:54%;

  transform:translateX(-50%);

  width:96px;height:63px;

  image-rendering:pixelated;

}

svg{width:96px;height:63px;overflow:visible;image-rendering:pixelated}

.p{fill:#fff}

.d{fill:rgba(255,255,255,.78)}

.walking{animation:bodyBob 1.1s steps(2,end) infinite}

@keyframes bodyBob{

  0%,100%{margin-top:0}

  50%{margin-top:2px}

}

.jitter{animation:jitter .12s steps(2,end) infinite}

@keyframes jitter{

  0%{transform:translateX(-50%) translateX(0)}

  50%{transform:translateX(-50%) translateX(1px)}

  100%{transform:translateX(-50%) translateX(-1px)}

}

#chaos{

  position:absolute;inset:0;background:#000;opacity:0;

  pointer-events:none;transition:opacity 1.1s ease;

}

#chaosText{

  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

  color:rgba(255,40,40,.35);letter-spacing:.35em;font-size:18px;

  opacity:0;

}

.flash{animation:flash .8s infinite}

@keyframes flash{50%{opacity:.28}}

.run{animation:runAway 3s linear forwards}

@keyframes runAway{

  from{left:50%}

  to{left:110%}

}

</style>

</head>

<body>

<div id="stage">

  <div id="wrap">

    <div id="bar">

      <div id="fill"></div>

      <div id="pct">0%</div>

    </div>

  </div>

  <div id="homie" class="walking"></div>

  <div id="chaos">

    <div id="chaosText">CHAOS</div>

  </div>

</div>

<script>

const homie=document.getElementById("homie");

const fill=document.getElementById("fill");

const pct=document.getElementById("pct");

const chaos=document.getElementById("chaos");

const chaosText=document.getElementById("chaosText");

let percent=0;

let frame=0;

function draw(blocks){

  homie.innerHTML=`<svg viewBox="0 0 32 21">

    ${blocks.map(b=>`<rect class="${b[4]||"p"}" x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}"/>`).join("")}

  </svg>`;

}

const walk1=[

[7,8,2,2],[9,7,3,2],[12,6,8,2],[20,7,3,2],[23,8,2,2],

[8,10,17,2],[7,12,19,2],[9,14,15,2],

[11,9,2,1,"d"],[15,8,2,1,"d"],[19,9,2,1,"d"],

[26,11,4,2],[30,10,2,2],

[4,13,3,2],[2,12,2,2],

[11,16,2,3],[21,16,2,3]

];

const walk2=[

[7,8,2,2],[9,7,3,2],[12,6,8,2],[20,7,3,2],[23,8,2,2],

[8,10,17,2],[7,12,19,2],[9,14,15,2],

[11,9,2,1,"d"],[15,8,2,1,"d"],[19,9,2,1,"d"],

[26,11,4,2],[30,10,2,2],

[4,13,3,2],[2,12,2,2],

[13,16,2,3],[19,16,2,3]

];

const lookBack=[

[7,8,2,2],[9,7,3,2],[12,6,8,2],[20,7,3,2],[23,8,2,2],

[8,10,17,2],[7,12,19,2],[9,14,15,2],

[11,9,2,1,"d"],[15,8,2,1,"d"],[19,9,2,1,"d"],

[0,10,2,2],[2,11,4,2],

[27,14,2,2],

[11,16,2,3],[21,16,2,3]

];

const peek=[

[7,8,2,2],[9,7,3,2],[12,6,8,2],[20,7,3,2],[23,8,2,2],

[8,10,17,2],[7,12,19,2],[9,14,15,2],

[11,9,2,1,"d"],[15,8,2,1,"d"],[19,9,2,1,"d"],

[0,5,2,2],[2,7,2,2],[4,9,2,2],[6,11,2,2],

[27,14,2,2],

[11,16,2,3],[21,16,2,3]

];

const shell=[

[7,8,2,2],[9,7,3,2],[12,6,8,2],[20,7,3,2],[23,8,2,2],

[8,10,17,2],[7,12,19,2],[9,14,15,2],

[11,9,2,1,"d"],[15,8,2,1,"d"],[19,9,2,1,"d"]

];

function walk(){

  draw(frame++%2?walk1:walk2);

}

walk();

const walkAnim=setInterval(walk,650);

const load=setInterval(()=>{

  percent++;

  fill.style.width=percent+"%";

  pct.textContent=percent+"%";

  if(percent===16){

    clearInterval(load);

    homie.classList.remove("walking");

    clearInterval(walkAnim);

    setTimeout(()=>draw(lookBack),500);

    setTimeout(()=>{

      percent=17;

      fill.style.width="17%";

      pct.textContent="17%";

    },900);

    setTimeout(()=>{

      percent=18;

      fill.style.width="18%";

      pct.textContent="18%";

    },1350);

    setTimeout(()=>draw(peek),1650);

    setTimeout(()=>{

      draw(shell);

      homie.classList.add("jitter");

    },2450);

    setTimeout(()=>{

      chaos.style.opacity=1;

      chaosText.style.opacity=.55;

    },3600);

    setTimeout(recovery,6600);

  }

},520);

function recovery(){

  chaos.style.opacity=0;

  chaosText.style.opacity=0;

  homie.classList.remove("jitter");

  fill.style.width="100%";

  pct.textContent="100%";

  pct.classList.add("flash");

  draw(shell);

  setTimeout(()=>draw(peek),1000);

  setTimeout(()=>{

    homie.classList.add("walking");

    setInterval(walk,420);

  },1800);

  setTimeout(()=>{

    homie.classList.add("run");

  },2300);

}

</script>

</body>

</html>
