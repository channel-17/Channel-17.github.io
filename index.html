<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Courier New, monospace;
}

/* =========================
BACKGROUND
========================= */

body{
background:
radial-gradient(circle at center,
rgba(35,18,5,.16) 0%,
rgba(0,0,0,0) 45%),
#000;
}

/* =========================
GLITCH LAYER
========================= */

#glitch{
position:fixed;
inset:0;
pointer-events:none;
opacity:0;
z-index:50;
mix-blend-mode:screen;
}

.glitch-bar{
position:absolute;
left:-10%;
width:120%;
height:2px;
background:
linear-gradient(90deg,
transparent,
rgba(255,120,40,.9),
transparent);
animation:glitchMove .18s linear infinite;
}

.glitch-bar:nth-child(1){top:12%;}
.glitch-bar:nth-child(2){top:28%;}
.glitch-bar:nth-child(3){top:47%;}
.glitch-bar:nth-child(4){top:66%;}
.glitch-bar:nth-child(5){top:84%;}

@keyframes glitchMove{
0%{
transform:translateX(-8%);
opacity:.1;
}
50%{
transform:translateX(5%);
opacity:.8;
}
100%{
transform:translateX(-6%);
opacity:.05;
}
}

/* =========================
CENTER SYMBOL
========================= */

#symbolWrap{
position:absolute;
top:42%;
left:50%;
transform:translate(-50%,-50%);
width:min(72vw,420px);
aspect-ratio:1/1;
display:flex;
align-items:center;
justify-content:center;
z-index:5;
}

/* OUTER TRIANGLE */

#outer{
position:absolute;
width:100%;
opacity:.42;
filter:blur(.3px);
animation:outerPulse 8s ease-in-out infinite;
}

@keyframes outerPulse{
0%,100%{
opacity:.22;
transform:scale(1);
}
50%{
opacity:.42;
transform:scale(1.01);
}
}

/* INNER TRUST */

#inner{
position:absolute;
width:46%;
opacity:.82;
filter:
drop-shadow(0 0 8px rgba(255,170,90,.18))
drop-shadow(0 0 22px rgba(255,110,20,.08));
animation:innerBreath 6s ease-in-out infinite;
}

@keyframes innerBreath{
0%,100%{
opacity:.65;
}
50%{
opacity:.95;
}
}

/* =========================
SIGNAL LOST
========================= */

#signal{
position:absolute;
top:61%;
left:50%;
transform:translateX(-50%);
font-size:clamp(12px,2vw,20px);
letter-spacing:.45em;
color:rgba(220,220,220,.22);
opacity:0;
animation:signalFlash .9s infinite;
z-index:10;
}

@keyframes signalFlash{
0%,100%{
opacity:.12;
}
50%{
opacity:.42;
}
}

/* =========================
RECONNECT
========================= */

#reconnect{
position:absolute;
top:71%;
left:50%;
transform:translateX(-50%);
font-size:clamp(34px,6vw,58px);
letter-spacing:.28em;
color:#f6e6d2;
opacity:0;
cursor:pointer;
transition:.4s;
z-index:20;
text-shadow:
0 0 12px rgba(255,160,90,.12),
0 0 30px rgba(255,120,40,.08);
}

#reconnect.active{
opacity:1;
animation:rePulse 4s ease-in-out infinite;
}

@keyframes rePulse{
0%,100%{
opacity:.82;
}
50%{
opacity:1;
}
}

#reconnect:hover{
transform:translateX(-50%) scale(1.04);
}

/* =========================
ETCHINGS
========================= */

#etchings{
position:absolute;
inset:0;
opacity:0;
transition:2s ease;
pointer-events:none;
z-index:15;
}

.etch{
position:absolute;
max-width:72vw;
opacity:.92;
filter:
drop-shadow(0 0 10px rgba(255,130,50,.18));
}

#etch1{
width:min(54vw,320px);
left:8%;
top:22%;
transform:rotate(-3deg);
}

#etch2{
width:min(60vw,340px);
left:11%;
top:46%;
transform:rotate(2deg);
}

#etch3{
width:min(56vw,300px);
left:14%;
bottom:15%;
transform:rotate(-4deg);
}

/* =========================
SMOKE
========================= */

#smoke{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:3;
}

.smoke{
position:absolute;
width:50vw;
height:50vw;
background:
radial-gradient(circle,
rgba(255,255,255,.045) 0%,
rgba(255,255,255,.02) 18%,
transparent 70%);
filter:blur(40px);
opacity:0;
animation:smokeFloat 28s linear infinite;
}

.smoke:nth-child(1){
left:-10%;
bottom:-10%;
animation-delay:0s;
}

.smoke:nth-child(2){
right:-20%;
top:10%;
animation-delay:8s;
}

.smoke:nth-child(3){
left:20%;
bottom:-20%;
animation-delay:16s;
}

@keyframes smokeFloat{
0%{
transform:translateX(0) translateY(0) scale(1);
opacity:0;
}
10%{
opacity:.12;
}
50%{
opacity:.06;
}
100%{
transform:translateX(140px) translateY(-220px) scale(1.3);
opacity:0;
}
}

/* =========================
AFTER CONNECT
========================= */

.connected #outer{
opacity:.08;
filter:blur(2px);
transition:3s ease;
}

.connected #signal{
display:none;
}

.connected #reconnect{
display:none;
}

.connected #etchings{
opacity:1;
pointer-events:auto;
}

</style>
</head>

<body>

<!-- GLITCH -->
<div id="glitch">
<div class="glitch-bar"></div>
<div class="glitch-bar"></div>
<div class="glitch-bar"></div>
<div class="glitch-bar"></div>
<div class="glitch-bar"></div>
</div>

<!-- SMOKE -->
<div id="smoke">
<div class="smoke"></div>
<div class="smoke"></div>
<div class="smoke"></div>
</div>

<!-- SYMBOL -->
<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<!-- SIGNAL -->
<div id="signal">
signal lost
</div>

<!-- RECONNECT -->
<div id="reconnect">
RECONNECT
</div>

<!-- ETCHINGS -->
<div id="etchings">

<a href="#">
<img class="etch" id="etch1" src="lastsesh17.png">
</a>

<a href="#">
<img class="etch" id="etch2" src="RoachTray17.png">
</a>

<a href="#">
<img class="etch" id="etch3" src="PassItBack17.png">
</a>

</div>

<script>

/* =========================
OPENING GLITCH
========================= */

const glitch = document.getElementById("glitch");

setTimeout(()=>{
glitch.style.opacity = 1;
},100);

setTimeout(()=>{
glitch.style.opacity = 0;
},1500);

/* =========================
SIGNAL + RECONNECT TIMING
========================= */

const signal = document.getElementById("signal");
const reconnect = document.getElementById("reconnect");

setTimeout(()=>{
signal.style.opacity = 1;
},2200);

setTimeout(()=>{
signal.style.opacity = 0;
},5200);

setTimeout(()=>{
reconnect.classList.add("active");
},5700);

/* =========================
RECONNECT CLICK
========================= */

reconnect.addEventListener("click",()=>{

document.body.classList.add("connected");

/* subtle flash */

document.body.animate([
{filter:"brightness(1)"},
{filter:"brightness(1.16)"},
{filter:"brightness(1)"}
],{
duration:900,
easing:"ease"
});

});

</script>

</body>
</html>
