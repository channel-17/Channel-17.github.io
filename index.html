<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

body {

    margin: 0;

    background: black;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    font-family: Arial, sans-serif;

    color: #d8d1bf;

}

.container {

    text-align: center;

}

/* SYMBOL */

.symbol-wrap {

    position: relative;

    width: 260px;

    margin: auto;

    animation: symbolFade 2.8s ease forwards;

}

.symbol-base {

    width: 100%;

    display: block;

}

/* WALL OVERLAY */

.wall {

    position: absolute;

    background: rgba(0,0,0,0.85);

    transition: all 2.4s ease;

    pointer-events: none;

}

/* LEFT WALL */

.wall-left {

    width: 16px;

    height: 230px;

    left: 52px;

    top: 6px;

    transform: rotate(26deg);

    transform-origin: bottom center;

}

/* RIGHT WALL */

.wall-right {

    width: 16px;

    height: 230px;

    right: 52px;

    top: 6px;

    transform: rotate(-26deg);

    transform-origin: bottom center;

}

/* BOTTOM WALL */

.wall-bottom {

    width: 190px;

    height: 16px;

    left: 35px;

    bottom: 18px;

}

/* DISSOLVE */

.connected .wall-left {

    opacity: 0;

    transform:

        rotate(26deg)

        translate(-140px,-90px);

}

.connected .wall-right {

    opacity: 0;

    transform:

        rotate(-26deg)

        translate(140px,-90px);

}

.connected .wall-bottom {

    opacity: 0;

    transform: translateY(100px);

}

/* SYMBOL FADE IN */

@keyframes symbolFade {

    0% {

        opacity: 0;

        transform: scale(0.96);

        filter: blur(8px);

    }

    100% {

        opacity: 1;

        transform: scale(1);

        filter: blur(0px);

    }

}

/* SIGNAL LOST */

#signalText {

    margin-top: 42px;

    letter-spacing: 12px;

    font-size: 20px;

    opacity: 0;

    animation: textAppear 1s forwards 2.2s;

}

@keyframes textAppear {

    to {

        opacity: 0.8;

    }

}

/* RECONNECT */

#reconnectBtn {

    margin-top: 50px;

    background: transparent;

    border: none;

    color: #d8d1bf;

    font-size: 18px;

    letter-spacing: 10px;

    opacity: 0;

    cursor: pointer;

    animation:

        reconnectAppear 1s forwards 3.3s,

        reconnectPulse 2.4s infinite 4.3s;

}

@keyframes reconnectAppear {

    to {

        opacity: 0.4;

    }

}

@keyframes reconnectPulse {

    0% {

        opacity: 0.35;

        text-shadow: 0 0 0px rgba(216,209,191,0);

    }

    50% {

        opacity: 1;

        text-shadow:

            0 0 8px rgba(216,209,191,0.45),

            0 0 18px rgba(216,209,191,0.25);

    }

    100% {

        opacity: 0.35;

        text-shadow: 0 0 0px rgba(216,209,191,0);

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="symbol-wrap" id="symbolWrap">

        <!-- YOUR SYMBOL -->

        <img src="symbol.png" class="symbol-base">

        <!-- DISSOLVING WALLS -->

        <div class="wall wall-left"></div>

        <div class="wall wall-right"></div>

        <div class="wall wall-bottom"></div>

    </div>

    <div id="signalText">

        SIGNAL LOST...

    </div>

    <button id="reconnectBtn">

        RECONNECT

    </button>

</div>

<script>

const reconnectBtn = document.getElementById("reconnectBtn");

const symbolWrap = document.getElementById("symbolWrap");

reconnectBtn.addEventListener("click", () => {

    symbolWrap.classList.add("connected");

    reconnectBtn.style.opacity = "0";

    setTimeout(() => {

        document.body.style.transition = "opacity 2s ease";

        document.body.style.opacity = "0";

    }, 2600);

});

</script>

</body>

</html>
