<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL 17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Courier New, monospace;
}

/* =========================================
CANVAS
========================================= */

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
display:block;
z-index:1;
background:#000;
}

/* =========================================
STATIC
========================================= */

#noise{
position:fixed;
inset:0;
pointer-events:none;
opacity:.03;
z-index:2;

background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.025) 0px,
rgba(255,255,255,.025) 1px,
transparent 1px,
transparent 4px
);

animation:noise .12s linear infinite;
}

@keyframes noise{

0%{
transform:translateY(0px);
}

100%{
transform:translateY(4px);
}

}

/* =========================================
OVERLAY
========================================= */

#overlay{
position:fixed;
inset:0;
z-index:10;
pointer-events:none;
}

/* =========================================
SIGNAL LOST
========================================= */

#signalLost{

position:absolute;

top:53%;
left:50%;

transform:translateX(-50%);

font-size:clamp(28px,4vw,52px);

letter-spacing:.18em;

color:white;

opacity:0;

white-space:nowrap;

}

#signalLost.active{

animation:warningPulse .45s ease infinite;

}

@keyframes warningPulse{

0%{
opacity:.04;
}

35%{
opacity:1;
}

100%{
opacity:.04;
}

}

/* =========================================
SYMBOL
========================================= */

#symbolWrap{

position:absolute;

top:39%;
left:50%;

transform:translate(-50%,-50%);

width:min(78vw,470px);

aspect-ratio:1/1;

display:flex;
justify-content:center;
align-items:center;

opacity:0;

transition:2.8s ease;

}

#symbolWrap.visible{
opacity:1;
}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:6s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.34;

transition:6s ease;

}

/* =========================================
RECONNECT
========================================= */

#reconnect{

position:absolute;

top:59%;
left:50%;

transform:translateX(-50%);

font-size:clamp(18px,3vw,30px);

letter-spacing:.24em;

color:#efc18a;

opacity:0;

pointer-events:none;

cursor:pointer;

transition:2s ease;

text-shadow:
0 0 6px rgba(255,140,40,.03),
0 0 18px rgba(255,120,20,.02);

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:reconnectPulse 4s ease-in-out infinite;

}

@keyframes reconnectPulse{

0%,100%{
opacity:.26;
}

50%{

opacity:1;

text-shadow:
0 0 12px rgba(255,180,90,.22),
0 0 34px rgba(255,120,20,.14);

}

}

/* =========================================
VIRUS SPREAD
========================================= */

#warmth{

position:fixed;
inset:0;

z-index:3;

pointer-events:none;

opacity:0;

background:
radial-gradient(circle at center,
rgba(255,140,40,.20) 0%,
rgba(255,120,20,.09) 10%,
rgba(255,110,20,.04) 18%,
transparent 38%);

mix-blend-mode:screen;

transition:8s ease;

}

/* =========================================
SMOKE
========================================= */

#smoke{

position:fixed;
inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:5s ease;

}

.cloud{

position:absolute;

width:55vw;
height:55vw;

border-radius:50%;

background:
radial-gradient(circle,
rgba(255,255,255,.05) 0%,
rgba(255,255,255,.02) 18%,
transparent 70%);

filter:blur(45px);

animation:smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;
bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;
top:10%;

animation-duration:34s;
animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;
bottom:-20%;

animation-duration:30s;
animation-delay:15s;

}

@keyframes smoke{

0%{
transform:translate(0,0) scale(1);
opacity:0;
}

10%{
opacity:.12;
}

50%{
opacity:.05;
}

100%{
transform:translate(160px,-220px) scale(1.35);
opacity:0;
}

}

/* =========================================
ETCHINGS
========================================= */

#etchings{

position:absolute;
inset:0;

opacity:0;

pointer-events:none;

transition:4s ease;

}

#etchings.visible{

opacity:1;
pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.08;

filter:
drop-shadow(0 0 12px rgba(255,120,20,.08));

transition:4s ease;

}

.connected .etch{
opacity:1;
}

#etch1{

width:min(52vw,320px);

left:18%;
top:36%;

transform:rotate(-2deg);

}

#etch2{

width:min(62vw,390px);

left:12%;
top:46%;

transform:rotate(2deg);

}

#etch3{

width:min(58vw,340px);

left:23%;
bottom:7%;

transform:rotate(-4deg);

}

/* =========================================
CONNECTED
========================================= */

.connected #warmth{
opacity:1;
}

.connected #smoke{
opacity:1;
}

.connected #outer{

opacity:.02;

filter:
blur(2px);

}

.connected #inner{

opacity:1;

filter:
drop-shadow(0 0 18px rgba(255,180,90,.24))
drop-shadow(0 0 56px rgba(255,120,20,.16));

}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="warmth"></div>

<div id="smoke">

<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

</div>

<div id="overlay">

<div id="signalLost">
SIGNAL LOST
</div>

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">
<img id="inner" src="Inner17-final.png">

</div>

<div id="reconnect">
RECONNECT
</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">
<img src="lastsesh17.png" width="100%">
</a>

<a class="etch" id="etch2" href="#">
<img src="RoachTray17.png" width="100%">
</a>

<a class="etch" id="etch3" href="#">
<img src="PassItBack17.png" width="100%">
</a>

</div>

</div>

<script>

/* =========================================
CANVAS
========================================= */

const canvas =
document.getElementById("matrix");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

/* =========================================
SETTINGS
========================================= */

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 16;

const rows =
Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:
canvas.width * .58,

y:
canvas.height * .58,

w:240,
h:120

};

/* =========================================
BUILD STREAMS
========================================= */

for(let i=0;i<rows;i++){

streams.push({

y: i * fontSize,

x:
Math.random() * -2200,

speed:
22 + Math.random() * 38,

length:
20 + Math.random() * 70,

laps:
0,

finished:false,

vertical:
Math.random() > .76,

dead:
Math.random() > .90,

flash:
Math.random() > .95,

glitch:
Math.random() > .93

});

}

/* =========================================
DRAW MATRIX
========================================= */

function drawMatrix(){

ctx.fillStyle =
"rgba(0,0,0,0.14)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =
stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&
charX < hidden17.x + hidden17.w &&
stream.y > hidden17.y &&
stream.y < hidden17.y + hidden17.h;

/* hidden .17 */

if(!inside17){

ctx.fillStyle =
`rgba(100,255,100,${
1 - (i / stream.length)
})`;

ctx.font =
fontSize + "px monospace";

ctx.fillText(

chars[
Math.floor(
Math.random() * chars.length
)
],

charX,
stream.y

);

}

/* vertical corruption */

if(
stream.vertical &&
Math.random() > .984
){

ctx.fillStyle =
"rgba(100,255,100,.55)";

ctx.fillText(

chars[
Math.floor(
Math.random() * chars.length
)
],

charX,
stream.y + (Math.random()*180)

);

}

/* white flash corruption */

if(
stream.flash &&
Math.random() > .992
){

ctx.fillStyle =
"rgba(255,255,255,.9)";

ctx.fillText(

chars[
Math.floor(
Math.random() * chars.length
)
],

charX,
stream.y

);

}

/* glitch bursts */

if(
stream.glitch &&
Math.random() > .994
){

ctx.fillStyle =
"rgba(100,255,100,.25)";

ctx.fillRect(

charX,
stream.y,

Math.random() * 80,
2

);

}

/* dead chunks */

if(
stream.dead &&
Math.random() > .988
){

ctx.clearRect(
charX,
stream.y,
fontSize,
fontSize
);

}

}

stream.x += stream.speed;

/* laps */

if(
stream.x -
(stream.length * fontSize)
>
canvas.width + 300
){

stream.laps++;

if(stream.laps >= 3){

stream.finished = true;

}else{

stream.x =
Math.random() * -1800;

}

}

});

/* all complete */

const unfinished =
streams.some(s => !s.finished);

if(!unfinished){

clearInterval(matrixLoop);

/* lingering destabilization */

setTimeout(()=>{

systemFailure();

},900);

}

}

/* =========================================
SYSTEM FAILURE
========================================= */

function systemFailure(){

ctx.fillStyle =
"rgba(0,0,0,.45)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

/* white interference */

for(let i=0;i<40;i++){

ctx.fillStyle =
`rgba(255,255,255,${
Math.random() * .18
})`;

ctx.fillRect(

Math.random() * canvas.width,
Math.random() * canvas.height,

Math.random() * 220,
1 + Math.random() * 2

);

}

const signalLost =
document.getElementById("signalLost");

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* warning disappears */

setTimeout(()=>{

signalLost.style.opacity = 0;

},1400);

/* darkness pause */

setTimeout(()=>{

document
.getElementById("symbolWrap")
.classList.add("visible");

},2600);

/* reconnect invitation */

setTimeout(()=>{

signalLost.classList.remove("active");

document
.getElementById("reconnect")
.classList.add("active");

},4200);

}

/* =========================================
START
========================================= */

const matrixLoop =
setInterval(drawMatrix,22);

/* =========================================
RECONNECT
========================================= */

const reconnect =
document.getElementById("reconnect");

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.classList.add("connected");

/* virus spread */

document
.getElementById("warmth")
.animate([

{
clipPath:"circle(0% at center)"
},

{
clipPath:"circle(62% at center)"
}

],{

duration:8000,
fill:"forwards",
easing:"ease"

});

/* smoke */

setTimeout(()=>{

document
.getElementById("smoke")
.style.opacity = 1;

},2200);

/* etchings emerge */

setTimeout(()=>{

document
.getElementById("etchings")
.classList.add("visible");

},6400);

});

</script>

</body>
</html>
