<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

body{

    margin:0;

    background:#000;

    overflow:hidden;

    font-family:Arial,sans-serif;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    color:#d8d2bf;

}

.container{

    text-align:center;

    position:relative;

    transition:opacity 2.5s ease;

}

.symbol-wrap{

    position:relative;

    width:220px;

    margin:auto;

}

/* YOUR ORIGINAL SYMBOL IMAGE */

#symbol{

    width:220px;

    opacity:0;

    animation:symbolFade 5s ease forwards;

    transition:2.8s ease;

    filter:

        drop-shadow(0 0 12px rgba(216,210,191,.08))

        brightness(.95);

}

/* WALL OVERLAYS */

.wall{

    position:absolute;

    background:#000;

    opacity:0;

    transition:2.6s ease;

    pointer-events:none;

}

/* LEFT */

.left-wall{

    width:80px;

    height:240px;

    left:-12px;

    top:-18px;

    transform:rotate(28deg);

}

/* RIGHT */

.right-wall{

    width:80px;

    height:240px;

    right:-12px;

    top:-18px;

    transform:rotate(-28deg);

}

/* BOTTOM */

.bottom-wall{

    width:180px;

    height:50px;

    bottom:-6px;

    left:20px;

}

/* WALL DISSOLVE */

.open .left-wall{

    transform:

        rotate(28deg)

        translate(-90px,-40px);

    opacity:1;

}

.open .right-wall{

    transform:

        rotate(-28deg)

        translate(90px,-40px);

    opacity:1;

}

.open .bottom-wall{

    transform:translateY(70px);

    opacity:1;

}

@keyframes symbolFade{

    from{

        opacity:0;

        transform:scale(.985);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

/* SIGNAL LOST */

.signal{

    margin-top:34px;

    width:340px;

    margin-left:auto;

    margin-right:auto;

    text-align:left;

    font-size:18px;

    letter-spacing:10px;

    min-height:26px;

    opacity:.9;

}

/* RECONNECT */

.reconnect{

    margin-top:32px;

    opacity:0;

    animation:

        pulse 2.8s ease-in-out infinite;

    transition:opacity 1.5s ease;

}

.reconnect button{

    background:none;

    border:1px solid rgba(216,210,191,.18);

    color:#d8d2bf;

    padding:12px 30px;

    letter-spacing:5px;

    font-size:11px;

    cursor:pointer;

    transition:.4s ease;

}

.reconnect button:hover{

    border-color:rgba(216,210,191,.55);

    background:rgba(216,210,191,.04);

}

@keyframes pulse{

    0%{

        opacity:.25;

    }

    50%{

        opacity:.7;

    }

    100%{

        opacity:.25;

    }

}

/* SUBTLE GLITCH */

.glitch{

    animation:glitch .14s linear;

}

@keyframes glitch{

    0%{

        transform:translate(0px,0px);

    }

    25%{

        transform:translate(-1px,1px);

    }

    50%{

        transform:translate(1px,-1px);

    }

    100%{

        transform:translate(0px,0px);

    }

}

.fade-out{

    opacity:0;

}

</style>

</head>

<body>

<div class="container" id="container">

    <div class="symbol-wrap" id="symbolWrap">

        <!-- YOUR REAL SYMBOL -->

        <img src="symbol.png" id="symbol">

        <!-- DISSOLVE MASKS -->

        <div class="wall left-wall"></div>

        <div class="wall right-wall"></div>

        <div class="wall bottom-wall"></div>

    </div>

    <div class="signal" id="signal"></div>

    <div class="reconnect" id="reconnectBox">

        <button onclick="reconnect()">

            RECONNECT

        </button>

    </div>

</div>

<script>

const text = "SIGNAL LOST...";

const signal = document.getElementById("signal");

let i = 0;

/* TYPEWRITER */

function typeSignal(){

    if(i < text.length){

        signal.innerHTML += text.charAt(i);

        /* RANDOM GLITCH */

        if(Math.random() > .76){

            signal.classList.add("glitch");

            setTimeout(()=>{

                signal.classList.remove("glitch");

            },100);

        }

        i++;

        setTimeout(typeSignal,145);

    } else {

        /* DELAY BEFORE RECONNECT */

        setTimeout(()=>{

            document.getElementById("reconnectBox")

            .style.opacity = 1;

        },1200);

    }

}

/* START AFTER SYMBOL */

setTimeout(typeSignal,5200);

/* RECONNECT */

function reconnect(){

    document.getElementById("symbolWrap")

    .classList.add("open");

    document.getElementById("reconnectBox")

    .style.opacity = 0;

    /* SMALL PAUSE */

    setTimeout(()=>{

        /* WHOLE PAGE FADES */

        document.getElementById("container")

        .classList.add("fade-out");

    },3200);

    /* THIS IS WHERE YOUR VOICE STARTS */

    setTimeout(()=>{

        console.log("START AUDIO");

        /*

        PLACE YOUR AUDIO HERE LATER

        */

    },5200);

}

</script>

</body>

</html>
