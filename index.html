<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<!-- FAVICON -->

<link rel="icon" type="image/png" sizes="32x32" href="Favicon17wh.png">

<link rel="shortcut icon" href="Favicon17wh.png">

<link rel="apple-touch-icon" sizes="512x512" href="favicon.png">

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  background:#000;

  overflow:hidden;

  height:100vh;

  width:100vw;

  display:flex;

  justify-content:center;

  align-items:center;

  font-family:"Courier New", monospace;

  color:#d8d2c8;

}

.screen{

  position:relative;

  width:100%;

  height:100vh;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  background:#000;

  transition:background 4s ease;

}

/* SYMBOL */

.symbol-wrap{

  position:relative;

  width:250px;

  height:250px;

  animation:

  symbolAppear 6.2s ease-out forwards;

  animation-delay:1.8s;

}

.outer-symbol,

.inner-symbol{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  pointer-events:none;

}

.outer-symbol{

  z-index:2;

  transition:

  opacity 8.5s ease,

  filter 8.5s ease,

  transform 8.5s ease;

}

.inner-symbol{

  z-index:1;

  transition:

  filter 5s ease;

}

@keyframes symbolAppear{

  0%{

    opacity:0;

    filter:blur(26px);

    transform:scale(.95);

  }

  20%{

    opacity:.03;

  }

  40%{

    opacity:.10;

  }

  65%{

    opacity:.38;

  }

  100%{

    opacity:1;

    filter:blur(0px);

    transform:scale(1);

  }

}

/* GLITCH */

.glitch{

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:99;

  opacity:0;

  mix-blend-mode:screen;

  filter:brightness(2.5) contrast(3) blur(1px);

}

.glitch.active{

  opacity:1;

  animation:glitchFlash .9s ease-out forwards;

}

@keyframes glitchFlash{

  0%{

    opacity:0;

  }

  8%{

    opacity:1;

    transform:translateX(-18px);

  }

  16%{

    opacity:0;

    transform:translateX(15px);

  }

  24%{

    opacity:.95;

    transform:translateX(-10px);

  }

  36%{

    opacity:0;

  }

  52%{

    opacity:.75;

    transform:translateY(7px);

  }

  68%{

    opacity:0;

  }

  100%{

    opacity:0;

  }

}

/* TEXT */

.text-zone{

  position:relative;

  margin-top:-2px;

  height:70px;

  display:flex;

  align-items:center;

  justify-content:center;

}

.signal-line,

.reconnect{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  white-space:nowrap;

  letter-spacing:8px;

}

.signal-line{

  font-size:1.5rem;

  color:#bfb7a8;

  opacity:0;

}

.reconnect{

  font-size:1.45rem;

  color:#d8d2c8;

  opacity:0;

  cursor:pointer;

  user-select:none;

  transition:opacity .8s ease;

}

/* RECONNECT */

.reconnect.live{

  animation:

  reconnectPulse 1.9s ease-in-out infinite;

}

@keyframes reconnectPulse{

  0%{

    opacity:.10;

    text-shadow:

    0 0 0px rgba(255,255,255,0);

  }

  20%{

    opacity:.26;

    text-shadow:

    0 0 5px rgba(255,255,255,.05);

  }

  50%{

    opacity:1;

    text-shadow:

    0 0 10px rgba(255,255,255,.24),

    0 0 24px rgba(255,255,255,.10),

    0 0 42px rgba(255,255,255,.05);

  }

  78%{

    opacity:.38;

    text-shadow:

    0 0 7px rgba(255,255,255,.08);

  }

  100%{

    opacity:.12;

    text-shadow:

    0 0 0px rgba(255,255,255,0);

  }

}

/* DISSOLVE */

.outer-symbol.dissolve{

  animation:signalErode 1.9s linear forwards;

}

@keyframes signalErode{

  0%{

    opacity:1;

    filter:

    blur(0px)

    brightness(1);

    clip-path:inset(0 0 0 0);

  }

  12%{

    clip-path:polygon(

      0% 0%,

      100% 0%,

      100% 100%,

      0% 100%

    );

  }

  28%{

    opacity:1;

    filter:

    blur(.5px)

    brightness(1.05);

    clip-path:polygon(

      0% 0%,

      96% 0%,

      92% 18%,

      100% 36%,

      94% 58%,

      100% 100%,

      0% 100%,

      4% 70%,

      0% 42%

    );

  }

  45%{

    opacity:.9;

    filter:

    blur(1px)

    brightness(.95);

    clip-path:polygon(

      6% 0%,

      100% 0%,

      88% 22%,

      100% 52%,

      82% 100%,

      0% 100%,

      10% 62%,

      0% 26%

    );

  }

  68%{

    opacity:.55;

    filter:

    blur(3px)

    brightness(.7);

    clip-path:polygon(

      16% 0%,

      100% 10%,

      76% 36%,

      100% 74%,

      58% 100%,

      0% 88%,

      20% 48%,

      0% 12%

    );

  }

  100%{

    opacity:0;

    filter:

    blur(10px)

    brightness(.25);

    clip-path:polygon(

      42% 0%,

      100% 28%,

      62% 58%,

      100% 100%,

      28% 100%,

      0% 64%,

      36% 40%,

      0% 0%

    );

  }


}

</style>

</head>

<body>

<div class="screen" id="screen">

  <div class="symbol-wrap">

    <img src="Inner17-final.png"

         class="inner-symbol"

         id="innerSymbol" />

    <img src="Outer17-final.png"

         class="outer-symbol"

         id="outerSymbol" />

    <div class="glitch"

     id="glitch">

  <img src="Outer17-final.png"

       class="outer-symbol" />

</div>

  </div>

  <div class="text-zone">

    <div class="signal-line"

         id="signalLine"></div>

    <div class="reconnect"

         id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

const signalLine =

document.getElementById("signalLine");

const reconnect =

document.getElementById("reconnect");

const outerSymbol =

document.getElementById("outerSymbol");

const innerSymbol =

document.getElementById("innerSymbol");

const glitch =

document.getElementById("glitch");

const screen =

document.getElementById("screen");

const phrase = "signal lost";

let index = 0;

/* GLITCH */

setTimeout(() => {

  glitch.classList.add("active");

}, 1200);

/* TYPE */

setTimeout(() => {

  signalLine.style.opacity = 1;

  typePhrase();

}, 8350);

function typePhrase(){

  if(index < phrase.length){

    signalLine.innerHTML +=

    phrase.charAt(index);

    index++;

    setTimeout(typePhrase, 250);

  } else {

    beginDots();

  }

}

/* SEARCH */

function beginDots(){

  let cycle = 0;

  function runCycle(){

    if(cycle >= 3){

      fadeSignalOut();

      return;

    }

    let dot = 0;

    function animateDots(){

      if(dot <= 3){

        signalLine.innerHTML =

        "signal lost" + ".".repeat(dot);

        dot++;

        setTimeout(animateDots, 470);

      } else {

        signalLine.innerHTML =

        "signal lost";

        cycle++;

        setTimeout(runCycle, 700);

      }

    }

    animateDots();

  }

  setTimeout(runCycle, 900);

}

/* FADE SIGNAL */

function fadeSignalOut(){

  signalLine.style.transition =

  "opacity 2.5s ease";

  signalLine.style.opacity = 0;

  setTimeout(() => {

    activateReconnect();

  }, 1800);

}

/* RECONNECT */

function activateReconnect(){

  reconnect.style.opacity = .08;

  setTimeout(() => {

    reconnect.classList.add("live");

  }, 950);

}

/* CLICK */

reconnect.addEventListener("click", () => {

  reconnect.style.pointerEvents = "none";

  reconnect.classList.remove("live");

  reconnect.style.animation = "none";

  reconnect.style.transition =

  "opacity 1.8s ease";

  reconnect.style.opacity = 0;

  setTimeout(() => {

    outerSymbol.classList.add("dissolve");

    screen.style.background =

    "#020202";

    innerSymbol.style.filter =

    `

    drop-shadow(0 0 12px rgba(255,245,220,.12))

    drop-shadow(0 0 30px rgba(255,245,220,.08))

    `;

  }, 1700);

});

</script>

</body>

</html>
