<!-- =========================================

CHANNEL 17 :: MASTER PASS V2

========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BODY

========================================= */

body{

background:#000;

color:#fff;

overflow:hidden;

}

/* =========================================

GLOBAL NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.08;

z-index:999;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .06s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

BREATHING DARKNESS

========================================= */

#breath{

position:fixed;

inset:0;

pointer-events:none;

z-index:5;

opacity:.14;

background:

radial-gradient(

circle,

rgba(255,180,90,.03) 0%,

transparent 70%

);

animation:

breathe 7s ease-in-out infinite;

}

@keyframes breathe{

0%,100%{

opacity:.09;

}

50%{

opacity:.17;

}

}

/* =========================================

VIGNETTE

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 52%,

rgba(0,0,0,.48) 72%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================

LOADER

========================================= */

#loader{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:1000;

transition:

1s ease;

}

/* transmission tube */

#tube{

position:relative;

width:min(84vw,560px);

height:26px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.14);

background:

rgba(255,255,255,.02);

box-shadow:

0 0 12px rgba(255,255,255,.03);

}

/* subtle imperfection */

#tube::after{

content:"";

position:absolute;

inset:0;

opacity:.15;

background:

linear-gradient(

180deg,

rgba(255,255,255,.08),

transparent

);

mix-blend-mode:screen;

}

/* fill */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.9),

rgba(255,255,255,1)

);

}

/* turtle */

#turtle{

margin-top:28px;

font-size:28px;

opacity:.88;

transition:

.28s ease;

filter:

drop-shadow(

0 0 12px rgba(255,255,255,.06)

);

}

/* percent */

#percent{

margin-top:18px;

font-size:13px;

letter-spacing:.34em;

opacity:.16;

}

/* =========================================

CHAOS

========================================= */

#chaos{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

opacity:0;

z-index:300;

transition:

.4s ease;

}

/* duplicated bars */

.ghostBar{

position:absolute;

left:0;

width:100%;

height:54px;

border-bottom:

1px solid rgba(255,255,255,.06);

background:

linear-gradient(

180deg,

rgba(255,255,255,.03),

transparent

);

mix-blend-mode:screen;

}

/* duplicated fake search */

.searchGhost{

position:absolute;

width:72vw;

height:48px;

left:50%;

transform:

translateX(-50%);

border-radius:999px;

border:

1px solid rgba(255,255,255,.08);

background:

rgba(255,255,255,.03);

opacity:.08;

}

/* warnings */

.warning{

position:absolute;

font-size:

clamp(10px,1.6vw,18px);

letter-spacing:.2em;

white-space:nowrap;

opacity:0;

color:#ff3a3a;

text-shadow:

0 0 10px rgba(255,0,0,.35);

animation:

warn .32s linear;

}

@keyframes warn{

0%{

opacity:0;

transform:

translateX(-8px);

}

40%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(8px);

}

}

/* SIGNAL LOST */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(28px,5vw,74px);

letter-spacing:.24em;

white-space:nowrap;

opacity:0;

color:#fff;

text-shadow:

0 0 18px rgba(255,255,255,.12);

}

/* =========================================

MATRIX

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

pointer-events:none;

z-index:260;

opacity:0;

}

/* =========================================

FLASH

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

z-index:500;

mix-blend-mode:screen;

}

/* =========================================

SIGNAL SPACE

========================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2s ease;

z-index:1200;

}

/* symbol */

#symbol{

position:absolute;

width:min(72vw,420px);

opacity:.34;

filter:

blur(.3px)

drop-shadow(

0 0 14px rgba(255,255,255,.06)

);

}

/* reconnect */

#reconnect{

position:absolute;

top:50%;

transform:

translateY(34px);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.32em;

opacity:0;

cursor:pointer;

color:

rgba(255,255,255,.78);

text-shadow:

0 0 12px rgba(255,255,255,.06);

animation:

rePulse 4s ease-in-out infinite;

transition:

1s ease;

}

@keyframes rePulse{

0%,100%{

opacity:.62;

}

50%{

opacity:.88;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

transition:

4s ease;

}

/* links */

.etch{

position:absolute;

display:block;

opacity:.18;

filter:

blur(.15px)

drop-shadow(

0 0 12px rgba(255,180,90,.04)

);

}

/* imperfect placements */

#etch1{

width:min(38vw,220px);

left:11%;

top:58%;

transform:

rotate(-3deg);

opacity:.76;

}

#etch2{

width:min(44vw,270px);

left:26%;

top:76%;

transform:

rotate(1.4deg);

opacity:.54;

}

#etch3{

width:min(28vw,160px);

left:64%;

top:77%;

transform:

rotate(-5deg);

opacity:.34;

}

/* =========================================

CONNECTED

========================================= */

.connected #signalSpace{

opacity:1;

}

.connected #etchings{

opacity:1;

}

/* =========================================

THERMAL TOUCH

========================================= */

#touch{

position:fixed;

width:34px;

height:34px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:999999;

background:

radial-gradient(

circle,

rgba(255,220,180,.28) 0%,

rgba(255,180,90,.12) 28%,

transparent 80%

);

filter:

blur(10px);

transform:

translate(-50%,-50%);

}

/* =========================================

SHAKE

========================================= */

.shake{

animation:

shake .08s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(1px,-1px);

}

50%{

transform:translate(-1px,1px);

}

75%{

transform:translate(1px,1px);

}

100%{

transform:translate(0px,0px);

}

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="breath"></div>

<div id="flash"></div>

<!-- =========================================

LOADER

========================================= -->

<div id="loader">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtle">

🐢

</div>

<div id="percent">

0%

</div>

</div>

<!-- =========================================

CHAOS

========================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================

MATRIX

========================================= -->

<canvas id="matrix"></canvas>

<!-- =========================================

SIGNAL SPACE

========================================= -->

<div id="signalSpace">

<img id="symbol"

src="Outer17-final.png">

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<!-- =========================================

TOUCH

========================================= -->

<div id="touch"></div>

<div id="vignette"></div>

<script>

/* =========================================

LOADER

========================================= */

const fill =

document.getElementById("fill");

const turtle =

document.getElementById("turtle");

const percent =

document.getElementById("percent");

const loader =

document.getElementById("loader");

let load = 0;

/* slower pacing */

const loading =

setInterval(()=>{

load += .18;

if(load > 17){

load = 17;

}

fill.style.width =

load + "%";

percent.innerText =

Math.floor(load) + "%";

/* turtle walk */

if(load < 16){

turtle.style.transform =

`translateX(${load * 3}px)`;

}

/* turtle notices */

if(load >= 16 && load < 16.4){

turtle.style.transform =

`translateX(${load * 3}px)

scaleX(-1)`;

}

/* turtle shell */

if(load >= 16.4){

turtle.innerText = "🐢";

turtle.style.transform =

`translateX(${load * 3}px)

scale(.78)`;

}

/* attack */

if(load >= 17){

clearInterval(loading);

setTimeout(()=>{

startChaos();

},900);

}

},100);

/* =========================================

CHAOS

========================================= */

const chaos =

document.getElementById("chaos");

const signalLost =

document.getElementById("signalLost");

const matrix =

document.getElementById("matrix");

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},800);

chaos.style.opacity = 1;

matrix.style.opacity = .55;

document.body.classList.add("shake");

runChaos();

}

/* =========================================

FLASH

========================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .16;

setTimeout(()=>{

f.style.opacity = 0;

},34);

}

/* =========================================

WARNINGS

========================================= */

function warning(){

const msgs = [

"UNAUTHORIZED SIGNAL",

"CONTAINMENT FAILURE",

"MEMORY COLLISION",

"TRANSMISSION BREACH",

"SYSTEM OVERLOAD",

"FREQUENCY COLLAPSE"

];

const w =

document.createElement("div");

w.className = "warning";

w.innerText =

msgs[

Math.floor(

Math.random()*msgs.length

)

];

w.style.left =

(Math.random()*70+8)+"%";

w.style.top =

(Math.random()*74+8)+"%";

chaos.appendChild(w);

setTimeout(()=>{

w.remove();

},320);

}

/* =========================================

GHOST BARS

========================================= */

function ghostBar(){

const g =

document.createElement("div");

g.className = "ghostBar";

g.style.top =

(Math.random()*100)+"%";

g.style.transform =

`translate(

${Math.random()*40-20}px,

${Math.random()*16-8}px

)`;

chaos.appendChild(g);

setTimeout(()=>{

g.remove();

},120);

}

/* =========================================

SEARCH GHOSTS

========================================= */

function searchGhost(){

const s =

document.createElement("div");

s.className = "searchGhost";

s.style.top =

(Math.random()*70+10)+"%";

s.style.transform =

`translateX(-50%)

translate(

${Math.random()*60-30}px,

${Math.random()*20-10}px

)`;

chaos.appendChild(s);

setTimeout(()=>{

s.remove();

},180);

}

/* =========================================

SIGNAL LOST FLASH

========================================= */

function lost(){

signalLost.style.opacity = .92;

setTimeout(()=>{

signalLost.style.opacity = 0;

},160);

}

/* =========================================

RUN CHAOS

========================================= */

function runChaos(){

const chaosLoop =

setInterval(()=>{

if(Math.random() > .24){

ghostBar();

}

if(Math.random() > .38){

searchGhost();

}

if(Math.random() > .48){

warning();

}

if(Math.random() > .64){

flash();

}

if(Math.random() > .76){

lost();

}

},70);

/* longer collapse */

setTimeout(()=>{

clearInterval(chaosLoop);

document.body.classList.remove("shake");

chaos.style.opacity = 0;

matrix.style.opacity = 0;

/* BREATH */

setTimeout(()=>{

document.body.classList.add("connected");

document.getElementById("etchings").style.opacity = 1;

document.getElementById("reconnect").style.opacity = 1;

},700);

},3800);

}

/* =========================================

MATRIX

========================================= */

const ctx =

matrix.getContext("2d");

function resize(){

matrix.width =

window.innerWidth;

matrix.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const streams = [];

for(let i=0;i<32;i++){

streams.push({

x:

Math.random()*matrix.width,

y:

Math.random()*matrix.height,

speed:

1.8 + Math.random()*2,

len:

12 + Math.random()*18

});

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,.08)";

ctx.fillRect(

0,

0,

matrix.width,

matrix.height

);

streams.forEach(s=>{

for(let i=0;i<s.len;i++){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i/s.len)

})`;

ctx.font =

"18px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

s.x + (i*18),

s.y

);

}

s.x += s.speed;

if(s.x > matrix.width + 300){

s.x = -400;

s.y =

Math.random()*matrix.height;

}

});

requestAnimationFrame(draw);

}

draw();

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

/* remove text */

reconnect.style.opacity = 0;

/* thermal */

const touch =

document.getElementById("touch");

touch.style.left =

e.clientX + "px";

touch.style.top =

e.clientY + "px";

touch.style.opacity = 1;

touch.animate([

{

transform:

"translate(-50%,-50%) scale(.5)",

opacity:1

},

{

transform:

"translate(-50%,-50%) scale(3.6)",

opacity:.7

},

{

transform:

"translate(-50%,-50%) scale(6.2)",

opacity:0

}

],{

duration:900,

fill:"forwards"

});

/* humanity glow */

document.getElementById("breath").style.opacity = .34;

});

</script>

</body>

</html>
