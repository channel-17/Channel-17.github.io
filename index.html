<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================

BASE

========================= */

body{

background:#000;

overflow:hidden;

color:#ddd;

}

/* =========================

STATIC NOISE

========================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.08;

z-index:2;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:noiseMove .14s linear infinite;

}

@keyframes noiseMove{

0%{transform:translateY(0px);}

100%{transform:translateY(3px);}

}

/* =========================

TAKEOVER

========================= */

#takeover{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

background:#000;

opacity:0;

z-index:100;

animation:twitch .12s infinite;

}

@keyframes twitch{

0%{transform:translateX(0px);}

20%{transform:translateX(1px);}

40%{transform:translateX(-2px);}

60%{transform:translateX(2px);}

80%{transform:translateX(-1px);}

100%{transform:translateX(0px);}

}

/* =========================

MATRIX RAIN

========================= */

.rain{

position:absolute;

top:-120%;

color:#6aff6a;

font-size:clamp(13px,1vw,18px);

font-weight:bold;

white-space:nowrap;

writing-mode:vertical-rl;

text-orientation:upright;

opacity:.95;

animation:rainDrop linear infinite;

}

@keyframes rainDrop{

0%{

transform:translateY(-10%);

opacity:0;

}

10%{

opacity:1;

}

100%{

transform:translateY(180%);

opacity:0;

}

}

/* =========================

BURSTS

========================= */

.burst{

position:absolute;

font-size:clamp(12px,1vw,18px);

font-weight:bold;

color:#7eff7e;

opacity:0;

white-space:nowrap;

animation:burstFlash .14s linear infinite;

}

@keyframes burstFlash{

0%{

opacity:0;

transform:translateX(-3px);

}

50%{

opacity:1;

transform:translateX(4px);

}

100%{

opacity:0;

transform:translateX(-2px);

}

}

/* =========================

SCANNER

========================= */

#scanner{

position:absolute;

top:-35%;

left:0;

width:100%;

height:35%;

background:

linear-gradient(

180deg,

transparent,

rgba(110,255,140,.12),

rgba(180,255,180,.22),

rgba(110,255,140,.12),

transparent

);

filter:blur(8px);

opacity:.95;

animation:scannerSweep 2.6s linear infinite;

}

@keyframes scannerSweep{

0%{

top:-35%;

}

100%{

top:130%;

}

}

/* =========================

HIDDEN .17

========================= */

#ghost17{

position:absolute;

top:72%;

left:50%;

transform:translate(-50%,-50%);

font-size:clamp(90px,18vw,220px);

font-weight:bold;

letter-spacing:.12em;

color:rgba(90,255,120,.18);

opacity:0;

mix-blend-mode:screen;

z-index:1;

}

/* =========================

MAIN

========================= */

#main{

position:relative;

width:100%;

height:100%;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}

/* =========================

SYMBOL

========================= */

#symbolWrap{

position:absolute;

top:38%;

left:50%;

transform:translate(-50%,-50%);

width:min(78vw,460px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:2.8s ease;

z-index:20;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.36;

filter:

drop-shadow(0 0 10px rgba(80,255,120,.08));

transition:3s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.36;

filter:

drop-shadow(0 0 10px rgba(80,255,120,.08));

transition:3s ease;

}

/* =========================

SIGNAL LOST

========================= */

#warning{

position:absolute;

top:60%;

left:50%;

transform:translateX(-50%);

font-size:clamp(24px,4vw,42px);

letter-spacing:.22em;

color:#8fff8f;

opacity:0;

z-index:25;

}

#warning.active{

animation:warningFlash .11s infinite;

}

@keyframes warningFlash{

0%{

opacity:.12;

transform:translateX(calc(-50% - 2px));

}

50%{

opacity:1;

transform:translateX(calc(-50% + 2px));

}

100%{

opacity:.08;

transform:translateX(calc(-50% - 1px));

}

}

/* =========================

RECONNECT

========================= */

#reconnect{

position:absolute;

top:60%;

left:50%;

transform:translateX(-50%);

font-size:clamp(22px,4vw,40px);

letter-spacing:.24em;

color:#f3d6b2;

opacity:0;

cursor:pointer;

z-index:30;

text-shadow:

0 0 10px rgba(255,150,60,.06),

0 0 22px rgba(255,120,20,.03);

transition:

opacity 2s ease,

transform .4s ease,

text-shadow 2s ease;

}

#reconnect.active{

opacity:1;

animation:reconnectPulse 4s ease-in-out infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.45;

text-shadow:

0 0 8px rgba(255,140,40,.04),

0 0 16px rgba(255,120,20,.02);

}

50%{

opacity:1;

text-shadow:

0 0 14px rgba(255,180,90,.22),

0 0 42px rgba(255,120,20,.14);

}

}

#reconnect:hover{

transform:translateX(-50%) scale(1.03);

}

/* =========================

SMOKE

========================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:3;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%);

filter:blur(45px);

opacity:0;

animation:smokeFloat linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smokeFloat{

0%{

transform:translate(0,0) scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:translate(160px,-220px) scale(1.35);

opacity:0;

}

}

/* =========================

ETCHINGS

========================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:2.5s ease;

z-index:40;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

filter:

drop-shadow(0 0 14px rgba(255,120,20,.16))

drop-shadow(0 0 28px rgba(255,120,20,.06));

transition:.4s ease;

}

.etch:hover{

transform:translateX(6px);

}

#etch1{

width:min(54vw,340px);

left:8%;

top:26%;

transform:rotate(-2deg);

}

#etch2{

width:min(60vw,380px);

left:12%;

top:50%;

transform:rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:15%;

bottom:12%;

transform:rotate(-4deg);

}

/* =========================

CONNECTED

========================= */

.connected #outer{

opacity:.02;

filter:blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(0 0 18px rgba(255,180,90,.24))

drop-shadow(0 0 56px rgba(255,120,20,.16));

}

.connected #reconnect{

opacity:0;

pointer-events:none;

}

.connected #warning{

opacity:0;

}

.connected #symbolWrap{

transform:

translate(-50%,-50%)

scale(1.05);

}

</style>

</head>

<body>

<!-- NOISE -->

<div id="noise"></div>

<!-- SMOKE -->

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<!-- TAKEOVER -->

<div id="takeover">

<!-- hidden beacon -->

<div id="ghost17">.17</div>

<!-- scanner -->

<div id="scanner"></div>

<!-- matrix rain -->

<div class="rain" style="left:2%;animation-duration:2.8s;">010110101</div>

<div class="rain" style="left:8%;animation-duration:3.4s;">CH17</div>

<div class="rain" style="left:14%;animation-duration:2.2s;">TRUST_FOUND</div>

<div class="rain" style="left:20%;animation-duration:4s;">110101110</div>

<div class="rain" style="left:26%;animation-duration:2.6s;">WAKE&BAKE</div>

<div class="rain" style="left:32%;animation-duration:3.2s;">SIGNAL_ERR</div>

<div class="rain" style="left:38%;animation-duration:2.4s;">CH17CH17</div>

<div class="rain" style="left:44%;animation-duration:3.8s;">UNAUTHORIZED</div>

<div class="rain" style="left:50%;animation-duration:2.1s;">010101101</div>

<div class="rain" style="left:56%;animation-duration:4.2s;">REC_SIGNAL</div>

<div class="rain" style="left:62%;animation-duration:2.9s;">.17</div>

<div class="rain" style="left:68%;animation-duration:3.5s;">TRANSMISSION</div>

<div class="rain" style="left:74%;animation-duration:2.3s;">111010101</div>

<div class="rain" style="left:80%;animation-duration:3.7s;">CHANNEL17</div>

<div class="rain" style="left:86%;animation-duration:2.5s;">FREQUENCY</div>

<div class="rain" style="left:92%;animation-duration:3s;">TRUST</div>

<!-- bursts -->

<div class="burst" style="top:6%;left:8%;">SIGNAL_OVERRIDE</div>

<div class="burst" style="top:16%;left:56%;">CH17 DETECTED</div>

<div class="burst" style="top:24%;left:12%;">UNAUTHORIZED FREQUENCY</div>

<div class="burst" style="top:34%;left:70%;">RECOVERING SIGNAL</div>

<div class="burst" style="top:44%;left:16%;">010110101110</div>

<div class="burst" style="top:56%;left:62%;">TRUST FOUND</div>

<div class="burst" style="top:68%;left:18%;">WAKE&BAKE</div>

<div class="burst" style="top:80%;left:54%;">CHANNEL17</div>

</div>

<!-- MAIN -->

<div id="main">

<!-- SYMBOL -->

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<!-- SIGNAL LOST -->

<div id="warning">

SIGNAL LOST

</div>

<!-- RECONNECT -->

<div id="reconnect">

RECONNECT

</div>

<!-- ETCHINGS -->

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<script>

/* =========================

TAKEOVER START

========================= */

const takeover = document.getElementById("takeover");

const ghost17 = document.getElementById("ghost17");

setTimeout(()=>{

takeover.style.opacity = 1;

},40);

/* hidden .17 flashes */

setInterval(()=>{

ghost17.style.opacity = ".22";

setTimeout(()=>{

ghost17.style.opacity = "0";

},100);

},850);

/* =========================

CUT TO BLACK

========================= */

setTimeout(()=>{

takeover.style.opacity = 0;

},4200);

/* =========================

SIGNAL LOST

========================= */

const warning = document.getElementById("warning");

setTimeout(()=>{

warning.classList.add("active");

warning.style.opacity = 1;

},4700);

/* =========================

SYMBOL EMERGES

========================= */

const symbol = document.getElementById("symbolWrap");

setTimeout(()=>{

symbol.classList.add("visible");

},5600);

/* =========================

RECONNECT

========================= */

const reconnect = document.getElementById("reconnect");

setTimeout(()=>{

warning.style.opacity = 0;

},7600);

setTimeout(()=>{

warning.classList.remove("active");

reconnect.classList.add("active");

},8600);

/* =========================

CLICK

========================= */

const etchings = document.getElementById("etchings");

reconnect.addEventListener("click",()=>{

document.body.classList.add("connected");

/* warmth pulse */

document.body.animate([

{

filter:"brightness(1)"

},

{

filter:"brightness(1.16)"

},

{

filter:"brightness(1)"

}

],{

duration:1800,

easing:"ease"

});

setTimeout(()=>{

etchings.classList.add("visible");

},1200);

});

</script>

</body>

</html>
