<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

<meta name="viewport" content="width=device
  <title>CHANNEL-17</title
  <style>

body {

    margin: 0;

    padding: 0;

    background: #050505;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    color: #d8d2c8;

    background-image:

    radial-gradient(circle at center,

    rgba(255,255,255,0.02) 0%,

    transparent 70%);

}

/* FILM GRAIN */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.18;

    background-image:

    repeating-radial-gradient(circle at center,

    rgba(255,255,255,0.015) 0px,

    rgba(255,255,255,0.015) 1px,

    transparent 1px,

    transparent 4px);

}

.container {

    text-align: center;

    opacity: 0;

    animation: fadeIn 3s ease forwards;

}

/* SYMBOL */

.symbol {

    width: 150px;

    max-width: 45vw;

    opacity: 0;

    animation:

    signalAppear 4s ease forwards,

    pulse 7s ease-in-out infinite;

    filter:

    drop-shadow(0 0 10px rgba(255,245,220,0.08));

}

/* .17 */

.dot17 {

    margin-top: 10px;

    font-size: 18px;

    letter-spacing: 2px;

    color: rgba(216,210,200,0.45);

}

/* INTERRUPTED */

.interrupted {

    margin-top: 85px;

    font-size: 18px;

    letter-spacing: 6px;

    color: rgba(216,210,200,0.55);

}

/* BLINKING DOTS */

.dots span {

    opacity: 0.15;

    animation: blink 1.8s infinite;

}

.dots span:nth-child(1) {

    animation-delay: 0s;

}

.dots span:nth-child(2) {

    animation-delay: 0.3s;

}

.dots span:nth-child(3) {

    animation-delay: 0.6s;

}

/* RECONNECT */

.reconnect {

    display: inline-block;

    margin-top: 55px;

    color: rgba(216,210,200,0.72);

    text-decoration: none;

    font-size: 21px;

    letter-spacing: 7px;

    border-bottom: 1px solid rgba(216,210,200,0.35);

    padding-bottom: 6px;

    transition: all 0.4s ease;

}

.reconnect:hover {

    color: rgba(255,255,255,0.95);

    border-bottom-color: rgba(255,255,255,0.95);

    transform: scale(1.03);

}

/* ANIMATIONS */

@keyframes fadeIn {

    to {

        opacity: 1;

    }

}

@keyframes signalAppear {

    0% {

        opacity: 0;

        transform: scale(0.94);

        filter: blur(6px);

    }

    40% {

        opacity: 0.25;

    }

    100% {

        opacity: 0.96;

        transform: scale(1);

        filter: blur(0px);

    }

}

@keyframes pulse {

    0% {

        opacity: 0.92;

    }

    50% {

        opacity: 1;

    }

    100% {

        opacity: 0.92;

    }

}

@keyframes blink {

    0% {

        opacity: 0.15;

    }

    20% {

        opacity: 1;

    }

    100% {

        opacity: 0.15;

    }

}

/* HIDE AUDIO PLAYER */

audio {

    display: none;

}

</style>
    </head>
    <body>
      <div class="container">
        <!-- SYMBOL IMAGE -->

<img src="IMG_8683.png" class="symbol">

<!-- .17 -->

<div class="dot17">

    .17

</div>

<!-- BROADCAST INTERRUPTED -->

<div class="interrupted">

    broadcast interrupted

    <span class="dots">

        <span>.</span>

        <span>.</span>

        <span>.</span>

    </span>

</div>

<!-- RECONNECT BUTTON -->

<a class="reconnect" href="#">

    reconnect

</a>
</div>
<!-- OPTIONAL AUDIO -->
      <audio autoplay>
        <source src="frequency.mp3" type="audio/m
          </audio>
          </body>
          </html>
