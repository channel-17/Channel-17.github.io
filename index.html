<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

html,body{

margin:0;

padding:0;

width:100%;

height:100%;

overflow:hidden;

background:black;

font-family:Courier New, monospace;

}

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

background:black;

display:block;

}

#overlay{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

pointer-events:none;

}

#symbol{

position:absolute;

top:38%;

left:50%;

transform:translate(-50%,-50%);

width:min(78vw,470px);

opacity:0;

transition:2s ease;

}

#symbol.visible{

opacity:.34;

}

#signal{

position:absolute;

top:58%;

left:50%;

transform:translateX(-50%);

font-size:clamp(28px,5vw,52px);

letter-spacing:.22em;

color:#7dff7d;

opacity:0;

}

#signal.active{

animation:flicker .12s infinite;

}

@keyframes flicker{

0%{

opacity:.1;

transform:

translateX(calc(-50% - 2px));

}

50%{

opacity:1;

transform:

translateX(calc(-50% + 2px));

}

100%{

opacity:.08;

transform:

translateX(calc(-50% - 1px));

}

}

#reconnect{

position:absolute;

top:58%;

left:50%;

transform:translateX(-50%);

font-size:clamp(24px,4vw,42px);

letter-spacing:.24em;

color:#f4c48c;

opacity:0;

pointer-events:none;

cursor:pointer;

transition:2s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:pulse 4s ease-in-out infinite;

}

@keyframes pulse{

0%,100%{

opacity:.4;

}

50%{

opacity:1;

}

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="overlay">

<img id="symbol" src="Inner17-final.png">

<div id="signal">

SIGNAL LOST

</div>

<div id="reconnect">

RECONNECT

</div>

</div>

<script>

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*.17";

const fontSize = 16;

const columns =

canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++){

drops[i] = 1;

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.08)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

ctx.fillStyle = "#66ff66";

ctx.font =

fontSize + "px monospace";

for(let i=0;i<drops.length;i++){

const text =

chars[

Math.floor(

Math.random()*chars.length

)

];

ctx.fillText(

text,

i * fontSize,

drops[i] * fontSize

);

if(

drops[i] * fontSize >

canvas.height &&

Math.random() > 0.975

){

drops[i] = 0;

}

drops[i]++;

}

}

setInterval(draw,35);

/* hidden .17 */

setInterval(()=>{

ctx.fillStyle =

"rgba(180,255,180,.18)";

ctx.font =

"bold 120px monospace";

ctx.fillText(

".17",

canvas.width/2 - 120,

canvas.height*.72

);

},850);

/* sequence */

const signal =

document.getElementById("signal");

const reconnect =

document.getElementById("reconnect");

const symbol =

document.getElementById("symbol");

setTimeout(()=>{

signal.style.opacity = 1;

signal.classList.add("active");

},3400);

setTimeout(()=>{

signal.style.opacity = 0;

},5400);

setTimeout(()=>{

symbol.classList.add("visible");

},5800);

setTimeout(()=>{

signal.classList.remove("active");

reconnect.classList.add("active");

},7600);

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.animate([

{

filter:"brightness(1)"

},

{

filter:"brightness(1.18)"

},

{

filter:"brightness(1)"

}

],{

duration:1800

});

});

</script>

</body>

</html>
