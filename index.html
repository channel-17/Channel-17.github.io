<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

/* =========================================

RESET

========================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

cursor:default;

color:#fff;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

background:#000;

z-index:5;

}

/* =========================================

PHONE EDGE DARKNESS

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:99999;

background:

radial-gradient(

circle,

transparent 48%,

rgba(0,0,0,.38) 76%,

rgba(0,0,0,.99) 100%

);

}

/* =========================================

NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.08;

z-index:8;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

GLOBAL SHAKE

========================================= */

body.shake{

animation:

shake .055s linear infinite;

}

@keyframes shake{

0%{

transform:translate(0px,0px);

}

25%{

transform:translate(-1px,1px);

}

50%{

transform:translate(1px,-1px);

}

75%{

transform:translate(-1px,-1px);

}

100%{

transform:translate(1px,1px);

}

}

/* =========================================

LOADING SCREEN

========================================= */

#loaderWrap{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:1000;

}

/* loading tube */

#tube{

width:min(72vw,420px);

height:18px;

border:

1px solid rgba(255,255,255,.25);

overflow:hidden;

position:relative;

background:

rgba(255,255,255,.03);

}

/* progress */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

background:#fff;

}

/* turtle */

#turtle{

margin-top:18px;

font-size:14px;

letter-spacing:.2em;

opacity:.45;

}

/* percent */

#percent{

margin-top:10px;

font-size:12px;

letter-spacing:.3em;

opacity:.32;

}

/* =========================================

FLASH

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:900;

}

/* =========================================

GHOST UI

========================================= */

#ghostUI{

position:fixed;

inset:0;

pointer-events:none;

z-index:600;

opacity:0;

}

.ghostBar{

position:absolute;

left:0;

width:100%;

height:58px;

border-bottom:

1px solid rgba(255,255,255,.08);

background:

linear-gradient(

180deg,

rgba(255,255,255,.06),

transparent

);

mix-blend-mode:screen;

}

/* =========================================

WARNINGS

========================================= */

#warningWrap{

position:fixed;

inset:0;

pointer-events:none;

z-index:700;

}

.warning{

position:absolute;

font-size:

clamp(10px,1.7vw,18px);

letter-spacing:.22em;

white-space:nowrap;

color:#ff2b2b;

opacity:0;

mix-blend-mode:screen;

text-shadow:

0 0 12px rgba(255,0,0,.35);

animation:

warning .12s linear;

}

@keyframes warning{

0%{

opacity:0;

transform:

translateX(-10px);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(10px);

}

}

/* =========================================

FRACTURES

========================================= */

#fracture{

position:fixed;

inset:0;

pointer-events:none;

z-index:500;

opacity:0;

}

.slice{

position:absolute;

background:

rgba(255,255,255,.08);

mix-blend-mode:screen;

filter:blur(.4px);

}

/* =========================================

STATIC

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

opacity:0;

z-index:800;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.95),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-260px);

opacity:.02;

}

50%{

opacity:.55;

}

100%{

transform:

translateX(260px);

opacity:.02;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(28px,5vw,74px);

letter-spacing:.28em;

white-space:nowrap;

color:#fff;

opacity:0;

z-index:900;

mix-blend-mode:screen;

text-shadow:

0 0 18px rgba(255,255,255,.18);

}

#signalLost.active{

animation:

signal .08s infinite;

}

@keyframes signal{

0%{

opacity:.08;

}

50%{

opacity:1;

}

100%{

opacity:.08;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:37%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(82vw,500px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

1s ease;

z-index:1200;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.28;

transition:

6s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.24;

transition:

6s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:58%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.28em;

color:#f2c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:1500;

transition:

.6s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

pulse 2.8s ease infinite;

}

@keyframes pulse{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,170,60,.18),

0 0 40px rgba(255,120,20,.08);

}

}

/* =========================================

THERMAL PRINT

========================================= */

#smudge{

position:fixed;

width:30px;

height:30px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:50;

background:

radial-gradient(

circle,

rgba(255,120,20,.72) 0%,

rgba(255,70,0,.34) 35%,

rgba(255,40,0,.12) 60%,

transparent 82%

);

filter:

blur(7px);

transform:

translate(-50%,-50%);

}

/* =========================================

WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:20;

opacity:0;

transition:

4s ease;

background:

linear-gradient(

90deg,

rgba(0,0,0,.99) 0%,

rgba(0,0,0,.97) 24%,

rgba(255,120,20,.02) 40%,

rgba(255,130,30,.05) 50%,

rgba(255,120,20,.02) 60%,

rgba(0,0,0,.97) 76%,

rgba(0,0,0,.99) 100%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:25;

opacity:0;

transition:

5s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(

circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

4s ease;

z-index:2000;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.02;

transition:

4s ease;

filter:

drop-shadow(

0 0 10px rgba(255,120,20,.05)

);

}

.connected .etch{

opacity:1;

}

/* LAST SESH */

#etch1{

width:min(42vw,240px);

left:14%;

top:56%;

transform:

rotate(-4deg);

}

/* ROACH TRAY */

#etch2{

width:min(54vw,330px);

left:26%;

top:67%;

transform:

rotate(2deg);

}

/* PASS IT BACK */

#etch3{

width:min(42vw,260px);

left:54%;

top:78%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 14px rgba(255,180,90,.16)

);

}

</style>

</head>

<body>

<div id="loaderWrap">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtle">

🐢

</div>

<div id="percent">

0%

</div>

</div>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="flash"></div>

<div id="ghostUI"></div>

<div id="fracture"></div>

<div id="warningWrap"></div>

<div id="static"></div>

<div id="smudge"></div>

<div id="warmth"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

/* =========================================

LOADING

========================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const loaderWrap =

document.getElementById("loaderWrap");

let load = 0;

const loader =

setInterval(()=>{

load++;

fill.style.width =

load + "%";

percent.innerText =

load + "%";

/* 17 INTERRUPT */

if(load === 17){

clearInterval(loader);

interrupt();

}

},55);

/* =========================================

INTERRUPT

========================================= */

function interrupt(){

document.body.classList.add("shake");

/* micro pauses */

setTimeout(()=>{

flash();

},140);

setTimeout(()=>{

ghostUI();

},240);

setTimeout(()=>{

flash();

},360);

setTimeout(()=>{

fracture();

},500);

setTimeout(()=>{

chaos();

},650);

}

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

function resize(){

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

/* =========================================

DATA

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 18;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .48,

y:

canvas.height * .25,

w:90,

h:140

};

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y:

Math.random()*canvas.height,

x:

Math.random()*canvas.width,

speed:

4 + Math.random()*5,

length:

10 + Math.random()*18,

charTimer:0,

charSet:[]

});

}

streams.forEach(stream=>{

for(let i=0;i<stream.length;i++){

stream.charSet.push(

chars[

Math.floor(

Math.random()*chars.length

)

]

);

}

});

/* =========================================

CHAOS

========================================= */

function chaos(){

loaderWrap.style.display = "none";

const loop =

setInterval(draw,42);

setTimeout(()=>{

clearInterval(loop);

failure();

},1800);

}

/* =========================================

DRAW

========================================= */

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.14)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

stream.charTimer++;

if(stream.charTimer > 5){

stream.charTimer = 0;

const rand =

Math.floor(

Math.random()*stream.length

);

stream.charSet[rand] =

chars[

Math.floor(

Math.random()*chars.length

)

];

}

for(let i=0;i<stream.length;i++){

const x =

stream.x + (i * fontSize);

const y =

stream.y;

const inside17 =

x > hidden17.x &&

x < hidden17.x + hidden17.w &&

y > hidden17.y &&

y < hidden17.y + hidden17.h;

if(!inside17){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

stream.charSet[i],

x,

y

);

}

}

/* movement */

stream.x += stream.speed;

if(stream.x > canvas.width + 200){

stream.x =

-400;

stream.y =

Math.random()*canvas.height;

}

/* random vertical leaks */

if(Math.random() > .985){

ctx.fillStyle =

"rgba(165,160,45,.5)";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

stream.x,

stream.y + (Math.random()*220)

);

}

});

/* SYSTEM FAILURE */

if(Math.random() > .58){

flash();

}

if(Math.random() > .65){

ghostUI();

}

if(Math.random() > .7){

fracture();

}

if(Math.random() > .76){

warning();

}

}

/* =========================================

FLASH

========================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .22;

setTimeout(()=>{

f.style.opacity = 0;

},35);

}

/* =========================================

GHOST UI

========================================= */

function ghostUI(){

const layer =

document.getElementById("ghostUI");

layer.style.opacity = .82;

layer.innerHTML = "";

for(let i=0;i<4;i++){

const g =

document.createElement("div");

g.className =

"ghostBar";

g.style.transform =

`translate(

${Math.random()*32-16}px,

${Math.random()*20-10}px

)`;

layer.appendChild(g);

}

setTimeout(()=>{

layer.style.opacity = 0;

},70);

}

/* =========================================

FRACTURE

========================================= */

function fracture(){

const layer =

document.getElementById("fracture");

layer.style.opacity = 1;

layer.innerHTML = "";

for(let i=0;i<6;i++){

const s =

document.createElement("div");

s.className = "slice";

s.style.left =

(Math.random()*100)+"%";

s.style.top =

(Math.random()*100)+"%";

s.style.width =

(80 + Math.random()*400)+"px";

s.style.height =

(10 + Math.random()*120)+"px";

s.style.transform =

`translate(

${Math.random()*90-45}px,

${Math.random()*90-45}px

)`;

layer.appendChild(s);

}

setTimeout(()=>{

layer.style.opacity = 0;

},60);

}

/* =========================================

WARNINGS

========================================= */

function warning(){

const wrap =

document.getElementById("warningWrap");

const w =

document.createElement("div");

w.className = "warning";

const messages = [

"UNAUTHORIZED SIGNAL",

"CONTAINMENT FAILURE",

"RENDER FAILURE",

"TRANSMISSION BREACH",

"SYSTEM FAILURE",

"MEMORY LEAK"

];

w.innerText =

messages[

Math.floor(

Math.random()*messages.length

)

];

w.style.left =

(Math.random()*70+10)+"%";

w.style.top =

(Math.random()*70+10)+"%";

wrap.appendChild(w);

setTimeout(()=>{

w.remove();

},120);

}

/* =========================================

FAILURE

========================================= */

function failure(){

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

for(let i=0;i<28;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70)+"%";

line.style.left =

Math.random()*60+"%";

line.style.top =

Math.random()*100+"%";

line.style.animationDuration =

(.04 + Math.random()*1)+"s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* QUICK */

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

document

.getElementById("symbolWrap")

.classList.add("visible");

document

.getElementById("reconnect")

.classList.add("active");

},260);

}

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

reconnect.classList.remove("active");

/* thermal print */

const smudge =

document.getElementById("smudge");

smudge.style.left =

e.clientX + "px";

smudge.style.top =

e.clientY + "px";

smudge.style.opacity = 1;

smudge.animate([

{

transform:

"translate(-50%,-50%) scale(.7)"

},

{

transform:

"translate(-50%,-50%) scale(1.3)"

}

],{

duration:160,

fill:"forwards"

});

/* cool */

setTimeout(()=>{

smudge.style.opacity = 0;

},600);

/* warmth */

setTimeout(()=>{

document.body.classList.add("connected");

},80);

/* etchings */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},1200);

});

</script>

</body>

</html>
