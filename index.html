<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
}

body{
position:relative;
background:black;
}



/ SCREEN /

.screen{
position:absolute;
inset:0;
overflow:hidden;

background:
radial-gradient(
circle at center,
rgba(8,8,8,.78) 0%,
rgba(0,0,0,.96) 68%,
black 100%
);
}



/ VIOLENT GLITCH /

.glitch{
position:absolute;
inset:-5%;

pointer-events:none;

opacity:0;

z-index:40;

background:

repeating-linear-gradient(
0deg,
rgba(255,255,255,.14) 0px,
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
),

repeating-linear-gradient(
90deg,
rgba(255,255,255,.06) 0px,
rgba(255,255,255,.02) 1px,
transparent 2px,
transparent 6px
);

mix-blend-mode:screen;
}

.glitch.active{
animation:
violentGlitch 2.5s steps(2) forwards;
}

@keyframes violentGlitch{

0%{
opacity:0;
}

6%{
opacity:1;
transform:
translateX(-50px)
skewX(18deg);
}

14%{
opacity:.12;
}

24%{
opacity:1;
transform:
translateX(34px)
skewX(-12deg);
}

36%{
opacity:0;
}

52%{
opacity:.9;
transform:
translateY(-5px)
scale(1.03);
}

66%{
opacity:.18;
}

82%{
opacity:.5;
}

100%{
opacity:.08;
transform:none;
}

}



/ EDGE INTERFERENCE /

.interference{
position:absolute;
inset:0;

pointer-events:none;

opacity:.1;

z-index:18;

background:
linear-gradient(
90deg,
rgba(255,255,255,.06),
transparent 20%,
transparent 80%,
rgba(255,255,255,.05)
);

mix-blend-mode:screen;

animation:
edgePulse 5s ease-in-out infinite;
}

@keyframes edgePulse{

0%{
opacity:.05;
}

50%{
opacity:.14;
}

100%{
opacity:.05;
}

}



/ SYMBOL /

.symbol-wrap{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:250px;
height:250px;

z-index:6;
}



/ TRIANGLE /

.outer{
position:absolute;

width:100%;
height:100%;

object-fit:contain;

opacity:.16;

filter:
blur(1px)
brightness(.45);

transition:4s ease;
}



/ INNER MARK /

.inner{
position:absolute;

width:100%;
height:100%;

object-fit:contain;

opacity:.015;

filter:
blur(.5px);

transition:4s ease;
}



/ SIGNAL LOST /

.signal{
position:absolute;

top:62%;
left:50%;

transform:
translateX(-50%);

font-size:.7rem;

letter-spacing:7px;

color:#b9b1a6;

opacity:0;

z-index:10;

animation:
signalAppear 2.5s ease forwards;

animation-delay:4s;
}

@keyframes signalAppear{

0%{
opacity:0;
letter-spacing:18px;
filter:blur(10px);
}

100%{
opacity:.58;
letter-spacing:7px;
filter:none;
}

}



/ RECONNECT /

.reconnect{
position:absolute;

top:68%;
left:50%;

transform:
translateX(-50%);

font-size:.82rem;

letter-spacing:8px;

color:#d8d0c4;

opacity:0;

cursor:pointer;

z-index:12;

animation:
reconnectAppear 2s ease forwards;

animation-delay:7s;
}

@keyframes reconnectAppear{

0%{
opacity:0;
}

100%{
opacity:.84;
}

}



/ EMBER /

.ember{
position:absolute;

width:12px;
height:12px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:30;

background:
radial-gradient(
circle,
rgba(255,220,160,1) 0%,
rgba(255,140,70,.95) 30%,
rgba(255,70,20,.5) 60%,
transparent 100%
);

box-shadow:
0 0 16px rgba(255,120,50,.9),
0 0 42px rgba(255,70,20,.4);
}



/ FREQUENCY ARCS /

.frequency{
position:absolute;

left:7vw;
bottom:7vh;

display:flex;
flex-direction:column;

gap:12px;

opacity:0;

transition:3s ease;

z-index:14;
}

.frequency div{

font-size:.58rem;

letter-spacing:4px;

color:#cfc7bb;

opacity:.7;
}

.frequency.awaken{
opacity:1;
}



/ SIGNAL REVEAL /

.inner.awaken{
opacity:.16;
filter:none;
}

.outer.fade{
opacity:.03;
filter:blur(8px);
}

</style>

</head>

<body>

<div class="screen">

<div class="glitch" id="glitch"></div>

<div class="interference"></div>

<div class="symbol-wrap">

<img
src="Trust17.png"
class="outer"
id="outer"
>

<img
src="Trust17.png"
class="inner"
id="inner"
>

</div>

<div
class="signal"
id="signal"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

<div
class="frequency"
id="frequency"
>

<div>Latest Sesh</div>

<div>Roach Tray</div>

<div>Pass One Back</div>

</div>

<div
class="ember"
id="ember"
></div>

</div>

<script>

const glitch =
document.getElementById("glitch");

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const outer =
document.getElementById("outer");

const inner =
document.getElementById("inner");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");



/ OPENING GLITCH /

setTimeout(()=>{

glitch.classList.add("active");

},200);



/ TOUCH */

reconnect.addEventListener("click",(e)=>{

signal.style.opacity="0";

reconnect.style.opacity="0";



ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";

ember.style.opacity="1";



ember.animate([

{
transform:"translate(-50%,-50%) scale(.2)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(18)",
opacity:.02
}

],{

duration:5200,
easing:"ease-out",
fill:"forwards"

});



setTimeout(()=>{

inner.classList.add("awaken");

outer.classList.add("fade");

},500);



setTimeout(()=>{

frequency.classList.add("awaken");

},2400);

});

</script>

</body>

</html>
