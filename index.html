<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Little Homie</title>

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,Helvetica,sans-serif;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

}

#stage{

  position:relative;

  width:100%;

  height:100%;

  overflow:hidden;

}

/* =========================

   LOADER

========================= */

#loaderWrap{

  position:absolute;

  width:min(76vw,420px);

  left:50%;

  top:42%;

  transform:translateX(-50%);

}

#loader{

  width:100%;

  height:24px;

  border:1px solid rgba(255,255,255,.14);

  overflow:hidden;

  position:relative;

}

#fill{

  height:100%;

  width:0%;

  background:

  repeating-linear-gradient(

    90deg,

    #fff 0px,

    #fff 12px,

    transparent 12px,

    transparent 17px

  );

  transition:width .45s linear;

}

#percent{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  color:rgba(255,255,255,.48);

  font-size:13px;

  font-weight:bold;

  letter-spacing:.25em;

}

/* =========================

   LITTLE HOMIE

========================= */

#homieWrap{

  position:absolute;

  left:50%;

  top:54%;

  transform:translateX(-50%);

  width:120px;

  height:90px;

}

#homie{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  width:70px;

  height:46px;

  transition:.25s ease;

}

/* shell */

.shell{

  position:absolute;

  width:34px;

  height:22px;

  left:16px;

  top:10px;

  background:#fff;

  border-radius:10px 10px 8px 8px;

}

.shell::before{

  content:"";

  position:absolute;

  width:3px;

  height:16px;

  background:rgba(0,0,0,.14);

  left:15px;

  top:3px;

}

.shell::after{

  content:"";

  position:absolute;

  width:24px;

  height:2px;

  background:rgba(0,0,0,.12);

  left:5px;

  top:10px;

}

/* head */

.head{

  position:absolute;

  width:10px;

  height:10px;

  background:#fff;

  border-radius:4px;

  left:50px;

  top:15px;

  transition:.25s ease;

}

/* eye */

.eye{

  position:absolute;

  width:2px;

  height:2px;

  background:#000;

  border-radius:50%;

  left:6px;

  top:4px;

}

/* neck */

.neck{

  position:absolute;

  width:8px;

  height:4px;

  background:#fff;

  left:44px;

  top:18px;

  transition:.25s ease;

}

/* tail */

.tail{

  position:absolute;

  width:0;

  height:0;

  border-top:4px solid transparent;

  border-bottom:4px solid transparent;

  border-right:10px solid #fff;

  left:8px;

  top:18px;

}

/* legs */

.leg{

  position:absolute;

  width:6px;

  height:10px;

  background:#fff;

  border-radius:2px;

}

.leg1{

  left:20px;

  top:30px;

}

.leg2{

  left:40px;

  top:30px;

}

/* =========================

   WALK

========================= */

.walk .leg1{

  animation:leg1 .8s infinite;

}

.walk .leg2{

  animation:leg2 .8s infinite;

}

.walk{

  animation:bob 1.1s infinite;

}

@keyframes bob{

  0%,100%{

    margin-top:0;

  }

  50%{

    margin-top:2px;

  }

}

@keyframes leg1{

  0%,100%{

    transform:translateX(0);

  }

  50%{

    transform:translateX(-2px);

  }

}

@keyframes leg2{

  0%,100%{

    transform:translateX(-2px);

  }

  50%{

    transform:translateX(0);

  }

}

/* =========================

   LOOK BACK

========================= */

.look .head{

  left:2px;

}

.look .neck{

  left:8px;

}

.look .eye{

  left:1px;

}

/* =========================

   PEEK

========================= */

.peek .head{

  top:-2px;

  left:0px;

}

.peek .neck{

  width:16px;

  left:8px;

  top:8px;

}

/* =========================

   SHELL

========================= */

.hide .head,

.hide .neck,

.hide .tail,

.hide .leg{

  opacity:0;

}

.hide .shell{

  transform:scale(1.04);

}

/* =========================

   NERVOUS

========================= */

.shake{

  animation:shake .11s infinite;

}

@keyframes shake{

  0%{

    transform:translate(-50%,-50%) translateX(0);

  }

  50%{

    transform:translate(-50%,-50%) translateX(1px);

  }

  100%{

    transform:translate(-50%,-50%) translateX(-1px);

  }

}

/* =========================

   CHAOS

========================= */

#chaos{

  position:absolute;

  inset:0;

  opacity:0;

  pointer-events:none;

  transition:1.2s ease;

  background:#000;

}

.glitch{

  position:absolute;

  color:rgba(255,60,60,.22);

  font-size:13px;

  letter-spacing:.18em;

  font-weight:bold;

  white-space:nowrap;

}

.g1{top:18%;left:10%}

.g2{top:35%;right:8%}

.g3{bottom:28%;left:14%}

.g4{top:52%;left:48%}

.g5{bottom:18%;right:10%}

/* =========================

   100%

========================= */

.flash{

  animation:flash 1s infinite;

}

@keyframes flash{

  0%,100%{

    opacity:1;

  }

  50%{

    opacity:.2;

  }

}

/* =========================

   RUN

========================= */

.run{

  animation:run 3.2s linear forwards;

}

@keyframes run{

  from{

    left:50%;

  }

  to{

    left:120%;

  }

}

</style>

</head>

<body>

<div id="stage">

  <div id="loaderWrap">

    <div id="loader">

      <div id="fill"></div>

      <div id="percent">0%</div>

    </div>

  </div>

  <div id="homieWrap">

    <div id="homie" class="walk">

      <div class="tail"></div>

      <div class="shell"></div>

      <div class="neck"></div>

      <div class="head">

        <div class="eye"></div>

      </div>

      <div class="leg leg1"></div>

      <div class="leg leg2"></div>

    </div>

  </div>

  <div id="chaos">

    <div class="glitch g1">TOO MANY ACTIVE MASKS</div>

    <div class="glitch g2">SIGNAL LOST</div>

    <div class="glitch g3">UNREQUESTED FILE STACK</div>

    <div class="glitch g4">IDENTITY LOOP ACTIVE</div>

    <div class="glitch g5">NOISE OVERLOAD</div>

  </div>

</div>

<script>

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

const homie = document.getElementById("homie");

const chaos = document.getElementById("chaos");

let progress = 0;

let stopped = false;

/* =========================

   NORMAL LOADING

========================= */

const loaderLoop = setInterval(()=>{

  if(stopped) return;

  progress++;

  fill.style.width = progress + "%";

  percent.innerText = progress + "%";

  /* tremor */

  if(progress === 16){

    stopped = true;

    /* he stops walking */

    homie.classList.remove("walk");

    /* he senses */

    setTimeout(()=>{

      homie.classList.add("look");

    },500);

    /* inertia */

    setTimeout(()=>{

      progress = 17;

      fill.style.width = "17%";

      percent.innerText = "17%";

    },900);

    setTimeout(()=>{

      progress = 18;

      fill.style.width = "18%";

      percent.innerText = "18%";

    },1300);

    /* loader dies */

    setTimeout(()=>{

      homie.classList.remove("look");

      homie.classList.add("peek");

    },1900);

    /* panic */

    setTimeout(()=>{

      homie.classList.remove("peek");

      homie.classList.add("hide");

    },3000);

    /* nervous shell */

    setTimeout(()=>{

      homie.classList.add("shake");

    },3300);

    /* CHAOS */

    setTimeout(()=>{

      chaos.style.opacity = 1;

    },4200);

    /* aftermath */

    setTimeout(()=>{

      recovery();

    },7600);

  }

},620);

/* =========================

   RECOVERY

========================= */

function recovery(){

  chaos.style.opacity = 0;

  fill.style.width = "100%";

  percent.innerText = "100%";

  percent.classList.add("flash");

  homie.classList.remove("shake");

  /* peeks out */

  setTimeout(()=>{

    homie.classList.remove("hide");

    homie.classList.add("peek");

  },900);

  /* realizes */

  setTimeout(()=>{

    homie.classList.remove("peek");

    homie.classList.add("walk");

  },1800);

  /* SCURRY */

  setTimeout(()=>{

    homie.classList.add("run");

  },2400);

}

</script>

</body>

</html>
