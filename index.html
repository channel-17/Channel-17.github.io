<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" href="Signal17.png?v=17">

<link rel="shortcut icon" href="Signal17.png?v=17">

<link rel="apple-touch-icon" sizes="180x180" href="Beacon17.png">

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  background:#000;

  overflow:hidden;

  width:100vw;

  height:100vh;

  font-family:"Courier New", monospace;

  color:#d8d2c8;

}

.screen{

  position:relative;

  width:100%;

  height:100vh;

  overflow:hidden;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

  background:#000;

}

/* FULLSCREEN GLITCH */

.glitch{

  position:fixed;

  inset:-8%;

  pointer-events:none;

  opacity:0;

  z-index:9999;

  background:

  repeating-linear-gradient(

    0deg,

    rgba(255,255,255,.28) 0px,

    rgba(255,255,255,.28) 2px,

    transparent 3px,

    transparent 6px

  ),

  repeating-linear-gradient(

    90deg,

    rgba(255,255,255,.10) 0px,

    rgba(255,255,255,.10) 1px,

    transparent 2px,

    transparent 5px

  );

  mix-blend-mode:screen;

  filter:

  blur(1.8px)

  contrast(2.8)

  brightness(3.8);

  transform-origin:center;

}

.glitch.active{

  opacity:1;

  animation:glitchFlash .9s steps(2) forwards;

}

@keyframes glitchFlash{

  0%{

    opacity:0;

    transform:

    scale(1);

    filter:

    blur(.4px)

    brightness(1);

  }

  6%{

    opacity:1;

    transform:

    translateX(-80px)

    skewX(28deg)

    scaleX(1.08);

    filter:

    blur(3px)

    brightness(5)

    contrast(4);

  }

  10%{

    opacity:.2;

    transform:

    translateX(55px)

    skewX(-22deg);

  }

  16%{

    opacity:1;

    transform:

    translateY(-18px)

    scale(1.04)

    skewY(5deg);

    filter:

    blur(2px)

    brightness(4);

  }

  22%{

    opacity:0;

  }

  30%{

    opacity:.95;

    transform:

    translateX(-35px)

    skewX(14deg);

    filter:

    blur(1.5px)

    contrast(3);

  }

  38%{

    opacity:0;

  }

  48%{

    opacity:.85;

    transform:

    translateX(24px)

    translateY(6px)

    skewY(-4deg);

  }

  58%{

    opacity:0;

  }

  68%{

    opacity:.65;

    transform:

    scale(1.015)

    translateX(-12px);

  }

  100%{

    opacity:0;

    transform:none;

    filter:none;

  }

}
/* ---------------- SYMBOL ---------------- */

.symbol-wrap{

  position:relative;

  width:250px;

  height:250px;

  opacity:0;

  animation:

  symbolRise 4.6s ease-out forwards;

  animation-delay:1s;

}

.outer-symbol,

.inner-symbol{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

}

.outer-symbol{

  z-index:2;

}

.inner-symbol{

  z-index:1;

}

@keyframes symbolRise{

  0%{

    opacity:0;

    transform:scale(.94);

    filter:blur(24px);

  }

  50%{

    opacity:.35;

  }

  100%{

    opacity:1;

    transform:scale(1);

    filter:blur(0px);

  }

}

/* ---------------- SIGNAL INTERRUPTION ---------------- */

.symbol-wrap.interrupted{

  animation:

  signalInterruption .18s linear 1;

}

@keyframes signalInterruption{

  0%{

    transform:translateX(0px);

  }

  20%{

    transform:

    translateX(-8px)

    skewX(8deg);

  }

  40%{

    transform:

    translateX(6px)

    skewX(-6deg);

  }

  100%{

    transform:none;

  }

}

.interrupt-bar{

  position:absolute;

  width:100%;

  height:16px;

  background:#000;

  left:0;

  top:48%;

  opacity:0;

  z-index:50;

}

.interrupt-bar.flash{

  animation:barFlash .12s linear;

}

@keyframes barFlash{

  0%{

    opacity:0;

  }

  50%{

    opacity:1;

  }

  100%{

    opacity:0;

  }

}

/* ---------------- TEXT ---------------- */

.text-zone{

  position:absolute;

  top:68%;

  left:50%;

  transform:translateX(-50%);

  width:100%;

  text-align:center;

}

.signal-line{

  opacity:0;

  font-size:1.15rem;

  letter-spacing:8px;

  color:#c2bcaf;

}

.signal-line.active{

  animation:signalResolve 2.2s ease-out forwards;

}

@keyframes signalResolve{

  0%{

    opacity:0;

    filter:blur(8px);

    letter-spacing:16px;

  }

  40%{

    opacity:.35;

  }

  70%{

    opacity:.7;

  }

  100%{

    opacity:.9;

    filter:none;

    letter-spacing:8px;

  }

}

/* ---------------- RECONNECT ---------------- */

.reconnect{

  margin-top:26px;

  opacity:0;

  font-size:1.1rem;

  letter-spacing:8px;

  cursor:pointer;

  user-select:none;

}

.reconnect.live{

  animation:reconnectPulse 2.6s ease-in-out infinite;

}

@keyframes reconnectPulse{

  0%{

    opacity:.08;

  }

  50%{

    opacity:1;

    text-shadow:

    0 0 10px rgba(255,255,255,.2),

    0 0 24px rgba(255,255,255,.08);

  }

  100%{

    opacity:.12;

  }

}

/* ---------------- DISSOLVE ---------------- */

.outer-symbol.dissolve{

  animation:

  dissolveSignal 3.2s ease forwards;

}

@keyframes dissolveSignal{

  0%{

    opacity:1;

    filter:none;

    transform:none;

  }

  40%{

    opacity:.8;

    transform:

    translateX(-2px)

    skewX(1deg);

    filter:

    blur(.5px);

  }

  70%{

    opacity:.45;

    transform:

    translateX(8px)

    translateY(-2px);

    filter:

    blur(4px);

  }

  100%{

    opacity:0;

    transform:

    translateX(24px)

    translateY(-8px);

    filter:

    blur(14px);

  }

}

</style>

</head>

<body>

<div class="screen" id="screen">

  <div class="glitch" id="glitch"></div>

  <div class="interrupt-bar" id="interruptBar"></div>

  <div class="symbol-wrap" id="symbolWrap">

    <img

      src="Inner17-final.png"

      class="inner-symbol"

      id="innerSymbol"

    />

    <img

      src="Outer17-final.png"

      class="outer-symbol"

      id="outerSymbol"

    />

  </div>

  <div class="text-zone">

    <div class="signal-line" id="signalLine">

      SIGNAL LOST

    </div>

    <div class="reconnect" id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

/* ---------------- ELEMENTS ---------------- */

const glitch =

document.getElementById("glitch");

const symbolWrap =

document.getElementById("symbolWrap");

const interruptBar =

document.getElementById("interruptBar");

const signalLine =

document.getElementById("signalLine");

const reconnect =

document.getElementById("reconnect");

const outerSymbol =

document.getElementById("outerSymbol");

/* ---------------- OPENING HIT ---------------- */

setTimeout(() => {

  glitch.classList.add("active");

}, 400);

/* ---------------- SIGNAL FIGHTING THROUGH ---------------- */

setTimeout(() => {

  symbolWrap.classList.add("interrupted");

  interruptBar.classList.add("flash");

}, 2600);

/* ---------------- SIGNAL LOST ---------------- */

setTimeout(() => {

  signalLine.classList.add("active");

}, 4300);

/* ---------------- RECONNECT ---------------- */

setTimeout(() => {

  reconnect.classList.add("live");

}, 7000);

/* ---------------- CLICK ---------------- */

reconnect.addEventListener("click", () => {

  reconnect.style.pointerEvents = "none";

  reconnect.style.transition =

  "opacity 1s ease";

  reconnect.style.opacity = "0";

  setTimeout(() => {

    outerSymbol.classList.add("dissolve");

  }, 400);

});

</script>

</body>

</html>
