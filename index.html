<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Courier New, monospace;
}

/* =========================
BACKGROUND
========================= */

body{
background:#000;
overflow:hidden;
}

/* =========================
NOISE
========================= */

#noise{
position:fixed;
inset:0;
pointer-events:none;
opacity:.08;
z-index:1;

background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.04) 0px,
rgba(255,255,255,.04) 1px,
transparent 1px,
transparent 3px
);

animation:noiseMove .16s linear infinite;
}

@keyframes noiseMove{
0%{
transform:translateY(0px);
}
100%{
transform:translateY(3px);
}
}

/* =========================
GLITCH TAKEOVER
========================= */

#takeover{
position:fixed;
inset:0;
pointer-events:none;
z-index:40;
opacity:0;
mix-blend-mode:screen;
}

.glitchLine{
position:absolute;
width:140%;
left:-20%;
height:2px;
background:
linear-gradient(
90deg,
transparent,
rgba(70,255,120,.95),
rgba(255,255,255,.45),
transparent
);

animation:lineMove .12s linear infinite;
}

.glitchLine:nth-child(1){top:12%;}
.glitchLine:nth-child(2){top:26%;}
.glitchLine:nth-child(3){top:39%;}
.glitchLine:nth-child(4){top:53%;}
.glitchLine:nth-child(5){top:66%;}
.glitchLine:nth-child(6){top:81%;}

@keyframes lineMove{

0%{
transform:translateX(-6%);
opacity:.12;
}

50%{
transform:translateX(5%);
opacity:.9;
}

100%{
transform:translateX(-3%);
opacity:.05;
}

}

/* =========================
MAIN WRAP
========================= */

#main{
position:relative;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* =========================
SYMBOL
========================= */

#symbolWrap{
position:absolute;
top:37%;
left:50%;
transform:translate(-50%,-50%);
width:min(78vw,460px);
aspect-ratio:1/1;

display:flex;
justify-content:center;
align-items:center;

opacity:0;
transition:2s ease;
z-index:10;
}

#symbolWrap.visible{
opacity:1;
}

#outer{
position:absolute;
width:100%;
opacity:.38;

filter:
drop-shadow(0 0 12px rgba(80,255,120,.08));

animation:outerBreath 8s ease-in-out infinite;
}

#inner{
position:absolute;
width:100%;
opacity:.38;

filter:
drop-shadow(0 0 12px rgba(80,255,120,.08));

animation:innerBreath 8s ease-in-out infinite;
}

@keyframes outerBreath{
0%,100%{
opacity:.22;
transform:scale(1);
}
50%{
opacity:.42;
transform:scale(1.01);
}
}

@keyframes innerBreath{
0%,100%{
opacity:.22;
transform:scale(1);
}
50%{
opacity:.42;
transform:scale(1.01);
}
}

/* =========================
SIGNAL LOST
========================= */

#signal{
position:absolute;
top:60%;
left:50%;
transform:translateX(-50%);

font-size:clamp(14px,2vw,22px);

letter-spacing:.45em;

color:rgba(210,255,210,.38);

opacity:0;

transition:1.4s ease;

z-index:15;
}

#signal.visible{
opacity:1;
animation:signalFlash .8s infinite;
}

@keyframes signalFlash{

0%,100%{
opacity:.12;
}

50%{
opacity:.55;
}

}

/* =========================
RECONNECT
========================= */

#reconnect{
position:absolute;
top:69%;
left:50%;
transform:translateX(-50%);

font-size:clamp(22px,4vw,42px);

letter-spacing:.32em;

color:rgba(255,220,180,.9);

text-shadow:
0 0 12px rgba(255,120,20,.14),
0 0 30px rgba(255,100,20,.08);

opacity:0;

cursor:pointer;

transition:
opacity 2s ease,
transform .4s ease,
text-shadow 1.5s ease;

z-index:20;
}

#reconnect.active{
opacity:1;
animation:reconnectPulse 5s ease-in-out infinite;
}

@keyframes reconnectPulse{

0%,100%{
opacity:.72;
}

50%{
opacity:1;
}

}

#reconnect:hover{
transform:translateX(-50%) scale(1.03);
}

/* =========================
ETCHINGS
========================= */

#etchings{
position:absolute;
inset:0;
opacity:0;
pointer-events:none;
transition:2.4s ease;
z-index:30;
}

#etchings.visible{
opacity:1;
pointer-events:auto;
}

.etch{
position:absolute;
display:block;
filter:
drop-shadow(0 0 14px rgba(255,120,20,.16))
drop-shadow(0 0 28px rgba(255,120,20,.06));

transition:.4s ease;
}

.etch:hover{
transform:translateX(6px);
filter:
drop-shadow(0 0 16px rgba(255,160,60,.3));
}

#etch1{
width:min(54vw,340px);
left:8%;
top:28%;
transform:rotate(-2deg);
}

#etch2{
width:min(60vw,380px);
left:12%;
top:50%;
transform:rotate(2deg);
}

#etch3{
width:min(56vw,330px);
left:15%;
bottom:12%;
transform:rotate(-4deg);
}

/* =========================
SMOKE
========================= */

#smoke{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:2;
}

.cloud{
position:absolute;

width:55vw;
height:55vw;

border-radius:50%;

background:
radial-gradient(circle,
rgba(255,255,255,.045) 0%,
rgba(255,255,255,.02) 18%,
transparent 70%);

filter:blur(45px);

opacity:0;

animation:smokeFloat linear infinite;
}

.cloud:nth-child(1){
left:-10%;
bottom:-10%;
animation-duration:28s;
}

.cloud:nth-child(2){
right:-20%;
top:10%;
animation-duration:34s;
animation-delay:7s;
}

.cloud:nth-child(3){
left:30%;
bottom:-20%;
animation-duration:30s;
animation-delay:15s;
}

@keyframes smokeFloat{

0%{
transform:translate(0,0) scale(1);
opacity:0;
}

10%{
opacity:.12;
}

50%{
opacity:.05;
}

100%{
transform:translate(160px,-220px) scale(1.35);
opacity:0;
}

}

/* =========================
CONNECTED STATE
========================= */

.connected #outer{
opacity:.02;
filter:blur(2px);
transition:3s ease;
}

.connected #inner{
opacity:.92;
transition:3s ease;

filter:
drop-shadow(0 0 14px rgba(255,170,90,.22))
drop-shadow(0 0 42px rgba(255,110,20,.12));
}

.connected #signal{
opacity:0;
}

.connected #reconnect{
opacity:0;
pointer-events:none;
}

</style>
</head>

<body>

<!-- NOISE -->
<div id="noise"></div>

<!-- GLITCH -->
<div id="takeover">

<div class="glitchLine"></div>
<div class="glitchLine"></div>
<div class="glitchLine"></div>
<div class="glitchLine"></div>
<div class="glitchLine"></div>
<div class="glitchLine"></div>

</div>

<!-- SMOKE -->
<div id="smoke">

<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>

</div>

<!-- MAIN -->
<div id="main">

<!-- SYMBOL -->
<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">
<img id="inner" src="Inner17-final.png">

</div>

<!-- SIGNAL -->
<div id="signal">
signal lost
</div>

<!-- RECONNECT -->
<div id="reconnect">
RECONNECT
</div>

<!-- ETCHINGS -->
<div id="etchings">

<a class="etch" id="etch1" href="#">
<img src="lastsesh17.png" width="100%">
</a>

<a class="etch" id="etch2" href="#">
<img src="RoachTray17.png" width="100%">
</a>

<a class="etch" id="etch3" href="#">
<img src="PassItBack17.png" width="100%">
</a>

</div>

</div>

<script>

/* =========================
OPENING TAKEOVER
========================= */

const takeover = document.getElementById("takeover");

setTimeout(()=>{
takeover.style.opacity = 1;
},80);

setTimeout(()=>{
takeover.style.opacity = 0;
},1800);

/* =========================
SYMBOL EMERGENCE
========================= */

const symbol = document.getElementById("symbolWrap");

setTimeout(()=>{
symbol.classList.add("visible");
},1900);

/* =========================
SIGNAL LOST
========================= */

const signal = document.getElementById("signal");

setTimeout(()=>{
signal.classList.add("visible");
},3200);

/* =========================
RECONNECT
========================= */

const reconnect = document.getElementById("reconnect");

setTimeout(()=>{
signal.classList.remove("visible");
},6200);

setTimeout(()=>{
reconnect.classList.add("active");
},7000);

/* =========================
CLICK
========================= */

const etchings = document.getElementById("etchings");

reconnect.addEventListener("click",()=>{

document.body.classList.add("connected");

/* amber pulse */

document.body.animate([
{
filter:"brightness(1)"
},
{
filter:"brightness(1.12)"
},
{
filter:"brightness(1)"
}
],{
duration:1200,
easing:"ease"
});

setTimeout(()=>{
etchings.classList.add("visible");
},1200);

});

</script>

</body>
</html>
