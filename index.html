<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>channel 17</title>
  <link rel="icon" href="Trust17.png?v=17">
  <link rel="shortcut icon" href="Trust17.png?v=17">
  <link rel="apple-touch-icon" sizes="180x180" href="Beacon17.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="screen" id="screen">

    <div class="intro" id="intro">
      <div class="loader-scene" id="loaderScene">
        <div class="loader" id="loader">
          <div class="fill" id="fill"></div>
          <div class="percent" id="percent">0%</div>
        </div>

        <div class="turtle-track">
          <div class="turtle walk" id="turtle" aria-hidden="true">
            <div class="tail"></div>
            <div class="shell"></div>
            <div class="neck"></div>
            <div class="head"><div class="eye"></div></div>
            <div class="leg l1"></div>
            <div class="leg l2"></div>
          </div>
        </div>
      </div>

      <div class="virus-layer" id="virusLayer">
        <div class="scanlines"></div>
        <div class="warning-word" id="warningWord">WARNING</div>
        <div class="warning-word signal-word" id="signalWord">UNAUTHORIZED SIGNAL DETECTED</div>
        <div class="warning-word auth-word" id="authWord">SYSTEM FAILURE<br>AUTHENTICATION VERIFIED</div>

        <div class="debris-field" id="debrisField"></div>
      </div>
    </div>

    <main class="home" id="home">
      <div class="station-map" id="stationMap">
        <div class="path path1"></div>
        <div class="path path2"></div>
        <div class="path path3"></div>
        <div class="path path4"></div>
        <div class="path path5"></div>
        <div class="path path6"></div>
      </div>

      <div class="home-core">
        <img src="Inner17-final.png" class="home-symbol" alt="Channel 17">
        <nav class="nodes" aria-label="Channel 17">
          <a class="node" href="#" id="latestSesh">Last Sesh</a>
          <a class="node" href="#" id="roachTray">Roach Tray</a>
          <button class="node" id="passItBack" type="button">Pass It Back</button>
        </nav>
      </div>

      <button class="chalk" id="chalk" type="button" aria-label="the wall"></button>

      <section class="transmission-modal" id="transmissionModal" aria-hidden="true">
        <div class="transmission-box">
          <button class="close" id="closeTransmission" type="button">×</button>
          <h2>PASS IT BACK</h2>
          <input class="field" placeholder="subject" />
          <textarea class="message" placeholder="two puffs max. don't be stingy."></textarea>
          <input class="field" placeholder="don't be an asshole and write Mark Johnson unless your name is Mark Johnson." />
          <button class="transmit" type="button">TRANSMIT</button>
        </div>
      </section>

      <section class="wall-modal" id="wallModal" aria-hidden="true">
        <div class="wall-box">
          <button class="close" id="closeWall" type="button">×</button>
          <h2>THE WALL</h2>
          <p>not mapped yet.</p>
          <p>somebody left the chalk.</p>
        </div>
      </section>
    </main>

  </div>

  <script src="main.js"></script>
</body>
</html>
