<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CHANNEL 17</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

html,body{

  width:100%;height:100%;overflow:hidden;background:#000;color:#fff;

  font-family:Arial,Helvetica,sans-serif;

  -webkit-tap-highlight-color:transparent;

}

body{position:relative}

/* ATMOSPHERE */

#noise{

  position:fixed;inset:0;pointer-events:none;z-index:99999;opacity:.035;

  mix-blend-mode:screen;

  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);

  animation:noise .06s linear infinite;

}

@keyframes noise{to{transform:translateY(3px)}}

#vignette{

  position:fixed;inset:0;pointer-events:none;z-index:999999;

  background:radial-gradient(circle,transparent 46%,rgba(0,0,0,.5) 72%,rgba(0,0,0,.98) 100%);

}

#flash{

  position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9000;mix-blend-mode:screen;

}

/* LOADER */

#loader{

  position:fixed;inset:0;z-index:3000;background:#000;

  display:flex;flex-direction:column;justify-content:center;align-items:center;

  transition:opacity .7s ease;

}

#bar{display:flex;gap:5px;width:min(58vw,320px);height:26px}

.segment{

  flex:1;border:1px solid rgba(255,255,255,.14);border-radius:4px;

  background:rgba(255,255,255,.025);

  box-shadow:inset 0 0 8px rgba(255,255,255,.02);

  transition:.12s ease;

}

.segment.active{

  background:rgba(255,255,255,.92);

  box-shadow:0 0 12px rgba(255,255,255,.12);

}

#percent{

  margin-top:16px;font-size:14px;font-weight:700;letter-spacing:.22em;opacity:.58;

}

/* BLOCK TURTLE */

#turtleWrap{

  margin-top:36px;width:120px;height:76px;display:flex;align-items:center;justify-content:center;

}

#turtle{

  position:relative;width:78px;height:44px;filter:drop-shadow(0 0 8px rgba(255,255,255,.06));

}

.turtlePart{position:absolute;background:#fff}

.shell{

  left:22px;top:8px;width:40px;height:28px;border-radius:4px;

  box-shadow:inset -8px 0 0 rgba(0,0,0,.08), inset 0 -6px 0 rgba(0,0,0,.06);

}

.shell:before,.shell:after{

  content:"";position:absolute;background:rgba(0,0,0,.18);

}

.shell:before{left:13px;top:3px;width:2px;height:22px}

.shell:after{left:4px;top:13px;width:31px;height:2px}

.head{left:63px;top:14px;width:13px;height:13px;border-radius:3px}

.neck{left:58px;top:17px;width:9px;height:7px;border-radius:2px}

.eye{position:absolute;right:2px;top:3px;width:2px;height:2px;background:#000;opacity:.35}

.tail{left:12px;top:19px;width:0;height:0;background:transparent;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:10px solid #fff}

.leg1{left:30px;top:33px;width:8px;height:10px;border-radius:2px}

.leg2{left:50px;top:33px;width:8px;height:10px;border-radius:2px}

.walk{animation:walk 1s ease-in-out infinite}

@keyframes walk{

  0%,100%{transform:translate(0,0)}

  50%{transform:translate(2px,-2px)}

}

.look{animation:none;transform:scaleX(-1)}

.gasp .head{transform:translateX(8px)}

.gasp .neck{transform:translateX(5px)}

.gasp .leg2{transform:translateY(3px)}

.retract .head,.retract .neck{transform:translateX(-24px);opacity:0}

.retract .leg1,.retract .leg2{transform:translateY(-16px);opacity:0}

.retract .tail{transform:translateX(10px);opacity:0}

.retract .shell{transform:scale(1.08)}

#turtle *{transition:.14s ease}

/* CHAOS */

#chaos{

  position:fixed;inset:0;z-index:5000;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s ease;

}

.window{

  position:absolute;background:rgba(10,10,10,.92);border:1px solid rgba(255,255,255,.08);

  border-radius:10px;overflow:hidden;box-shadow:0 0 22px rgba(0,0,0,.72);

  opacity:0;animation:cascade linear forwards;

}

@keyframes cascade{

  0%{opacity:0;transform:translate(0,0) scale(.96)}

  10%{opacity:.92}

  100%{opacity:0;transform:translate(var(--mx),var(--my)) scale(1.03)}

}

.windowTop{

  height:28px;padding-left:12px;display:flex;align-items:center;font-size:11px;letter-spacing:.14em;

  background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.48);

}

.windowBody{padding:12px;font-size:11px;line-height:1.6;color:rgba(255,255,255,.62)}

.red{color:#ff4141}.amber{color:#c8b86a}

.strip{

  position:absolute;height:14px;opacity:0;

  background:linear-gradient(90deg,transparent,rgba(196,176,92,.24),transparent);

  animation:strip .7s linear forwards;

}

@keyframes strip{

  0%{opacity:0;transform:translateX(-30px)}

  20%{opacity:.7}

  100%{opacity:0;transform:translateX(70px)}

}

#signalLost{

  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

  font-size:clamp(32px,6vw,74px);letter-spacing:.24em;opacity:0;text-shadow:0 0 14px rgba(255,255,255,.12);

}

/* FINAL SIGNAL */

#signalSpace{

  position:fixed;inset:0;z-index:8000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;

  display:flex;justify-content:center;align-items:center;

}

#signalCanvas{

  position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:7600;pointer-events:none;

  transition:opacity 1.2s ease;

}

#outer,#inner{

  position:absolute;opacity:0;transition:opacity 1.5s ease,filter 1.4s ease,transform 1.4s ease;

}

#outer{width:min(72vw,360px);filter:drop-shadow(0 0 8px rgba(255,255,255,.03));z-index:8000}

#inner{width:min(42vw,190px);filter:drop-shadow(0 0 10px rgba(255,255,255,.05));z-index:8100}

#reconnect{

  position:absolute;z-index:9000;font-size:clamp(18px,3vw,28px);letter-spacing:.34em;

  padding:34px;cursor:pointer;user-select:none;opacity:0;color:rgba(255,255,255,.76);

  transition:opacity .15s linear;

}

.breathing{animation:heartbeat 2.2s ease-in-out infinite}

@keyframes heartbeat{

  0%{opacity:.44;text-shadow:0 0 6px rgba(255,255,255,.04)}

  18%{opacity:.98;text-shadow:0 0 22px rgba(255,255,255,.2)}

  36%{opacity:.5;text-shadow:0 0 8px rgba(255,255,255,.05)}

  100%{opacity:.72;text-shadow:0 0 14px rgba(255,255,255,.08)}

}

#channels{

  position:absolute;bottom:11vh;left:50%;transform:translateX(-50%);

  display:flex;flex-direction:column;gap:18px;opacity:0;transition:opacity 1.8s ease;z-index:9200;

}

.channel{

  position:relative;font-size:15px;letter-spacing:.24em;color:rgba(255,255,255,.64);text-decoration:none;

  padding:10px 18px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.015);

  border-radius:6px;overflow:hidden;transition:.18s ease;

}

.channel:hover,.channel:active{

  color:rgba(255,255,255,.92);border-color:rgba(255,210,140,.18);

  background:rgba(255,210,140,.03);box-shadow:0 0 14px rgba(255,186,92,.08);

}

.channel:after{

  content:"";position:absolute;left:-40%;top:0;width:30%;height:100%;

  background:linear-gradient(90deg,transparent,rgba(255,210,140,.08),transparent);

  transform:skewX(-20deg);opacity:0;

}

.channel:hover:after,.channel:active:after{animation:signalPass .8s linear}

@keyframes signalPass{

  0%{left:-40%;opacity:0}

  20%{opacity:1}

  100%{left:140%;opacity:0}

}

</style>

</head>

<body>

<div id="noise"></div>

<div id="flash"></div>

<div id="loader">

  <div id="bar"></div>

  <div id="percent">0%</div>

  <div id="turtleWrap">

    <div id="turtle" class="walk">

      <div class="turtlePart tail"></div>

      <div class="turtlePart shell"></div>

      <div class="turtlePart neck"></div>

      <div class="turtlePart head"><div class="eye"></div></div>

      <div class="turtlePart leg1"></div>

      <div class="turtlePart leg2"></div>

    </div>

  </div>

</div>

<div id="chaos">

  <div id="signalLost">SIGNAL LOST</div>

</div>

<div id="signalSpace">

  <canvas id="signalCanvas"></canvas>

  <img id="outer" src="Outer17-final.png">

  <img id="inner" src="Inner17-final.png">

  <div id="reconnect">RECONNECT</div>

  <div id="channels">

    <a class="channel" href="#">LAST SESH</a>

    <a class="channel" href="#">ROACH TRAY</a>

    <a class="channel" href="#">PASS IT BACK</a>

  </div>

</div>

<div id="vignette"></div>

<script>

const bar=document.getElementById("bar");

for(let i=0;i<17;i++){

  const s=document.createElement("div");

  s.className="segment";

  bar.appendChild(s);

}

const segments=document.querySelectorAll(".segment");

const percent=document.getElementById("percent");

const turtle=document.getElementById("turtle");

const loader=document.getElementById("loader");

const chaos=document.getElementById("chaos");

const flash=document.getElementById("flash");

const signalLost=document.getElementById("signalLost");

const signalSpace=document.getElementById("signalSpace");

const reconnect=document.getElementById("reconnect");

const outer=document.getElementById("outer");

const inner=document.getElementById("inner");

const channels=document.getElementById("channels");

const canvas=document.getElementById("signalCanvas");

const ctx=canvas.getContext("2d");

let load=0, looked=false, gasped=false, retracted=false;

const loadLoop=setInterval(()=>{

  load++;

  if(load>17) load=17;

  segments.forEach((s,i)=>{ if(i<load) s.classList.add("active"); });

  percent.innerText=load+"%";

  if(load>=15 && !looked){

    looked=true;

    microTwitch();

    setTimeout(()=>{

      turtle.classList.remove("walk");

      turtle.classList.add("look");

    },120);

  }

  if(load>=16 && !gasped){

    gasped=true;

    turtle.classList.add("gasp");

  }

  if(load>=17 && !retracted){

    retracted=true;

    turtle.classList.remove("gasp");

    turtle.classList.add("retract");

    clearInterval(loadLoop);

    setTimeout(startChaos,950);

  }

},260);

function microTwitch(){

  document.body.style.transform="translateX(2px)";

  setTimeout(()=>document.body.style.transform="translateX(0)",40);

}

function startChaos(){

  loader.style.opacity=0;

  setTimeout(()=>loader.style.display="none",700);

  chaos.style.opacity=1;

  let stage=0;

  const chaosLoop=setInterval(()=>{

    stage++;

    for(let i=0;i<Math.min(stage,5);i++) spawnWindow();

    if(stage>5) spawnStrip();

    if(stage>7) pulseSignal();

    if(stage>8) pulseFlash();

    if(stage>=15){

      clearInterval(chaosLoop);

      collapse();

    }

  },180);

}

function spawnWindow(){

  const types=[

    {title:"identity",color:"red",headline:"TOO MANY ACTIVE MASKS",body:["authentic signal buried","identity loop active","synthetic behavior detected"]},

    {title:"download",color:"red",headline:"UNREQUESTED FILE STACK",body:["plasticself.exe","performative_identity.pkg","human_input_lost.dat"]},

    {title:"transmission",color:"amber",headline:"SIGNAL STILL ACTIVE",body:["frequency surviving","hidden packet received","reconnect possible"]},

    {title:"toxic stream",color:"amber",headline:"TRANSMISSION POISONED",body:["M4SK NULL 5IGNAL","17 17 17","carrier wave unstable"]}

  ];

  const data=types[Math.floor(Math.random()*types.length)];

  const win=document.createElement("div");

  win.className="window";

  win.style.width=(220+Math.random()*240)+"px";

  win.style.height=(120+Math.random()*120)+"px";

  win.style.left=(Math.random()*72)+"vw";

  win.style.top=(Math.random()*70)+"vh";

  win.style.setProperty("--mx",(70+Math.random()*120)+"px");

  win.style.setProperty("--my",(50+Math.random()*120)+"px");

  win.style.animationDuration=(.8+Math.random()*1)+"s";

  win.innerHTML=`

    <div class="windowTop">${data.title}</div>

    <div class="windowBody">

      <div class="${data.color}">${data.headline}</div><br>

      <div>${data.body[0]}</div>

      <div>${data.body[1]}</div>

      <div>${data.body[2]}</div>

    </div>`;

  chaos.appendChild(win);

  setTimeout(()=>win.remove(),2000);

}

function spawnStrip(){

  const strip=document.createElement("div");

  strip.className="strip";

  strip.style.left=(Math.random()*80)+"vw";

  strip.style.top=(Math.random()*90)+"vh";

  strip.style.width=(100+Math.random()*260)+"px";

  chaos.appendChild(strip);

  setTimeout(()=>strip.remove(),700);

}

function pulseSignal(){

  signalLost.style.opacity=.84;

  signalLost.style.transform=`translate(-50%,-50%) translate(${Math.random()*8-4}px,${Math.random()*6-3}px)`;

  setTimeout(()=>signalLost.style.opacity=0,150);

}

function pulseFlash(){

  flash.style.opacity=Math.random()*.12;

  setTimeout(()=>flash.style.opacity=0,38);

}

function collapse(){

  chaos.style.opacity=0;

  setTimeout(showSignal,1100);

}

function showSignal(){

  signalSpace.style.opacity=1;

  signalSpace.style.pointerEvents="auto";

  outer.style.opacity=.16;

  inner.style.opacity=.16;

  reconnect.style.opacity=.76;

  reconnect.classList.add("breathing");

  resizeCanvas();

  drawDormantSignal();

}

function resizeCanvas(){

  canvas.width=window.innerWidth;

  canvas.height=window.innerHeight;

}

window.addEventListener("resize",resizeCanvas);

let rippleActive=false;

let rippleStart=0;

function drawDormantSignal(){

  canvas.style.opacity=.16;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<12;i++){

    const y=(canvas.height*.22)+(i*(canvas.height*.055));

    ctx.beginPath();

    ctx.strokeStyle=`rgba(255,190,100,${.025+(i%3)*.01})`;

    ctx.lineWidth=1;

    ctx.moveTo(canvas.width*.15,y);

    ctx.lineTo(canvas.width*.85,y+Math.sin(i)*8);

    ctx.stroke();

  }

  if(!rippleActive) requestAnimationFrame(drawDormantSignal);

}

reconnect.addEventListener("click",()=>{

  reconnect.classList.remove("breathing");

  reconnect.style.pointerEvents="none";

  reconnect.style.opacity=0;

  rippleActive=true;

  rippleStart=performance.now();

  canvas.style.opacity=1;

  outer.style.opacity=.16;

  inner.style.opacity=.28;

  animateRipple();

  setTimeout(()=>{

    outer.style.opacity=0;

    outer.style.filter="blur(4px)";

    outer.style.transform="scale(1.08)";

  },950);

  setTimeout(()=>{

    channels.style.opacity=1;

  },1700);

});

function animateRipple(){

  const now=performance.now();

  const t=(now-rippleStart)/2600;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const cx=canvas.width/2;

  const cy=canvas.height/2;

  const maxR=Math.max(canvas.width,canvas.height)*.85;

  const r=t*maxR;

  for(let ring=0;ring<5;ring++){

    const rr=r-ring*42;

    if(rr>0){

      ctx.beginPath();

      ctx.strokeStyle=`rgba(255,180,90,${Math.max(0,.34-t*.3-ring*.045)})`;

      ctx.lineWidth=1.5;

      ctx.arc(cx,cy,rr,0,Math.PI*2);

      ctx.stroke();

    }

  }

  for(let i=0;i<22;i++){

    const y=cy + Math.sin(i*.75+t*7)*60 + (i-11)*12;

    ctx.beginPath();

    ctx.strokeStyle=`rgba(255,190,100,${Math.max(0,.2-t*.16)})`;

    ctx.lineWidth=1;

    for(let x=canvas.width*.08;x<canvas.width*.92;x+=12){

      const amp=Math.sin((x*.018)+(t*12)+i)*8;

      const dist=Math.abs(x-cx);

      const wake=Math.max(0,1-Math.abs(dist-r)/180);

      const yy=y+amp*wake;

      if(x===canvas.width*.08) ctx.moveTo(x,yy);

      else ctx.lineTo(x,yy);

    }

    ctx.stroke();

  }

  if(t<1){

    requestAnimationFrame(animateRipple);

  }else{

    canvas.style.opacity=.22;

    drawDormantSignal();

  }

}

</script>

</body>

</html>
