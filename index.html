<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" type="image/png" sizes="32x32" href="Favicon17wh.png">

<link rel="shortcut icon" href="Favicon17wh.png">

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  background:#000;

  overflow:hidden;

  width:100vw;

  height:100vh;

  font-family:"Courier New", monospace;

  color:#d8d2c8;

}

.screen{

  position:relative;

  width:100%;

  height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  flex-direction:column;

  overflow:hidden;

  background:#000;

}

/* FULLSCREEN GLITCH */

.glitch{

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:0;

  z-index:999;

  background:

linear-gradient(

  rgba(255,255,255,.08),

  rgba(255,255,255,.02)

),

repeating-linear-gradient(

  0deg,

  rgba(255,255,255,.12) 0px,

  rgba(255,255,255,.12) 1px,

  transparent 2px,

  transparent 5px

),

repeating-linear-gradient(

  90deg,

  rgba(255,255,255,.03) 0px,

  rgba(255,255,255,.03) 1px,

  transparent 2px,

  transparent 4px

)

  mix-blend-mode:screen;

  filter:

  blur(.4px)

  contrast(1.4)

  brightness(1.8);

}

.glitch.active{

  animation:glitchFlash .55s ease-out forwards;

}

@keyframes glitchFlash{

  0%{

    opacity:0;

    transform:scale(1);

    filter:blur(.5px);

  }

  8%{

    opacity:1;

    transform:

    translateX(-25px)

    skewX(18deg);

    filter:

    blur(2px)

    brightness(2.4);

  }

  16%{

    opacity:0;

    transform:

    translateX(18px)

    skewX(-12deg);

  }

  26%{

    opacity:.95;

    transform:

    translateY(-8px)

    scale(1.02);

    filter:

    blur(1px)

    contrast(2);

  }

  38%{

    opacity:0;

  }

  52%{

    opacity:.75;

    transform:

    translateX(12px)

    skewY(6deg);

    filter:

    brightness(2.8);

  }

  70%{

    opacity:0;

  }

  100%{

    opacity:0;

    transform:none;

    filter:none;

  }

}

/* SYMBOL */

.symbol-wrap{

  position:relative;

  width:250px;

  height:250px;

  opacity:0;

  animation:

  symbolReveal 5.5s ease-out forwards;

  animation-delay:1.1s;

}

.outer-symbol,

.inner-symbol{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  pointer-events:none;

}

.outer-symbol{

  z-index:2;

}

.inner-symbol{

  z-index:1;

}

@keyframes symbolReveal{

  0%{

    opacity:0;

    filter:blur(24px);

    transform:scale(.96);

  }

  35%{

    opacity:.08;

  }

  70%{

    opacity:.45;

  }

  100%{

    opacity:1;

    filter:blur(0px);

    transform:scale(1);

  }

}

/* TEXT */

.text-zone{

  position:relative;

  margin-top:10px;

  height:70px;

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

}

.signal-line,

.reconnect{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  white-space:nowrap;

  letter-spacing:8px;

}

/* SIGNAL LOST */

.signal-line{

  opacity:0;

  font-size:1.2rem;

  color:#c2bcaf;

}

.signal-line.flicker{

  animation:signalFlicker .45s steps(2) infinite;

}

@keyframes signalFlicker{

  0%{opacity:0;}

  20%{opacity:.9;}

  40%{opacity:.1;}

  60%{opacity:1;}

  80%{opacity:.2;}

  100%{opacity:.92;}

}

/* RECONNECT */

.reconnect{

  opacity:0;

  font-size:1.15rem;

  cursor:pointer;

  user-select:none;

}

.reconnect.live{

  animation:reconnectPulse 2s ease-in-out infinite;

}

@keyframes reconnectPulse{

  0%{

    opacity:.08;

    text-shadow:none;

  }

  50%{

    opacity:1;

    text-shadow:

    0 0 10px rgba(255,255,255,.22),

    0 0 28px rgba(255,255,255,.08);

  }

  100%{

    opacity:.12;

    text-shadow:none;

  }

}

/* DISSOLVE */

.outer-symbol.dissolve{

  animation:signalErode 1.7s linear forwards;

}

@keyframes signalErode{

  0%{

    opacity:1;

    clip-path:inset(0 0 0 0);

  }

  100%{

    opacity:0;

    clip-path:polygon(

      42% 0%,

      100% 22%,

      68% 54%,

      100% 100%,

      24% 100%,

      0% 62%,

      30% 36%,

      0% 0%

    );

    filter:

    blur(8px)

    brightness(.2);

  }

}

</style>

</head>

<body>

<div class="screen" id="screen">

  <div class="glitch" id="glitch"></div>

  <div class="symbol-wrap">

    <img

      src="Inner17-final.png"

      class="inner-symbol"

      id="innerSymbol"

    />

    <img

      src="Outer17-final.png"

      class="outer-symbol"

      id="outerSymbol"

    />

  </div>

  <div class="text-zone">

    <div class="signal-line" id="signalLine">

      signal lost

    </div>

    <div class="reconnect" id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

const glitch =

document.getElementById("glitch");

const signalLine =

document.getElementById("signalLine");

const reconnect =

document.getElementById("reconnect");

const outerSymbol =

document.getElementById("outerSymbol");

const innerSymbol =

document.getElementById("innerSymbol");

/* OPENING GLITCH */

setTimeout(() => {

  glitch.classList.add("active");

}, 500);

/* SIGNAL LOST */

setTimeout(() => {

  signalLine.style.opacity = 1;

  signalLine.classList.add("flicker");

}, 4700);

/* REMOVE SIGNAL */

setTimeout(() => {

  signalLine.classList.remove("flicker");

  signalLine.style.opacity = 0;

}, 6900);

/* RECONNECT */

setTimeout(() => {

  reconnect.classList.add("live");

}, 7600);

/* CLICK */

reconnect.addEventListener("click", () => {

  reconnect.style.pointerEvents = "none";

  reconnect.classList.remove("live");

  reconnect.style.transition =

  "opacity 1.2s ease";

  reconnect.style.opacity = 0;

  setTimeout(() => {

    outerSymbol.classList.add("dissolve");

    innerSymbol.style.filter =

    `

    drop-shadow(0 0 10px rgba(255,245,220,.08))

    drop-shadow(0 0 24px rgba(255,245,220,.05))

    `;

  }, 600);

});

</script>

</body>

</html>
