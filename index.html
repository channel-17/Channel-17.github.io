<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Courier New, monospace;
}

/* MAIN */

body{
display:flex;
justify-content:center;
align-items:center;
background:#000;
color:#ddd;
}

/* STATIC */

body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
opacity:.045;
background-image:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.08) 0px,
rgba(255,255,255,.08) 1px,
transparent 1px,
transparent 3px
);
mix-blend-mode:screen;
animation:staticDrift .2s linear infinite;
}

@keyframes staticDrift{
0%{transform:translateY(0px);}
100%{transform:translateY(3px);}
}

/* GLITCH OVERLAY */

#glitch{
position:fixed;
inset:0;
background:#000;
z-index:999;
pointer-events:none;
animation:takeover 2.4s forwards;
}

@keyframes takeover{

0%{
background:#000;
opacity:1;
filter:contrast(400%);
}

8%{
background:#120500;
}

12%{
background:#000;
transform:translateX(-12px);
}

18%{
background:#1d0800;
transform:translateX(8px);
}

25%{
background:#000;
transform:translateY(-6px);
}

31%{
background:#220900;
}

38%{
background:#000;
transform:translateX(4px);
}

48%{
background:#130500;
}

58%{
background:#000;
}

70%{
opacity:.95;
}

100%{
opacity:0;
visibility:hidden;
}
}

/* SYMBOL */

#symbolWrap{
position:absolute;
top:38%;
left:50%;
transform:translate(-50%,-50%);
width:min(70vw,340px);
opacity:0;
animation:appear 2s forwards;
animation-delay:1.1s;
}

@keyframes appear{
to{
opacity:.35;
}
}

#symbol{
width:100%;
filter:
drop-shadow(0 0 8px rgba(255,140,40,.08))
drop-shadow(0 0 20px rgba(255,120,0,.04));
}

/* SIGNAL LOST */

#warning{
position:absolute;
top:57%;
left:50%;
transform:translateX(-50%);
font-size:clamp(18px,2vw,24px);
letter-spacing:.55em;
color:#666;
opacity:0;
animation:warningFlash 2.7s forwards;
animation-delay:1.5s;
white-space:nowrap;
}

@keyframes warningFlash{

0%{
opacity:0;
transform:translateX(-50%) scale(1);
filter:blur(2px);
}

10%{
opacity:.9;
}

15%{
opacity:.15;
}

22%{
opacity:.8;
}

30%{
opacity:.05;
}

42%{
opacity:.7;
}

60%{
opacity:.4;
}

80%{
opacity:.08;
}

100%{
opacity:0;
filter:blur(6px);
}
}

/* RECONNECT */

#reconnect{
position:absolute;
top:66%;
left:50%;
transform:translateX(-50%);
font-size:clamp(34px,5vw,58px);
letter-spacing:.35em;
color:#cfcfcf;
opacity:0;
cursor:pointer;
transition:
opacity 2s ease,
color 1.2s ease,
text-shadow 2s ease,
transform .4s ease;
white-space:nowrap;
animation:revealReconnect 2.5s forwards;
animation-delay:3.2s;
}

@keyframes revealReconnect{
from{
opacity:0;
filter:blur(6px);
}
to{
opacity:1;
filter:blur(0px);
}
}

#reconnect:hover{
color:#ffd2a3;
text-shadow:
0 0 8px rgba(255,140,60,.4),
0 0 18px rgba(255,100,20,.25);
}

/* EMBER */

#ember{
position:fixed;
width:10px;
height:10px;
border-radius:50%;
background:rgba(255,140,40,.8);
pointer-events:none;
opacity:0;
z-index:50;
filter:blur(1px);
}

/* LINKS */

#links{
position:absolute;
bottom:11%;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
gap:38px;
opacity:0;
transition:opacity 2s ease;
align-items:flex-start;
width:min(85vw,550px);
}

.link{
display:block;
max-width:100%;
}

.link img{
width:100%;
max-width:420px;
height:auto;
display:block;
filter:
drop-shadow(0 0 8px rgba(255,120,20,.22))
drop-shadow(0 0 20px rgba(255,80,0,.08));
transition:
transform .5s ease,
filter .6s ease,
opacity .6s ease;
opacity:.92;
}

.link img:hover{
transform:translateX(8px) scale(1.03);
filter:
drop-shadow(0 0 12px rgba(255,160,60,.45))
drop-shadow(0 0 28px rgba(255,90,0,.18));
opacity:1;
}

/* SMOKE */

.smoke{
position:fixed;
width:55vw;
height:55vw;
border-radius:50%;
background:
radial-gradient(circle,
rgba(255,255,255,.045) 0%,
rgba(255,255,255,.02) 25%,
transparent 70%);
pointer-events:none;
mix-blend-mode:screen;
filter:blur(55px);
opacity:0;
animation:smokeFloat 18s linear infinite;
}

.smoke:nth-child(1){
top:60%;
left:-20%;
animation-delay:0s;
}

.smoke:nth-child(2){
top:15%;
left:70%;
animation-delay:6s;
}

.smoke:nth-child(3){
top:80%;
left:40%;
animation-delay:12s;
}

@keyframes smokeFloat{

0%{
transform:translateX(0px) translateY(0px) scale(1);
opacity:0;
}

15%{
opacity:.12;
}

50%{
opacity:.08;
}

100%{
transform:translateX(120px) translateY(-90px) scale(1.4);
opacity:0;
}
}

/* HIDE AFTER CONNECT */

.connected #warning,
.connected #reconnect,
.connected #symbolWrap{
transition:all 2s ease;
opacity:0;
filter:blur(12px);
}

/* SHOW LINKS */

.connected #links{
opacity:1;
}

/* AMBER WARMTH */

.connected{
background:
radial-gradient(circle at center,
rgba(255,110,20,.08) 0%,
rgba(0,0,0,1) 55%);
transition:background 3s ease;
}

</style>
</head>

<body>

<div id="glitch"></div>

<div class="smoke"></div>
<div class="smoke"></div>
<div class="smoke"></div>

<div id="symbolWrap">
<img id="symbol" src="Trust17.png">
</div>

<div id="warning">SIGNAL LOST</div>

<div id="reconnect">RECONNECT</div>

<div id="links">

<a class="link" href="#">
<img src="lastsesh17.png">
</a>

<a class="link" href="#">
<img src="RoachTray17.png">
</a>

<a class="link" href="#">
<img src="PassItBack17.png">
</a>

</div>

<div id="ember"></div>

<script>

const reconnect = document.getElementById("reconnect");
const ember = document.getElementById("ember");

reconnect.addEventListener("click", e=>{

document.body.classList.add("connected");

const x = e.clientX;
const y = e.clientY;

ember.style.left = x + "px";
ember.style.top = y + "px";
ember.style.opacity = 1;

ember.animate([
{
transform:"scale(1)",
opacity:1
},
{
transform:"scale(140)",
opacity:0
}
],{
duration:2200,
easing:"ease-out",
fill:"forwards"
});

});

</script>

</body>
</html>
