<script>

const signalText = document.getElementById("signalText");

const reconnect = document.getElementById("reconnect");

const container = document.getElementById("container");

/* START EMPTY */

signalText.innerHTML = "";

reconnect.style.opacity = "0";

/* TIMING */

const introDelay = 4200;

/* TYPE "signal lost" */

setTimeout(() => {

    let text = "signal lost";

    let i = 0;

    const typeInterval = setInterval(() => {

        signalText.innerHTML += text.charAt(i);

        i++;

        if(i >= text.length){

            clearInterval(typeInterval);

            /* SMALL PAUSE BEFORE DOTS */

            setTimeout(startDots, 650);

        }

    }, 110);

}, introDelay);

/* DOT PULSE */

function startDots(){

    let dotCount = 0;

    const dotInterval = setInterval(() => {

        dotCount++;

        signalText.innerHTML =

        "signal lost" + ".".repeat(dotCount);

        if(dotCount >= 3){

            dotCount = 0;

        }

    }, 650);

    /* AFTER 4 PULSES */

    setTimeout(() => {

        clearInterval(dotInterval);

        /* TEXT FADES OUT */

        signalText.style.transition =

        "opacity 1.8s ease";

        signalText.style.opacity = "0";

        /* RECONNECT TAKES OVER SAME SPACE */

        setTimeout(() => {

            signalText.innerHTML = "";

            reconnect.style.position = "absolute";

            reconnect.style.left = "50%";

            reconnect.style.transform =

            "translateX(-50%)";

            reconnect.style.top =

            signalText.offsetTop + "px";

            reconnect.style.opacity = ".72";

        }, 1800);

    }, 8500);

}

/* CLICK RECONNECT */

reconnect.addEventListener("click", () => {

    reconnect.style.transition =

    "opacity 1.2s ease";

    reconnect.style.opacity = "0";

    container.classList.add("connected");

    setTimeout(() => {

        document.body.style.transition =

        "opacity 2.5s ease";

        document.body.style.opacity = "0";

    }, 4200);

});

</script>
