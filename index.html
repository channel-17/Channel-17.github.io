<!-- =========================================

CHANNEL 17 // FOUNDATION RESET

CHECKPOINT BUILD

========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

cursor:default;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

background:#000;

z-index:1;

}

/* =========================================

BLACK EDGE

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:9999;

background:

radial-gradient(

circle,

transparent 52%,

rgba(0,0,0,.28) 74%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================

NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

z-index:4;

opacity:.07;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

FLASH

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:100;

}

/* =========================================

GHOST SEARCH BAR

========================================= */

#ghostUI{

position:fixed;

inset:0;

pointer-events:none;

z-index:120;

opacity:0;

}

.ghostBar{

position:absolute;

left:0;

width:100%;

height:58px;

border-bottom:

1px solid rgba(255,255,255,.08);

background:

linear-gradient(

180deg,

rgba(255,255,255,.06),

transparent

);

mix-blend-mode:screen;

}

/* =========================================

FRACTURES

========================================= */

#fracture{

position:fixed;

inset:0;

pointer-events:none;

z-index:90;

opacity:0;

}

.slice{

position:absolute;

background:

rgba(255,255,255,.08);

mix-blend-mode:screen;

filter:blur(.4px);

}

/* =========================================

WARNINGS

========================================= */

#warningWrap{

position:fixed;

inset:0;

pointer-events:none;

z-index:150;

}

.warning{

position:absolute;

font-size:

clamp(10px,1.7vw,18px);

letter-spacing:.2em;

white-space:nowrap;

color:#fff;

opacity:0;

mix-blend-mode:screen;

text-shadow:

0 0 10px rgba(255,255,255,.2);

animation:

warning .14s linear;

}

@keyframes warning{

0%{

opacity:0;

transform:

translateX(-10px);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(10px);

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(26px,5vw,74px);

letter-spacing:.24em;

white-space:nowrap;

color:#fff;

opacity:0;

z-index:240;

mix-blend-mode:screen;

text-shadow:

0 0 16px rgba(255,255,255,.18);

}

#signalLost.active{

animation:

signal .08s infinite;

}

@keyframes signal{

0%{

opacity:.1;

}

50%{

opacity:1;

}

100%{

opacity:.1;

}

}

/* =========================================

STATIC

========================================= */

#static{

position:fixed;

inset:0;

pointer-events:none;

opacity:0;

z-index:200;

mix-blend-mode:screen;

}

.staticLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.9),

transparent

);

animation:

staticMove linear infinite;

}

@keyframes staticMove{

0%{

transform:

translateX(-220px);

opacity:.02;

}

50%{

opacity:.5;

}

100%{

transform:

translateX(220px);

opacity:.02;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:38%;

left:50%;

transform:

translate(-50%,-50%);

width:

min(82vw,500px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

1.2s ease;

z-index:300;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.28;

transition:

8s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.24;

transition:

8s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:60%;

left:50%;

transform:

translateX(-50%);

font-size:

clamp(18px,3vw,30px);

letter-spacing:.28em;

color:#f2c287;

opacity:0;

pointer-events:none;

cursor:pointer;

z-index:400;

transition:

.8s ease;

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

pulse 2.8s ease infinite;

}

@keyframes pulse{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

text-shadow:

0 0 18px rgba(255,170,60,.18),

0 0 40px rgba(255,120,20,.08);

}

}

/* =========================================

THERMAL PRINT

========================================= */

#smudge{

position:fixed;

width:32px;

height:32px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:20;

background:

radial-gradient(

circle,

rgba(255,110,20,.65) 0%,

rgba(255,70,0,.3) 35%,

rgba(255,50,0,.14) 60%,

transparent 82%

);

filter:

blur(7px);

transform:

translate(-50%,-50%);

}

/* =========================================

WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

pointer-events:none;

z-index:8;

opacity:0;

transition:

5s ease;

background:

linear-gradient(

90deg,

rgba(0,0,0,.98) 0%,

rgba(0,0,0,.96) 24%,

rgba(255,120,20,.02) 38%,

rgba(255,130,30,.05) 50%,

rgba(255,120,20,.02) 62%,

rgba(0,0,0,.96) 76%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:10;

opacity:0;

transition:

5s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(

circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%

);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:

5s ease;

z-index:500;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.02;

transition:

5s ease;

filter:

drop-shadow(

0 0 10px rgba(255,120,20,.05)

);

}

.connected .etch{

opacity:1;

}

/* LAST SESH */

#etch1{

width:min(42vw,240px);

left:12%;

top:58%;

transform:

rotate(-4deg);

}

/* ROACH TRAY */

#etch2{

width:min(54vw,330px);

left:28%;

top:69%;

transform:

rotate(2deg);

}

/* PASS IT BACK */

#etch3{

width:min(42vw,260px);

left:56%;

top:77%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmth{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 14px rgba(255,180,90,.16)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="flash"></div>

<div id="ghostUI"></div>

<div id="fracture"></div>

<div id="warningWrap"></div>

<div id="static"></div>

<div id="smudge"></div>

<div id="warmth"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer"

src="Outer17-final.png">

<img id="inner"

src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

<div id="vignette"></div>

<script>

window.onload = ()=>{

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

function resize(){

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

/* =========================================

DATA

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 18;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .49,

y:

canvas.height * .24,

w:110,

h:170

};

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y:

i * fontSize,

x:

Math.random() * -3000,

speed:

7 + Math.random() * 4,

length:

18 + Math.random() * 18,

laps:0,

finished:false,

charTimer:0,

charSet:[]

});

}

/* =========================================

PREBUILD CHARS

========================================= */

streams.forEach(stream=>{

for(let i=0;i<stream.length;i++){

stream.charSet.push(

chars[

Math.floor(

Math.random()*chars.length

)

]

);

}

});

/* =========================================

FLASH

========================================= */

function flash(){

const f =

document.getElementById("flash");

f.style.opacity =

Math.random() * .16;

setTimeout(()=>{

f.style.opacity = 0;

},40);

}

/* =========================================

FRACTURE

========================================= */

function fracture(){

const layer =

document.getElementById("fracture");

layer.style.opacity = 1;

layer.innerHTML = "";

for(let i=0;i<4;i++){

const s =

document.createElement("div");

s.className = "slice";

s.style.left =

(Math.random()*100)+"%";

s.style.top =

(Math.random()*100)+"%";

s.style.width =

(80 + Math.random()*400)+"px";

s.style.height =

(10 + Math.random()*120)+"px";

s.style.transform =

`translate(

${Math.random()*80-40}px,

${Math.random()*80-40}px

)`;

layer.appendChild(s);

}

setTimeout(()=>{

layer.style.opacity = 0;

},65);

}

/* =========================================

WARNINGS

========================================= */

function warning(){

const wrap =

document.getElementById("warningWrap");

const w =

document.createElement("div");

w.className = "warning";

const messages = [

"SYSTEM FAILURE",

"TRANSMISSION BREACH",

"UNAUTHORIZED SIGNAL",

"MEMORY LEAK",

"CHANNEL COLLISION",

"RENDER FAILURE"

];

w.innerText =

messages[

Math.floor(

Math.random()*messages.length

)

];

w.style.left =

(Math.random()*70+10)+"%";

w.style.top =

(Math.random()*70+10)+"%";

wrap.appendChild(w);

setTimeout(()=>{

w.remove();

},150);

}

/* =========================================

GHOST UI

========================================= */

function ghostUI(){

const layer =

document.getElementById("ghostUI");

layer.style.opacity = .75;

layer.innerHTML = "";

for(let i=0;i<3;i++){

const g =

document.createElement("div");

g.className =

"ghostBar";

g.style.transform =

`translate(

${Math.random()*20-10}px,

${Math.random()*18-9}px

)`;

layer.appendChild(g);

}

setTimeout(()=>{

layer.style.opacity = 0;

},90);

}

/* =========================================

DRAW

========================================= */

function draw(){

ctx.fillStyle =

"rgba(0,0,0,0.15)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

/* SLOWER CHARACTER MUTATION */

stream.charTimer++;

if(stream.charTimer > 5){

stream.charTimer = 0;

const rand =

Math.floor(

Math.random()*stream.length

);

stream.charSet[rand] =

chars[

Math.floor(

Math.random()*chars.length

)

];

}

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

if(!inside17){

ctx.fillStyle =

`rgba(170,165,55,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

stream.charSet[i],

charX,

stream.y

);

}

}

stream.x += stream.speed;

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 220

){

stream.laps++;

if(stream.laps >= 1){

stream.finished = true;

}else{

stream.x =

Math.random() * -3000;

}

}

});

/* CHAOS */

if(Math.random() > .72){

flash();

}

if(Math.random() > .8){

fracture();

}

if(Math.random() > .84){

warning();

}

if(Math.random() > .9){

ghostUI();

}

/* FINISH */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(loop);

setTimeout(()=>{

failure();

},80);

}

}

/* =========================================

FAILURE

========================================= */

function failure(){

const signalLost =

document.getElementById("signalLost");

const staticLayer =

document.getElementById("static");

for(let i=0;i<34;i++){

const line =

document.createElement("div");

line.className =

"staticLine";

line.style.width =

(20 + Math.random()*70)+"%";

line.style.left =

Math.random()*60+"%";

line.style.top =

Math.random()*100+"%";

line.style.animationDuration =

(.04 + Math.random()*1)+"s";

staticLayer.appendChild(line);

}

staticLayer.style.opacity = .95;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

setTimeout(()=>{

signalLost.style.opacity = 0;

staticLayer.style.opacity = 0;

},520);

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},650);

setTimeout(()=>{

document

.getElementById("reconnect")

.classList.add("active");

},950);

}

/* =========================================

START

========================================= */

const loop =

setInterval(draw,46);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

reconnect.classList.remove("active");

/* THERMAL PRINT */

const smudge =

document.getElementById("smudge");

smudge.style.left =

e.clientX + "px";

smudge.style.top =

e.clientY + "px";

smudge.style.opacity = 1;

/* INSTANT HEAT */

smudge.animate([

{

transform:

"translate(-50%,-50%) scale(.6)"

},

{

transform:

"translate(-50%,-50%) scale(1.2)"

}

],{

duration:180,

fill:"forwards"

});

/* COOL */

setTimeout(()=>{

smudge.style.opacity = 0;

},700);

/* PAGE WARMS */

setTimeout(()=>{

document.body.classList.add("connected");

},120);

/* ETCHINGS */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},1600);

});

};

</script>

</body>

</html>
