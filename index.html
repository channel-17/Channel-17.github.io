FOCUS:

- believable survivor turtle

- clean pacing

- readable chaos

- functioning reconnect ritual

-->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Arial, Helvetica, sans-serif;

color:#fff;

}

/* =========================================

BASE ATMOSPHERE

========================================= */

body{

position:relative;

background:#000;

}

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.035;

z-index:99999;

mix-blend-mode:screen;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.04) 0px,

rgba(255,255,255,.04) 1px,

transparent 1px,

transparent 4px

);

animation:noiseMove .06s linear infinite;

}

@keyframes noiseMove{

from{transform:translateY(0);}

to{transform:translateY(3px);}

}

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 48%,

rgba(0,0,0,.5) 72%,

rgba(0,0,0,.96) 100%

);

}

/* =========================================

LOADER

========================================= */

#loader{

position:fixed;

inset:0;

z-index:3000;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

transition:opacity .8s ease;

}

/* =========================================

BAR

========================================= */

#bar{

position:relative;

width:min(56vw,390px);

height:44px;

border-radius:999px;

overflow:hidden;

border:

1px solid rgba(255,255,255,.14);

background:

rgba(255,255,255,.02);

box-shadow:

0 0 18px rgba(255,255,255,.03),

inset 0 0 18px rgba(255,255,255,.02);

}

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.84),

rgba(255,255,255,1)

);

box-shadow:

0 0 18px rgba(255,255,255,.16);

}

/* =========================================

PERCENT

========================================= */

#percent{

margin-top:18px;

font-size:16px;

font-weight:700;

letter-spacing:.22em;

opacity:.58;

}

/* =========================================

TURTLE

========================================= */

#turtleWrap{

margin-top:34px;

width:120px;

height:90px;

display:flex;

justify-content:center;

align-items:center;

}

#turtle{

width:104px;

height:72px;

overflow:visible;

opacity:.98;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.05)

);

}

.walking{

animation:

walk 1s ease-in-out infinite;

}

@keyframes walk{

0%,100%{

transform:

translateY(0px)

translateX(0px);

}

50%{

transform:

translateY(-2px)

translateX(2px);

}

}

/* turtle anatomy */

#shell{

transition:.18s ease;

}

#head,

#neck,

#frontLeg,

#backLeg,

#tail{

transition:.14s ease;

}

/* look */

.look{

transform:

scaleX(-1);

}

/* gasp */

.gasp #head{

transform:

translateX(8px);

}

.gasp #neck{

transform:

translateX(5px);

}

.gasp #frontLeg{

transform:

translateY(4px);

}

/* retract */

.retract #head{

transform:

translateX(-30px);

opacity:0;

}

.retract #neck{

transform:

translateX(-24px);

opacity:0;

}

.retract #frontLeg,

.retract #backLeg{

transform:

translateY(-18px);

opacity:0;

}

.retract #tail{

transform:

translateX(10px);

opacity:0;

}

.retract #shell{

transform:

scale(1.04);

}

/* =========================================

CHAOS

========================================= */

#chaos{

position:fixed;

inset:0;

overflow:hidden;

opacity:0;

pointer-events:none;

z-index:5000;

transition:opacity .4s ease;

}

/* generic windows */

.window{

position:absolute;

background:

rgba(10,10,10,.92);

border:

1px solid rgba(255,255,255,.08);

border-radius:12px;

overflow:hidden;

box-shadow:

0 0 28px rgba(0,0,0,.72);

opacity:0;

animation:

cascade linear forwards;

}

@keyframes cascade{

0%{

opacity:0;

transform:

translate(0px,0px)

scale(.96);

}

12%{

opacity:.92;

}

100%{

opacity:0;

transform:

translate(

var(--moveX),

var(--moveY)

)

scale(1.03);

}

}

.windowTop{

height:32px;

padding-left:14px;

display:flex;

align-items:center;

font-size:12px;

letter-spacing:.16em;

color:

rgba(255,255,255,.5);

background:

rgba(255,255,255,.045);

border-bottom:

1px solid rgba(255,255,255,.04);

}

.windowBody{

padding:14px;

font-size:12px;

line-height:1.65;

color:

rgba(255,255,255,.64);

}

.red{

color:#ff3b3b;

}

.yellow{

color:#c7c05f;

}

/* toxic strips */

.strip{

position:absolute;

height:18px;

background:

linear-gradient(

90deg,

transparent,

rgba(198,192,78,.3),

transparent

);

opacity:0;

animation:

stripMove .7s linear forwards;

}

@keyframes stripMove{

0%{

opacity:0;

transform:

translateX(-40px);

}

25%{

opacity:.7;

}

100%{

opacity:0;

transform:

translateX(80px);

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(34px,6vw,82px);

letter-spacing:.24em;

opacity:0;

color:#fff;

text-shadow:

0 0 16px rgba(255,255,255,.12);

}

/* =========================================

RECONNECT SPACE

========================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

z-index:8000;

transition:opacity 1.4s ease;

}

/* reconnect */

#reconnect{

position:absolute;

z-index:9999;

font-size:

clamp(18px,3vw,30px);

letter-spacing:.34em;

padding:34px;

cursor:pointer;

user-select:none;

color:

rgba(255,255,255,.78);

opacity:0;

transition:.12s linear;

}

/* heartbeat */

.breathing{

animation:

heartbeat 2.1s ease-in-out infinite;

}

@keyframes heartbeat{

0%{

opacity:.46;

text-shadow:

0 0 6px rgba(255,255,255,.04);

}

18%{

opacity:.96;

text-shadow:

0 0 24px rgba(255,255,255,.2);

}

38%{

opacity:.52;

text-shadow:

0 0 8px rgba(255,255,255,.06);

}

100%{

opacity:.72;

text-shadow:

0 0 14px rgba(255,255,255,.1);

}

}

/* warmth */

#warmth{

position:absolute;

width:20px;

height:20px;

border-radius:50%;

opacity:0;

pointer-events:none;

z-index:9000;

filter:

blur(6px);

background:

radial-gradient(

circle,

rgba(255,226,180,.95) 0%,

rgba(255,125,50,.72) 26%,

rgba(120,25,10,.4) 52%,

rgba(0,0,0,.92) 74%,

transparent 100%

);

}

/* subtle center warmth */

#centerWarmth{

position:absolute;

width:60vw;

height:52vh;

border-radius:50%;

opacity:0;

pointer-events:none;

background:

radial-gradient(

circle,

rgba(255,135,55,.06) 0%,

rgba(255,135,55,.03) 32%,

transparent 72%

);

filter:

blur(28px);

transition:opacity 2s ease;

}

/* symbol */

#inner{

position:absolute;

width:min(42vw,220px);

opacity:0;

z-index:7000;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.04)

);

transition:opacity 2s ease;

}

#outer{

position:absolute;

width:min(70vw,410px);

opacity:0;

z-index:6500;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.03)

);

transition:

opacity 1.2s ease,

transform 1.2s ease,

filter 1.2s ease;

}

/* survivor links */

#links{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

z-index:8500;

transition:opacity 2.4s ease;

}

.link{

position:absolute;

display:block;

pointer-events:auto;

opacity:.75;

filter:

blur(.12px)

drop-shadow(

0 0 12px rgba(255,140,55,.08)

);

}

#last{

width:min(40vw,220px);

left:10%;

top:62%;

}

#roach{

width:min(46vw,260px);

left:24%;

top:79%;

}

#pass{

width:min(28vw,170px);

left:70%;

top:77%;

}

</style>

</head>

<body>

<div id="noise"></div>

<!-- =========================================

LOADER

========================================= -->

<div id="loader">

<div id="bar">

<div id="fill"></div>

</div>

<div id="percent">0%</div>

<div id="turtleWrap">

<svg

id="turtle"

class="walking"

viewBox="0 0 150 90">

<!-- back leg -->

<ellipse

id="backLeg"

cx="62"

cy="72"

rx="8"

ry="10"

fill="white"/>

<!-- front leg -->

<ellipse

id="frontLeg"

cx="96"

cy="72"

ry="10"

<polygon

id="tail"

points="32,56 18,49 18,63"

fill="white"/>

<!-- shell bottom -->

<ellipse

cx="82"

cy="55"

fill="rgba(255,255,255,.92)"/>

<!-- shell top -->

<path

id="shell"

d="

M44 55

C44 34 61 22 84 22

C108 22 124 36 124 55

C124 74 108 87 84 87

C61 87 44 75 44 55

Z"

fill="white"/>

<!-- shell lines -->

<path

d="M58 39 C76 33 96 33 112 42"

stroke="black"

stroke-width="3"

opacity=".14"

fill="none"/>

<path

d="M54 58 C74 52 98 52 116 60"

stroke="black"

stroke-width="3"

opacity=".14"

<path

d="M73 24 C67 44 67 67 72 86"

stroke="black"

<path

d="M95 24 C89 44 89 67 94 86"

stroke="black"

<!-- neck -->

<rect

id="neck"

x="116"

id="head"

opacity=".32"/>

</svg>

</div>

</div>

<!-- =========================================

CHAOS

========================================= -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- =========================================

SIGNAL SPACE

========================================= -->

<div id="signalSpace">

<div id="centerWarmth"></div>

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

<div id="reconnect">

RECONNECT

</div>

<div id="warmth"></div>

<div id="links">

<a id="last" class="link" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a id="roach" class="link" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a id="pass" class="link" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<div id="vignette"></div>

<script>

/* =========================================

ELEMENTS

========================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loader =

document.getElementById("loader");

const chaos =

document.getElementById("chaos");

const reconnect =

document.getElementById("reconnect");

const signalSpace =

document.getElementById("signalSpace");

const warmth =

document.getElementById("warmth");

const outer =

document.getElementById("outer");

const inner =

document.getElementById("inner");

const links =

document.getElementById("links");

const centerWarmth =

document.getElementById("centerWarmth");

const signalLost =

document.getElementById("signalLost");

/* =========================================

LOADING

========================================= */

let load = 0;

let looked = false;

let gasped = false;

let retracted = false;

const loading =

setInterval(()=>{

load += .52;

if(load > 17){

load = 17;

}

fill.style.width =

load + "%";

percent.innerText =

Math.floor(load) + "%";

/* twitch */

if(load >= 15.5 && !looked){

looked = true;

microTwitch();

setTimeout(()=>{

turtle.classList.remove(

"walking"

);

turtle.classList.add(

"look"

);

},120);

}

/* gasp */

if(load >= 16.05 && !gasped){

gasped = true;

turtle.classList.add(

"gasp"

);

}

/* retract */

if(load >= 16.55 && !retracted){

retracted = true;

turtle.classList.remove(

"gasp"

);

turtle.classList.add(

"retract"

);

}

/* chaos */

if(load >= 17){

clearInterval(loading);

setTimeout(()=>{

startChaos();

},1000);

}

},55);

/* =========================================

TWITCH

========================================= */

function microTwitch(){

document.body.style.transform =

"translateX(2px)";

setTimeout(()=>{

document.body.style.transform =

"translateX(0px)";

},40);

}

/* =========================================

CHAOS

========================================= */

function startChaos(){

loader.style.opacity = 0;

setTimeout(()=>{

loader.style.display = "none";

},700);

chaos.style.opacity = 1;

let stage = 0;

const loop =

setInterval(()=>{

stage++;

/* recursive windows */

for(let i=0;i<Math.min(stage,5);i++){

spawnWindow();

}

/* toxic strips */

if(stage > 5){

spawnStrip();

}

/* signal lost */

if(stage > 7){

pulseSignalLost();

}

/* collapse */

if(stage >= 16){

clearInterval(loop);

collapseChaos();

}

},180);

}

/* =========================================

WINDOWS

========================================= */

function spawnWindow(){

const types = [

{

title:"identity",

color:"red",

headline:"TOO MANY ACTIVE MASKS",

body:[

"original input buried",

"self-image loop active",

"authenticity unreadable"

]

},

{

title:"download",

color:"red",

headline:"UNREQUESTED FILE STACK",

body:[

"plasticself.exe",

"performative_identity.pkg",

"human_input_lost.dat"

]

},

{

title:"toxic stream",

color:"yellow",

headline:"TRANSMISSION POISONED",

body:[

"A7X19 BZ0% C17",

"M4SK NULL 5IGNAL",

"17 17 17"

]

},

{

title:"system failure",

color:"red",

headline:"CONTAINMENT FAILURE",

body:[

"mask protocol engaged",

"original signal suppressed",

"synthetic layer active"

]

}

];

const data =

types[

Math.floor(Math.random()*types.length)

];

const win =

document.createElement("div");

win.className =

"window";

win.style.width =

(250 + Math.random()*260)+"px";

win.style.height =

(130 + Math.random()*160)+"px";

win.style.left =

(Math.random()*70)+"vw";

win.style.top =

(Math.random()*68)+"vh";

win.style.setProperty(

"--moveX",

`${70 + Math.random()*120}px`

);

win.style.setProperty(

"--moveY",

`${60 + Math.random()*140}px`

);

win.style.animationDuration =

(.8 + Math.random()*1)+"s";

win.innerHTML = `

<div class="windowTop">

${data.title}

</div>

<div class="windowBody">

<div class="${data.color}">

${data.headline}

</div>

<br>

<div>${data.body[0]}</div>

<div>${data.body[1]}</div>

<div>${data.body[2]}</div>

</div>

`;

chaos.appendChild(win);

setTimeout(()=>{

win.remove();

},2200);

}

/* =========================================

TOXIC STRIPS

========================================= */

function spawnStrip(){

const strip =

document.createElement("div");

strip.className =

"strip";

strip.style.left =

(Math.random()*80)+"vw";

strip.style.top =

(Math.random()*90)+"vh";

strip.style.width =

(120 + Math.random()*320)+"px";

chaos.appendChild(strip);

setTimeout(()=>{

strip.remove();

},800);

}

/* =========================================

SIGNAL LOST

========================================= */

function pulseSignalLost(){

signalLost.style.opacity =

.86;

signalLost.style.transform =

`translate(-50%,-50%)

translate(

${Math.random()*8-4}px,

${Math.random()*6-3}px

)`;

setTimeout(()=>{

signalLost.style.opacity = 0;

},150);

}

/* =========================================

COLLAPSE

========================================= */

function collapseChaos(){

chaos.style.opacity = 0;

setTimeout(()=>{

showReconnect();

},1200);

}

/* =========================================

RECONNECT

========================================= */

function showReconnect(){

signalSpace.style.opacity = 1;

signalSpace.style.pointerEvents =

"auto";

reconnect.style.opacity = .78;

reconnect.classList.add(

"breathing"

);

/* symbol emerges */

setTimeout(()=>{

inner.style.opacity = .18;

outer.style.opacity = .12;

},400);

}

/* =========================================

CLICK

========================================= */

reconnect.addEventListener(

"click",

()=>{

/* kill reconnect */

reconnect.classList.remove(

"breathing"

);

reconnect.style.pointerEvents =

"none";

reconnect.style.opacity = 0;

/* warmth appears */

warmth.style.opacity = 1;

warmth.animate([

{

transform:"scale(.3)",

opacity:1

},

{

transform:"scale(1)",

opacity:1

},

{

transform:"scale(6)",

opacity:.18

},

{

transform:"scale(8)",

opacity:.08

}

],{

duration:2500,

fill:"forwards",

easing:"ease-out"

});

/* warmth in center */

centerWarmth.style.opacity = 1;

/* outer pyramid dissolves */

outer.style.opacity = 0;

outer.style.transform =

"scale(1.08)";

outer.style.filter =

"blur(4px)";

/* inner survives */

inner.style.opacity = .32;

/* smudge becomes dark */

setTimeout(()=>{

warmth.style.background =

`

radial-gradient(

circle,

rgba(0,0,0,.96) 0%,

rgba(0,0,0,.72) 44%,

transparent 82%

)

`;

warmth.style.filter =

"blur(8px)";

warmth.style.opacity = .92;

},2100);

/* survivor links */

setTimeout(()=>{

links.style.opacity = 1;

links.style.pointerEvents =

"auto";

},1100);

});

</script>

</body>

</html>
