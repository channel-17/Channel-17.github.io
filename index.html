<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>channel 17</title>

  <link rel="icon" type="image/png" href="mark17.png" />

  <style>

    *{

      margin:0;

      padding:0;

      box-sizing:border-box;

    }

    body{

      background:#000;

      overflow:hidden;

      height:100vh;

      width:100vw;

      font-family: "Courier New", monospace;

      color:#d8d2c8;

    }

    .screen{

      position:relative;

      width:100%;

      height:100vh;

      display:flex;

      flex-direction:column;

      justify-content:center;

      align-items:center;

      background:#000;

    }

    /* SYMBOL */

    .symbol-wrap{

      position:relative;

      width:250px;

      height:250px;

      opacity:0;

      animation:

        symbolAppear 4.8s ease-out forwards;

      animation-delay:2.8s;

    }

    .outer-symbol,

    .inner-symbol{

      position:absolute;

      inset:0;

      width:100%;

      height:100%;

      object-fit:contain;

      pointer-events:none;

    }

    .outer-symbol{

      z-index:2;

      transition:

        opacity 3.2s ease,

        filter 3.2s ease;

    }

    .inner-symbol{

      z-index:1;

    }

    @keyframes symbolAppear{

      0%{

        opacity:0;

        filter:blur(18px);

        transform:scale(.96);

      }

      35%{

        opacity:.12;

      }

      65%{

        opacity:.45;

      }

      100%{

        opacity:1;

        filter:blur(0px);

        transform:scale(1);

      }

    }

    /* BIG GLITCH */

    .glitch{

      position:absolute;

      inset:0;

      pointer-events:none;

      opacity:0;

      mix-blend-mode:screen;

    }

    .glitch.active{

      animation:glitchFlash .55s ease-out forwards;

    }

    @keyframes glitchFlash{

      0%{

        opacity:0;

      }

      8%{

        opacity:.95;

        transform:translateX(-14px);

      }

      16%{

        opacity:0;

        transform:translateX(11px);

      }

      24%{

        opacity:.8;

        transform:translateX(-7px);

      }

      32%{

        opacity:0;

      }

      48%{

        opacity:.65;

        transform:translateY(6px);

      }

      64%{

        opacity:0;

      }

      100%{

        opacity:0;

      }

    }

    /* TEXT AREA */

    .text-zone{

      position:relative;

      margin-top:14px;

      height:70px;

      display:flex;

      align-items:center;

      justify-content:center;

    }

    .signal-line,

    .reconnect{

      position:absolute;

      left:50%;

      top:50%;

      transform:translate(-50%,-50%);

      white-space:nowrap;

      letter-spacing:9px;

    }

    .signal-line{

      font-size:1.35rem;

      color:#bfb7a8;

      opacity:0;

    }

    .reconnect{

      font-size:1.25rem;

      color:#d8d2c8;

      opacity:0;

      cursor:pointer;

      transition:opacity .6s ease;

      user-select:none;

    }

    /* reconnect “activation” */

    .reconnect.live{

      animation:reconnectPulse 3.2s ease-in-out infinite;

    }

    @keyframes reconnectPulse{

      0%{

        opacity:.18;

        text-shadow:

          0 0 0px rgba(255,255,255,0);

      }

      30%{

        opacity:.42;

        text-shadow:

          0 0 4px rgba(255,255,255,.10);

      }

      55%{

        opacity:.72;

        text-shadow:

          0 0 8px rgba(255,255,255,.16);

      }

      75%{

        opacity:.45;

        text-shadow:

          0 0 5px rgba(255,255,255,.08);

      }

      100%{

        opacity:.22;

        text-shadow:

          0 0 0px rgba(255,255,255,0);

      }

    }

    /* dissolve climax */

    .outer-symbol.dissolve{

      opacity:0;

      filter:blur(10px);

    }

  </style>

</head>

<body>

<div class="screen">

  <div class="symbol-wrap">

    <img src="Inner17-final.png" class="inner-symbol" />

    <img src="Outer17-final.png" class="outer-symbol" id="outerSymbol" />

    <div class="glitch" id="glitch"></div>

  </div>

  <div class="text-zone">

    <div class="signal-line" id="signalLine"></div>

    <div class="reconnect" id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

  const signalLine = document.getElementById("signalLine");

  const reconnect = document.getElementById("reconnect");

  const outerSymbol = document.getElementById("outerSymbol");

  const glitch = document.getElementById("glitch");

  const phrase = "signal lost";

  let index = 0;

  /* timing flow */

  setTimeout(() => {

    glitch.classList.add("active");

  }, 7300);

  /* pause after glitch before typing */

  setTimeout(() => {

    signalLine.style.opacity = 1;

    typePhrase();

  }, 8600);

  function typePhrase(){

    if(index < phrase.length){

      signalLine.innerHTML += phrase.charAt(index);

      index++;

      /* slower human typewriter feel */

      setTimeout(typePhrase, 165);

    } else {

      beginDots();

    }

  }

  /* searching dots */

  function beginDots(){

    let cycle = 0;

    function runCycle(){

      if(cycle >= 3){

        fadeSignalOut();

        return;

      }

      let dot = 0;

      function animateDots(){

        if(dot <= 3){

          signalLine.innerHTML =

            "signal lost" + ".".repeat(dot);

          dot++;

          setTimeout(animateDots, 420);

        } else {

          signalLine.innerHTML = "signal lost";

          cycle++;

          setTimeout(runCycle, 500);

        }

      }

      animateDots();

    }

    setTimeout(runCycle, 600);

  }

  /* fade signal out */

  function fadeSignalOut(){

    signalLine.style.transition =

      "opacity 1.8s ease";

    signalLine.style.opacity = 0;

    setTimeout(() => {

      activateReconnect();

    }, 1200);

  }

  /* reconnect emerges */

  function activateReconnect(){

    reconnect.style.opacity = .15;

    setTimeout(() => {

      reconnect.classList.add("live");

    }, 700);

  }

  /* click climax */

  reconnect.addEventListener("click", () => {

    reconnect.style.pointerEvents = "none";

    reconnect.style.transition =

      "opacity 1.2s ease";

    reconnect.style.opacity = 0;

    /* slow emotional dissolve */

    setTimeout(() => {

      outerSymbol.classList.add("dissolve");

    }, 900);

  });

</script>

</body>

</html>
