<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL-17</title>
<style>

body {

    margin: 0;

    padding: 0;

    background: #050505;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    color: rgba(255,255,255,0.75);

}

.container {

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    animation: fadeIn 3s ease;

}

/* LOGO */

.logo {

    width: 170px;

    max-width: 40vw;

    opacity: 0;

    animation: signalFade 4s ease forwards;

    filter:

    drop-shadow(0 0 12px rgba(255,255,255,0.08));

}

/* TEXT */

.subtext {

    margin-top: 42px;

    font-size: 1rem;

    letter-spacing: 3px;

    color: rgba(255,255,255,0.45);

}

/* BLINKING DOTS */

.dots span {

    animation: blink 1.6s infinite;

}

.dots span:nth-child(2) {

    animation-delay: 0.3s;

}

.dots span:nth-child(3) {

    animation-delay: 0.6s;

}

/* RECONNECT */

.reconnect {

    margin-top: 38px;

    text-decoration: none;

    font-size: 0.75rem;

    letter-spacing: 6px;

    color: rgba(255,255,255,0.22);

    transition: 0.3s ease;

}

.reconnect:hover {

    color: rgba(255,255,255,0.75);

    letter-spacing: 8px;

}

/* ANIMATIONS */

@keyframes signalFade {

    0% {

        opacity: 0;

        transform: scale(0.94);

        filter: blur(6px);

    }

    100% {

        opacity: 1;

        transform: scale(1);

        filter: blur(0px);

    }

}

@keyframes blink {

    0%, 20% {

        opacity: 0.2;

    }

    50% {

        opacity: 1;

    }

    100% {

        opacity: 0.2;

    }

}

@keyframes fadeIn {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

</style>
