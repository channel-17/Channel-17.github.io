<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>channel 17</title>

  <!-- FAVICON -->

  <link rel="icon" type="image/png" href="favicon17.png">

  <link rel="apple-touch-icon" href="favicon17.png">

  <style>

    *{

      margin:0;

      padding:0;

      box-sizing:border-box;

    }

    body{

      background:#000;

      overflow:hidden;

      height:100vh;

      width:100vw;

      display:flex;

      justify-content:center;

      align-items:center;

      font-family:"Courier New", monospace;

      color:#d8d2c8;

    }

    .screen{

      position:relative;

      width:100%;

      height:100vh;

      display:flex;

      flex-direction:column;

      justify-content:center;

      align-items:center;

      background:#000;

      transition:background 4s ease;

    }

    /* SYMBOL */

    .symbol-wrap{

      position:relative;

      width:250px;

      height:250px;

      opacity:0;

      animation:

      symbolAppear 4.8s ease-out forwards;

      animation-delay:2.2s;

    }

    .outer-symbol,

    .inner-symbol{

      position:absolute;

      inset:0;

      width:100%;

      height:100%;

      object-fit:contain;

      pointer-events:none;

    }

    .outer-symbol{

      z-index:2;

      transition:

      opacity 5.8s ease,

      filter 5.8s ease,

      transform 5.8s ease;

    }

    .inner-symbol{

      z-index:1;

      transition:

      filter 4s ease;

    }

    @keyframes symbolAppear{

      0%{

        opacity:0;

        filter:blur(18px);

        transform:scale(.96);

      }

      35%{

        opacity:.08;

      }

      65%{

        opacity:.42;

      }

      100%{

        opacity:1;

        filter:blur(0px);

        transform:scale(1);

      }

    }

    /* GLITCH */

    .glitch{

      position:absolute;

      inset:0;

      pointer-events:none;

      opacity:0;

      mix-blend-mode:screen;

    }

    .glitch.active{

      animation:glitchFlash .55s ease-out forwards;

    }

    @keyframes glitchFlash{

      0%{

        opacity:0;

      }

      8%{

        opacity:.95;

        transform:translateX(-14px);

      }

      16%{

        opacity:0;

        transform:translateX(11px);

      }

      24%{

        opacity:.8;

        transform:translateX(-7px);

      }

      32%{

        opacity:0;

      }

      48%{

        opacity:.65;

        transform:translateY(6px);

      }

      64%{

        opacity:0;

      }

      100%{

        opacity:0;

      }

    }

    /* TEXT */

    .text-zone{

      position:relative;

      margin-top:14px;

      height:70px;

      display:flex;

      align-items:center;

      justify-content:center;

    }

    .signal-line,

    .reconnect{

      position:absolute;

      left:50%;

      top:50%;

      transform:translate(-50%,-50%);

      white-space:nowrap;

      letter-spacing:9px;

    }

    .signal-line{

      font-size:1.35rem;

      color:#bfb7a8;

      opacity:0;

    }

    .reconnect{

      font-size:1.25rem;

      color:#d8d2c8;

      opacity:0;

      cursor:pointer;

      user-select:none;

      transition:opacity .8s ease;

    }

    /* RECONNECT PULSE */

    .reconnect.live{

      animation:

      reconnectPulse 2.55s ease-in-out infinite;

    }

    @keyframes reconnectPulse{

      0%{

        opacity:.14;

        text-shadow:

        0 0 0px rgba(255,255,255,0);

      }

      22%{

        opacity:.36;

        text-shadow:

        0 0 5px rgba(255,255,255,.08);

      }

      48%{

        opacity:.82;

        text-shadow:

        0 0 10px rgba(255,255,255,.18),

        0 0 20px rgba(255,255,255,.08);

      }

      72%{

        opacity:.44;

        text-shadow:

        0 0 6px rgba(255,255,255,.08);

      }

      100%{

        opacity:.18;

        text-shadow:

        0 0 0px rgba(255,255,255,0);

      }

    }

    /* DISSOLVE */

    .outer-symbol.dissolve{

      opacity:0;

      filter:

      blur(18px)

      brightness(.35);

      transform:scale(1.12);

    }

  </style>

</head>

<body>

<div class="screen" id="screen">

  <div class="symbol-wrap">

    <img src="Inner17-final.png"

         class="inner-symbol"

         id="innerSymbol" />

    <img src="Outer17-final.png"

         class="outer-symbol"

         id="outerSymbol" />

    <div class="glitch"

         id="glitch"></div>

  </div>

  <div class="text-zone">

    <div class="signal-line"

         id="signalLine"></div>

    <div class="reconnect"

         id="reconnect">

      reconnect

    </div>

  </div>

</div>

<script>

  const signalLine =

  document.getElementById("signalLine");

  const reconnect =

  document.getElementById("reconnect");

  const outerSymbol =

  document.getElementById("outerSymbol");

  const innerSymbol =

  document.getElementById("innerSymbol");

  const glitch =

  document.getElementById("glitch");

  const screen =

  document.getElementById("screen");

  const phrase = "signal lost";

  let index = 0;

  /* GLITCH */

  setTimeout(() => {

    glitch.classList.add("active");

  }, 6900);

  /* TYPE */

  setTimeout(() => {

    signalLine.style.opacity = 1;

    typePhrase();

  }, 8300);

  function typePhrase(){

    if(index < phrase.length){

      signalLine.innerHTML +=

      phrase.charAt(index);

      index++;

      /* slower human typing */

      setTimeout(typePhrase, 195);

    } else {

      beginDots();

    }

  }

  /* SEARCHING */

  function beginDots(){

    let cycle = 0;

    function runCycle(){

      if(cycle >= 3){

        fadeSignalOut();

        return;

      }

      let dot = 0;

      function animateDots(){

        if(dot <= 3){

          signalLine.innerHTML =

          "signal lost" + ".".repeat(dot);

          dot++;

          setTimeout(animateDots, 420);

        } else {

          signalLine.innerHTML =

          "signal lost";

          cycle++;

          setTimeout(runCycle, 550);

        }

      }

      animateDots();

    }

    setTimeout(runCycle, 700);

  }

  /* FADE SIGNAL */

  function fadeSignalOut(){

    signalLine.style.transition =

    "opacity 2.2s ease";

    signalLine.style.opacity = 0;

    setTimeout(() => {

      activateReconnect();

    }, 1500);

  }

  /* ACTIVATE */

  function activateReconnect(){

    reconnect.style.opacity = .12;

    setTimeout(() => {

      reconnect.classList.add("live");

    }, 800);

  }

  /* CLICK */

  reconnect.addEventListener("click", () => {

    reconnect.style.pointerEvents = "none";

    /* kill pulse immediately */

    reconnect.classList.remove("live");

    reconnect.style.animation = "none";

    reconnect.style.transition =

    "opacity 2.2s ease";

    reconnect.style.opacity = 0;

    /* emotional pause */

    setTimeout(() => {

      outerSymbol.classList.add("dissolve");

      screen.style.background =

      "#020202";

      innerSymbol.style.filter =

      `

      drop-shadow(0 0 10px rgba(255,245,220,.10))

      drop-shadow(0 0 28px rgba(255,245,220,.08))

      `;

    }, 1400);

  });

</script>

</body>

</html>
