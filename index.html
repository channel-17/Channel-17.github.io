<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Little Homie Stage 1</title>

<style>

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

html,body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  font-family:Arial,Helvetica,sans-serif;

}

#stage{

  position:relative;

  width:100%;

  height:100%;

}

/* =========================

   LOADER

========================= */

#loaderWrap{

  position:absolute;

  width:min(76vw,420px);

  left:50%;

  top:42%;

  transform:translateX(-50%);

}

#loader{

  width:100%;

  height:26px;

  border:1px solid rgba(255,255,255,.15);

  overflow:hidden;

  position:relative;

  background:rgba(255,255,255,.02);

}

#fill{

  width:0%;

  height:100%;

  background:

  repeating-linear-gradient(

    90deg,

    #fff 0px,

    #fff 12px,

    transparent 12px,

    transparent 17px

  );

  transition:width .58s linear;

}

#percent{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:13px;

  letter-spacing:.25em;

  font-weight:bold;

  color:rgba(255,255,255,.45);

}

/* =========================

   LITTLE HOMIE

========================= */

#lane{

  position:absolute;

  width:min(76vw,420px);

  height:100px;

  left:50%;

  top:52%;

  transform:translateX(-50%);

}

#homie{

  position:absolute;

  left:50%;

  top:10px;

  transform:translateX(-50%);

  width:92px;

  height:58px;

  animation:

    bob 1.2s steps(2,end) infinite;

}

/* body */

.body{

  position:absolute;

  left:22px;

  top:18px;

  width:44px;

  height:24px;

  background:#fff;

  border-radius:24px 24px 12px 12px;

}

/* head */

.head{

  position:absolute;

  left:63px;

  top:21px;

  width:16px;

  height:16px;

  background:#fff;

  border-radius:50%;

}

/* eye */

.eye{

  position:absolute;

  right:4px;

  top:5px;

  width:3px;

  height:3px;

  background:#000;

  border-radius:50%;

}

/* tail */

.tail{

  position:absolute;

  left:14px;

  top:29px;

  width:0;

  height:0;

  border-top:5px solid transparent;

  border-bottom:5px solid transparent;

  border-right:10px solid #fff;

}

/* legs */

.leg{

  position:absolute;

  width:8px;

  height:11px;

  background:#fff;

  border-radius:4px;

  top:42px;

}

.leg1{

  left:30px;

  animation:legA 1.2s steps(2,end) infinite;

}

.leg2{

  left:50px;

  animation:legB 1.2s steps(2,end) infinite;

}

/* =========================

   MOTION

========================= */

@keyframes bob{

  50%{

    margin-top:2px;

  }

}

@keyframes legA{

  50%{

    transform:translateX(-3px);

  }

}

@keyframes legB{

  50%{

    transform:translateX(3px);

  }

}

</style>

</head>

<body>

<div id="stage">

  <!-- loader -->

  <div id="loaderWrap">

    <div id="loader">

      <div id="fill"></div>

      <div id="percent">0%</div>

    </div>

  </div>

  <!-- little homie -->

  <div id="lane">

    <div id="homie">

      <div class="tail"></div>

      <div class="body"></div>

      <div class="head">

        <div class="eye"></div>

      </div>

      <div class="leg leg1"></div>

      <div class="leg leg2"></div>

    </div>

  </div>

</div>

<script>

const fill = document.getElementById("fill");

const percent = document.getElementById("percent");

let progress = 0;

setInterval(()=>{

  progress++;

  if(progress > 100){

    progress = 0;

  }

  fill.style.width = progress + "%";

  percent.innerText = progress + "%";

},580);

</script>

</body>

</html>
