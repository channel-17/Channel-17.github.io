<!DOCTYPE html>
<html lang="en">
    <head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANNEL 17</title>
<style>

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background: black;

    overflow: hidden;

    font-family: Arial, sans-serif;

}

body {

    position: relative;

}

/* SYMBOL */

.logo {

    position: absolute;

    top: 42%;

    left: 50%;

    transform: translate(-50%, -50%);

    width: 170px;

    max-width: 58vw;

    opacity: 0;

    filter:

    blur(5px)

    drop-shadow(0 0 12px rgba(255,255,255,0.06));

    animation: signalFade 5s ease forwards;

    animation-delay: 1.8s;

}

/* SIGNAL TEXT */

.signal {

    position: absolute;

    top: 60%;

    left: 34%;

    color: rgba(255,255,255,0.42);

    font-size: 0.82rem;

    letter-spacing: 6px;

    text-transform: uppercase;

}

/* RECONNECT */

.reconnect {

    position: absolute;

    bottom: 20%;

    left: 50%;

    transform: translateX(-50%);

    color: rgba(255,255,255,0.22);

    text-decoration: none;

    letter-spacing: 10px;

    font-size: 0.78rem;

    opacity: 0;

    animation: reconnectFade 3s ease forwards;

    animation-delay: 10s;

}

/* FADE */

@keyframes signalFade {

    from {

        opacity: 0;

        filter:

        blur(10px)

        drop-shadow(0 0 2px rgba(255,255,255,0.02));

        transform:

        translate(-50%, -50%)

        scale(0.94);

    }

    to {

        opacity: 1;

        filter:

        blur(0)

        drop-shadow(0 0 18px rgba(255,255,255,0.08));

        transform:

        translate(-50%, -50%)

        scale(1);

    }

}

/* RECONNECT FADE */

@keyframes reconnectFade {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

</style>
</head>
<body>
    <img src="mark17.png" class="logo">
    <div class="signal" id="signal"></div>
    <a href="#" class="reconnect">

reconnect

</a>
    <script>

const text = "SIGNAL LOST...";

const speed = 120;

let i = 0;

function typeWriter() {

    if (i < text.length) {

        document.getElementById("signal").innerHTML += text.charAt(i);

        i++;

        setTimeout(typeWriter, speed);

    }

}

setTimeout(typeWriter, 5500);

</script>
    </body>
    </html>
