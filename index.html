<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>
<style>

html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    background: #000;

    overflow: hidden;

    font-family: Arial, sans-serif;

}

body {

    display: flex;

    justify-content: center;

    align-items: center;

}

.container {

    display: flex;

    flex-direction: column;

    align-items: center;

}

/* LOGO */

.logo {

    width: 160px;

    max-width: 55vw;

    opacity: 0;

    animation: fadeLogo 3s ease forwards;

    filter: drop-shadow(0 0 18px rgba(255,255,255,0.08));

}

/* TYPEWRITER */

.subtext {

    margin-top: 42px;

    color: rgba(255,255,255,0.78);

    font-size: 1rem;

    letter-spacing: 8px;

    text-transform: uppercase;

    overflow: hidden;

    white-space: nowrap;

    width: 0;

    border-right: 1px solid rgba(255,255,255,0.65);

    animation:

    typing 3.5s steps(26,end) forwards;

    animation-delay: 3s;

}

/* RECONNECT */

.reconnect {

    margin-top: 48px;

    color: rgba(255,255,255,0.35);

    text-decoration: none;

    font-size: 0.9rem;

    letter-spacing: 10px;

    opacity: 0;

    animation: fadeReconnect 2s ease forwards;

    animation-delay: 8s;

}

/* ANIMATIONS */

@keyframes fadeLogo {

    from {

        opacity: 0;

        transform: scale(0.92);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}

@keyframes typing {

    from {

        width: 0;

    }

    to {

        width: 26ch;

    }

}

@keyframes fadeReconnect {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}

</style>
</head>
  <body>
<div class="container">
  <img src="mark17.png" class="logo">
  <div class="subtext">

TRANSMISSION INTERRUPTED...

</div>
  <a class="reconnect" href="#">

reconnect

</a>
  </div>
    </body>

</html>
