<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

body{

position:relative;

color:#ddd;

}

/* =========================

   SIGNAL CHAOS

========================= */

#glitch{

position:fixed;

inset:0;

background:#000;

z-index:9999;

pointer-events:none;

opacity:1;

animation:glitchKill 3.2s forwards;

}

#glitch::before,

#glitch::after{

content:"";

position:absolute;

inset:0;

mix-blend-mode:screen;

}

#glitch::before{

background:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.04) 0px,

rgba(255,255,255,.04) 1px,

transparent 2px,

transparent 4px

);

animation:

scanMove .08s infinite,

flicker .15s infinite;

}

#glitch::after{

background:

linear-gradient(

90deg,

transparent,

rgba(255,120,40,.12),

transparent

);

filter:blur(30px);

animation:burnFlash .4s infinite;

}

@keyframes glitchKill{

0%{opacity:1;}

72%{opacity:1;}

100%{opacity:0;visibility:hidden;}

}

@keyframes flicker{

0%{opacity:.3;}

20%{opacity:.7;}

40%{opacity:.2;}

60%{opacity:.9;}

80%{opacity:.15;}

100%{opacity:.6;}

}

@keyframes scanMove{

from{transform:translateY(-10px);}

to{transform:translateY(10px);}

}

@keyframes burnFlash{

0%{transform:translateX(-100%);}

100%{transform:translateX(100%);}

}

/* =========================

   MAIN FIELD

========================= */

#field{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

}

/* =========================

   SYMBOL

========================= */

#symbolWrap{

position:relative;

width:52vw;

max-width:290px;

min-width:210px;

aspect-ratio:1/1;

opacity:.18;

transition:all 2.4s ease;

filter:blur(.2px);

}

#outer{

position:absolute;

inset:0;

width:100%;

height:100%;

object-fit:contain;

opacity:.2;

transition:all 2.8s ease;

}

#inner{

position:absolute;

inset:0;

width:100%;

height:100%;

object-fit:contain;

opacity:.65;

filter:

drop-shadow(0 0 4px rgba(255,180,110,.06))

drop-shadow(0 0 16px rgba(255,140,60,.12));

transition:all 2.8s ease;

}

/* after reconnect */

.connected #outer{

opacity:0;

filter:blur(8px);

transform:scale(1.12);

}

.connected #inner{

opacity:.92;

filter:

drop-shadow(0 0 6px rgba(255,190,120,.22))

drop-shadow(0 0 22px rgba(255,120,40,.28));

}

/* =========================

   SIGNAL TEXT

========================= */

#signalLost{

margin-top:42px;

letter-spacing:9px;

font-size:13px;

opacity:.22;

transition:all 1.5s ease;

}

#reconnect{

margin-top:40px;

font-size:22px;

letter-spacing:12px;

cursor:pointer;

color:#ddd;

opacity:.82;

transition:all .6s ease;

position:relative;

}

#reconnect:hover{

opacity:1;

letter-spacing:16px;

}

/* =========================

   AMBER TOUCH

========================= */

#pulse{

position:fixed;

width:20px;

height:20px;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,170,90,.55),

rgba(255,120,40,.18),

transparent 70%);

pointer-events:none;

transform:translate(-50%,-50%) scale(0);

opacity:0;

z-index:8000;

}

.pulsing{

animation:moodTouch 2.8s ease forwards;

}

@keyframes moodTouch{

0%{

transform:translate(-50%,-50%) scale(.4);

opacity:.65;

}

100%{

transform:translate(-50%,-50%) scale(28);

opacity:0;

}

}

/* =========================

   ETCHINGS

========================= */

#etchings{

position:fixed;

left:7vw;

bottom:13vh;

display:flex;

flex-direction:column;

gap:52px;

opacity:0;

transform:translateY(30px);

transition:all 2s ease;

z-index:40;

}

.connected #etchings{

opacity:1;

transform:translateY(0);

}

.etch{

display:block;

cursor:pointer;

user-select:none;

transition:all .45s ease;

filter:

drop-shadow(0 0 4px rgba(255,120,40,.06));

}

.etch img{

width:min(62vw,360px);

height:auto;

display:block;

}

.etch:hover{

transform:translateX(8px);

filter:

drop-shadow(0 0 8px rgba(255,150,70,.2))

drop-shadow(0 0 18px rgba(255,120,40,.15));

}

/* uneven humanity */

#etch1{

transform:rotate(-3deg);

}

#etch2{

margin-left:28px;

transform:rotate(1deg);

}

#etch3{

margin-left:10px;

transform:rotate(-1.5deg);

}

/* =========================

   SMOKE

========================= */

.smoke{

position:fixed;

inset:-20%;

pointer-events:none;

opacity:0;

transition:opacity 4s ease;

z-index:3;

}

.connected .smoke{

opacity:.16;

}

.smoke::before,

.smoke::after{

content:"";

position:absolute;

width:60vw;

height:60vw;

background:

radial-gradient(circle,

rgba(255,255,255,.08),

transparent 70%);

filter:blur(60px);

animation:drift 24s linear infinite;

}

.smoke::after{

left:50%;

top:40%;

animation-duration:31s;

opacity:.5;

}

@keyframes drift{

0%{

transform:translate(-10vw,5vh) scale(1);

}

50%{

transform:translate(12vw,-8vh) scale(1.2);

}

100%{

transform:translate(-8vw,10vh) scale(.9);

}

}

/* =========================

   MOBILE

========================= */

@media(max-width:700px){

#etchings{

left:9vw;

bottom:12vh;

gap:40px;

}

#signalLost{

font-size:11px;

letter-spacing:7px;

}

#reconnect{

font-size:20px;

letter-spacing:10px;

}

}

</style>

</head>

<body>

<div id="glitch"></div>

<div class="smoke"></div>

<div id="pulse"></div>

<div id="field">

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<div id="signalLost">signal lost</div>

<div id="reconnect">reconnect</div>

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png">

</a>

</div>

<script>

const reconnect = document.getElementById("reconnect");

const pulse = document.getElementById("pulse");

reconnect.addEventListener("click",(e)=>{

pulse.style.left = e.clientX + "px";

pulse.style.top = e.clientY + "px";

pulse.classList.remove("pulsing");

void pulse.offsetWidth;

pulse.classList.add("pulsing");

document.body.classList.add("connected");

document.getElementById("signalLost").style.opacity = "0";

reconnect.style.opacity = "0";

reconnect.style.pointerEvents = "none";

});

</script>

</body>

</html>
