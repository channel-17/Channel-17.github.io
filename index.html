<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" type="image/png" href="mark17.png"/>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

    color:#d7cdbd;

}

/* MAIN */

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transform:translateY(-22px);

}

/* SYMBOL */

.symbol{

    width:220px;

    opacity:0;

    filter:

        drop-shadow(0 0 4px rgba(255,245,220,.08))

        drop-shadow(0 0 14px rgba(255,245,220,.05));

}

/* GLITCH */

.glitch{

    animation:glitch .22s linear 2;

}

@keyframes glitch{

    0%{

        transform:translateX(0px);

        filter:brightness(1);

    }

    20%{

        transform:translateX(-8px);

        filter:brightness(2.5);

    }

    40%{

        transform:translateX(7px);

        filter:brightness(.45);

    }

    60%{

        transform:translateX(-5px);

    }

    80%{

        transform:translateX(4px);

    }

    100%{

        transform:translateX(0px);

        filter:brightness(1);

    }

}

/* TEXT AREA */

.text-area{

    margin-top:34px;

    min-height:38px;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

}

/* SIGNAL LOST */

#line{

    font-size:1.52rem;

    letter-spacing:.48rem;

    color:#d3cab9;

    opacity:0;

    transition:opacity 1.2s ease;

    white-space:nowrap;

}

/* RECONNECT */

#reconnect{

    position:absolute;

    font-size:1.52rem;

    letter-spacing:.48rem;

    color:#948a7d;

    opacity:0;

    transition:opacity 2s ease;

    white-space:nowrap;

    cursor:pointer;

    user-select:none;

    transform-origin:center;

}

/* ACTIVE PULSE */

#reconnect.active{

    animation:pulse 2.8s ease-in-out infinite;

}

@keyframes pulse{

    0%{

        opacity:.22;

        transform:scale(1);

        letter-spacing:.48rem;

        filter:

            blur(.4px)

            brightness(.82);

        text-shadow:

            0 0 0px rgba(255,255,255,0);

    }

    50%{

        opacity:.92;

        transform:scale(1.018);

        letter-spacing:.52rem;

        filter:

            blur(0px)

            brightness(1.18);

        text-shadow:

            0 0 6px rgba(255,255,255,.08),

            0 0 18px rgba(255,255,255,.06);

    }

    100%{

        opacity:.22;

        transform:scale(1);

        letter-spacing:.48rem;

        filter:

            blur(.4px)

            brightness(.82);

        text-shadow:

            0 0 0px rgba(255,255,255,0);

    }

}

</style>

</head>

<body>

<div class="container">

    <img src="mark17.png" class="symbol" id="symbol">

    <div class="text-area">

        <div id="line"></div>

        <div id="reconnect">

            reconnect

        </div>

    </div>

</div>

<script>

const symbol = document.getElementById("symbol");

const line = document.getElementById("line");

const reconnect = document.getElementById("reconnect");

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function runSequence(){

    /* BLACK SCREEN */

    await sleep(3200);

    /* SYMBOL BLEEDS IN */

    symbol.style.transition = "opacity 2.7s ease";

    symbol.style.opacity = ".93";

    await sleep(2700);

    /* BIG GLITCH HIT */

    symbol.classList.add("glitch");

    await sleep(500);

    /* START TYPEWRITER */

    line.style.opacity = "1";

    const words = [

        "s",

        "si",

        "sig",

        "sign",

        "signa",

        "signal",

        "signal ",

        "signal l",

        "signal lo",

        "signal los",

        "signal lost"

    ];

    for(let i = 0; i < words.length; i++){

        line.innerHTML = words[i];

        await sleep(120);

    }

    /* HOLD */

    await sleep(700);

    /* SEARCHING DOTS */

    for(let cycle = 0; cycle < 3; cycle++){

        line.innerHTML = "signal lost.";

        await sleep(340);

        line.innerHTML = "signal lost..";

        await sleep(340);

        line.innerHTML = "signal lost...";

        await sleep(520);

        line.innerHTML = "signal lost";

        await sleep(260);

    }

    /* FINAL HOLD */

    await sleep(500);

    /* FADE SIGNAL LOST AWAY */

    line.style.opacity = "0";

    await sleep(1300);

    /* GHOST RECONNECT */

    reconnect.style.opacity = ".14";

    await sleep(1200);

    /* ACTIVATE */

    reconnect.classList.add("active");

}

runSequence();

</script>

</body>

</html>
