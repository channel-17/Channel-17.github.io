<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

/* =========================================

RESET

========================================= */

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

color:#fff;

}

/* =========================================

PHONE DARKNESS

========================================= */

#vignette{

position:fixed;

inset:0;

pointer-events:none;

z-index:999999;

background:

radial-gradient(

circle,

transparent 52%,

rgba(0,0,0,.45) 76%,

rgba(0,0,0,.98) 100%

);

}

/* =========================================

NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.05;

mix-blend-mode:screen;

z-index:50;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 3px

);

animation:

noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(3px);

}

}

/* =========================================

LOADER

========================================= */

#loaderWrap{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:#000;

z-index:1000;

}

/* transmission tube */

#tube{

width:min(84vw,540px);

height:24px;

border-radius:999px;

overflow:hidden;

position:relative;

border:

1px solid rgba(255,255,255,.18);

background:

rgba(255,255,255,.03);

box-shadow:

0 0 12px rgba(255,255,255,.04);

}

/* fill */

#fill{

position:absolute;

left:0;

top:0;

height:100%;

width:0%;

border-radius:999px;

background:

linear-gradient(

90deg,

rgba(255,255,255,.85),

rgba(255,255,255,1)

);

}

/* turtle */

#turtle{

margin-top:22px;

font-size:28px;

opacity:.82;

transition:

.18s linear;

filter:

drop-shadow(

0 0 10px rgba(255,255,255,.08)

);

}

/* percent */

#percent{

margin-top:14px;

font-size:12px;

letter-spacing:.32em;

opacity:.18;

}

/* =========================================

FLASH

========================================= */

#flash{

position:fixed;

inset:0;

background:#fff;

opacity:0;

pointer-events:none;

mix-blend-mode:screen;

z-index:500;

}

/* =========================================

WORLD CHAOS

========================================= */

#chaos{

position:fixed;

inset:0;

pointer-events:none;

overflow:hidden;

opacity:0;

z-index:300;

}

/* duplicated bars */

.ghostBar{

position:absolute;

left:0;

width:100%;

height:54px;

border-bottom:

1px solid rgba(255,255,255,.08);

background:

linear-gradient(

180deg,

rgba(255,255,255,.06),

transparent

);

mix-blend-mode:screen;

}

/* duplicated search bars */

.searchGhost{

position:absolute;

width:68vw;

height:46px;

left:50%;

transform:

translateX(-50%);

border-radius:999px;

border:

1px solid rgba(255,255,255,.1);

background:

rgba(255,255,255,.03);

opacity:.12;

filter:blur(.4px);

}

/* warning */

.warning{

position:absolute;

font-size:

clamp(10px,1.6vw,18px);

letter-spacing:.22em;

white-space:nowrap;

color:#ff3131;

opacity:0;

mix-blend-mode:screen;

text-shadow:

0 0 12px rgba(255,0,0,.35);

animation:

warning .18s linear;

}

@keyframes warning{

0%{

opacity:0;

transform:

translateX(-8px);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:

translateX(8px);

}

}

/* signal lost */

#signalLost{

position:absolute;

top:50%;

left:50%;

transform:

translate(-50%,-50%);

font-size:

clamp(28px,5vw,74px);

letter-spacing:.26em;

white-space:nowrap;

opacity:0;

color:#fff;

mix-blend-mode:screen;

text-shadow:

0 0 18px rgba(255,255,255,.16);

}

/* =========================================

YELLOW CONTAMINATION

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

z-index:260;

pointer-events:none;

opacity:0;

}

/* =========================================

RECONNECT SPACE

========================================= */

#signalSpace{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:

2s ease;

z-index:1200;

}

/* subtle humanity haze */

#signalGlow{

position:absolute;

width:90vw;

height:70vh;

background:

radial-gradient(

circle,

rgba(255,180,90,.035) 0%,

rgba(255,180,90,.015) 24%,

transparent 72%

);

filter:

blur(40px);

opacity:.7;

}

/* symbol */

#symbol{

position:absolute;

width:min(72vw,420px);

opacity:.22;

filter:

drop-shadow(

0 0 14px rgba(255,180,90,.06)

);

}

/* reconnect */

#reconnect{

position:absolute;

top:58%;

font-size:

clamp(18px,3vw,30px);

letter-spacing:.28em;

opacity:0;

cursor:pointer;

transition:

1s ease;

color:

rgba(255,255,255,.72);

text-shadow:

0 0 12px rgba(255,255,255,.08);

}

#reconnect.active{

opacity:.88;

}

/* =========================================

THERMAL TOUCH

========================================= */

#touch{

position:fixed;

width:34px;

height:34px;

border-radius:50%;

pointer-events:none;

opacity:0;

z-index:2000;

background:

radial-gradient(

circle,

rgba(255,220,180,.22) 0%,

rgba(255,180,90,.14) 26%,

rgba(255,180,90,.04) 60%,

transparent 80%

);

filter:

blur(10px);

transform:

translate(-50%,-50%);

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

pointer-events:none;

opacity:0;

transition:

4s ease;

}

/* links */

.etch{

position:absolute;

display:block;

opacity:.18;

filter:

drop-shadow(

0 0 10px rgba(255,180,90,.04)

);

transition:

3s ease;

}

/* imperfect placement */

#etch1{

width:min(40vw,220px);

left:12%;

top:58%;

transform:

rotate(-3deg);

}

#etch2{

width:min(52vw,320px);

left:25%;

top:68%;

transform:

rotate(1deg);

}

#etch3{

width:min(42vw,250px);

left:52%;

top:79%;

transform:

rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #signalSpace{

opacity:1;

}

.connected #etchings{

opacity:1;

}

.connected .etch{

opacity:.72;

}

</style>

</head>

<body>

<!-- ======================================

NOISE

====================================== -->

<div id="noise"></div>

<!-- ======================================

FLASH

====================================== -->

<div id="flash"></div>

<!-- ======================================

CHAOS

====================================== -->

<div id="chaos">

<div id="signalLost">

SIGNAL LOST

</div>

</div>

<!-- ======================================

LOADER

====================================== -->

<div id="loaderWrap">

<div id="tube">

<div id="fill"></div>

</div>

<div id="turtle">

🐢

</div>

<div id="percent">

0%

</div>

</div>

<!-- ======================================

CONTAMINATION

====================================== -->

<canvas id="matrix"></canvas>

<!-- ======================================

SIGNAL SPACE

====================================== -->

<div id="signalSpace">

<div id="signalGlow"></div>

<img id="symbol"

src="Outer17-final.png">

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<!-- ======================================

TOUCH

====================================== -->

<div id="touch"></div>

<!-- ======================================

EDGE

====================================== -->

<div id="vignette"></div>

<script>

/* =========================================

LOADER

========================================= */

const fill =

document.getElementById("fill");

const percent =

document.getElementById("percent");

const turtle =

document.getElementById("turtle");

const loaderWrap =

document.getElementById("loaderWrap");

let load = 0;

/* smooth pour */

const loader =

setInterval(()=>{

load += .45;

if(load > 17){

load = 17;

}

fill.style.width =

load + "%";

percent.innerText =

Math.floor(load) + "%";

/* turtle slight movement */

turtle.style.transform =

`translateX(${load * 1.8}px)`;

/* 16% turtle senses */

if(load >= 16 && load < 16.5){

turtle.innerText = "🐢";

turtle.style.transform =

`translateX(${load * 1.8}px)

scaleX(-1)`;

}

/* 17% */

if(load >= 17){

clearInterval(loader);

turtle.innerText = "🐢";

turtle.style.transform =

`translateX(${load * 1.8}px)

scale(.92)`;

setTimeout(()=>{

chaos();

},520);

}

},65);

/* =========================================

CHAOS

========================================= */

const chaosLayer =

document.getElementById("chaos");

function chaos(){

loaderWrap.style.opacity = 0;

setTimeout(()=>{

loaderWrap.style.display = "none";

},500);

chaosLayer.style.opacity = 1;

document.body.classList.add("shake");

matrix.style.opacity = .5;

runChaos();

setTimeout(()=>{

collapse();

},2600);

}

/* =========================================

FLASH

========================================= */

function flash(){

const flash =

document.getElementById("flash");

flash.style.opacity =

Math.random() * .18;

setTimeout(()=>{

flash.style.opacity = 0;

},30);

}

/* =========================================

WARNING

========================================= */

function warning(){

const w =

document.createElement("div");

w.className = "warning";

const msgs = [

"TRANSMISSION BREACH",

"UNAUTHORIZED SIGNAL",

"MEMORY COLLISION",

"SYSTEM FAILURE",

"CONTAINMENT FAILURE",

"SIGNAL OVERLOAD"

];

w.innerText =

msgs[

Math.floor(

Math.random()*msgs.length

)

];

w.style.left =

(Math.random()*70+10)+"%";

w.style.top =

(Math.random()*70+10)+"%";

chaosLayer.appendChild(w);

setTimeout(()=>{

w.remove();

},180);

}

/* =========================================

GHOST BARS

========================================= */

function ghostBar(){

const g =

document.createElement("div");

g.className = "ghostBar";

g.style.transform =

`translate(

${Math.random()*34-17}px,

${Math.random()*22-11}px

)`;

chaosLayer.appendChild(g);

setTimeout(()=>{

g.remove();

},90);

}

/* =========================================

SEARCH GHOSTS

========================================= */

function searchGhost(){

const s =

document.createElement("div");

s.className = "searchGhost";

s.style.top =

(Math.random()*70+10)+"%";

s.style.transform =

`translateX(-50%)

translate(

${Math.random()*70-35}px,

${Math.random()*40-20}px

)`;

chaosLayer.appendChild(s);

setTimeout(()=>{

s.remove();

},120);

}

/* =========================================

SIGNAL LOST

========================================= */

function signalLost(){

const s =

document.getElementById("signalLost");

s.style.opacity = 1;

setTimeout(()=>{

s.style.opacity = 0;

},90);

}

/* =========================================

RUN CHAOS

========================================= */

function runChaos(){

const interval =

setInterval(()=>{

if(Math.random() > .35){

ghostBar();

}

if(Math.random() > .42){

searchGhost();

}

if(Math.random() > .55){

warning();

}

if(Math.random() > .68){

flash();

}

if(Math.random() > .72){

signalLost();

}

},58);

setTimeout(()=>{

clearInterval(interval);

},2500);

}

/* =========================================

COLLAPSE

========================================= */

function collapse(){

document.body.classList.remove("shake");

chaosLayer.style.opacity = 0;

matrix.style.opacity = 0;

setTimeout(()=>{

document.body.classList.add("connected");

const reconnect =

document.getElementById("reconnect");

reconnect.classList.add("active");

},400);

}

/* =========================================

MATRIX CONTAMINATION

========================================= */

const matrix =

document.getElementById("matrix");

const ctx =

matrix.getContext("2d");

function resize(){

matrix.width =

window.innerWidth;

matrix.height =

window.innerHeight;

}

resize();

window.addEventListener(

"resize",

resize

);

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

const streams = [];

for(let i=0;i<38;i++){

streams.push({

x:

Math.random()*matrix.width,

y:

Math.random()*matrix.height,

speed:

2 + Math.random()*5,

len:

10 + Math.random()*14

});

}

function draw(){

ctx.fillStyle =

"rgba(0,0,0,.08)";

ctx.fillRect(

0,

0,

matrix.width,

matrix.height

);

streams.forEach(s=>{

for(let i=0;i<s.len;i++){

ctx.fillStyle =

`rgba(165,160,45,${

1 - (i/s.len)

})`;

ctx.font =

"18px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random()*chars.length

)

],

s.x + (i*18),

s.y

);

}

s.x += s.speed;

if(s.x > matrix.width + 300){

s.x = -400;

s.y =

Math.random()*matrix.height;

}

});

requestAnimationFrame(draw);

}

draw();

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",e=>{

reconnect.classList.remove("active");

/* human touch */

const touch =

document.getElementById("touch");

touch.style.left =

e.clientX + "px";

touch.style.top =

e.clientY + "px";

touch.style.opacity = 1;

touch.animate([

{

transform:

"translate(-50%,-50%) scale(.6)"

},

{

transform:

"translate(-50%,-50%) scale(1.6)"

}

],{

duration:260,

fill:"forwards"

});

setTimeout(()=>{

touch.style.opacity = 0;

},700);

});

</script>

</body>

</html>
