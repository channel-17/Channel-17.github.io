<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Channel 17</title>

<style>

{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:Courier New, monospace;
}

body{
position:relative;
}



/ BACKGROUND /

.bg{
position:absolute;
inset:0;

background:
radial-gradient(
circle at center,
rgba(10,10,10,.95) 0%,
black 82%
);

}



/ SYMBOL /

.symbol{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:210px;

opacity:.045;

transition:4s ease;
}



/ SIGNAL LOST /

.signal{
position:absolute;

top:67%;
left:50%;

transform:
translateX(-50%);

color:#bfb7aa;

font-size:.85rem;

letter-spacing:8px;

opacity:0;

animation:
signalAppear 3s ease forwards;

animation-delay:5s;
}

@keyframes signalAppear{

0%{
opacity:0;
letter-spacing:18px;
filter:blur(8px);
}

100%{
opacity:.65;
letter-spacing:8px;
filter:none;
}

}



/ RECONNECT /

.reconnect{
position:absolute;

top:67%;
left:50%;

transform:
translateX(-50%);

color:#d7d0c5;

font-size:.85rem;

letter-spacing:8px;

opacity:0;

cursor:pointer;

animation:
reconnectAppear 2s ease forwards;

animation-delay:9s;
}

@keyframes reconnectAppear{

0%{
opacity:0;
}

100%{
opacity:.8;
}

}



/ EMBER /

.ember{
position:absolute;

width:12px;
height:12px;

border-radius:50%;

pointer-events:none;

opacity:0;

background:
radial-gradient(
circle,
rgba(255,190,120,1) 0%,
rgba(255,120,50,.95) 25%,
rgba(255,70,20,.35) 60%,
transparent 100%
);

box-shadow:
0 0 18px rgba(255,120,50,.6);
}



/ FREQUENCY /

.frequency{
position:absolute;

left:7vw;
bottom:7vh;

display:flex;
flex-direction:column;

gap:14px;

opacity:0;

transition:3s ease;
}

.frequency div{

font-size:.6rem;

letter-spacing:3px;

color:#cfc7bb;

opacity:.6;
}



/ ACTIVE STATES /

.symbol.awaken{
opacity:.16;
}

.frequency.awaken{
opacity:1;
}

</style>

</head>

<body>

<div class="bg"></div>

<img
src="Inner17-final.png"
class="symbol"
id="symbol"
>

<div
class="signal"
id="signal"
>
signal lost
</div>

<div
class="reconnect"
id="reconnect"
>
reconnect
</div>

<div
class="frequency"
id="frequency"
>

<div>Latest Sesh</div>
<div>Roach Tray</div>
<div>Pass One Back</div>

</div>

<div
class="ember"
id="ember"
></div>

<script>

const reconnect =
document.getElementById("reconnect");

const signal =
document.getElementById("signal");

const symbol =
document.getElementById("symbol");

const ember =
document.getElementById("ember");

const frequency =
document.getElementById("frequency");



reconnect.addEventListener("click",(e)=>{

/ HIDE TEXT /

reconnect.style.opacity="0";

signal.style.opacity="0";



/ EMBER POSITION /

ember.style.left =
e.clientX + "px";

ember.style.top =
e.clientY + "px";



/ SHOW EMBER /

ember.style.opacity="1";



/ EMBER ANIMATION /

ember.animate([

{
transform:"translate(-50%,-50%) scale(.2)",
opacity:1
},

{
transform:"translate(-50%,-50%) scale(18)",
opacity:.05
}

],{

duration:5000,
easing:"ease-out",
fill:"forwards"

});



/ SYMBOL AWAKENS /

setTimeout(()=>{

symbol.classList.add("awaken");

},400);



/ FREQUENCY REVEAL */

setTimeout(()=>{

frequency.classList.add("awaken");

},2200);

});

</script>

</body>
</html>
