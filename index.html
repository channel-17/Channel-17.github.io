<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:black;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:black;

overflow:hidden;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

z-index:1;

background:black;

}

/* =========================================

NOISE

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.05;

z-index:2;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 4px

);

animation:noise .14s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(4px);

}

}

/* =========================================

OVERLAY

========================================= */

#overlay{

position:fixed;

inset:0;

z-index:10;

pointer-events:none;

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:58%;

left:50%;

transform:translateX(-50%);

font-size:clamp(26px,4vw,44px);

letter-spacing:.24em;

color:white;

opacity:0;

white-space:nowrap;

}

#signalLost.active{

animation:heartbeat .5s ease infinite;

}

@keyframes heartbeat{

0%{

opacity:.05;

}

35%{

opacity:1;

}

100%{

opacity:.05;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:40%;

left:50%;

transform:translate(-50%,-50%);

width:min(78vw,470px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:2.5s ease;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:3s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.34;

transition:3s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:58%;

left:50%;

transform:translateX(-50%);

font-size:clamp(22px,4vw,40px);

letter-spacing:.24em;

color:#f2c690;

opacity:0;

pointer-events:none;

cursor:pointer;

transition:2s ease;

text-shadow:

0 0 8px rgba(255,140,40,.04),

0 0 24px rgba(255,120,20,.02);

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:reconnectPulse 4s ease-in-out infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.4;

text-shadow:

0 0 8px rgba(255,140,40,.04),

0 0 20px rgba(255,120,20,.02);

}

50%{

opacity:1;

text-shadow:

0 0 16px rgba(255,190,120,.26),

0 0 48px rgba(255,120,20,.16);

}

}

/* =========================================

WARMTH

========================================= */

#warmth{

position:fixed;

inset:0;

z-index:3;

pointer-events:none;

opacity:0;

background:

radial-gradient(circle at center,

rgba(255,140,40,.22) 0%,

rgba(255,120,20,.08) 20%,

rgba(255,120,20,.03) 40%,

transparent 70%);

transition:3s ease;

mix-blend-mode:screen;

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:4s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%);

filter:blur(45px);

animation:smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:translate(0,0) scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:translate(160px,-220px) scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:2.4s ease;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

filter:

drop-shadow(0 0 14px rgba(255,120,20,.16))

drop-shadow(0 0 28px rgba(255,120,20,.06));

transition:.4s ease;

}

.etch:hover{

transform:translateX(6px);

}

#etch1{

width:min(56vw,350px);

left:8%;

top:24%;

transform:rotate(-2deg);

}

#etch2{

width:min(62vw,390px);

left:12%;

top:48%;

transform:rotate(2deg);

}

#etch3{

width:min(58vw,340px);

left:15%;

bottom:12%;

transform:rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(0 0 18px rgba(255,180,90,.24))

drop-shadow(0 0 56px rgba(255,120,20,.16));

}

.connected #warmth{

opacity:1;

}

.connected #smoke{

opacity:1;

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="warmth"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="overlay">

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<script>

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

/* =========================================

DATA

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 16;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y: i * fontSize,

x:

Math.random() * -800,

speed:

14 + Math.random() * 22,

length:

14 + Math.random() * 50,

glitch:

Math.random() > .8

});

}

/* =========================================

HIDDEN .17

========================================= */

const hidden17 = {

x:

canvas.width * .58,

y:

canvas.height * .68,

w:120,

h:50

};

/* =========================================

DRAW

========================================= */

function drawMatrix(){

ctx.fillStyle =

"rgba(0,0,0,0.12)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

/* negative space */

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* random vertical corruption */

if(stream.glitch && Math.random() > .97){

ctx.fillStyle =

"rgba(100,255,100,.6)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y + (Math.random()*90)

);

}

}

/* reset */

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 200

){

stream.x =

Math.random() * -1200;

stream.speed =

14 + Math.random() * 22;

stream.length =

14 + Math.random() * 50;

}

stream.x += stream.speed;

});

}

/* =========================================

START

========================================= */

const matrixLoop =

setInterval(drawMatrix,35);

/* =========================================

SEQUENCE

========================================= */

const signalLost =

document.getElementById("signalLost");

const reconnect =

document.getElementById("reconnect");

const symbolWrap =

document.getElementById("symbolWrap");

const etchings =

document.getElementById("etchings");

/* chaos ends */

setTimeout(()=>{

clearInterval(matrixLoop);

ctx.fillStyle = "black";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

},3600);

/* signal lost */

setTimeout(()=>{

signalLost.style.opacity = 1;

signalLost.classList.add("active");

},4200);

/* remove signal */

setTimeout(()=>{

signalLost.style.opacity = 0;

},6200);

/* symbol emerges */

setTimeout(()=>{

symbolWrap.classList.add("visible");

},7000);

/* reconnect */

setTimeout(()=>{

signalLost.classList.remove("active");

reconnect.classList.add("active");

},8600);

/* reconnect click */

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.classList.add("connected");

/* reveal */

setTimeout(()=>{

etchings.classList.add("visible");

},1500);

});

</script>

</body>

</html>
