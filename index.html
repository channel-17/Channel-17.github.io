<!-- ========================================= -->

<!-- CHANNEL 17 / INFECTION BUILD -->

<!-- ========================================= -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHANNEL 17</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html,body{

width:100%;

height:100%;

overflow:hidden;

background:#000;

font-family:Courier New, monospace;

}

/* =========================================

BASE

========================================= */

body{

background:#000;

overflow:hidden;

}

/* =========================================

CANVAS

========================================= */

canvas{

position:fixed;

inset:0;

width:100%;

height:100%;

display:block;

z-index:1;

background:#000;

}

/* =========================================

STATIC

========================================= */

#noise{

position:fixed;

inset:0;

pointer-events:none;

opacity:.05;

z-index:2;

background-image:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.03) 0px,

rgba(255,255,255,.03) 1px,

transparent 1px,

transparent 4px

);

animation:noise .05s linear infinite;

}

@keyframes noise{

0%{

transform:translateY(0px);

}

100%{

transform:translateY(4px);

}

}

/* =========================================

GLITCH FLASHES

========================================= */

#glitchLayer{

position:fixed;

inset:0;

pointer-events:none;

z-index:6;

mix-blend-mode:screen;

}

.glitchFlash{

position:absolute;

background:

rgba(255,255,255,.12);

opacity:0;

animation:

glitchFlash .12s linear;

}

@keyframes glitchFlash{

0%{

opacity:0;

}

50%{

opacity:1;

}

100%{

opacity:0;

}

}

/* =========================================

WHITE SIGNAL CHAOS

========================================= */

#signalNoise{

position:fixed;

inset:0;

pointer-events:none;

z-index:5;

opacity:0;

mix-blend-mode:screen;

}

.signalLine{

position:absolute;

height:1px;

background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.95),

transparent

);

animation:

signalMove linear infinite;

}

@keyframes signalMove{

0%{

transform:translateX(-80px);

opacity:.02;

}

50%{

opacity:.3;

}

100%{

transform:translateX(80px);

opacity:.04;

}

}

/* =========================================

SIGNAL LOST

========================================= */

#signalLost{

position:absolute;

top:54%;

left:50%;

transform:translateX(-50%);

font-size:clamp(28px,4vw,54px);

letter-spacing:.24em;

color:white;

opacity:0;

white-space:nowrap;

mix-blend-mode:screen;

filter:blur(.3px);

}

#signalLost.active{

animation:

warningPulse .22s infinite;

}

@keyframes warningPulse{

0%{

opacity:.04;

transform:

translateX(-50%)

translateY(0px);

}

20%{

opacity:1;

transform:

translateX(-50%)

translateY(-2px);

}

45%{

opacity:.18;

}

70%{

opacity:.92;

transform:

translateX(-50%)

translateY(2px);

}

100%{

opacity:.04;

}

}

/* =========================================

SYMBOL

========================================= */

#symbolWrap{

position:absolute;

top:39%;

left:50%;

transform:translate(-50%,-50%);

width:min(78vw,470px);

aspect-ratio:1/1;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

transition:2s ease;

}

#symbolWrap.visible{

opacity:1;

}

#outer{

position:absolute;

width:100%;

opacity:.34;

transition:8s ease;

}

#inner{

position:absolute;

width:100%;

opacity:.34;

transition:8s ease;

}

/* =========================================

RECONNECT

========================================= */

#reconnect{

position:absolute;

top:60%;

left:50%;

transform:translateX(-50%);

font-size:clamp(18px,3vw,28px);

letter-spacing:.24em;

color:#efc18a;

opacity:0;

pointer-events:none;

cursor:pointer;

transition:3s ease;

text-shadow:

0 0 6px rgba(255,120,20,.04);

}

#reconnect.active{

opacity:1;

pointer-events:auto;

animation:

reconnectPulse 4s ease infinite;

}

@keyframes reconnectPulse{

0%,100%{

opacity:.22;

}

50%{

opacity:1;

text-shadow:

0 0 16px rgba(255,180,90,.22),

0 0 42px rgba(255,120,20,.12);

}

}

/* =========================================

VIRUS STAIN

========================================= */

#stain{

position:fixed;

inset:0;

z-index:3;

pointer-events:none;

opacity:0;

background:

radial-gradient(circle at center,

rgba(255,90,30,.28) 0%,

rgba(255,120,20,.12) 6%,

rgba(255,120,20,.05) 12%,

transparent 20%);

mix-blend-mode:screen;

transition:10s ease;

}

/* =========================================

BACKGROUND LIGHTEN

========================================= */

#warmBackground{

position:fixed;

inset:0;

background:

radial-gradient(circle at center,

rgba(255,140,40,.05) 0%,

rgba(255,110,20,.02) 25%,

transparent 60%);

opacity:0;

z-index:2;

pointer-events:none;

transition:10s ease;

}

/* =========================================

SMOKE

========================================= */

#smoke{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:4;

opacity:0;

transition:6s ease;

}

.cloud{

position:absolute;

width:55vw;

height:55vw;

border-radius:50%;

background:

radial-gradient(circle,

rgba(255,255,255,.05) 0%,

rgba(255,255,255,.02) 18%,

transparent 70%);

filter:blur(45px);

animation:

smoke linear infinite;

}

.cloud:nth-child(1){

left:-10%;

bottom:-10%;

animation-duration:28s;

}

.cloud:nth-child(2){

right:-20%;

top:10%;

animation-duration:34s;

animation-delay:7s;

}

.cloud:nth-child(3){

left:30%;

bottom:-20%;

animation-duration:30s;

animation-delay:15s;

}

@keyframes smoke{

0%{

transform:

translate(0,0)

scale(1);

opacity:0;

}

10%{

opacity:.12;

}

50%{

opacity:.05;

}

100%{

transform:

translate(160px,-220px)

scale(1.35);

opacity:0;

}

}

/* =========================================

ETCHINGS

========================================= */

#etchings{

position:absolute;

inset:0;

opacity:0;

pointer-events:none;

transition:6s ease;

}

#etchings.visible{

opacity:1;

pointer-events:auto;

}

.etch{

position:absolute;

display:block;

opacity:.04;

filter:

drop-shadow(

0 0 12px

rgba(255,120,20,.06)

);

transition:6s ease;

}

.connected .etch{

opacity:1;

}

#etch1{

width:min(48vw,280px);

left:7%;

top:43%;

transform:rotate(-4deg);

}

#etch2{

width:min(62vw,390px);

left:12%;

top:50%;

transform:rotate(2deg);

}

#etch3{

width:min(56vw,330px);

left:24%;

bottom:2%;

transform:rotate(-4deg);

}

/* =========================================

CONNECTED

========================================= */

.connected #warmBackground{

opacity:1;

}

.connected #smoke{

opacity:1;

}

.connected #outer{

opacity:.02;

filter:

blur(2px);

}

.connected #inner{

opacity:1;

filter:

drop-shadow(

0 0 18px

rgba(255,180,90,.22)

)

drop-shadow(

0 0 56px

rgba(255,120,20,.12)

);

}

</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div id="noise"></div>

<div id="warmBackground"></div>

<div id="stain"></div>

<div id="signalNoise"></div>

<div id="glitchLayer"></div>

<div id="smoke">

<div class="cloud"></div>

<div class="cloud"></div>

<div class="cloud"></div>

</div>

<div id="overlay">

<div id="signalLost">

SIGNAL LOST

</div>

<div id="symbolWrap">

<img id="outer" src="Outer17-final.png">

<img id="inner" src="Inner17-final.png">

</div>

<div id="reconnect">

RECONNECT

</div>

<div id="etchings">

<a class="etch" id="etch1" href="#">

<img src="lastsesh17.png" width="100%">

</a>

<a class="etch" id="etch2" href="#">

<img src="RoachTray17.png" width="100%">

</a>

<a class="etch" id="etch3" href="#">

<img src="PassItBack17.png" width="100%">

</a>

</div>

</div>

<script>

/* =========================================

CANVAS

========================================= */

const canvas =

document.getElementById("matrix");

const ctx =

canvas.getContext("2d");

canvas.width =

window.innerWidth;

canvas.height =

window.innerHeight;

/* =========================================

SETTINGS

========================================= */

const chars =

"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";

const fontSize = 16;

const rows =

Math.floor(canvas.height / fontSize);

const streams = [];

const hidden17 = {

x:

canvas.width * .53,

y:

canvas.height * .52,

w:360,

h:200

};

/* =========================================

BUILD STREAMS

========================================= */

for(let i=0;i<rows;i++){

streams.push({

y: i * fontSize,

x:

Math.random() * -2600,

speed:

34 + Math.random() * 60,

length:

20 + Math.random() * 90,

laps:

0,

finished:false,

vertical:

Math.random() > .68,

dead:

Math.random() > .84,

flash:

Math.random() > .90,

glitch:

Math.random() > .86

});

}

/* =========================================

GLITCH FLASHES

========================================= */

function glitchBurst(){

const layer =

document.getElementById("glitchLayer");

for(let i=0;i<12;i++){

const flash =

document.createElement("div");

flash.className =

"glitchFlash";

flash.style.left =

Math.random()*100 + "%";

flash.style.top =

Math.random()*100 + "%";

flash.style.width =

Math.random()*400 + "px";

flash.style.height =

(1 + Math.random()*4) + "px";

flash.style.transform =

`rotate(${Math.random()*8-4}deg)`;

layer.appendChild(flash);

setTimeout(()=>{

flash.remove();

},120);

}

}

/* =========================================

DRAW MATRIX

========================================= */

function drawMatrix(){

ctx.fillStyle =

"rgba(0,0,0,0.20)";

ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);

streams.forEach(stream=>{

if(stream.finished) return;

for(let i=0;i<stream.length;i++){

const charX =

stream.x - (i * fontSize);

const inside17 =

charX > hidden17.x &&

charX < hidden17.x + hidden17.w &&

stream.y > hidden17.y &&

stream.y < hidden17.y + hidden17.h;

/* hidden .17 */

if(!inside17){

ctx.fillStyle =

`rgba(100,255,100,${

1 - (i / stream.length)

})`;

ctx.font =

fontSize + "px monospace";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* vertical corruption */

if(

stream.vertical &&

Math.random() > .978

){

ctx.fillStyle =

"rgba(100,255,100,.5)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y + (Math.random()*300)

);

}

/* white flashes */

if(

stream.flash &&

Math.random() > .988

){

ctx.fillStyle =

"rgba(255,255,255,.9)";

ctx.fillText(

chars[

Math.floor(

Math.random() * chars.length

)

],

charX,

stream.y

);

}

/* glitch tears */

if(

stream.glitch &&

Math.random() > .990

){

ctx.fillStyle =

"rgba(100,255,100,.35)";

ctx.fillRect(

charX,

stream.y,

Math.random() * 180,

2

);

}

/* dead chunks */

if(

stream.dead &&

Math.random() > .984

){

ctx.clearRect(

charX,

stream.y,

fontSize,

fontSize

);

}

}

stream.x += stream.speed;

/* laps */

if(

stream.x -

(stream.length * fontSize)

>

canvas.width + 300

){

stream.laps++;

if(stream.laps >= 3){

stream.finished = true;

}else{

stream.x =

Math.random() * -2400;

}

}

});

/* random glitch bursts */

if(Math.random() > .90){

glitchBurst();

}

/* all complete */

const unfinished =

streams.some(s => !s.finished);

if(!unfinished){

clearInterval(matrixLoop);

setTimeout(()=>{

systemFailure();

},500);

}

}

/* =========================================

SYSTEM FAILURE

========================================= */

function systemFailure(){

const signalLost =

document.getElementById("signalLost");

const signalNoise =

document.getElementById("signalNoise");

/* moving unstable signal */

for(let i=0;i<24;i++){

const bar =

document.createElement("div");

bar.className =

"signalLine";

bar.style.width =

(30 + Math.random()*60) + "%";

bar.style.left =

Math.random()*60 + "%";

bar.style.top =

Math.random()*100 + "%";

bar.style.animationDuration =

(.2 + Math.random()*1.1) + "s";

signalNoise.appendChild(bar);

}

signalNoise.style.opacity = .8;

signalLost.style.opacity = 1;

signalLost.classList.add("active");

/* failure fade */

setTimeout(()=>{

signalLost.style.opacity = 0;

signalNoise.style.opacity = 0;

},1700);

/* symbol */

setTimeout(()=>{

document

.getElementById("symbolWrap")

.classList.add("visible");

},3000);

/* reconnect */

setTimeout(()=>{

signalLost.classList.remove("active");

document

.getElementById("reconnect")

.classList.add("active");

},4700);

}

/* =========================================

START

========================================= */

const matrixLoop =

setInterval(drawMatrix,14);

/* =========================================

RECONNECT

========================================= */

const reconnect =

document.getElementById("reconnect");

reconnect.addEventListener("click",()=>{

reconnect.classList.remove("active");

reconnect.style.opacity = 0;

document.body.classList.add("connected");

/* thumbprint lava stain */

const stain =

document.getElementById("stain");

stain.style.opacity = 1;

/* background warmth */

setTimeout(()=>{

document

.getElementById("warmBackground")

.style.opacity = 1;

},1800);

/* smoke */

setTimeout(()=>{

document

.getElementById("smoke")

.style.opacity = 1;

},3200);

/* etchings uncovered */

setTimeout(()=>{

document

.getElementById("etchings")

.classList.add("visible");

},6200);

});

</script>

</body>

</html>
