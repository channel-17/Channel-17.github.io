<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>channel 17</title>

<link rel="icon" type="image/png" href="mark17.png"/>

<style>

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

body{

    width:100vw;

    height:100vh;

    overflow:hidden;

    background:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:"Courier New", monospace;

    color:#d7cdbd;

}

/* MAIN */

.container{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    transform:translateY(-32px);

}

/* SYMBOL */

.symbol{

    width:220px;

    opacity:0;

    filter:

        drop-shadow(0 0 4px rgba(255,245,220,.08))

        drop-shadow(0 0 14px rgba(255,245,220,.05));

}

/* GLITCH */

.glitch{

    animation:glitch .22s linear 2;

}

@keyframes glitch{

    0%{

        transform:translateX(0px);

        filter:brightness(1);

    }

    20%{

        transform:translateX(-8px);

        filter:brightness(2.8);

    }

    40%{

        transform:translateX(7px);

        filter:brightness(.35);

    }

    60%{

        transform:translateX(-5px);

    }

    80%{

        transform:translateX(4px);

    }

    100%{

        transform:translateX(0px);

        filter:brightness(1);

    }

}

/* TEXT AREA */

.text-area{

    margin-top:24px;

    min-height:38px;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

}

/* SIGNAL LOST */

#line{

    font-size:1.42rem;

    letter-spacing:.34rem;

    color:#d8cfbf;

    opacity:0;

    transition:opacity 1.3s ease;

    white-space:nowrap;

}

/* RECONNECT */

#reconnect{

    position:absolute;

    font-size:1.42rem;

    letter-spacing:.34rem;

    color:#8f8578;

    opacity:0;

    transition:opacity 2s ease;

    white-space:nowrap;

    cursor:pointer;

    user-select:none;

    transform-origin:center;

}

/* ACTIVATION */

#reconnect.active{

    animation:

    awaken 5.5s ease-in-out infinite;

}

/* HUNTING PULSE */

@keyframes awaken{

    0%{

        opacity:.10;

        transform:scale(1);

        filter:

            blur(.6px)

            brightness(.72);

        text-shadow:

            0 0 0px rgba(255,255,255,0);

    }

    18%{

        opacity:.22;

        transform:scale(1.004);

        filter:

            blur(.3px)

            brightness(.88);

    }

    34%{

        opacity:.94;

        transform:scale(1.026);

        filter:

            blur(0px)

            brightness(1.42);

        text-shadow:

            0 0 8px rgba(255,255,255,.10),

            0 0 22px rgba(255,255,255,.08),

            0 0 42px rgba(255,255,255,.03);

    }

    42%{

        opacity:.26;

        transform:scale(1.003);

        filter:

            blur(.25px)

            brightness(.84);

    }

    58%{

        opacity:.16;

        transform:scale(1);

        filter:

            blur(.5px)

            brightness(.76);

    }

    74%{

        opacity:.98;

        transform:scale(1.03);

        filter:

            blur(0px)

            brightness(1.55);

        text-shadow:

            0 0 10px rgba(255,255,255,.12),

            0 0 28px rgba(255,255,255,.09),

            0 0 52px rgba(255,255,255,.04);

    }

    100%{

        opacity:.10;

        transform:scale(1);

        filter:

            blur(.6px)

            brightness(.72);

        text-shadow:

            0 0 0px rgba(255,255,255,0);

    }

}

</style>

</head>

<body>

<div class="container">

    <img src="mark17.png" class="symbol" id="symbol">

    <div class="text-area">

        <div id="line"></div>

        <div id="reconnect">

            reconnect

        </div>

    </div>

</div>

<script>

const symbol = document.getElementById("symbol");

const line = document.getElementById("line");

const reconnect = document.getElementById("reconnect");

const sleep = (ms) =>

new Promise(resolve => setTimeout(resolve, ms));

async function runSequence(){

    /* BLACK SCREEN */

    await sleep(3200);

    /* SYMBOL EMERGES */

    symbol.style.transition =

    "opacity 2.7s ease";

    symbol.style.opacity = ".93";

    await sleep(2700);

    /* GLITCH */

    symbol.classList.add("glitch");

    /* PAUSE AFTER GLITCH */

    await sleep(900);

    /* TYPEWRITER */

    line.style.opacity = "1";

    const words = [

        "s",

        "si",

        "sig",

        "sign",

        "signa",

        "signal",

        "signal ",

        "signal l",

        "signal lo",

        "signal los",

        "signal lost"

    ];

    for(let i = 0; i < words.length; i++){

        line.innerHTML = words[i];

        await sleep(120);

    }

    /* HOLD */

    await sleep(700);

    /* SEARCH LOOP */

    for(let cycle = 0; cycle < 3; cycle++){

        line.innerHTML = "signal lost.";

        await sleep(340);

        line.innerHTML = "signal lost..";

        await sleep(340);

        line.innerHTML = "signal lost...";

        await sleep(520);

        line.innerHTML = "signal lost";

        await sleep(260);

    }

    /* FINAL HOLD */

    await sleep(500);

    /* FADE SIGNAL */

    line.style.opacity = "0";

    await sleep(1400);

    /* GHOST APPEAR */

    reconnect.style.opacity = ".08";

    await sleep(1200);

    /* ACTIVATE */

    reconnect.classList.add("active");

}

runSequence();

</script>

</body>

</html>
